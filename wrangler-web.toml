name = "reqoo-web"
main = "_web_worker.js"
compatibility_date = "2026-08-29"
workers_dev = false

[assets]
directory = "."
binding = "ASSETS"
# The same Worker serves multiple hostnames; run it first so / on each
# subdomain is routed by hostname instead of being served as root index.html.
run_worker_first = ["/*"]

[[routes]]
pattern = "reqoo.co/*"
zone_name = "reqoo.co"

[[routes]]
pattern = "admin.reqoo.co/*"
zone_name = "reqoo.co"

[[routes]]
pattern = "shop.reqoo.co/*"
zone_name = "reqoo.co"

[[routes]]
pattern = "sim.reqoo.co/*"
zone_name = "reqoo.co"

[[routes]]
pattern = "pksk.sim.reqoo.co/*"
zone_name = "reqoo.co"

[[d1_databases]]
binding = "CAD_DB"
database_name = "reqoo-rebuild"
database_id = "15123ddd-d63a-4033-912c-51c1f05c11c5"

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 0.1

[observability.traces]
enabled = true
head_sampling_rate = 0.01
