<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>REQOO.CO Shop</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0d0d0d;border-bottom:1px solid #292929;padding:14px 20px;display:flex;gap:18px;align-items:center}
.logo{font-weight:900;letter-spacing:5px;color:#e4b94f;white-space:nowrap}.search{flex:1;background:#171717;border:1px solid #444;border-radius:28px;padding:12px 18px;color:#ddd}
.cartbtn{border:1px solid #555;background:#151515;color:#fff;border-radius:25px;padding:11px 16px}
.wrap{max-width:1200px;margin:auto;padding:25px 18px}.cats{display:flex;gap:10px;overflow:auto;margin-bottom:25px}
.cat{background:#121212;color:#fff;border:1px solid #444;border-radius:22px;padding:10px 20px}.cat.active{background:#e8bb4e;color:#111;border-color:#e8bb4e}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.card{background:#111;border:1px solid #333;border-radius:18px;overflow:hidden}.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#222}.info{padding:15px}.tag{font-size:11px;letter-spacing:3px;color:#e8bb4e;font-weight:bold}.name{font-size:20px;font-weight:bold;margin:8px 0}.desc{color:#aaa;font-size:14px;min-height:38px}.price{font-size:19px;font-weight:bold;margin:14px 0}.btn{width:100%;border:0;border-radius:25px;background:#f0bf49;color:#111;padding:13px;font-weight:bold;cursor:pointer}
.overlay{display:none;position:fixed;inset:0;background:#000b;z-index:10;align-items:center;justify-content:center;padding:18px}.modal{background:#111;border:1px solid #444;border-radius:20px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px}.close{float:right;background:none;color:#fff;border:0;font-size:28px}.modal h2{margin-top:0}.field{width:100%;padding:12px;margin:7px 0 12px;background:#181818;border:1px solid #444;color:#fff;border-radius:10px}.summary{background:#181818;border-radius:12px;padding:15px;margin:12px 0}.qr{display:block;width:min(330px,90%);margin:15px auto;border-radius:12px;background:#fff}.muted{color:#aaa;font-size:13px}.total{font-size:22px;font-weight:bold;color:#f0bf49}
</style>
</head>
<body>
<header>
<div class="logo">REQOO.CO</div>
<input id="search" class="search" placeholder="Cari plaque, trophy, medal...">
<button class="cartbtn" onclick="openCart()">🛒 <span id="cartCount">0</span></button>
</header>

<main class="wrap">
<div class="cats">
<button class="cat active" onclick="filterCat('Semua',this)">Semua</button>
<button class="cat" onclick="filterCat('Plaque',this)">Plaque</button>
<button class="cat" onclick="filterCat('Trophy',this)">Trophy</button>
<button class="cat" onclick="filterCat('Medal',this)">Medal</button>
<button class="cat" onclick="filterCat('Brooch',this)">Brooch</button>
</div>
<div id="grid" class="grid"></div>
</main>

<div id="customOverlay" class="overlay">
<div class="modal">
<button class="close" onclick="closeCustom()">×</button>
<h2 id="customTitle">Customize Produk</h2>
<p class="muted">Masukkan maklumat tempahan.</p>
<input id="customName" class="field" placeholder="Nama / teks custom">
<input id="customQty" class="field" type="number" min="1" value="1" placeholder="Kuantiti">
<textarea id="customNote" class="field" rows="4" placeholder="Nota / ukuran / design / permintaan khas"></textarea>
<button class="btn" onclick="addCustomToCart()">Tambah ke Cart</button>
</div>
</div>

<div id="cartOverlay" class="overlay">
<div class="modal">
<button class="close" onclick="closeCart()">×</button>
<h2>Cart</h2>
<div id="cartItems"></div>
<div class="summary"><div class="total">Jumlah: RM<span id="cartTotal">0.00</span></div></div>
<button class="btn" onclick="checkout()">Checkout</button>
</div>
</div>

<div id="checkoutOverlay" class="overlay">
<div class="modal">
<button class="close" onclick="closeCheckout()">×</button>
<h2>Checkout</h2>
<input id="custName" class="field" placeholder="Nama">
<input id="custPhone" class="field" placeholder="No. WhatsApp">
<textarea id="custAddress" class="field" rows="3" placeholder="Alamat penghantaran"></textarea>
<div class="summary"><b>Jumlah perlu dibayar</b><div class="total">RM<span id="payTotal">0.00</span></div></div>
<h3>Bayar melalui Maybank QR</h3>
<p class="muted">Scan QR di bawah menggunakan aplikasi bank anda. Selepas pembayaran, tekan butang “Saya Dah Bayar”.</p>
<img class="qr" src="assets/qr-maybank.png" alt="Maybank QR">
<button class="btn" onclick="paidWhatsApp()">Saya Dah Bayar — Hantar Order WhatsApp</button>
</div>
</div>

<script>
const products=[
{id:1,cat:"Plaque",name:"Plaque Penghargaan",price:45,img:"product-1.jpg",desc:"Sesuai untuk anugerah, penghargaan dan majlis."},
{id:2,cat:"Plaque",name:"Plaque Nama",price:35,img:"product-2.jpg",desc:"Personalised plaque dengan nama pilihan anda."},
{id:3,cat:"Plaque",name:"Plaque Custom",price:35,img:"product-3.jpg",desc:"Custom nama, logo, teks dan design."},
{id:4,cat:"Trophy",name:"Trophy Custom",price:45,img:"product-4.jpg",desc:"Custom nama, logo, teks dan design."},
{id:5,cat:"Trophy",name:"Trophy Event",price:50,img:"product-5.jpg",desc:"Untuk kejohanan, acara dan pertandingan."},
{id:6,cat:"Medal",name:"Medal Custom",price:8,img:"product-6.jpg",desc:"Medal custom untuk acara dan pertandingan."},
{id:7,cat:"Brooch",name:"Brooch Custom",price:6,img:"product-7.jpg",desc:"Custom logo dan design pilihan pelanggan."},
{id:8,cat:"Brooch",name:"Brooch Premium",price:12,img:"product-8.jpg",desc:"Brooch premium untuk corporate dan event."}
];
let cart=JSON.parse(localStorage.getItem("reqooCart")||"[]"), current=null, activeCat="Semua";

function render(){
 const q=document.getElementById("search").value.toLowerCase();
 const list=products.filter(p=>(activeCat==="Semua"||p.cat===activeCat)&&
 (p.name.toLowerCase().includes(q)||p.cat.toLowerCase().includes(q)));
 document.getElementById("grid").innerHTML=list.map(p=>`
 <div class="card">
 <img src="${p.img}" onerror="this.style.display='none'" alt="">
 <div class="info"><div class="tag">${p.cat.toUpperCase()}</div><div class="name">${p.name}</div>
 <div class="desc">${p.desc}</div><div class="price">Dari RM${p.price}</div>
 <button class="btn" onclick="customize(${p.id})">Customize</button></div></div>`).join("");
 updateCount();
}
function filterCat(c,b){activeCat=c;document.querySelectorAll(".cat").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()}
document.getElementById("search").addEventListener("input",render);
function customize(id){current=products.find(p=>p.id===id);document.getElementById("customTitle").textContent="Customize — "+current.name;document.getElementById("customOverlay").style.display="flex"}
function closeCustom(){document.getElementById("customOverlay").style.display="none"}
function addCustomToCart(){
 const qty=Math.max(1,parseInt(document.getElementById("customQty").value)||1);
 cart.push({id:Date.now(),product:current.name,cat:current.cat,price:current.price,qty,
 custom:document.getElementById("customName").value||"-",note:document.getElementById("customNote").value||"-"});
 localStorage.setItem("reqooCart",JSON.stringify(cart));closeCustom();openCart();
}
function updateCount(){document.getElementById("cartCount").textContent=cart.reduce((a,x)=>a+x.qty,0)}
function total(){return cart.reduce((a,x)=>a+x.price*x.qty,0)}
function openCart(){renderCart();document.getElementById("cartOverlay").style.display="flex"}
function closeCart(){document.getElementById("cartOverlay").style.display="none"}
function renderCart(){
 document.getElementById("cartItems").innerHTML=cart.length?cart.map((x,i)=>`
 <div class="summary"><b>${x.product}</b> × ${x.qty}<br>Custom: ${x.custom}<br>Nota: ${x.note}
 <br><b>RM${(x.price*x.qty).toFixed(2)}</b><br><button onclick="removeItem(${i})">Buang</button></div>`).join(""):"Cart kosong.";
 document.getElementById("cartTotal").textContent=total().toFixed(2);updateCount()
}
function removeItem(i){cart.splice(i,1);localStorage.setItem("reqooCart",JSON.stringify(cart));renderCart()}
function checkout(){
 if(!cart.length)return alert("Cart kosong.");
 document.getElementById("payTotal").textContent=total().toFixed(2);
 closeCart();document.getElementById("checkoutOverlay").style.display="flex";
}
function closeCheckout(){document.getElementById("checkoutOverlay").style.display="none"}
function paidWhatsApp(){
 const n=document.getElementById("custName").value.trim(), ph=document.getElementById("custPhone").value.trim(), ad=document.getElementById("custAddress").value.trim();
 if(!n||!ph){alert("Sila isi nama dan no. WhatsApp.");return}
 let msg="*ORDER REQOO.CO*%0A%0A";
 cart.forEach((x,i)=>msg+=(i+1)+". "+x.product+" x"+x.qty+" — RM"+(x.price*x.qty).toFixed(2)+"%0ACustom: "+encodeURIComponent(x.custom)+"%0ANota: "+encodeURIComponent(x.note)+"%0A%0A");
 msg+="*Jumlah: RM"+total().toFixed(2)+"*%0A%0ANama: "+encodeURIComponent(n)+"%0AWhatsApp: "+encodeURIComponent(ph)+"%0AAlamat: "+encodeURIComponent(ad)+"%0A%0APembayaran: Maybank QR — pelanggan akan hantar bukti pembayaran.";
 window.open("https://wa.me/60165192803?text="+msg,"_blank");
}
render();
</script>
</body>
</html>
