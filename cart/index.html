<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../shop/">Shop</a><a href="../admin/">Admin</a></div></nav><main><div class="rq-kicker">Customer</div><section class="rq-hero"><h1>Cart</h1><p>Semak pilihan produk sebelum checkout.</p></section><div id="cart"></div></main></div>
<script type="module">import{cart,money}from'../shared/cart.js?v=20260820-5';const root=document.querySelector('#cart');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function selection(i){const bits=[];const v=i.variation&&typeof i.variation==='object'?i.variation:{};Object.values(v).forEach(x=>{if(x?.label&&x?.value)bits.push(`${x.label}: ${x.value}`)});const a=Array.isArray(i.addons)?i.addons:[];a.forEach(x=>{const vals=(x.values||[]).map(v=>v.label).filter(Boolean).join(', ');if(vals)bits.push(`${x.label}: ${vals}`)});const c=i.customization&&typeof i.customization==='object'?i.customization:{};Object.values(c).forEach(x=>{if(x?.label&&x?.value)bits.push(`${x.label}: ${x.value}`)});return bits.length?`<div style="margin-top:7px;color:var(--rq-muted);font-size:11px;line-height:1.5">${bits.map(esc).join('<br>')}</div>`:''}function render(){const items=cart.get();if(!items.length){root.innerHTML='<div class="rq-empty">Cart kosong. <a href="../shop/">Kembali ke Shop</a></div>';return}root.innerHTML=`<div style="display:grid;gap:12px">${items.map(i=>`<article style="display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:14px;border:1px solid var(--rq-line);border-radius:14px;background:var(--rq-panel)">${i.image?`<img src="${esc(i.image)}" alt="" style="width:72px;height:72px;object-fit:cover;border-radius:10px">`:'<div></div>'}<div><strong>${esc(i.name)}</strong>${selection(i)}<div style="margin-top:8px">${money(i.price)} × <input class="qty" data-id="${esc(i.id)}" type="number" min="1" value="${i.quantity}" style="width:65px"></div></div><button class="remove" data-id="${esc(i.id)}">Buang</button></article>`).join('')}</div><div style="margin-top:22px;display:flex;justify-content:space-between;align-items:center"><strong>Subtotal</strong><strong>${money(cart.subtotal())}</strong></div><button id="checkout" style="margin-top:18px">Teruskan ke Checkout</button><button id="clear" style="margin:18px 0 0 8px">Kosongkan</button>`;root.querySelectorAll('.qty').forEach(el=>el.onchange=()=>{cart.update(el.dataset.id,el.value);render()});root.querySelectorAll('.remove').forEach(el=>el.onclick=()=>{cart.remove(el.dataset.id);render()});root.querySelector('#clear').onclick=()=>{cart.clear();render()};root.querySelector('#checkout').onclick=()=>location.href='../checkout/'}render();</script></body></html>
