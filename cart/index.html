<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Troli · REQOO.CO</title><link rel="stylesheet" href="../shared/reqoo.css?v=20260820-ui2"><style>
.cart-page{padding:28px 0 80px}.cart-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:22px}.cart-head h1{font-size:32px;margin:5px 0}.cart-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px}.cart-list{display:grid;gap:10px}.cart-item{display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:16px;align-items:center;background:#111;border:1px solid #292418;border-radius:14px;padding:14px}.cart-img{width:96px;height:96px;object-fit:cover;border-radius:10px;background:#191919}.cart-name{font-size:14px;font-weight:800;color:#fff}.cart-meta{font-size:10px;color:#96938b;line-height:1.65;margin-top:6px}.cart-price{font-size:15px;font-weight:900;color:#f5c65d;margin-top:9px}.qty{width:68px;background:#090909;color:#fff;border:1px solid #3a3426;border-radius:7px;padding:7px}.remove{background:transparent;border:0;color:#8e8b84;font-size:10px;cursor:pointer}.summary{background:#111;border:1px solid #30291d;border-radius:14px;padding:20px;position:sticky;top:100px;height:max-content}.summary h2{font-size:17px;margin:0 0 18px}.sum-row{display:flex;justify-content:space-between;gap:12px;font-size:11px;color:#aaa;padding:8px 0}.sum-total{border-top:1px solid #30291d;margin-top:8px;padding-top:16px;font-size:17px;font-weight:900;color:#fff}.sum-total strong:last-child{color:#f5c65d}.cart-actions{display:grid;gap:8px;margin-top:18px}.empty{padding:55px 20px;text-align:center;border:1px dashed #393225;border-radius:14px;background:#101010;color:#999}.custom-pill{display:inline-block;margin-top:6px;padding:3px 7px;border:1px solid #594719;border-radius:999px;color:#e5bd56;font-size:8px;font-weight:800}.mobile-checkout{display:none}@media(max-width:800px){.cart-layout{grid-template-columns:1fr}.summary{position:static}.cart-head h1{font-size:26px}.cart-item{grid-template-columns:72px minmax(0,1fr);position:relative}.cart-img{width:72px;height:72px}.cart-item>.remove{position:absolute;right:12px;top:12px}.cart-item .cart-right{grid-column:2}.mobile-checkout{display:block;position:fixed;left:12px;right:12px;bottom:14px;z-index:30}.mobile-checkout .rq-btn{width:100%;box-shadow:0 10px 30px #000}}
</style></head><body><header class="rq-header"><div class="rq-shell"><div class="rq-header-main"><a class="rq-brand" href="../"><span class="rq-brand-mark">R</span><span>REQOO.CO</span></a><form class="rq-search" onsubmit="event.preventDefault();location.href='../shop/?q='+encodeURIComponent(this.q.value)"><select><option>Semua</option></select><input name="q" placeholder="Cari produk, design atau custom…"><button>⌕</button></form><a class="rq-action" href="./">🛒 <span class="label">Troli <b class="rq-badge" id="cartCount">0</b></span></a></div><nav class="rq-nav"><a href="../">Laman Utama</a><a href="../custom/">Custom Made</a><a href="../shop/">Koleksi</a><a href="../calculator/">Kalkulator</a><a href="../quotation/">Quotation</a></nav></div></header><main class="rq-shell cart-page"><div class="cart-head"><div><div class="rq-eyebrow">REQOO.CO · SHOPPING CART</div><h1>Troli Anda</h1><p class="rq-muted">Semak produk, variation dan customisation sebelum checkout.</p></div><a class="rq-btn" href="../shop/">← Teruskan Shopping</a></div><div id="cart"></div></main><div class="mobile-checkout" id="mobileCheckout"></div><nav class="rq-mobile-nav"><a href="../">⌂<span>Home</span></a><a href="../shop/">▦<span>Shop</span></a><a href="../custom/">✦<span>Custom</span></a><a class="active" href="./">🛒<span>Cart</span></a><a href="../admin/">♙<span>Admin</span></a></nav><script type="module">import{cart,money}from'../shared/cart.js?v=20260820-5';const root=document.querySelector('#cart'),badge=document.querySelector('#cartCount'),mobile=document.querySelector('#mobileCheckout');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function selection(i){const bits=[];Object.values(i.variation&&typeof i.variation==='object'?i.variation:{}).forEach(x=>{if(x?.label&&x?.value)bits.push(`${x.label}: ${x.value}`)});(Array.isArray(i.addons)?i.addons:[]).forEach(x=>{const vals=(x.values||[]).map(v=>v.label).filter(Boolean).join(', ');if(vals)bits.push(`${x.label}: ${vals}`)});Object.values(i.customization&&typeof i.customization==='object'?i.customization:{}).forEach(x=>{if(x?.label&&x?.value)bits.push(`${x.label}: ${x.value}`)});return bits.length?bits.map(esc).join('<br>'):''}function render(){const items=cart.get();badge.textContent=cart.count();if(!items.length){root.innerHTML='<div class="empty"><div style="font-size:28px;margin-bottom:10px">🛒</div><strong style="color:#fff">Troli masih kosong</strong><p>Belum ada produk dalam troli anda.</p><a class="rq-btn gold" href="../shop/" style="display:inline-flex;margin-top:10px">Lihat Produk →</a></div>';mobile.innerHTML='';return}const subtotal=cart.subtotal();root.innerHTML=`<div class="cart-layout"><section class="cart-list">${items.map(i=>{const meta=selection(i),custom=meta||i.customization&&Object.keys(i.customization).length;return `<article class="cart-item">${i.image?`<img class="cart-img" src="${esc(i.image)}" alt="${esc(i.name)}">`:'<div class="cart-img"></div>'}<div><div class="cart-name">${esc(i.name)}</div>${custom?'<span class="custom-pill">CUSTOM</span>':''}<div class="cart-meta">${meta||'Produk standard'}</div><div class="cart-price">${money(i.price)}</div></div><div class="cart-right" style="text-align:right"><button class="remove" data-remove="${esc(i.id)}">Buang</button><div style="margin-top:18px"><input class="qty" data-qty="${esc(i.id)}" type="number" min="1" value="${i.quantity}"></div></div></article>`}).join('')}</section><aside class="summary"><h2>Ringkasan Pesanan</h2><div class="sum-row"><span>Subtotal</span><strong>${money(subtotal)}</strong></div><div class="sum-row"><span>Diskaun</span><span>—</span></div><div class="sum-row"><span>Penghantaran</span><span>Dikira checkout</span></div><div class="sum-row sum-total"><strong>Jumlah</strong><strong>${money(subtotal)}</strong></div><div class="cart-actions"><a class="rq-btn gold" href="../checkout/">CHECKOUT →</a><a class="rq-btn" href="../shop/">Teruskan Shopping</a><button id="clear" class="rq-btn" style="cursor:pointer">Kosongkan Troli</button></div></aside></div>`;mobile.innerHTML=`<a class="rq-btn gold" href="../checkout/">CHECKOUT · ${money(subtotal)} →</a>`;root.querySelectorAll('[data-qty]').forEach(el=>el.onchange=()=>{cart.update(el.dataset.qty,el.value);render()});root.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{cart.remove(el.dataset.remove);render()});root.querySelector('#clear').onclick=()=>{cart.clear();render()}}render();window.addEventListener('reqoo-cart-updated',render);</script></body></html>
