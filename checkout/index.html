<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Checkout · REQOO.CO</title><link rel="stylesheet" href="../shared/reqoo.css?v=20260820-ui2"></head><body><main class="rq-shell" style="padding:28px 0 70px"><div class="rq-eyebrow">REQOO.CO · SECURE CHECKOUT</div><h1 style="font-size:30px;margin:6px 0">Checkout</h1><p class="rq-muted">Lengkapkan maklumat untuk meneruskan pesanan.</p><div id="notice" class="notice"></div><div style="display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px"><form id="form" class="rq-card"><h2>Maklumat pelanggan</h2><label>Nama penuh *<input name="name" required autocomplete="name"></label><label>No. telefon *<input name="phone" required autocomplete="tel"></label><label>Emel<input name="email" type="email" autocomplete="email"></label><label>Alamat penghantaran *<textarea name="address" required></textarea></label><label>Nota pesanan<textarea name="note"></textarea></label><h2>Kaedah pembayaran</h2><div class="rq-card">Billplz · pembayaran automatik</div><div class="rq-card">QR AB ART · manual verification</div><button id="submit" class="rq-btn gold" type="submit" style="width:100%;margin-top:18px">BUAT PESANAN →</button></form><aside class="rq-card"><h2>Ringkasan pesanan</h2><div id="summary"></div></aside></div></main><script type="module">import{cart,money}from'../shared/cart.js?v=20260820-5';const API='https://api.reqoo.co',items=cart.get(),summary=document.querySelector('#summary'),form=document.querySelector('#form'),notice=document.querySelector('#notice'),submit=document.querySelector('#submit'),idempotencyKey=crypto.randomUUID();const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function details(i){const b=[];Object.values(i.variation||{}).forEach(x=>x?.label&&x?.value&&b.push(`${x.label}: ${x.value}`));(i.addons||[]).forEach(x=>{const v=(x.values||[]).map(y=>y.label).filter(Boolean).join(', ');if(v)b.push(`${x.label}: ${v}`)});Object.values(i.customization||{}).forEach(x=>x?.label&&x?.value&&b.push(`${x.label}: ${x.value}`));return b}if(!items.length){summary.innerHTML='<div class="rq-empty">Cart kosong. <a href="../shop/">Kembali ke Shop</a></div>';form.remove()}else{summary.innerHTML=items.map(i=>{const d=details(i);return `<div style="padding:10px 0;border-bottom:1px solid #272218"><b>${esc(i.name)} × ${i.quantity}</b>${d.length?`<div class="rq-muted">${d.map(esc).join('<br>')}</div>`:''}<strong>${money(i.price*i.quantity)}</strong></div>`}).join('')+`<div style="padding-top:12px"><b>Jumlah ${money(cart.subtotal())}</b></div>`}form?.addEventListener('submit',async e=>{e.preventDefault();submit.disabled=true;notice.textContent='Membuat pesanan…';try{const fields=Object.fromEntries(new FormData(form));const body={name:fields.name,phone:fields.phone,email:fields.email,shipping_address:fields.address,order_note:fields.note,items:items.map(i=>({product_id:i.id,quantity:i.quantity,customization:i.customization&&typeof i.customization==='object'?i.customization:{},variation:i.variation&&typeof i.variation==='object'?i.variation:{},addons:Array.isArray(i.addons)?i.addons:[]}))};const res=await fetch(`${API}/orders`,{method:'POST',headers:{'Content-Type':'application/json','Idempotency-Key':idempotencyKey},body:JSON.stringify(body)}),data=await res.json().catch(()=>({}));if(!res.ok)throw new Error(data.error?.message||data.error||`HTTP ${res.status}`);if(!data.order?.id||!data.order?.public_token)throw new Error('Order access token tidak diterima');cart.clear();location.href=`../order/?id=${encodeURIComponent(data.order.id)}#token=${encodeURIComponent(data.order.public_token)}`}catch(err){notice.textContent='Pesanan gagal: '+(err?.message||'Sila cuba lagi.');submit.disabled=false}});</script></body></html>
