<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"><style>.checkout-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:20px}@media(max-width:760px){.checkout-grid{grid-template-columns:1fr}}label{display:block;margin:0 0 14px}input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--rq-line);border-radius:10px;background:var(--rq-panel);color:inherit}button{padding:12px 16px}.panel{padding:18px;border:1px solid var(--rq-line);border-radius:16px;background:var(--rq-panel)}.line{display:flex;justify-content:space-between;gap:12px;margin:10px 0}.total{font-size:20px;font-weight:800;margin-top:16px;padding-top:16px;border-top:1px solid var(--rq-line)}</style></head>
<body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../shop/">Shop</a><a href="../cart/">Cart</a></div></nav><main><div class="rq-kicker">Customer</div><section class="rq-hero"><h1>Checkout</h1><p>Semak maklumat pelanggan dan sahkan pesanan.</p></section><div id="notice"></div><div class="checkout-grid"><form id="form" class="panel"><h2>Maklumat pelanggan</h2><label>Nama<input name="name" required autocomplete="name"></label><label>No. telefon<input name="phone" required autocomplete="tel"></label><label>Emel<input name="email" type="email" autocomplete="email"></label><button type="submit">Buat Pesanan</button></form><section class="panel"><h2>Pesanan</h2><div id="summary"></div></section></div></main></div>
<script type="module">
import { cart, money } from '../shared/cart.js';
const items=cart.get(), summary=document.querySelector('#summary'), notice=document.querySelector('#notice'), form=document.querySelector('#form');
if(!items.length){summary.innerHTML='<div class="rq-empty">Cart kosong. <a href="../shop/">Kembali ke Shop</a></div>';form.remove();}
else{summary.innerHTML=items.map(i=>`<div class="line"><span>${String(i.name).replace(/[<>]/g,'')} × ${i.quantity}</span><strong>${money(i.price*i.quantity)}</strong></div>`).join('')+`<div class="total"><div class="line"><span>Jumlah</span><strong>${money(cart.subtotal())}</strong></div></div>`;}
form?.addEventListener('submit',async e=>{e.preventDefault();const button=form.querySelector('button');button.disabled=true;notice.textContent='Memproses pesanan…';try{const body=Object.fromEntries(new FormData(form));body.items=items.map(i=>({product_id:i.id,quantity:i.quantity}));const res=await fetch('https://api.reqoo.co/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await res.json();if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);cart.clear();location.href=`../order/?id=${encodeURIComponent(data.order.id)}`;}catch(err){notice.textContent='Pesanan gagal: '+err.message;button.disabled=false;}});
</script></body></html>
