<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Invoice · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"><style>.invoice{max-width:820px;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.brand{font-size:28px;font-weight:850;letter-spacing:.05em}.gold{color:var(--rq-accent)}.meta{text-align:right;color:var(--rq-muted);font-size:12px;line-height:1.7}.customer{margin-top:24px;padding:14px;border:1px solid var(--rq-line);border-radius:12px}.label{font-size:10px;font-weight:800;color:var(--rq-muted);text-transform:uppercase;letter-spacing:.08em}.table{margin-top:18px;border:1px solid var(--rq-line);border-radius:12px;overflow:hidden}.row{display:grid;grid-template-columns:1fr 70px 120px 120px;gap:10px;padding:12px 14px;border-bottom:1px solid var(--rq-line);font-size:13px}.row:last-child{border-bottom:0}.right{text-align:right}.muted{color:var(--rq-muted);font-size:12px}.summary{margin:18px 0 0 auto;max-width:330px}.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rq-line)}.grand{font-size:21px;font-weight:850}.payment{margin-top:20px;padding:15px;border:1px solid var(--rq-line);border-radius:12px}.paid{color:#91e6a7}.pending{color:#e1c47c}.failed{color:#ff8b8b}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}@media print{body{background:white;color:#111}.rq-nav,.actions{display:none}.rq-shell{max-width:900px}.rq-card{border:0;background:white}.table,.customer,.payment{border-color:#ccc}.row{border-color:#ddd}}@media(max-width:650px){.head{flex-direction:column}.meta{text-align:left}.row{grid-template-columns:1fr 45px 85px 90px;font-size:11px;padding:10px 8px}}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../shop/">Shop</a><a href="../quotation/">Quotation</a><a href="../admin/">Admin</a></div></nav><main class="invoice"><section class="rq-card"><div id="content"><div class="muted">Memuatkan invoice...</div></div></section></main></div><script>const $=s=>document.querySelector(s),money=n=>'RM'+(Number(n||0)/100).toFixed(2),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function parse(v,f){try{return v?JSON.parse(v):f}catch{return f}}async function main(){const id=new URLSearchParams(location.search).get('id');if(!id){$('#content').innerHTML='<div class="muted">Order ID tidak diberikan.</div>';return}try{const r=await fetch('https://api.reqoo.co/orders/'+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw Error(d.error||'Order tidak dijumpai');const o=d.order,c=d.customer,items=d.items||[],p=d.payment;const paid=o.payment_status==='paid';const title=paid?'RECEIPT / PAID INVOICE':'INVOICE';const date=new Date(o.created_at).toLocaleDateString('ms-MY');$('#content').innerHTML=`<div class="head"><div><div class="brand">REQOO<span class="gold">.CO</span></div><div class="muted">Custom Manufacturing & Creative Works</div></div><div class="meta"><b>${title}</b><br>Order #${esc(o.id)}<br>${esc(date)}</div></div><div class="customer"><div class="label">Customer</div><strong>${esc(c?.name||'-')}</strong><br><span class="muted">${esc(c?.phone||'')}${c?.email?' · '+esc(c.email):''}</span></div><div class="table"><div class="row muted"><div>ITEM</div><div class="right">QTY</div><div class="right">UNIT</div><div class="right">TOTAL</div></div>${items.map(i=>{const v=parse(i.variation_snapshot_json,{}),custom=parse(i.customization_snapshot_json,{});const details=[...Object.entries(v),...Object.entries(custom)].filter(([k,x])=>x!==undefined&&x!==null&&String(x)!=='').map(([k,x])=>`${esc(k)}: ${esc(typeof x==='object'?JSON.stringify(x):x)}`).join(' · ');return `<div class="row"><div><strong>${esc(i.product_name_snapshot)}</strong>${details?'<br><span class="muted">'+details+'</span>':''}</div><div class="right">${esc(i.quantity)}</div><div class="right">${money(i.unit_price_minor)}</div><div class="right">${money(i.line_total_minor)}</div></div>`}).join('')}</div><div class="summary"><div class="sum"><span>Subtotal</span><strong>${money(o.subtotal_minor)}</strong></div><div class="sum"><span>Diskaun</span><strong>${money(o.discount_minor)}</strong></div><div class="sum"><span>Shipping</span><strong>${money(o.shipping_minor)}</strong></div><div class="sum grand"><span>Total</span><strong class="gold">${money(o.total_minor)}</strong></div></div><div class="payment"><div class="label">Payment Status</div><strong class="${paid?'paid':o.payment_status==='failed'?'failed':'pending'}">${esc(o.payment_status.toUpperCase())}</strong>${p?`<div class="muted" style="margin-top:6px">Provider: ${esc(p.provider||'-')} · Reference: ${esc(p.provider_reference||'-')}${p.paid_at?' · Paid: '+esc(new Date(p.paid_at).toLocaleString('ms-MY')):''}</div>`:''}</div><div class="actions"><button class="rq-btn" onclick="window.print()">Print / Save PDF</button><a class="rq-btn secondary" href="../order/?id=${encodeURIComponent(o.id)}">Order Page</a></div>`}catch(e){$('#content').innerHTML='<div class="muted">Gagal: '+esc(e.message)+'</div>'}}main()</script></body></html>
