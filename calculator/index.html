<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculator · REQOO.CO</title><link rel="stylesheet" href="../shared/reqoo.css"><style>.page{padding:22px 0 70px}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:14px}.card{background:#111;border:1px solid var(--rq-line);border-radius:16px;padding:18px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:#aaa;font-weight:800}.field input,.field select,.field textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #302d27;border-radius:9px;background:#0a0a0b;color:#eee}.field textarea{min-height:78px}.section{font-size:10px;font-weight:900;letter-spacing:.14em;color:var(--rq-gold-hi);margin:18px 0 9px}.total{font-size:45px;font-weight:950;color:var(--rq-gold-hi);margin:6px 0 15px}.line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #28251f;font-size:11px}.muted{color:#888}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.status{margin-top:12px;padding:10px;border-radius:9px;font-size:10px;display:none}.ok{display:block;border:1px solid #315b3d;background:#101a13;color:#a6dfb6}.bad{display:block;border:1px solid #6b3e3e;background:#1a1111;color:#ffb7b7}@media(max-width:820px){.layout{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../admin/">Admin</a><a href="../shop/">Shop</a><a href="../quotation/">Quotation</a></div></nav><main class="page"><section class="rq-hero"><div class="rq-eyebrow">INTERNAL PRICING TOOL</div><h1>Selling Price Calculator</h1><p>Gunakan calculator ini untuk kos → overhead → margin → selling price → quotation.</p></section><div class="layout"><section class="card"><div class="section">Projek</div><div class="fields"><div class="field"><label>Jenis kerja</label><select id="type"><option>Laser Cut</option><option>Laser Engraving</option><option>3D Print</option><option>Acrylic / Wood</option><option>Custom Gift</option></select></div><div class="field"><label>Material</label><select id="material"></select></div><div class="field"><label>Kuantiti</label><input id="qty" type="number" min="1" value="1"></div><div class="field"><label>Ukuran</label><input id="size" placeholder="100 × 150 mm"></div></div><div class="section">Kos</div><div class="fields"><div class="field"><label>Kos bahan seunit RM</label><input id="materialCost" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Waste %</label><input id="waste" type="number" min="0" value="10"></div><div class="field"><label>Masa mesin min</label><input id="machineMin" type="number" min="0" value="10"></div><div class="field"><label>Kadar mesin RM/min</label><input id="machineRate" type="number" min="0" step="0.01" value="0.80"></div><div class="field"><label>Masa kerja min</label><input id="laborMin" type="number" min="0" value="10"></div><div class="field"><label>Kadar kerja RM/jam</label><input id="laborRate" type="number" min="0" step="0.5" value="25"></div><div class="field"><label>Finishing / packing RM</label><input id="finish" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Setup / design RM</label><input id="setup" type="number" min="0" step="0.01" value="0"></div></div><div class="section">Harga</div><div class="fields"><div class="field"><label>Overhead %</label><input id="overhead" type="number" min="0" value="10"></div><div class="field"><label>Margin %</label><input id="margin" type="number" min="0" value="40"></div><div class="field"><label>Minimum charge RM</label><input id="minimum" type="number" min="0" step="0.5" value="15"></div><div class="field"><label>Diskaun quotation %</label><input id="discount" type="number" min="0" max="100" value="0"></div></div><div class="section">Customer</div><div class="fields"><div class="field"><label>Nama</label><input id="customer"></div><div class="field"><label>Telefon</label><input id="phone"></div><div class="field"><label>Email</label><input id="email" type="email"></div><div class="field"><label>Reference</label><input id="reference"></div><div class="field full"><label>Item quotation</label><input id="item"></div><div class="field full"><label>Nota / terms</label><textarea id="notes"></textarea></div></div><div class="actions"><button id="calc" class="rq-btn">Kira</button><button id="quote" class="rq-btn gold">Create Quotation</button><a id="view" class="rq-btn secondary" style="display:none" href="../quotation/">Lihat</a></div><div id="status" class="status"></div></section><aside class="card"><div class="rq-eyebrow">SELLING PRICE</div><div id="total" class="total">RM0.00</div><div class="line"><span class="muted">Bahan + waste</span><b id="mout"></b></div><div class="line"><span class="muted">Mesin</span><b id="machineOut"></b></div><div class="line"><span class="muted">Kerja</span><b id="laborOut"></b></div><div class="line"><span class="muted">Finishing + setup</span><b id="otherOut"></b></div><div class="line"><span class="muted">Kos penuh</span><b id="fullOut"></b></div><div class="line"><span class="muted">Selling price</span><b id="sellOut" class="gold"></b></div><div class="line"><span class="muted">Selepas diskaun</span><b id="discOut" class="gold"></b></div></aside></div></main></div><script>const API='https://api.reqoo.co',$=s=>document.querySelector(s),q=new URLSearchParams(location.search),money=n=>'RM'+Number(n||0).toFixed(2),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const mats={Kayu:35,MDF:25,Plywood:55,Acrylic:110,Aluminium:120,PLA:60,TPU:100,PETG:75};Object.keys(mats).forEach(x=>$('#material').insertAdjacentHTML('beforeend',`<option>${x}</option>`));function n(id){return Math.max(0,Number($(id).value)||0)}function calc(){const qty=Math.max(1,n('#qty')),material=n('#materialCost')*qty*(1+n('#waste')/100),machine=n('#machineMin')*n('#machineRate'),labor=n('#laborMin')*n('#laborRate')/60,other=n('#finish')+n('#setup'),cost=material+machine+labor+other,full=cost*(1+n('#overhead')/100),sell=Math.max(n('#minimum'),full*(1+n('#margin')/100)),after=sell*(1-Math.min(100,n('#discount'))/100);[['#mout',material],['#machineOut',machine],['#laborOut',labor],['#otherOut',other],['#fullOut',full],['#sellOut',sell],['#discOut',after]].forEach(([id,v])=>$(id).textContent=money(v));$('#total').textContent=money(after);return{qty,sell,after,discount:n('#discount')}}function fillFromQuery(){['customer','phone','email','reference','item','size','notes','type','qty'].forEach(id=>{if(q.get(id))$('#'+id).value=q.get(id)});if(q.get('material')&&mats[q.get('material')]){$('#material').value=q.get('material');$('#materialCost').value=mats[q.get('material')]}}$('#material').onchange=()=>{$('#materialCost').value=mats[$('#material').value]||0;calc()};document.querySelectorAll('input,select,textarea').forEach(x=>x.oninput=calc);$('#calc').onclick=calc;$('#quote').onclick=async()=>{const s=$('#status');s.className='status';s.style.display='block';s.textContent='Menyediakan quotation…';try{const r=calc(),body={customer_name:$('#customer').value.trim()||'Customer',customer_phone:$('#phone').value.trim(),customer_email:$('#email').value.trim(),discount_minor:Math.round(r.sell*r.discount),notes:$('#notes').value.trim(),items:[{description:$('#item').value.trim()||$('#type').value,material:$('#material').value,size:$('#size').value,quantity:r.qty,unit_price_minor:Math.round((r.sell/r.qty)*100)}]};const res=await fetch(API+'/quotations',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await res.json();if(!res.ok)throw Error(d.error||`HTTP ${res.status}`);s.className='status ok';s.textContent=`Quotation ${d.quotation.reference} berjaya dibuat.`;$('#view').style.display='inline-flex';$('#view').href=`../quotation/?token=${encodeURIComponent(d.quotation.share_token||'')}`;if(q.get('request_id'))fetch(API+'/custom-requests/'+encodeURIComponent(q.get('request_id')),{method:'PUT',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:'quoted'})}).catch(()=>{})}catch(e){s.className='status bad';s.textContent=e.message}};fillFromQuery();$('#materialCost').value=mats[$('#material').value]||0;calc();</script></body></html>
