<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Reqoo.co</title>
<link rel="stylesheet" href="../shared/reqoo.css">
<style>
.grid{display:grid;grid-template-columns:minmax(300px,430px) 1fr;gap:18px}.form{display:grid;gap:11px}.form label{font-size:12px;color:var(--rq-muted);font-weight:700;letter-spacing:.04em}.form input,.form textarea,.form select{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--rq-line);border-radius:10px;background:#0f0f12;color:var(--rq-text);font:inherit}.form textarea{min-height:80px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.notice{padding:12px 14px;margin-bottom:16px;border:1px solid var(--rq-line);border-radius:10px;color:var(--rq-muted)}.product{display:grid;grid-template-columns:70px 1fr auto;gap:12px;padding:12px;border:1px solid var(--rq-line);border-radius:12px;margin-bottom:10px;background:var(--rq-panel)}.product img{width:70px;height:70px;object-fit:cover;border-radius:8px}.muted{color:var(--rq-muted);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.tag{display:inline-block;padding:4px 7px;border-radius:999px;font-size:10px;font-weight:800;background:#25252b}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:15px}@media(max-width:800px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.product{grid-template-columns:56px 1fr}.product img{width:56px;height:56px}.product .actions{grid-column:1/-1}}
</style>
</head>
<body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../shop/">Shop</a><a href="../calculator/">Calculator</a><a href="../quotation/">Quotation</a></div></nav>
<main><div class="rq-kicker">Admin · Rebuild V1</div><section class="rq-hero"><h1>Product Catalog</h1><p>Produk bermula kosong. Admin mengurus produk, harga, jenis fulfillment dan kandungan produk.</p></section>
<div id="notice" class="notice">Masukkan Admin Key untuk sambung.</div>
<section class="grid">
<article class="rq-card"><h2>Admin access</h2><form id="keyForm" class="form"><label>Admin Key<input id="key" type="password" autocomplete="off"></label><button class="rq-btn">Sambung</button></form><hr style="border:0;border-top:1px solid var(--rq-line);margin:20px 0">
<h2 id="title">Tambah produk</h2><form id="form" class="form">
<input id="id" type="hidden">
<div class="row"><label>SKU<input id="sku"></label><label>Status<select id="status"><option value="draft">Draft</option><option value="active">Active</option><option value="hidden">Hidden</option><option value="out_of_stock">Out of stock</option><option value="archived">Archived</option></select></label></div>
<label>Nama produk<input id="name" required></label><label>Slug<input id="slug"></label>
<div class="row"><label>Product type<select id="type"><option value="physical">Physical</option><option value="digital">Digital</option><option value="licensed">Licensed</option><option value="play_access">Play access</option><option value="service">Service</option></select></label><label>Fulfillment<select id="fulfillment"><option value="physical_shipping">Physical shipping</option><option value="digital_delivery">Digital delivery</option><option value="licensed_access">Licensed access</option><option value="play_access">Play access</option><option value="service_custom">Service custom</option></select></label></div>
<div class="row"><label>Harga asas (sen)<input id="base" type="number" min="0" value="0"></label><label>Harga jual (sen)<input id="sale" type="number" min="0" placeholder="optional"></label></div>
<label>Short description<input id="short"></label><label>Description<textarea id="description"></textarea></label><label>Gambar — satu URL setiap baris<textarea id="images"></textarea></label><label>Production instructions<textarea id="production"></textarea></label><label>Internal notes<textarea id="notes"></textarea></label>
<div class="actions"><button class="rq-btn">Simpan produk</button><button id="cancel" class="rq-btn secondary" type="button" hidden>Batal</button></div>
</form></article>
<article class="rq-card"><div class="toolbar"><div><h2 style="margin:0">Semua produk</h2><p class="muted" style="margin:4px 0 0">Data live daripada reqoo-rebuild</p></div><button id="refresh" class="rq-btn secondary">Refresh</button></div><div id="list"></div></article>
</section></main></div>
<script type="module">
import {catalog,catalogAuth,normalizeProduct} from '../shared/catalog.js';
const $=s=>document.querySelector(s), notice=$('#notice'), list=$('#list'); let products=[];
function msg(t,ok=false){notice.textContent=t;notice.style.color=ok?'#91e6a7':''}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function reset(){ $('#form').reset();$('#id').value='';$('#base').value='0';$('#title').textContent='Tambah produk';$('#cancel').hidden=true }
function fill(p){$('#id').value=p.id||'';$('#sku').value=p.sku||'';$('#status').value=p.status||'draft';$('#name').value=p.name||'';$('#slug').value=p.slug||'';$('#type').value=p.product_type||'physical';$('#fulfillment').value=p.fulfillment_type||'physical_shipping';$('#base').value=p.base_price_minor??0;$('#sale').value=p.sale_price_minor??'';$('#short').value=p.short_description||'';$('#description').value=p.description||'';$('#images').value=(p.images||[]).map(x=>x.url||x).join('\n');$('#production').value=p.production_instructions||'';$('#notes').value=p.internal_notes||'';$('#title').textContent='Edit produk';$('#cancel').hidden=false;scrollTo({top:0,behavior:'smooth'})}
function render(){if(!products.length){list.innerHTML='<div class="rq-empty">Belum ada produk.</div>';return}list.innerHTML=products.map(p=>{const img=(p.images||[])[0];const url=img?.url||img||'';return `<div class="product"><div>${url?`<img src="${esc(url)}" alt="">`:'<div style="width:70px;height:70px;border-radius:8px;background:#0b0b0d"></div>'}</div><div><h3 style="margin:0 0 5px">${esc(p.name)}</h3><div class="muted">${esc(p.sku||'No SKU')} · ${esc(p.product_type)} · ${esc(p.fulfillment_type)}</div><div class="muted">RM${(Number(p.base_price_minor||0)/100).toFixed(2)} ${p.sale_price_minor!=null?'· Sale RM'+(Number(p.sale_price_minor)/100).toFixed(2):''} · <span class="tag">${esc(p.status)}</span></div></div><div class="actions"><button class="rq-btn secondary" data-edit="${p.id}">Edit</button><button class="rq-btn secondary" data-del="${p.id}">Delete</button></div></div>`}).join('');list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>fill(products.find(p=>String(p.id)===b.dataset.edit)));list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete produk ini?'))return;try{await catalog.remove(b.dataset.del);msg('Produk dipadam.',true);await load()}catch(e){msg('Gagal delete: '+e.message)}})}
async function load(){if(!catalogAuth.getKey()){msg('Masukkan Admin Key untuk sambung.');return}try{products=await catalog.list(false);render();msg('Rebuild API tersambung.',true)}catch(e){products=[];render();msg('API: '+e.message)}}
$('#keyForm').onsubmit=e=>{e.preventDefault();catalogAuth.setKey($('#key').value);load()};
$('#form').onsubmit=async e=>{e.preventDefault();const payload=normalizeProduct({sku:$('#sku').value,name:$('#name').value,slug:$('#slug').value,product_type:$('#type').value,fulfillment_type:$('#fulfillment').value,base_price_minor:$('#base').value,sale_price_minor:$('#sale').value||null,status:$('#status').value,short_description:$('#short').value,description:$('#description').value,images:$('#images').value.split(/\n+/).filter(Boolean),production_instructions:$('#production').value,internal_notes:$('#notes').value});try{const id=$('#id').value;if(id)await catalog.update(id,payload);else await catalog.create(payload);msg(id?'Produk dikemas kini.':'Produk berjaya ditambah.',true);reset();await load()}catch(e){msg('Gagal simpan: '+e.message)}};
$('#cancel').onclick=reset;$('#refresh').onclick=load;$('#key').value=catalogAuth.getKey();load();
</script></body></html>
