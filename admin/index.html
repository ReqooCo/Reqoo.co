<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Products · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"><style>
.admin-grid{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:18px}.rq-form{display:grid;gap:12px}.rq-form label{font-size:12px;color:var(--rq-muted);font-weight:700;letter-spacing:.06em}.rq-form input,.rq-form textarea{width:100%;padding:13px;border:1px solid var(--rq-line);border-radius:10px;background:#0f0f12;color:var(--rq-text);font:inherit}.rq-form textarea{min-height:90px;resize:vertical}.rq-check{display:flex;gap:9px;align-items:center;color:var(--rq-text)}.rq-check input{width:auto}.product-row{display:grid;grid-template-columns:72px 1fr auto;gap:14px;align-items:center;padding:12px;border:1px solid var(--rq-line);border-radius:12px;margin-bottom:10px;background:var(--rq-panel)}.product-row img{width:72px;height:72px;border-radius:9px;object-fit:cover;background:#0b0b0d}.product-row h3{margin:0 0 4px}.product-row p{margin:0;color:var(--rq-muted);font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap}.rq-btn.secondary{background:transparent;color:var(--rq-text);border:1px solid var(--rq-line)}.status{padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800}.published{background:#183d25;color:#91e6a7}.draft{background:#3a3215;color:#f0d36a}.notice{margin:0 0 18px;padding:12px 14px;border-radius:10px;background:#17171c;color:var(--rq-muted);border:1px solid var(--rq-line)}@media(max-width:800px){.admin-grid{grid-template-columns:1fr}.product-row{grid-template-columns:56px 1fr}.product-row img{width:56px;height:56px}.product-row .actions{grid-column:1/-1}}
</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../shop/">Shop</a><a href="../calculator/">Calculator</a><a href="../quotation/">Quotation</a></div></nav><main><div class="rq-kicker">Admin · Product</div><section class="rq-hero"><h1>Product Catalog</h1><p>Admin sahaja mengurus katalog. Produk bermula kosong; produk yang belum diterbitkan tidak muncul di Shop.</p></section><div id="notice" class="notice">Masukkan Admin Key untuk sambung.</div><section class="admin-grid"><article class="rq-card"><h2>Admin access</h2><form id="key-form" class="rq-form"><label>Admin Key<input id="admin-key" type="password" autocomplete="off" placeholder="Worker secret"></label><button class="rq-btn" type="submit">Sambung</button></form><hr style="border:0;border-top:1px solid var(--rq-line);margin:20px 0"><h2 id="form-title">Tambah produk</h2><form id="product-form" class="rq-form"><input id="product-id" type="hidden"><label>Nama produk<input id="name" required placeholder="Contoh: Signature Plaque"></label><label>Slug<input id="slug" placeholder="signature-plaque"></label><label>Penerangan<textarea id="description" placeholder="Penerangan ringkas produk"></textarea></label><label>Harga (RM)<input id="price" type="number" min="0" step="0.01" value="0"></label><label>Gambar produk — satu URL setiap baris<textarea id="images" placeholder="https://…/gambar-1.jpg&#10;https://…/gambar-2.jpg"></textarea></label><label>Susunan<input id="sort" type="number" value="0"></label><label class="rq-check"><input id="published" type="checkbox"> Terbitkan ke Shop</label><div class="actions"><button class="rq-btn" type="submit">Simpan produk</button><button class="rq-btn secondary" id="cancel" type="button" hidden>Batal</button></div></form></article><article class="rq-card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h2 style="margin-bottom:4px">Semua produk</h2><p style="margin:0">Draft + published</p></div><button class="rq-btn secondary" id="refresh" type="button">Refresh</button></div><div id="products" style="margin-top:16px"></div></article></section></main></div><script type="module">
import { catalog, catalogAuth, normalizeProduct } from '../shared/catalog.js';
const $=s=>document.querySelector(s); const notice=$('#notice'); const list=$('#products'); let products=[];
function msg(t,ok=false){notice.textContent=t;notice.style.color=ok?'#91e6a7':''}
function reset(){ $('#product-form').reset(); $('#product-id').value=''; $('#price').value='0'; $('#sort').value='0'; $('#form-title').textContent='Tambah produk'; $('#cancel').hidden=true; }
function edit(p){ $('#product-id').value=p.id||''; $('#name').value=p.name||''; $('#slug').value=p.slug||''; $('#description').value=p.description||''; $('#price').value=p.price??0; $('#images').value=(p.images||[]).join('\n'); $('#sort').value=p.sort??0; $('#published').checked=!!p.published; $('#form-title').textContent='Edit produk'; $('#cancel').hidden=false; scrollTo({top:0,behavior:'smooth'}); }
function render(){ if(!products.length){list.innerHTML='<div class="rq-empty">Belum ada produk. Tambah produk pertama di sebelah kiri.</div>';return} list.innerHTML=products.map(p=>{const img=(p.images||[])[0]||'';return `<div class="product-row"><div>${img?`<img src="${img.replace(/"/g,'&quot;')}" alt="">`:'<div style="width:72px;height:72px;border-radius:9px;background:#0b0b0d"></div>'}</div><div><h3>${esc(p.name)}</h3><p>RM${Number(p.price||0).toFixed(2)} · <span class="status ${p.published?'published':'draft'}">${p.published?'PUBLISHED':'DRAFT'}</span></p><p>${esc(p.description||'')}</p></div><div class="actions"><button class="rq-btn secondary" data-edit="${p.id}">Edit</button><button class="rq-btn secondary" data-del="${p.id}">Delete</button></div></div>`}).join(''); list.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>edit(products.find(p=>String(p.id)===b.dataset.edit))); list.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete produk ini?'))return;try{await catalog.remove(b.dataset.del);msg('Produk dipadam.',true);await load()}catch(e){msg('Gagal delete: '+e.message)}})}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(!catalogAuth.getKey()){msg('Masukkan Admin Key untuk sambung.');return}try{products=await catalog.list(false);products=Array.isArray(products)?products:(products.products||[]);render();msg('Catalog API tersambung.',true)}catch(e){products=[];render();msg('Catalog API: '+e.message)}}
$('#key-form').onsubmit=e=>{e.preventDefault();catalogAuth.setKey($('#admin-key').value);load()};
$('#product-form').onsubmit=async e=>{e.preventDefault();const payload=normalizeProduct({name:$('#name').value,slug:$('#slug').value,description:$('#description').value,price:$('#price').value,images:$('#images').value.split(/\n+/),published:$('#published').checked,sort:$('#sort').value});try{const id=$('#product-id').value;if(id)await catalog.update(id,payload);else await catalog.create(payload);msg(id?'Produk dikemas kini.':'Produk berjaya ditambah.',true);reset();await load()}catch(e){msg('Gagal simpan: '+e.message)}};
$('#cancel').onclick=reset; $('#refresh').onclick=load; $('#admin-key').value=catalogAuth.getKey(); load();
</script></body></html>
