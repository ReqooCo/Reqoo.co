<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reqoo Control Center</title><link rel="stylesheet" href="../assets/app.css"></head><body><div id="adminGate"><div class="admin-gate-card"><div class="brand">REQOO</div><div class="muted">Control Center · Admin</div><h1>Admin Key</h1><div class="muted">Masukkan Admin Key untuk masuk ke Admin Center.</div><div class="gate-key-wrap"><input id="gateAdminKey" class="gate-input" type="password" autocomplete="current-password" placeholder="Admin Key"><button id="gateToggleKey" class="gate-toggle-key" type="button">👁</button></div><button id="gateLogin" class="gate-button" type="button">Masuk Admin</button><div id="gateError" class="gate-error gate-hidden"></div></div></div><main id="adminApp" class="shell gate-hidden"><div class="topbar"><div><a class="brand" href="/">REQOO</a><div class="muted">Control Center · Shop + SIM</div></div><a class="button" href="/shop/">Buka Shop</a></div><div class="admin-grid"><aside class="card sidebar"><button type="button" class="side-btn active" data-tab="dashboard">Dashboard</button><button type="button" class="side-btn" data-tab="orders">Orders</button><button type="button" class="side-btn" data-tab="products">Shop · Products</button><button type="button" class="side-btn" onclick="location.href='/admin/shop-visuals.html'">Shop · Visuals</button><button type="button" class="side-btn" data-tab="sim">SIM · PKSK</button><button type="button" class="side-btn" data-tab="quotation">Quotation</button><button type="button" class="side-btn" data-tab="invoice">Invoice</button><button type="button" class="side-btn" data-tab="receipt">Receipt</button><button type="button" class="side-btn" data-tab="settings">Settings</button></aside><section><div id="dashboard" class="panel"><section class="card"><span class="eyebrow">CONTROL CENTER</span><h1>Reqoo Admin</h1><p class="muted">Kawal Shop, Orders, dokumen dan modul SIM dari satu tempat.</p></section></div><div id="orders" class="panel hidden"><section class="card"><h2>Orders</h2><div id="orderList"></div></section></div><div id="products" class="panel hidden"><section class="card"><h2>Products</h2><div id="productList"></div></section></div><div id="sim" class="panel hidden"><section class="card"><h2>PKSK</h2><a class="button primary" href="/sim/pksk/">Buka PKSK</a></section></div><div id="quotation" class="panel hidden"><section class="card"><h2>Quotation</h2><div id="quotationList"></div></section></div><div id="invoice" class="panel hidden"><section class="card"><h2>Invoice</h2><div id="invoiceList"></div></section></div><div id="receipt" class="panel hidden"><section class="card"><h2>Receipt</h2><div id="receiptList"></div></section></div><div id="settings" class="panel hidden"><section class="card"><h2>Settings</h2></section></div></section></div></main><script>/* Admin key persistence: never put the Cloudflare secret in the page. Keep the user's authenticated key locally so UI changes/navigation cannot erase it. */(()=>{try{const k=localStorage.getItem('reqoo_admin_key');if(k&&!sessionStorage.getItem('reqoo_admin_key'))sessionStorage.setItem('reqoo_admin_key',k);const s=sessionStorage.setItem.bind(sessionStorage);sessionStorage.setItem=(n,v)=>{s(n,v);if(n==='reqoo_admin_key')localStorage.setItem(n,v)};sessionStorage.removeItem=((rm)=>function(n){rm(n);if(n==='reqoo_admin_key')localStorage.removeItem(n)})(sessionStorage.removeItem.bind(sessionStorage))}catch(e){console.warn('admin key persistence',e)}})();</script><script src="admin.js?v=20260827-keyfix1"></script><script>document.addEventListener('DOMContentLoaded',function(){const i=document.getElementById('gateAdminKey'),b=document.getElementById('gateToggleKey');if(!i||!b)return;b.addEventListener('click',function(){const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'🙈':'👁';i.focus()})});</script></body></html>
