<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111315"><title>REQOO Admin — Control Centre</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;background:#f5f5f2;color:#1b1d20}.wrap{max-width:1400px;margin:auto;padding:22px}.hero{display:flex;justify-content:space-between;gap:16px;align-items:end;padding:8px 0 6px}.hero h1{margin:0;font-size:30px;letter-spacing:-.7px}.hero p{margin:6px 0 0;color:#72767d;font-size:12px}.date{font-size:9px;letter-spacing:1.3px;font-weight:850;color:#8a6a25}.btn{border:1px solid #d9d9d4;background:#fff;color:#222;border-radius:10px;padding:9px 12px;font-size:10px;font-weight:800;cursor:pointer}#loginGate{position:fixed;inset:0;z-index:9999;display:none;place-items:center;padding:20px;background:rgba(18,20,23,.82);backdrop-filter:blur(14px)}.login-card{width:min(430px,100%);background:#fff;border:1px solid #e3e3df;border-radius:18px;padding:26px;box-shadow:0 24px 80px rgba(0,0,0,.22)}.brand{font-weight:950;letter-spacing:2px}.brand span{color:#a6812f}.login-card h1{font-size:24px;margin:14px 0 7px}.login-card p{font-size:12px;color:#70747b;line-height:1.55}.login-field{position:relative}.login-field input{width:100%;padding:13px 45px 13px 13px;border:1px solid #d5d5d0;border-radius:10px}.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:transparent;cursor:pointer}.login-btn{width:100%;margin-top:10px;padding:13px;border:0;background:#1c1f22;color:#fff;border-radius:10px;font-weight:900}.login-msg{min-height:16px;margin-top:9px;font-size:11px;color:#a4312b}@media(max-width:700px){.wrap{padding:15px}.hero{align-items:flex-start;flex-direction:column}.hero h1{font-size:25px}}</style>
<link rel="stylesheet" href="/admin/overview.css?v=1">
</head>
<body>
<div id="loginGate"><div class="login-card"><div class="brand">REQOO<span>.ADMIN</span></div><h1>Selamat datang, Admin.</h1><p>Masukkan password/token Admin. Selepas berjaya, semua workspace Admin menggunakan sesi yang sama.</p><div class="login-field"><input id="loginToken" type="password" autocomplete="current-password" placeholder="Password / token Admin" onkeydown="if(event.key==='Enter')login()"><button class="eye" type="button" onclick="toggleLogin()" aria-label="Lihat password">◉</button></div><button class="login-btn" onclick="login()">MASUK ADMIN</button><div id="loginMsg" class="login-msg"></div></div></div>
<main class="wrap" id="adminApp"><section><div class="hero"><div><h1>Business Command Center</h1><p>Sales, collection, production dan customer Reqoo dalam satu dashboard.</p></div><div class="date">LIVE CONTROL CENTRE</div></div></section></main>
<script>
const LEGACY_KEYS=['reqoo_admin_token','REQOO_ADMIN_TOKEN','reqoo_shop_admin_token'],RETURN_KEY='reqoo_admin_return';
function legacyCookie(name){for(const part of document.cookie.split(';')){const i=part.indexOf('=');if(i>=0&&part.slice(0,i).trim()===name)return decodeURIComponent(part.slice(i+1).trim())}return''}
function clearLegacySecrets(){for(const k of LEGACY_KEYS)localStorage.removeItem(k);document.cookie='reqoo_admin_token=; Domain=.reqoo.co; Path=/; Max-Age=0; Secure; SameSite=Lax';document.cookie='reqoo_admin_token=; Path=/; Max-Age=0; Secure; SameSite=Lax'}
function safeReturn(v){if(!v)return'';try{const u=new URL(v,location.origin);if(u.origin!==location.origin)return'';if(u.pathname==='/'||u.pathname.startsWith('/admin/')||u.pathname==='/admin'||u.pathname.startsWith('/sim/pksk/admin'))return u.pathname+u.search+u.hash}catch{}return''}
function toggleLogin(){const i=document.getElementById('loginToken');i.type=i.type==='password'?'text':'password'}
function showGate(msg=''){const gate=document.getElementById('loginGate');gate.style.display='grid';document.getElementById('loginMsg').textContent=msg;setTimeout(()=>document.getElementById('loginToken').focus(),50)}
async function sessionStatus(){const r=await fetch('/api/admin-session',{cache:'no-store'});return r.ok}
async function createSession(v){const r=await fetch('/api/admin-session',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({token:v}),cache:'no-store'});let d={};try{d=await r.json()}catch{}return r.ok&&d.ok===true}
function ready(){window.dispatchEvent(new Event('reqoo:admin-ready'))}
async function login(){const v=document.getElementById('loginToken').value.trim(),m=document.getElementById('loginMsg');if(v.length<8){m.textContent='Password/token mesti sekurang-kurangnya 8 aksara.';return}m.textContent='Membuka sesi selamat…';try{if(!await createSession(v)){m.textContent='Password/token salah.';return}clearLegacySecrets();document.getElementById('loginToken').value='';const ret=safeReturn(sessionStorage.getItem(RETURN_KEY));sessionStorage.removeItem(RETURN_KEY);if(ret){location.href=ret;return}document.getElementById('loginGate').style.display='none';ready()}catch{m.textContent='Tak dapat buka sesi Admin. Cuba lagi.'}}
async function ensureSession(){const requested=safeReturn(new URLSearchParams(location.search).get('return'));if(requested)sessionStorage.setItem(RETURN_KEY,requested);try{if(await sessionStatus()){clearLegacySecrets();ready();return}}catch{}const legacy=LEGACY_KEYS.map(k=>localStorage.getItem(k)).find(Boolean)||legacyCookie('reqoo_admin_token');if(legacy){try{if(await createSession(legacy)){clearLegacySecrets();ready();return}}catch{}clearLegacySecrets()}showGate('Masukkan password Admin untuk mulakan sesi selamat.')}
ensureSession();
</script>
<script src="/admin/overview.js?v=3"></script>
</body></html>
