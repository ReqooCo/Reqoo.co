<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reqoo Control Center</title>
<link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
<div id="loginGate" class="login-gate">
  <div class="login-card">
    <div class="brand">REQOO</div>
    <div class="muted">Control Center · Admin</div>
    <h1>Admin Key</h1>
    <p class="muted">Masukkan Admin Key sekali untuk masuk. Selepas berjaya, tak perlu masukkan lagi untuk setiap tindakan.</p>
    <div id="loginStatus" class="notice hidden"></div>
    <input id="loginKey" class="input" type="password" autocomplete="current-password" placeholder="Admin Key">
    <button id="loginBtn" class="button primary">Masuk Admin</button>
  </div>
</div>
<div id="app" class="hidden">
<!-- original admin application markup is generated/used by admin.js -->
</div>
<script src="admin.js"></script>
</body>
</html>
