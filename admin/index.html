<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reqoo Control Center</title><link rel="stylesheet" href="../assets/app.css"><style>html,body{min-height:100%;margin:0}body{min-height:100svh;overflow-x:hidden}#adminGate{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px 16px;box-sizing:border-box;background:radial-gradient(circle at 50% 18%,rgba(215,170,74,.10),transparent 38%),#080806}.admin-gate-card{width:min(100%,440px);box-sizing:border-box;padding:34px 30px 30px;border:1px solid #4b3b21;border-radius:28px;background:linear-gradient(145deg,rgba(27,22,14,.98),rgba(12,11,8,.98));box-shadow:0 28px 90px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.035)}.admin-gate-card .brand{display:block;font-size:18px;font-weight:950;letter-spacing:.28em;color:#f4ecdc;margin-bottom:8px}.admin-gate-card .brand::after{content:'.';color:#d7aa4a}.admin-gate-card>.muted{font-size:14px;color:#aaa08e!important}.admin-gate-card h1{margin:28px 0 8px;font-size:clamp(34px,8vw,48px);line-height:1;letter-spacing:-.045em;color:#f4ecdc}.admin-gate-card h1+.muted{line-height:1.55;margin-bottom:18px}.gate-key-wrap{position:relative;width:100%;margin-bottom:12px}.gate-input{width:100%;height:54px;box-sizing:border-box;padding:0 58px 0 17px;border:1px solid #554327;border-radius:15px;background:#0a0907;color:#f4ecdc;outline:none;font-size:16px;box-shadow:inset 0 1px 8px rgba(0,0,0,.28)}.gate-input::placeholder{color:#746b5c}.gate-input:focus{border-color:#d7aa4a;box-shadow:0 0 0 3px rgba(215,170,74,.12)}.gate-toggle-key{position:absolute;right:6px;top:6px;width:42px;height:42px;border:1px solid #4a3b24;border-radius:12px;background:#18130c;color:#f4ecdc;cursor:pointer;font-size:18px}.gate-toggle-key:hover{border-color:#d7aa4a}.gate-button{width:100%;height:54px;border:1px solid #d7aa4a;border-radius:15px;background:linear-gradient(135deg,#f0cc7a,#d7aa4a);color:#120e07;font-size:16px;font-weight:850;cursor:pointer;box-shadow:0 10px 28px rgba(215,170,74,.13)}.gate-button:active{transform:translateY(1px)}.gate-button:disabled{opacity:.65;cursor:wait}.gate-error{margin-top:12px;padding:11px 13px;border:1px solid #6f3337;border-radius:12px;background:#211011;color:#ffb0b3;font-size:14px;line-height:1.4}.gate-hidden{display:none!important}@media(max-width:520px){#adminGate{padding:18px 14px}.admin-gate-card{padding:28px 20px 22px;border-radius:23px}.admin-gate-card h1{margin-top:24px}.gate-input,.gate-button{height:52px}}@media(min-height:760px){.admin-gate-card{transform:translateY(-2vh)}}</style></head><body><div id="adminGate"><div class="admin-gate-card"><div class="brand">REQOO</div><div class="muted">Control Center · Admin</div><h1>Admin Key</h1><div class="muted">Masukkan Admin Key untuk masuk ke Admin Center.</div><div class="gate-key-wrap"><input id="gateAdminKey" class="gate-input" type="password" autocomplete="current-password" placeholder="Admin Key"><button id="gateToggleKey" class="gate-toggle-key" type="button" aria-label="Tunjuk atau sembunyikan Admin Key">👁</button></div><button id="gateLogin" class="gate-button" type="button">Masuk Admin</button><div id="gateError" class="gate-error gate-hidden"></div></div></div><main id="adminApp" class="shell gate-hidden"><div class="topbar"><div><a class="brand" href="/">REQOO</a><div class="muted">Control Center · Shop + SIM</div></div><a class="button" href="/shop/">Buka Shop</a></div><div class="admin-grid"><aside class="card sidebar"><button type="button" class="side-btn active" data-tab="dashboard">Dashboard</button><button type="button" class="side-btn" data-tab="orders">Orders</button><button type="button" class="side-btn" data-tab="products">Shop · Products</button><button type="button" class="side-btn" onclick="location.href='/admin/shop-visuals.html'">Shop · Visuals</button><button type="button" class="side-btn" data-tab="sim">SIM · PKSK</button><button type="button" class="side-btn" data-tab="quotation">Quotation</button><button type="button" class="side-btn" data-tab="invoice">Invoice</button><button type="button" class="side-btn" data-tab="receipt">Receipt</button><button type="button" class="side-btn" data-tab="settings">Settings</button></aside><section><div id="dashboard" class="panel"><section class="card"><span class="eyebrow">CONTROL CENTER</span><h1>Reqoo Admin</h1><p class="muted">Kawal Shop, Orders, dokumen dan modul SIM dari satu tempat.</p></section></div><div id="orders" class="panel hidden"><section class="card"><h2>Orders</h2><div id="orderList"></div></section></div><div id="products" class="panel hidden"><section class="card"><h2>Products</h2><div id="productList"></div></section></div><div id="sim" class="panel hidden"><section class="card"><h2>PKSK</h2><a class="button primary" href="/sim/pksk/">Buka PKSK</a></section></div><div id="quotation" class="panel hidden"><section class="card"><h2>Quotation</h2><div id="quotationList"></div></section></div><div id="invoice" class="panel hidden"><section class="card"><h2>Invoice</h2><div id="invoiceList"></div></section></div><div id="receipt" class="panel hidden"><section class="card"><h2>Receipt</h2><div id="receiptList"></div></section></div><div id="settings" class="panel hidden"><section class="card"><h2>Settings</h2></section></div></section></div></main><script>/* Admin key persistence: never put the Cloudflare secret in the page. Keep the user's authenticated key locally so UI changes/navigation cannot erase it. */(()=>{try{const k=localStorage.getItem('reqoo_admin_key');if(k&&!sessionStorage.getItem('reqoo_admin_key'))sessionStorage.setItem('reqoo_admin_key',k);const s=sessionStorage.setItem.bind(sessionStorage);sessionStorage.setItem=(n,v)=>{s(n,v);if(n==='reqoo_admin_key')localStorage.setItem(n,v)};sessionStorage.removeItem=((rm)=>function(n){rm(n);if(n==='reqoo_admin_key')localStorage.removeItem(n)})(sessionStorage.removeItem.bind(sessionStorage))}catch(e){console.warn('admin key persistence',e)}})();</script><script src="admin.js?v=20260827-keyfix2"></script><script>document.addEventListener('DOMContentLoaded',function(){const i=document.getElementById('gateAdminKey'),b=document.getElementById('gateToggleKey');if(!i||!b)return;b.addEventListener('click',function(){const show=i.type==='password';i.type=show?'text':'password';b.textContent=show?'🙈':'👁';i.focus()})});</script></body></html>
