<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#145744"><title>REQOO Push Test</title>
<link rel="manifest" href="./push-test.webmanifest">
<style>body{font:16px system-ui;background:#FAFBF7;color:#173c31;margin:0;padding:24px}main{max-width:460px;margin:50px auto;background:white;padding:24px;border-radius:20px;box-shadow:0 12px 35px #1233}button{background:#145744;color:white;border:0;border-radius:12px;padding:15px;font:inherit;width:100%;margin:8px 0}button:disabled{opacity:.5}small{color:#555}#status{white-space:pre-wrap}</style></head>
<body><main><h1>REQOO Push Test</h1><p>Local test notification only. No customer data or payment activity.</p><p id="status">Checking support…</p><button id="test" disabled>Send test notification</button><p><small>iPhone: Safari → Share → Add to Home Screen → open installed app. Allow notifications when asked. This test works only on supported installed web apps.</small></p></main>
<script>
(async()=>{
 const status=document.querySelector('#status'),btn=document.querySelector('#test');
 const installed=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
 if(!('serviceWorker' in navigator)||!('Notification' in window)){status.textContent='Notifications unsupported in this browser.';return}
 try{
 const registration=await navigator.serviceWorker.register('./push-test-sw.js',{scope:'./'});
 await navigator.serviceWorker.ready;
 if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&!installed){status.textContent='Install this page to Home Screen and reopen it to test notifications.';return}
 status.textContent='Ready. Permission: '+Notification.permission;
 btn.disabled=false;
 btn.onclick=async()=>{
 try{
 if(Notification.permission==='default'){const p=await Notification.requestPermission();if(p!=='granted'){status.textContent='Permission: '+p;return}}
 if(Notification.permission!=='granted'){status.textContent='Notifications are blocked in device settings.';return}
 await registration.showNotification('REQOO Test Notification',{body:'This is a test only — no real order or payment.',tag:'reqoo-local-test',icon:'../favicon.ico'});
 status.textContent='Test notification requested. Check Notification Center.';
 }catch(e){status.textContent='Test failed: '+e.message}
 };
 }catch(e){status.textContent='Service worker registration failed: '+e.message}
})();
</script></body></html>
