<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production · REQOO.CO</title><link rel="stylesheet" href="../../shared/reqoo.css"><style>.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.row,.detail{border:1px solid var(--rq-line);border-radius:12px;background:var(--rq-panel);padding:14px}.row{margin-bottom:8px;cursor:pointer}.row:hover{border-color:#e1c47c}.detail{position:sticky;top:15px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filters input,.filters select{padding:10px;border:1px solid var(--rq-line);border-radius:9px;background:#0f0f12;color:var(--rq-text)}.muted{color:var(--rq-muted);font-size:11px;line-height:1.55}.steps{display:grid;gap:7px;margin:14px 0}.step{padding:10px;border:1px solid var(--rq-line);border-radius:9px}.active{border-color:#e1c47c}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:800px){.grid{grid-template-columns:1fr}.detail{position:static}}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../../">REQOO.CO</a><div class="rq-navlinks"><a href="../">Admin</a><a href="../orders/">Orders</a><a href="../../shop/">Shop</a></div></nav><main><div class="rq-kicker">ADMIN · PRODUCTION</div><section class="rq-hero"><h1>Production & Fulfilment</h1><p>Hanya order yang sudah paid boleh masuk production.</p></section><div id="notice" class="muted">Menyambung…</div><section class="rq-card"><div class="filters"><input id="search" placeholder="Cari order / customer"><select id="status"><option value="">Semua</option><option>pending</option><option>processing</option><option>qc</option><option>ready</option><option>shipped</option><option>completed</option><option>cancelled</option></select><button id="refresh" class="rq-btn secondary">Refresh</button></div><div class="grid"><div id="orders"></div><aside id="detail" class="detail"><div class="muted">Pilih order.</div></aside></div></section></main></div><script>const API='https://api.reqoo.co',$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>'RM'+(Number(v||0)/100).toFixed(2);let orders=[];const steps=['pending','processing','qc','ready','shipped','completed'];const labels={pending:'Menunggu produksi',processing:'Dalam produksi',qc:'QC',ready:'Ready',shipped:'Shipped / Pickup',completed:'Completed'};async function api(path,opt={}){const r=await fetch(API+path,{...opt,credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})}});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={error:t}}if(!r.ok)throw Error(d.error?.message||d.error||`HTTP ${r.status}`);return d}function render(){const q=$('#search').value.trim().toLowerCase(),s=$('#status').value;const a=orders.filter(o=>(!s||o.fulfillment_status===s)&&(!q||`${o.id} ${o.customer_id}`.toLowerCase().includes(q)));$('#orders').innerHTML=a.length?a.map(o=>`<div class="row" data-id="${esc(o.id)}"><b>#${esc(o.id.slice(0,8))}</b> · ${esc(o.payment_status)}<div class="muted">${money(o.total_minor)} · ${esc(o.fulfillment_status)}</div></div>`).join(''):'<div class="muted">Tiada order.</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>open(x.dataset.id))}async function load(){try{orders=await api('/orders');orders=Array.isArray(orders)?orders:(orders.orders||[]);render();$('#notice').textContent='Production API tersambung.';$('#notice').style.color='#91e6a7'}catch(e){$('#notice').textContent=e.message}}async function open(id){try{const d=await api('/orders/'+encodeURIComponent(id)),o=d.order,c=d.customer,current=o.fulfillment_status||'pending';$('#detail').innerHTML=`<h2>#${esc(o.id.slice(0,8))}</h2><div class="muted">${esc(c?.name||'-')} · ${esc(c?.phone||'-')}</div><p><b>${money(o.total_minor)}</b><br>Payment: ${esc(o.payment_status)}<br>Status: ${esc(current)}</p><div class="steps">${steps.map(s=>`<div class="step ${s===current?'active':''}"><b>${labels[s]}</b>${s===current?'<div class="muted">STATUS SEKARANG</div>':''}</div>`).join('')}</div><div class="actions">${o.payment_status==='paid'&&current!=='completed'&&current!=='cancelled'?`<button id="next" class="rq-btn">${current==='pending'?'Start Production':'Set '+labels[steps[Math.min(steps.indexOf(current)+1,steps.length-1)]]}</button>`:''}<button id="cancel" class="rq-btn secondary">Cancel</button></div><div id="out" class="muted"></div>`;$('#next')?.addEventListener('click',()=>change(id,steps[Math.min(steps.indexOf(current)+1,steps.length-1)]));$('#cancel').onclick=()=>change(id,'cancelled')}catch(e){$('#detail').innerHTML=`<div class="muted">${esc(e.message)}</div>`}}async function change(id,status){try{await api('/orders/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({fulfillment_status:status})});await load();await open(id)}catch(e){$('#out').textContent=e.message}}$('#refresh').onclick=load;$('#search').oninput=render;$('#status').onchange=render;load();</script></body></html>
