<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Production & Fulfilment · Reqoo.co</title><link rel="stylesheet" href="../../shared/reqoo.css"><style>.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:18px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filters input,.filters select,.filters textarea{padding:11px 12px;border:1px solid var(--rq-line);border-radius:9px;background:#0f0f12;color:var(--rq-text);font:inherit}.order-row,.detail{border:1px solid var(--rq-line);border-radius:12px;background:var(--rq-panel);padding:14px}.order-row{margin-bottom:9px;cursor:pointer}.order-row:hover{border-color:#e1c47c}.head{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--rq-muted);font-size:12px;line-height:1.55}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;border:1px solid var(--rq-line)}.paid{color:#91e6a7}.pending{color:#e1c47c}.failed{color:#ff8b8b}.detail{position:sticky;top:18px;min-height:260px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.rq-btn.secondary{background:transparent;color:var(--rq-text);border:1px solid var(--rq-line)}.timeline{display:grid;gap:8px;margin-top:14px}.step{padding:10px;border:1px solid var(--rq-line);border-radius:9px}.step.active{border-color:#e1c47c}.notice{margin-bottom:16px;padding:11px 13px;border:1px solid var(--rq-line);border-radius:10px;background:#17171c;color:var(--rq-muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.detail{position:static}}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../../">REQOO.CO</a><div class="rq-navlinks"><a href="../">Admin</a><a href="../orders/">Orders</a><a href="../../quotation/">Quotation</a></div></nav><main><div class="rq-kicker">ADMIN · PRODUCTION</div><section class="rq-hero"><h1>Production & Fulfilment</h1><p>Urus order yang sudah dibayar sehingga siap dihantar atau diambil customer.</p></section><div id="notice" class="notice">Masukkan Admin Key untuk sambung.</div><section class="rq-card"><form id="keyform" class="filters"><input id="key" type="password" placeholder="Admin Key" autocomplete="off"><button class="rq-btn">Sambung</button><button type="button" id="refresh" class="rq-btn secondary">Refresh</button></form><div class="filters"><input id="search" placeholder="Cari order ID / customer..."><select id="status"><option value="">Semua status</option><option value="paid">Paid · Belum produksi</option><option value="processing">Processing</option><option value="qc">QC</option><option value="ready">Ready</option><option value="shipped">Shipped / Pickup</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div class="grid"><div id="orders"></div><aside id="detail" class="detail"><div class="muted">Pilih order untuk lihat workflow.</div></aside></div></section></main></div><script type="module">import{catalogAuth}from'../../shared/catalog.js';const API='https://api.reqoo.co',key=document.querySelector('#key'),notice=document.querySelector('#notice'),ordersEl=document.querySelector('#orders'),detail=document.querySelector('#detail'),search=document.querySelector('#search'),status=document.querySelector('#status');let orders=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])}function msg(t,ok=false){notice.textContent=t;notice.style.color=ok?'#91e6a7':''}function money(v){return 'RM'+(Number(v||0)/100).toFixed(2)}async function api(path,opt={}){const h={'Content-Type':'application/json',...(opt.headers||{})},k=catalogAuth.getKey();if(k)h['X-Admin-Key']=k;const r=await fetch(API+path,{...opt,headers:h}),text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{d={error:text}}if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}async function load(){if(!catalogAuth.getKey()){msg('Masukkan Admin Key untuk sambung.');return}try{orders=await api('/orders');orders=Array.isArray(orders)?orders:orders.orders||[];render();msg('Production API tersambung.',true)}catch(e){msg('Gagal load orders: '+e.message)}}function render(){const q=search.value.trim().toLowerCase(),s=status.value;const list=orders.filter(o=>(!s||o.payment_status===s||o.fulfillment_status===s)&&(!q||`${o.id} ${o.customer_id}`.toLowerCase().includes(q)));if(!list.length){ordersEl.innerHTML='<div class="muted">Tiada order sepadan.</div>';return}ordersEl.innerHTML=list.map(o=>`<div class="order-row" data-id="${esc(o.id)}"><div class="head"><strong>#${esc(o.id.slice(0,8))}</strong><span class="status ${esc(o.payment_status)}">${esc(o.payment_status)}</span></div><div class="muted" style="margin-top:7px">${esc(o.created_at||'')}<br>${money(o.total_minor)} · Fulfilment: <strong>${esc(o.fulfillment_status)}</strong></div></div>`).join('');ordersEl.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>open(x.dataset.id))}const steps=['pending','processing','qc','ready','shipped','completed'];const labels={pending:'Menunggu produksi',processing:'Dalam produksi',qc:'QC / pemeriksaan',ready:'Siap',shipped:'Shipped / Pickup',completed:'Completed'};function nextStatus(s){const i=steps.indexOf(s);return i<0?'processing':steps[Math.min(i+1,steps.length-1)]}async function open(id){try{const d=await api('/orders/'+encodeURIComponent(id)),o=d.order,c=d.customer,current=o.fulfillment_status||'pending';detail.innerHTML=`<h2>Order #${esc(o.id.slice(0,8))}</h2><div class="muted">${esc(c?.name||'-')} · ${esc(c?.phone||'-')}</div><p><strong>${money(o.total_minor)}</strong><br>Payment: <span class="status ${esc(o.payment_status)}">${esc(o.payment_status)}</span></p><div class="timeline">${steps.map(x=>`<div class="step ${x===current?'active':''}"><strong>${labels[x]}</strong><div class="muted">${x===current?'STATUS SEKARANG':''}</div></div>`).join('')}</div><div class="actions">${o.payment_status==='paid'&&current!=='completed'&&current!=='cancelled'?`<button id="next" class="rq-btn">${current==='pending'?'Start Production':'Set '+labels[nextStatus(current)]}</button>`:''}<button id="cancel" class="rq-btn secondary">Cancel</button><a class="rq-btn secondary" href="../orders/?id=${encodeURIComponent(o.id)}">Order Detail</a></div><div id="out" class="muted" style="margin-top:10px"></div>`;const next=document.querySelector('#next');if(next)next.onclick=()=>change(id,nextStatus(current));const cancel=document.querySelector('#cancel');cancel.onclick=()=>change(id,'cancelled')}catch(e){detail.innerHTML='<div class="muted">'+esc(e.message)+'</div>'}}async function change(id,s){try{await api('/orders/'+encodeURIComponent(id),{method:'PUT',body:JSON.stringify({fulfillment_status:s})});await load();await open(id)}catch(e){const out=document.querySelector('#out');if(out)out.textContent='Gagal: '+e.message}}document.querySelector('#keyform').onsubmit=e=>{e.preventDefault();catalogAuth.setKey(key.value);load()};document.querySelector('#refresh').onclick=load;[search,status].forEach(x=>x.oninput=render);key.value=catalogAuth.getKey();load();</script></body></html>
