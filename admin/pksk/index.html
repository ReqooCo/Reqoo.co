<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PKSK Admin · REQOO.CO</title><link rel="stylesheet" href="../../shared/reqoo.css"><style>.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.filters input{flex:1;padding:11px;border:1px solid var(--rq-line);border-radius:9px;background:#0f0f12;color:var(--rq-text)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat,.row,.result{border:1px solid var(--rq-line);border-radius:11px;background:var(--rq-panel);padding:13px}.stat small{color:var(--rq-muted)}.stat strong{display:block;font-size:22px;margin-top:5px}.row{margin-bottom:8px}.muted{color:var(--rq-muted);font-size:11px;line-height:1.55}.ok{color:#91e6a7}.bad{color:#ff8b8b}.code{font-family:ui-monospace,monospace;word-break:break-all}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0}.tabs button{border:1px solid var(--rq-line);background:transparent;color:var(--rq-text);padding:9px 12px;border-radius:9px}.panel{display:none}.panel.active{display:block}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:450px){.grid{grid-template-columns:1fr}}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../../">REQOO.CO</a><div class="rq-navlinks"><a href="../">Admin</a><a href="../orders/">Orders</a><a href="../../shop/">Shop</a></div></nav><main><div class="rq-kicker">ADMIN · PKSK</div><section class="rq-hero"><h1>PKSK Control</h1><p>License, device, QR verification dan troubleshooting.</p></section><div id="notice" class="muted">Menyambung…</div><div class="tabs"><button data-tab="overview">Overview</button><button data-tab="verify">Verify QR</button><button data-tab="licenses">Licenses</button><button data-tab="devices">Devices</button><button data-tab="logs">Logs</button></div><section id="overview" class="panel active"><div id="stats" class="grid"></div></section><section id="verify" class="panel"><section class="rq-card"><h2>Verify QR / Access Code</h2><div class="filters"><input id="qr" placeholder="Paste QR payload / access code / order ID"><button id="verifyBtn" class="rq-btn">Verify</button></div><div id="verifyResult"></div></section></section><section id="licenses" class="panel"><section class="rq-card"><div id="licenseList"></div></section></section><section id="devices" class="panel"><section class="rq-card"><div id="deviceList"></div></section></section><section id="logs" class="panel"><section class="rq-card"><div id="logList"></div></section></section></main></div><script>const API='https://api.reqoo.co',$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(path,opt={}){const r=await fetch(API+path,{...opt,credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})}});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={error:t}}if(!r.ok)throw Error(d.error?.message||d.error||`HTTP ${r.status}`);return d}function msg(t,ok=false){$('#notice').textContent=t;$('#notice').className=ok?'muted ok':'muted'}function tab(id){document.querySelectorAll('.panel').forEach(x=>x.classList.toggle('active',x.id===id));if(id==='overview')summary();if(id==='licenses')licenses();if(id==='devices')devices();if(id==='logs')logs()}document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>tab(x.dataset.tab));async function summary(){try{const d=await api('/pksk-admin/summary');const n=(a)=>Array.isArray(a)?a.reduce((s,x)=>s+Number(x.count||0),0):0;$('#stats').innerHTML=`<div class="stat"><small>LICENSES</small><strong>${n(d.licenses)}</strong></div><div class="stat"><small>DEVICES</small><strong>${n(d.devices)}</strong></div><div class="stat"><small>ORDERS</small><strong>${n(d.orders)}</strong></div><div class="stat"><small>ERRORS</small><strong>${Number(d.error_count||0)}</strong></div>`;msg('PKSK API tersambung.',true)}catch(e){msg(e.message)}}async function licenses(){try{const a=await api('/pksk-admin/licenses');$('#licenseList').innerHTML=a.length?a.map(x=>`<div class="row"><b class="code">${esc(x.access_code||x.id)}</b><div class="muted">${esc(x.status)} · max device ${esc(x.max_devices)} · order ${esc(x.order_id||'-')} · expiry ${esc(x.expires_at||'-')}</div></div>`).join(''):'<div class="muted">Tiada license.</div>'}catch(e){$('#licenseList').innerHTML=`<div class="bad">${esc(e.message)}</div>`}}async function devices(){try{const a=await api('/pksk-admin/devices');$('#deviceList').innerHTML=a.length?a.map(x=>`<div class="row"><b>${esc(x.device_name||x.device_id||'-')}</b><div class="muted">License ${esc(x.license_id)}<br>${esc(x.device_id||'-')} · ${esc(x.status)} · ${esc(x.last_seen_at||'-')}</div></div>`).join(''):'<div class="muted">Tiada device.</div>'}catch(e){$('#deviceList').innerHTML=`<div class="bad">${esc(e.message)}</div>`}}async function logs(){try{const d=await api('/pksk-admin/logs'),a=[...(d.errors||[]),...(d.activity||[])].sort((x,y)=>String(y.created_at||'').localeCompare(String(x.created_at||'')));$('#logList').innerHTML=a.slice(0,200).map(x=>`<div class="row"><pre class="muted" style="white-space:pre-wrap">${esc(JSON.stringify(x,null,2))}</pre></div>`).join('')||'<div class="muted">Tiada log.</div>'}catch(e){$('#logList').innerHTML=`<div class="bad">${esc(e.message)}</div>`}}$('#verifyBtn').onclick=async()=>{const v=$('#qr').value.trim();if(!v)return;try{const d=await api('/pksk-admin/verify',{method:'POST',body:JSON.stringify({qr:v})});$('#verifyResult').innerHTML=d.valid?`<div class="result ok"><b>✓ SAH · ${esc(d.type)}</b><pre class="muted" style="white-space:pre-wrap">${esc(JSON.stringify(d,null,2))}</pre></div>`:`<div class="result bad"><b>✕ Tidak sah</b><div class="muted">${esc(d.raw||'')}</div></div>`}catch(e){$('#verifyResult').innerHTML=`<div class="result bad">${esc(e.message)}</div>`}}summary();</script></body></html>
