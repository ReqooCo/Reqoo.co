<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Requests · REQOO.CO</title><link rel="stylesheet" href="../shared/reqoo.css"><style>.filters,.actions{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filters input,.filters select{padding:10px;border:1px solid var(--rq-line);border-radius:9px;background:#0f0f12;color:var(--rq-text)}.card{border:1px solid var(--rq-line);border-radius:14px;padding:14px;background:var(--rq-panel);margin-bottom:9px}.head{display:flex;justify-content:space-between;gap:10px}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.chip{border:1px solid var(--rq-line);border-radius:8px;padding:8px;font-size:10px}.chip small{display:block;color:var(--rq-muted)}.muted{color:var(--rq-muted);font-size:11px;line-height:1.55}@media(max-width:650px){.chips{grid-template-columns:1fr 1fr}}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="./">Admin</a><a href="./quotations.html">Quotation</a><a href="../calculator/">Calculator</a></div></nav><main><div class="rq-kicker">ADMIN · CUSTOM SALES</div><section class="rq-hero"><h1>Customer Requests</h1><p>Request → Review → Quote → Convert.</p></section><section class="rq-card"><div class="filters"><input id="search" placeholder="Cari nama / reference / telefon"><select id="status"><option value="">Semua status</option><option>new</option><option>reviewing</option><option>quoted</option><option>approved</option><option>rejected</option><option>converted</option></select><button id="refresh" class="rq-btn secondary">Refresh</button></div><div id="notice" class="muted">Menyambung…</div><div id="list"></div></section></main></div><script>const API='https://api.reqoo.co',$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let rows=[];async function api(path,opt={}){const r=await fetch(API+path,{...opt,credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})}});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={error:t}}if(!r.ok)throw Error(d.error?.message||d.error||`HTTP ${r.status}`);return d}async function load(){try{rows=await api('/custom-requests');rows=Array.isArray(rows)?rows:[];render();$('#notice').textContent=`${rows.length} request.`;$('#notice').style.color='#91e6a7'}catch(e){$('#notice').textContent=e.message}}function render(){const q=$('#search').value.trim().toLowerCase(),s=$('#status').value,a=rows.filter(x=>(!s||x.status===s)&&(!q||`${x.reference} ${x.name} ${x.phone}`.toLowerCase().includes(q)));$('#list').innerHTML=a.length?a.map(x=>`<article class="card"><div class="head"><div><b>${esc(x.reference)}</b><div class="muted">${esc(x.name)} · ${esc(x.phone)}${x.email?' · '+esc(x.email):''}<br>${esc(x.created_at)}</div></div><select data-status="${esc(x.id)}"><option ${x.status==='new'?'selected':''}>new</option><option ${x.status==='reviewing'?'selected':''}>reviewing</option><option ${x.status==='quoted'?'selected':''}>quoted</option><option ${x.status==='approved'?'selected':''}>approved</option><option ${x.status==='rejected'?'selected':''}>rejected</option><option ${x.status==='converted'?'selected':''}>converted</option></select></div><div class="chips"><div class="chip"><small>Jenis</small>${esc(x.request_type||'-')}</div><div class="chip"><small>Material</small>${esc(x.material||'-')}</div><div class="chip"><small>Saiz</small>${esc(x.size||'-')}</div><div class="chip"><small>Qty</small>${esc(x.quantity||1)}</div><div class="chip"><small>Needed</small>${esc(x.needed_date||'-')}</div><div class="chip"><small>Budget</small>${esc(x.budget||'-')}</div></div><p class="muted">${esc(x.details)}</p><div class="actions">${x.file_url?`<a class="rq-btn secondary" href="${esc(x.file_url)}" target="_blank" rel="noopener">Lihat Design</a>`:''}<a class="rq-btn gold" href="../calculator/?request_id=${encodeURIComponent(x.id)}&customer=${encodeURIComponent(x.name||'')}&phone=${encodeURIComponent(x.phone||'')}&email=${encodeURIComponent(x.email||'')}&reference=${encodeURIComponent(x.reference||'')}&item=${encodeURIComponent(x.request_type||'Custom Work')}&material=${encodeURIComponent(x.material||'')}&size=${encodeURIComponent(x.size||'')}&qty=${encodeURIComponent(x.quantity||1)}">Calculator →</a></div></article>`).join(''):'<div class="muted">Tiada request.</div>';document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{try{await api('/custom-requests/'+encodeURIComponent(s.dataset.status),{method:'PUT',body:JSON.stringify({status:s.value})});await load()}catch(e){alert(e.message);load()}})}$('#refresh').onclick=load;$('#search').oninput=render;$('#status').onchange=render;load();</script></body></html>
