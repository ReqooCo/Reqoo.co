<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Requests · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css?v=20260822-requests1"><style>.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.filters input,.filters select{padding:11px;border:1px solid var(--rq-line);border-radius:9px;background:#0f0f12;color:var(--rq-text);font:inherit}.card{border:1px solid var(--rq-line);border-radius:14px;padding:15px;background:#111;margin-bottom:10px}.head{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--rq-muted);font-size:11px;line-height:1.55}.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}.chip{border:1px solid var(--rq-line);border-radius:9px;padding:8px;font-size:10px}.chip small{display:block;color:var(--rq-muted);margin-bottom:3px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{padding:30px;text-align:center;color:var(--rq-muted);border:1px dashed var(--rq-line);border-radius:12px}@media(max-width:650px){.chips{grid-template-columns:1fr 1fr}}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="./center.html">Admin</a><a href="../calculator/">Calculator</a><a href="../quotation/">Quotation</a></div></nav><main><div class="rq-kicker">ADMIN · SALES INTAKE</div><section class="rq-hero"><h1>Customer Requests</h1><p>New → Reviewing → Calculator → Quoted → Approved → Converted.</p></section><section class="rq-card"><div class="top"><div><h2 style="margin:0">Request Queue</h2><p style="margin:4px 0" class="muted">Request Custom Studio yang masuk daripada customer.</p></div><button id="refresh" class="rq-btn secondary">Refresh</button></div><form id="keyform" class="filters"><input id="key" type="password" placeholder="Admin Key" autocomplete="off"><button class="rq-btn" type="submit">Sambung</button></form><div class="filters"><input id="search" placeholder="Cari nama / reference / telefon"><select id="status"><option value="">Semua status</option><option>new</option><option>reviewing</option><option>quoted</option><option>approved</option><option>rejected</option><option>converted</option></select></div><div id="notice" class="muted"></div><div id="list" style="margin-top:12px"></div></section></main></div><script type="module">import{catalogAuth}from'../shared/catalog.js?v=20260822-requests1';const API='https://api.reqoo.co',$=s=>document.querySelector(s),key=$('#key'),list=$('#list'),notice=$('#notice'),search=$('#search'),status=$('#status');let rows=[];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const k=catalogAuth.getKey();if(!k){notice.textContent='Masukkan Admin Key.';return}try{const r=await fetch(API+'/custom-requests',{headers:{'X-Admin-Key':k}}),d=await r.json();if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);rows=Array.isArray(d)?d:[];render();notice.textContent=`${rows.length} request.`}catch(e){notice.textContent='Gagal: '+e.message}}function render(){const q=search.value.trim().toLowerCase(),s=status.value;const a=rows.filter(x=>(!s||x.status===s)&&(!q||`${x.reference} ${x.name} ${x.phone}`.toLowerCase().includes(q)));if(!a.length){list.innerHTML='<div class="empty">Tiada request.</div>';return}list.innerHTML=a.map(x=>`<article class="card"><div class="head"><div><strong>${esc(x.reference)}</strong><div class="muted">${esc(x.name)} · ${esc(x.phone)}${x.email?' · '+esc(x.email):''}<br>${esc(x.created_at||'')}</div></div><select data-status="${esc(x.id)}"><option value="new" ${x.status==='new'?'selected':''}>NEW</option><option value="reviewing" ${x.status==='reviewing'?'selected':''}>REVIEWING</option><option value="quoted" ${x.status==='quoted'?'selected':''}>QUOTED</option><option value="approved" ${x.status==='approved'?'selected':''}>APPROVED</option><option value="rejected" ${x.status==='rejected'?'selected':''}>REJECTED</option><option value="converted" ${x.status==='converted'?'selected':''}>CONVERTED</option></select></div><div class="chips"><div class="chip"><small>Jenis</small>${esc(x.request_type||'-')}</div><div class="chip"><small>Material</small>${esc(x.material||'-')}</div><div class="chip"><small>Saiz</small>${esc(x.size||'-')}</div><div class="chip"><small>Qty</small>${esc(x.quantity||1)}</div><div class="chip"><small>Needed</small>${esc(x.needed_date||'-')}</div><div class="chip"><small>Budget</small>${esc(x.budget||'-')}</div></div><p class="muted" style="margin:10px 0 0">${esc(x.details)}</p><div class="actions">${x.file_url?`<a class="rq-btn secondary" href="${esc(x.file_url)}" target="_blank" rel="noopener">Lihat Design</a>`:''}<a class="rq-btn gold" href="../calculator/?request_id=${encodeURIComponent(x.id)}&customer=${encodeURIComponent(x.name||'')}&phone=${encodeURIComponent(x.phone||'')}&email=${encodeURIComponent(x.email||'')}&reference=${encodeURIComponent(x.reference||'')}&item=${encodeURIComponent(x.request_type||'Custom Work')}&material=${encodeURIComponent(x.material||'')}&size=${encodeURIComponent(x.size||'')}&qty=${encodeURIComponent(x.quantity||1)}">Buka Calculator →</a></div></article>`).join('');list.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{try{const r=await fetch(API+'/custom-requests/'+encodeURIComponent(s.dataset.status),{method:'PUT',headers:{'Content-Type':'application/json','X-Admin-Key':catalogAuth.getKey()},body:JSON.stringify({status:s.value})});if(!r.ok)throw Error('Update gagal');load()}catch(e){alert(e.message);load()}})}$('#keyform').onsubmit=e=>{e.preventDefault();catalogAuth.setKey(key.value);load()};$('#refresh').onclick=load;search.oninput=render;status.onchange=render;key.value=catalogAuth.getKey();load();</script></body></html>
