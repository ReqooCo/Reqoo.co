<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>REQOO.CO — Products</title><link rel="stylesheet" href="/admin/products-v1.css?v=1"></head><body><main class="wrap rqProductsApp"><section class="rqProductsHead"><div><div class="rqProductsEyebrow">PRODUCT CONTROL</div><h1>Products</h1><p>Urus katalog, variasi dan stok tanpa memuatkan Orders atau Production.</p></div><div class="rqProductsHeadActions"><button class="btn" id="refreshProducts" type="button">↻ Refresh</button><button class="btn primary" id="addProduct" type="button">+ Produk</button></div></section><section class="rqProductsStats"><article><span>PRODUCTS</span><strong id="prdTotal">—</strong></article><article><span>ACTIVE</span><strong id="prdActive">—</strong></article><article><span>LOW STOCK</span><strong id="prdLow">—</strong></article><article><span>OUT OF STOCK</span><strong id="prdOut">—</strong></article><article><span>PAID REVENUE</span><strong id="prdRevenue">—</strong></article></section><section class="rqProductsPanel"><div class="rqProductsToolbar"><input id="productSearch" type="search" placeholder="Cari produk, kategori atau SKU"><select id="productFilter"><option value="all">Semua</option><option value="active">Active</option><option value="hidden">Hidden</option><option value="low">Low stock ≤ 5</option><option value="out">Out of stock</option><option value="untracked">Untracked</option></select></div><div id="productsList" class="rqProductsList"><div class="rqProductsState">Memuatkan products…</div></div></section><div id="productsState" class="rqProductsState"></div></main><div id="productDrawer" class="rqProductDrawer" aria-hidden="true"><div class="rqProductDrawerCard"><div class="rqProductDrawerHead"><div><small>PRODUCT EDITOR</small><h2 id="productDrawerTitle">Produk</h2></div><button type="button" id="closeProductDrawer">×</button></div><form id="productForm"><input id="productId" type="hidden"><label>Nama<input id="productName" required maxlength="160"></label><label>Kategori<input id="productCategory" maxlength="100"></label><div class="rqGrid2"><label>Harga asas (RM)<input id="productPrice" type="number" min="0" step="0.01"></label><label>Status<select id="productActive"><option value="1">Active</option><option value="0">Hidden</option></select></label></div><label>Description<textarea id="productDescription" rows="4"></textarea></label><div class="rqVariantHead"><b>Variasi</b><button type="button" class="btn" id="addVariant">+ Variasi</button></div><div id="variantList" class="rqVariantList"></div><div class="rqProductDrawerActions"><button type="button" class="btn" id="cancelProductEdit">Batal</button><button type="submit" class="btn primary" id="saveProduct">Simpan</button></div></form></div></div><div id="productsToast" class="rqProductsToast"></div><script src="/admin/products-v1.js?v=1"></script></body></html>
