<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotations · Reqoo Admin</title><link rel="stylesheet" href="../shared/reqoo.css"><style>.bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.bar input{padding:11px;border:1px solid var(--rq-line);border-radius:9px;background:#0f0f12;color:var(--rq-text);flex:1;min-width:180px}.row{padding:15px;border:1px solid var(--rq-line);border-radius:12px;background:var(--rq-panel);margin-bottom:9px}.row strong{font-size:16px}.muted{color:var(--rq-muted);font-size:12px;line-height:1.6}.pill{display:inline-block;padding:4px 8px;border:1px solid var(--rq-line);border-radius:999px;font-size:10px;margin-left:6px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.empty{padding:28px;text-align:center;color:var(--rq-muted);border:1px dashed var(--rq-line);border-radius:12px}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="./">REQOO.CO</a><div class="rq-navlinks"><a href="./center.html">Center</a><a href="./orders/">Orders</a><a href="../quotation/">Customer View</a></div></nav><main><div class="rq-kicker">REQOO · SALES</div><section class="rq-hero"><h1>Quotation Manager</h1><p>Buat quotation → share → customer accept → convert Order → payment.</p></section><section class="rq-card"><div class="bar"><input id="key" type="password" placeholder="Admin Key"><button id="connect" class="rq-btn">Sambung</button><button id="refresh" class="rq-btn secondary">Refresh</button></div><div id="msg" class="muted">Masukkan Admin Key.</div></section><section class="rq-card" style="margin-top:14px"><h2>Buat Quotation</h2><div class="bar"><input id="name" placeholder="Nama customer"><input id="phone" placeholder="Telefon"><input id="email" placeholder="Email"></div><div class="bar"><input id="item" placeholder="Item / custom work"><input id="material" placeholder="Material"><input id="size" placeholder="Saiz"><input id="qty" type="number" min="1" value="1" placeholder="Qty"><input id="price" type="number" step="0.01" min="0" placeholder="Harga unit RM"></div><div class="bar"><input id="discount" type="number" step="0.01" min="0" value="0" placeholder="Diskaun RM"><input id="notes" placeholder="Nota / terms"><button id="create" class="rq-btn">Create & Share</button></div></section><section class="rq-card" style="margin-top:14px"><h2>Quotation Queue</h2><div id="list"></div></section></main></div><script type="module">import{catalogAuth}from'../shared/catalog.js';const API='https://api.reqoo.co',$=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'RM'+(Number(n||0)/100).toFixed(2);function key(){return catalogAuth.getKey()}async function api(path,opt={}){const k=key();if(!k)throw Error('Admin Key diperlukan');const r=await fetch(API+path,{...opt,headers:{'Content-Type':'application/json','X-Admin-Key':k,...(opt.headers||{})}});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||`HTTP ${r.status}`);return d}async function load(){try{const a=await api('/quotations');$('#list').innerHTML=a.length?a.map(q=>`<div class="row"><strong>${esc(q.reference)}</strong><span class="pill">${esc(q.status)}</span><div class="muted">${esc(q.customer_name)} · ${esc(q.customer_phone||'')}<br>Total: <b>${money(q.total_minor)}</b> · ${esc(q.created_at)}</div><div class="actions"><a class="rq-btn secondary" href="../quotation/?token=${encodeURIComponent(q.share_token||'')}" target="_blank">Customer View</a><button class="rq-btn secondary" data-copy="${esc(q.id)}">Copy Link</button>${q.status==='accepted'?`<button class="rq-btn" data-convert="${esc(q.id)}">Convert to Order</button>`:''}</div></div>`).join(''):'<div class="empty">Belum ada quotation.</div>'}catch(e){$('#list').innerHTML=`<div class="empty">${esc(e.message)}</div>`}}$('#connect').onclick=()=>{catalogAuth.setKey($('#key').value);load()};$('#refresh').onclick=load;$('#key').value=key();$('#create').onclick=async()=>{try{const qty=Math.max(1,Number($('#qty').value||1)),price=Math.max(0,Number($('#price').value||0));const d=await api('/quotations',{method:'POST',body:JSON.stringify({customer_name:$('#name').value,customer_phone:$('#phone').value,customer_email:$('#email').value,discount_minor:Math.round(Number($('#discount').value||0)*100),notes:$('#notes').value,items:[{description:$('#item').value,material:$('#material').value,size:$('#size').value,quantity:qty,unit_price_minor:Math.round(price*100)}]})});$('#msg').textContent='Quotation '+d.quotation.reference+' siap. '+d.share_url;load()}catch(e){$('#msg').textContent=e.message}};document.addEventListener('click',async e=>{const c=e.target.closest('[data-convert]');if(c)try{const d=await api('/quotations/'+c.dataset.convert+'/convert',{method:'POST'});$('#msg').textContent='Order berjaya dibuat: '+d.order_id;load()}catch(x){alert(x.message)}const cp=e.target.closest('[data-copy]');if(cp)try{const q=await api('/quotations/'+cp.dataset.copy);await navigator.clipboard.writeText('https://reqoo.co/quotation/?token='+q.share_token);alert('Share link disalin')}catch(x){alert(x.message)}});if(key())load();</script></body></html>
