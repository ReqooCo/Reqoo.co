<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>REQOO.CO — Customers</title>
<link rel="stylesheet" href="/admin/customers.css?v=2">
<style>.rqBtnIcon{width:19px;height:19px;flex:none;margin-right:7px;vertical-align:middle}button:has(>.rqBtnIcon){display:inline-flex;align-items:center;justify-content:center;min-height:44px}button:focus-visible{outline:3px solid #287653;outline-offset:2px}</style></head>
<body>
<main class="wrap rqCustomersApp">
  <section class="rqCustomersHead">
    <div><div class="rqCustomersEyebrow">CUSTOMER CRM</div><h1>Customers</h1><p>Customer profiles, orders, documents, payments and balances in one place.</p></div>
    <button class="btn" id="refreshCustomers" type="button"><svg class="rqBtnIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.2 5.5"/><path d="M20 4v7h-7"/></svg>Refresh</button>
  </section>
  <section class="rqCustomerStats crm">
    <article><span>CUSTOMERS</span><strong id="statCustomers">—</strong></article>
    <article><span>REPEAT BUYERS</span><strong id="statRepeat">—</strong></article>
    <article><span>LIFETIME COLLECTED</span><strong id="statRevenue">—</strong></article>
    <article class="outstanding"><span>OUTSTANDING</span><strong id="statOutstanding">—</strong></article>
    <article><span>AVG. CUSTOMER VALUE</span><strong id="statAov">—</strong></article>
  </section>
  <section class="rqCustomerPanel">
    <div class="rqCustomerToolbar">
      <input id="customerSearch" placeholder="Search name, phone or email">
      <select id="customerSort"><option value="recent">Most recent</option><option value="spend">Highest lifetime value</option><option value="outstanding">Highest outstanding</option><option value="orders">Most orders</option><option value="name">Name A–Z</option></select>
    </div>
    <div id="customerState" class="rqCustomerState">Loading customers…</div>
    <div id="customerList" class="rqCustomerList"></div>
  </section>
</main>
<div class="rqCustomerDrawer" id="customerDrawer" aria-hidden="true"><div class="rqCustomerDrawerBox"><div class="rqCustomerDrawerHead"><div><div class="rqCustomersEyebrow">CUSTOMER PROFILE</div><h2 id="drawerTitle">Customer</h2></div><button id="drawerClose" type="button" aria-label="Close">×</button></div><div id="drawerBody"></div></div></div>
<div class="rqCustomerToast" id="customerToast"></div>
<script src="/admin/customers.js?v=5"></script>
</body>
</html>
