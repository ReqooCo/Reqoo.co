<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>REQOO.CO — Customers</title>
<link rel="stylesheet" href="/admin/customers.css?v=1">
</head>
<body>
<main class="wrap rqCustomersApp">
  <section class="rqCustomersHead">
    <div><div class="rqCustomersEyebrow">CUSTOMER CRM</div><h1>Customers</h1><p>Customer profile, order, dokumen, payment dan outstanding dalam satu tempat.</p></div>
    <button class="btn" id="refreshCustomers" type="button">↻ Refresh</button>
  </section>
  <section class="rqCustomerStats crm">
    <article><span>CUSTOMERS</span><strong id="statCustomers">—</strong></article>
    <article><span>REPEAT BUYERS</span><strong id="statRepeat">—</strong></article>
    <article><span>LIFETIME COLLECTED</span><strong id="statRevenue">—</strong></article>
    <article class="outstanding"><span>OUTSTANDING</span><strong id="statOutstanding">—</strong></article>
    <article><span>AVG. CUSTOMER VALUE</span><strong id="statAov">—</strong></article>
  </section>
  <section class="rqCustomerPanel">
    <div class="rqCustomerToolbar">
      <input id="customerSearch" placeholder="Cari nama, telefon atau email">
      <select id="customerSort"><option value="recent">Terbaru</option><option value="spend">Lifetime value tertinggi</option><option value="outstanding">Outstanding tertinggi</option><option value="orders">Order terbanyak</option><option value="name">Nama A–Z</option></select>
    </div>
    <div id="customerState" class="rqCustomerState">Memuatkan pelanggan…</div>
    <div id="customerList" class="rqCustomerList"></div>
  </section>
</main>
<div class="rqCustomerDrawer" id="customerDrawer" aria-hidden="true"><div class="rqCustomerDrawerBox"><div class="rqCustomerDrawerHead"><div><div class="rqCustomersEyebrow">CUSTOMER PROFILE</div><h2 id="drawerTitle">Customer</h2></div><button id="drawerClose" type="button" aria-label="Tutup">×</button></div><div id="drawerBody"></div></div></div>
<div class="rqCustomerToast" id="customerToast"></div>
<script src="/admin/customers.js?v=3"></script>
</body>
</html>
