<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-store"><title>REQOO.CO — Production</title><link rel="stylesheet" href="/admin/production.css?v=6"></head><body>
<main class="wrap rqProductionApp">
<section class="rqProductionHead"><div><div class="rqProductionEyebrow">PRODUCTION CONTROL</div><h1>Production</h1><p>Organize work by status, due date, priority and assignee.</p></div><button class="btn" id="refreshProduction" type="button">↻ Refresh</button></section>
<section class="rqProductionStats"><article><span>PENDING PAYMENT</span><strong id="prdPending">—</strong></article><article><span>READY TO PRODUCE</span><strong id="prdPaid">—</strong></article><article><span>IN PRODUCTION</span><strong id="prdProcessing">—</strong></article><article><span>FULFILLED</span><strong id="prdFulfilled">—</strong></article></section>
<section class="rqProductionPanel"><div class="rqProductionToolbar"><input id="productionSearch" type="search" placeholder="Search orders, customers or assignees"><select id="productionFilter"><option value="active">All active</option><option value="pending">Pending payment</option><option value="paid">Ready</option><option value="processing">In production</option><option value="today">Due hari ini</option><option value="overdue">Overdue</option><option value="fulfilled">Fulfilled</option></select></div><div id="productionList" class="rqProductionList"><div class="rqProductionState">Memuatkan production…</div></div><div class="rqProductionMore"><button class="btn" id="loadMoreProduction" type="button" hidden>Load More</button></div></section>
<div id="productionState" class="rqProductionState"></div></main>
<div id="productionDrawer" class="rqProductionDrawer" aria-hidden="true"><div class="rqProductionDrawerCard"><div class="rqProductionDrawerHead"><div><small>PRODUCTION WORKSPACE</small><h2 id="productionDrawerRef">Order</h2></div><button type="button" id="closeProductionDrawer">×</button></div><div id="productionDetail"></div><div class="rqProductionPlanTitle"><small>PRODUCTION PLAN</small><h3>Internal work plan</h3></div><form id="productionForm"><label>Due date<input id="productionDue" type="date"></label><label>Priority<select id="productionPriority"><option value="normal">Normal</option><option value="high">High</option><option value="urgent">Urgent</option></select></label><label>Operator / PIC<input id="productionAssigned" maxlength="80"></label><label>Nota dalaman<textarea id="productionNote" rows="5" maxlength="2000"></textarea></label><div class="rqProductionDrawerActions"><button type="button" class="btn" id="cancelProductionPlan">Batal</button><button type="submit" class="btn primary" id="saveProductionPlan">Save plan</button></div></form></div></div>
<div id="productionToast" class="rqProductionToast"></div><script src="/admin/production.js?v=7"></script></body></html>
