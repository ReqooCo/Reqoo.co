<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Orders · Reqoo.co</title><link rel="stylesheet" href="../../shared/reqoo.css"><style>.top{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}.filters input,.filters select{padding:11px 12px;border:1px solid var(--rq-line);border-radius:9px;background:#0f0f12;color:var(--rq-text);font:inherit}.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:18px}.order-row,.detail-box{border:1px solid var(--rq-line);border-radius:12px;background:var(--rq-panel);padding:14px}.order-row{margin-bottom:9px;cursor:pointer}.order-row:hover{border-color:#e1c47c}.order-head{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--rq-muted);font-size:12px;line-height:1.55}.status{display:inline-block;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:800;border:1px solid var(--rq-line)}.pending{color:#e1c47c}.paid{color:#91e6a7}.failed{color:#ff8b8b}.detail-box{position:sticky;top:18px;min-height:240px}.item{padding:12px 0;border-bottom:1px solid var(--rq-line)}.item:last-child{border-bottom:0}.custom{margin-top:8px;padding:9px 10px;border-radius:9px;background:#101014;border:1px solid var(--rq-line);font-size:12px;line-height:1.65}.custom b{color:#e1c47c}.notice{margin:0 0 16px;padding:11px 13px;border:1px solid var(--rq-line);border-radius:10px;background:#17171c;color:var(--rq-muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.rq-btn.secondary{background:transparent;color:var(--rq-text);border:1px solid var(--rq-line)}.empty{padding:24px;text-align:center;color:var(--rq-muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.detail-box{position:static}}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../../">REQOO.CO</a><div class="rq-navlinks"><a href="../">Admin</a><a href="../../shop/">Shop</a><a href="../../quotation/">Quotation</a></div></nav><main><div class="rq-kicker">Admin · Orders & Notifications</div><section class="rq-hero"><h1>Orders</h1><p>Pesanan shop dan perkara yang memerlukan tindakan admin.</p></section><div id="notice" class="notice">Masukkan Admin Key untuk sambung.</div><section class="rq-card"><div class="top"><div><h2 style="margin-bottom:4px">Notification Centre</h2><p style="margin:0">Ringkasan item yang perlu diperiksa.</p></div><button id="refresh" class="rq-btn secondary">Refresh</button></div><div id="summary" class="filters"></div></section><section class="rq-card" style="margin-top:18px"><form id="keyform" class="filters"><input id="key" type="password" placeholder="Admin Key" autocomplete="off"><button class="rq-btn" type="submit">Sambung</button></form><div class="filters"><input id="search" placeholder="Cari order ID / customer..."><select id="payment"><option value="">Semua bayaran</option><option value="pending">Pending</option><option value="paid">Paid</option><option value="failed">Failed</option></select><select id="fulfil"><option value="">Semua fulfilment</option><option value="pending">Pending</option><option value="processing">Processing</option><option value="completed">Completed</option><option value="cancelled">Cancelled</option></select></div><div class="grid"><div><div id="orders"></div></div><aside id="detail" class="detail-box"><div class="empty">Pilih order untuk lihat detail.</div></aside></div></section></main></div><script type="module">import{catalogAuth}from'../../shared/catalog.js';const API='https://api.reqoo.co',keyEl=document.querySelector('#key'),notice=document.querySelector('#notice'),ordersEl=document.querySelector('#orders'),detailEl=document.querySelector('#detail'),summaryEl=document.querySelector('#summary'),searchEl=document.querySelector('#search'),paymentEl=document.querySelector('#payment'),fulfilEl=document.querySelector('#fulfil');let orders=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])}function money(v){return 'RM'+(Number(v||0)/100).toFixed(2)}function msg(t,ok=false){notice.textContent=t;notice.style.color=ok?'#91e6a7':''}async function api(path,opt={}){const k=catalogAuth.getKey();const h={'Content-Type':'application/json',...(opt.headers||{})};if(k)h['X-Admin-Key']=k;const r=await fetch(API+path,{...opt,headers:h});const text=await r.text();let d={};try{d=text?JSON.parse(text):{}}catch{d={error:text}}if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);return d}function renderSummary(){const pending=orders.filter(x=>x.payment_status==='pending').length,paid=orders.filter(x=>x.payment_status==='paid').length,failed=orders.filter(x=>x.payment_status==='failed').length;summaryEl.innerHTML=`<span class="status pending">PAYMENT PENDING · ${pending}</span><span class="status paid">PAID · ${paid}</span><span class="status failed">FAILED · ${failed}</span><span class="status">TOTAL ORDERS · ${orders.length}</span>`}function render(){const q=searchEl.value.trim().toLowerCase(),pf=paymentEl.value,ff=fulfilEl.value;const list=orders.filter(x=>(!pf||x.payment_status===pf)&&(!ff||x.fulfillment_status===ff)&&(!q||`${x.id} ${x.customer_id}`.toLowerCase().includes(q)));if(!list.length){ordersEl.innerHTML='<div class="empty">Tiada order sepadan.</div>';return}ordersEl.innerHTML=list.map(x=>`<div class="order-row" data-id="${esc(x.id)}"><div class="order-head"><strong>#${esc(x.id.slice(0,8))}</strong><span class="status ${esc(x.payment_status)}">${esc(x.payment_status)}</span></div><div class="muted" style="margin-top:7px">${esc(x.created_at||'')}<br>Jumlah: <strong>${money(x.total_minor)}</strong><br>Fulfilment: ${esc(x.fulfillment_status)}</div></div>`).join('');ordersEl.querySelectorAll('[data-id]').forEach(el=>el.onclick=()=>openOrder(el.dataset.id))}function parseJSON(v,fallback){try{return v?JSON.parse(v):fallback}catch{return fallback}}function customizationHTML(i){const c=parseJSON(i.customization_snapshot_json,{}),v=parseJSON(i.variation_snapshot_json,{}),a=parseJSON(i.addons_snapshot_json,[]);const entries=[];for(const[k,val]of Object.entries(c)){if(val!==undefined&&val!==null&&String(val)!=='')entries.push(`<div><b>${esc(k)}:</b> ${esc(typeof val==='object'?JSON.stringify(val):val)}</div>`)}for(const[k,val]of Object.entries(v)){if(val!==undefined&&val!==null&&String(val)!=='')entries.push(`<div><b>${esc(k)}:</b> ${esc(typeof val==='object'?JSON.stringify(val):val)}</div>`)}if(Array.isArray(a)&&a.length)entries.push(`<div><b>Add-ons:</b> ${esc(JSON.stringify(a))}</div>`);return entries.length?`<div class="custom"><strong>Customisation</strong>${entries.join('')}</div>`:''}async function openOrder(id){try{const d=await api('/orders/'+encodeURIComponent(id));const o=d.order,c=d.customer;detailEl.innerHTML=`<h2>Order #${esc(o.id.slice(0,8))}</h2><div class="muted">${esc(o.created_at||'')}</div><hr style="border:0;border-top:1px solid var(--rq-line);margin:14px 0"><p><strong>${esc(c?.name||'-')}</strong><br>${esc(c?.phone||'-')}<br>${esc(c?.email||'')}</p><div><strong>Item</strong>${(d.items||[]).map(i=>`<div class="item"><div><strong>${esc(i.product_name_snapshot)}</strong> × ${esc(i.quantity)}${customizationHTML(i)}</div><strong>${money(i.line_total_minor)}</strong></div>`).join('')}</div><div style="margin-top:14px"><div>Payment: <strong>${esc(o.payment_status)}</strong></div><div>Fulfilment: <strong>${esc(o.fulfillment_status)}</strong></div><div style="font-size:20px;margin-top:10px"><strong>${money(o.total_minor)}</strong></div></div><div class="actions">${o.payment_status==='pending'?'<button id="bill" class="rq-btn">Generate Payment Link</button>':''}<a class="rq-btn secondary" href="../../invoice/?id=${encodeURIComponent(o.id)}" target="_blank">Invoice / Receipt</a><a class="rq-btn secondary" href="../../order/?id=${encodeURIComponent(o.id)}" target="_blank">Open Order Page</a></div><div id="billout" class="muted" style="margin-top:10px"></div>`;const bill=document.querySelector('#bill');if(bill)bill.onclick=async()=>{bill.disabled=true;try{const x=await api('/payments/billplz/create/'+encodeURIComponent(o.id),{method:'POST'});document.querySelector('#billout').innerHTML=`Payment link: <a href="${esc(x.bill_url)}" target="_blank" rel="noopener">Open Bill</a>`}catch(e){document.querySelector('#billout').textContent='Gagal: '+e.message}finally{bill.disabled=false}}}catch(e){detailEl.innerHTML=`<div class="empty">${esc(e.message)}</div>`}}async function load(){if(!catalogAuth.getKey()){msg('Masukkan Admin Key untuk sambung.');return}try{orders=await api('/orders');orders=Array.isArray(orders)?orders:(orders.orders||[]);renderSummary();render();msg('Order API tersambung.',true)}catch(e){msg('Gagal load orders: '+e.message);orders=[];renderSummary();render()}}document.querySelector('#keyform').onsubmit=e=>{e.preventDefault();catalogAuth.setKey(keyEl.value);load()};document.querySelector('#refresh').onclick=load;[searchEl,paymentEl,fulfilEl].forEach(x=>x.oninput=render);keyEl.value=catalogAuth.getKey();load();</script></body></html>
