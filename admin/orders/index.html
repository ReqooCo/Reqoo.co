<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orders · REQOO.CO</title><link rel="stylesheet" href="../../shared/reqoo.css"><style>.grid{display:grid;grid-template-columns:1fr 1.15fr;gap:16px}.filters,.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:14px 0}.filters input,.filters select{padding:10px 12px;border:1px solid var(--rq-line);border-radius:9px;background:#0f0f12;color:var(--rq-text);font:inherit}.row,.detail{border:1px solid var(--rq-line);border-radius:12px;background:var(--rq-panel);padding:14px}.row{margin-bottom:8px;cursor:pointer}.row:hover{border-color:#e1c47c}.detail{position:sticky;top:15px;min-height:300px}.muted{color:var(--rq-muted);font-size:11px;line-height:1.55}.pill{display:inline-block;padding:4px 8px;border:1px solid var(--rq-line);border-radius:999px;font-size:9px}.item{padding:10px 0;border-bottom:1px solid var(--rq-line)}.notice{padding:10px 12px;border:1px solid var(--rq-line);border-radius:10px;margin:12px 0;color:var(--rq-muted)}@media(max-width:800px){.grid{grid-template-columns:1fr}.detail{position:static}}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../../">REQOO.CO</a><div class="rq-navlinks"><a href="../">Admin</a><a href="../../shop/">Shop</a><a href="../../quotation/">Quotation</a></div></nav><main><div class="rq-kicker">ADMIN · ORDERS</div><section class="rq-hero"><h1>Orders</h1><p>Order → payment → production → shipping.</p></section><div id="notice" class="notice">Menyambung ke Admin API…</div><section class="rq-card"><div id="summary" class="filters"></div><div class="filters"><input id="search" placeholder="Cari order ID / customer"><select id="payment"><option value="">Semua bayaran</option><option>pending</option><option>paid</option><option>failed</option></select><select id="fulfil"><option value="">Semua fulfilment</option><option>pending</option><option>processing</option><option>qc</option><option>ready</option><option>shipped</option><option>completed</option><option>cancelled</option></select><button id="refresh" class="rq-btn secondary">Refresh</button></div><div class="grid"><div id="orders"></div><aside id="detail" class="detail"><div class="muted">Pilih order.</div></aside></div></section></main></div><script>const API='https://api.reqoo.co',$=s=>document.querySelector(s),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),money=v=>'RM'+(Number(v||0)/100).toFixed(2);let orders=[];async function api(path,opt={}){const r=await fetch(API+path,{...opt,credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})}});const t=await r.text();let d={};try{d=t?JSON.parse(t):{}}catch{d={error:t}}if(!r.ok)throw Error(d.error?.message||d.error||`HTTP ${r.status}`);return d}function notice(t,ok=false){$('#notice').textContent=t;$('#notice').style.color=ok?'#91e6a7':''}function render(){const q=$('#search').value.trim().toLowerCase(),p=$('#payment').value,f=$('#fulfil').value;const a=orders.filter(o=>(!p||o.payment_status===p)&&(!f||o.fulfillment_status===f)&&(!q||`${o.id} ${o.customer_id}`.toLowerCase().includes(q)));$('#orders').innerHTML=a.length?a.map(o=>`<div class="row" data-id="${esc(o.id)}"><strong>#${esc(o.id.slice(0,8))}</strong> <span class="pill">${esc(o.payment_status)}</span><div class="muted">${esc(o.created_at)}<br>${money(o.total_minor)} · ${esc(o.fulfillment_status)}</div></div>`).join(''):'<div class="muted">Tiada order.</div>';document.querySelectorAll('[data-id]').forEach(x=>x.onclick=()=>openOrder(x.dataset.id));$('#summary').innerHTML=`<span class="pill">TOTAL ${orders.length}</span><span class="pill">PENDING ${orders.filter(x=>x.payment_status==='pending').length}</span><span class="pill">PAID ${orders.filter(x=>x.payment_status==='paid').length}</span>`}async function load(){try{orders=await api('/orders');orders=Array.isArray(orders)?orders:(orders.orders||[]);render();notice('Admin API tersambung.',true)}catch(e){notice(e.message);orders=[];render()}}function parse(v){try{return v?JSON.parse(v):{}}catch{return{}}}async function openOrder(id){try{const d=await api('/orders/'+encodeURIComponent(id)),o=d.order,c=d.customer,p=d.payment;const qr=p?.method==='qr'&&p?.status==='pending_verification';$('#detail').innerHTML=`<h2>#${esc(o.id.slice(0,8))}</h2><div class="muted">${esc(o.created_at)}</div><p><b>${esc(c?.name||'-')}</b><br>${esc(c?.phone||'-')}<br>${esc(c?.email||'')}</p><p class="muted"><b>Alamat</b><br>${esc(o.shipping_address||'Belum diisi')}</p><p class="muted"><b>Nota</b><br>${esc(o.order_note||'-')}</p><div><b>Item</b>${(d.items||[]).map(i=>{const v=parse(i.variation_snapshot_json),c=parse(i.customization_snapshot_json),a=parse(i.addons_snapshot_json);return`<div class="item"><b>${esc(i.product_name_snapshot)} × ${esc(i.quantity)}</b><div class="muted">Variation: ${esc(JSON.stringify(v))}<br>Custom: ${esc(JSON.stringify(c))}<br>Add-on: ${esc(JSON.stringify(a))}</div><b>${money(i.line_total_minor)}</b></div>`}).join('')}</div><p>Subtotal <b>${money(o.subtotal_minor)}</b><br>Shipping <b>${money(o.shipping_minor)}</b><br>Total <b>${money(o.total_minor)}</b><br>Payment <b>${esc(o.payment_status)}</b> · Fulfilment <b>${esc(o.fulfillment_status)}</b></p>${o.payment_status==='pending'?`<div class="actions"><input id="ship" type="number" min="0" step="0.01" value="${(Number(o.shipping_minor||0)/100).toFixed(2)}" placeholder="Shipping RM"><button id="saveShip" class="rq-btn secondary">Finalize Shipping</button><button id="bill" class="rq-btn gold">Generate Billplz</button></div>`:''}<div class="actions">${qr?'<button id="qr" class="rq-btn gold">Verify QR</button>':''}<a class="rq-btn secondary" href="../../invoice/?id=${encodeURIComponent(o.id)}" target="_blank">Invoice</a><a class="rq-btn secondary" href="../../order/?id=${encodeURIComponent(o.id)}" target="_blank">Customer View</a></div><div id="out" class="muted"></div>`;$('#saveShip')?.addEventListener('click',async()=>{const amount=Math.round(Number($('#ship').value||0)*100);try{const x=await api('/admin-orders/'+encodeURIComponent(o.id)+'/shipping',{method:'POST',body:JSON.stringify({shipping_minor:amount})});$('#out').textContent='Total finalized: '+money(x.total_minor);await load();await openOrder(o.id)}catch(e){$('#out').textContent=e.message}});$('#bill')?.addEventListener('click',async()=>{try{const x=await api('/payments/billplz/create/'+encodeURIComponent(o.id),{method:'POST'});$('#out').innerHTML=`<a href="${esc(x.bill_url)}" target="_blank" rel="noopener">Buka Billplz</a>`}catch(e){$('#out').textContent=e.message}});$('#qr')?.addEventListener('click',async()=>{try{await api('/payments/qr/verify/'+encodeURIComponent(o.id),{method:'POST'});await load();await openOrder(o.id)}catch(e){$('#out').textContent=e.message}})}catch(e){$('#detail').innerHTML=`<div class="muted">${esc(e.message)}</div>`}}$('#refresh').onclick=load;$('#search').oninput=render;$('#payment').onchange=render;$('#fulfil').onchange=render;load();</script></body></html>
