<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>REQOO • PKSK Control Center</title><style>:root{--bg:#f5f3ed;--card:#fffdf9;--ink:#14243d;--muted:#68788f;--line:#ded8cc;--gold:#c99d38;--green:#19784e;--red:#a8323b;--warn:#9b6b12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1250px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0 20px}.brand{font-weight:950;letter-spacing:3px}.brand b{color:var(--gold)}.muted{color:var(--muted)}.nav,.tabs,.actions{display:flex;gap:8px;flex-wrap:wrap}.btn,input{border:1px solid #d5cec0;background:#fff;color:var(--ink);border-radius:12px;padding:11px 13px;font:inherit}.btn{cursor:pointer;font-weight:800}.primary{background:var(--ink);color:#fff}.gold{background:linear-gradient(135deg,#e9d18e,#c99d38);color:#111}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;margin-top:14px;box-shadow:0 8px 25px rgba(20,36,61,.05)}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{padding:17px;border-top:4px solid var(--gold)}.k{font-size:11px;font-weight:900;letter-spacing:1px;color:var(--muted)}.v{font-size:30px;font-weight:950;margin-top:7px}.ok{color:var(--green)}.warn{color:var(--warn)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:900px}.table th,.table td{padding:11px 9px;border-bottom:1px solid #e7e1d7;text-align:left;vertical-align:top}.table th{font-size:10px;color:var(--muted);letter-spacing:1px}.pill{display:inline-block;border:1px solid var(--line);border-radius:99px;padding:5px 8px;font-size:10px;font-weight:900}.paid,.active{color:var(--green);border-color:#a8d8bd;background:#eef9f2}.pending{color:var(--warn);border-color:#e5c978;background:#fff8e3}.empty{text-align:center;color:var(--muted);padding:25px}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}.hint{font-size:12px;color:var(--muted);line-height:1.5}.danger{color:var(--red)}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.wrap{padding:12px}.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><div><div class="brand">REQOO<b>.ADMIN</b></div><div class="muted">PKSK 50 • PAYMENT • LICENSE • DEVICE</div></div><a class="btn" href="/admin/">← MAIN ADMIN</a></header><div class="nav"><button class="btn primary" onclick="loadAll()">↻ Refresh</button><button class="btn" onclick="load('orders')">Payment</button><button class="btn" onclick="load('licenses')">License</button></div><section class="grid"><div class="card metric"><div class="k">ORDERS</div><div class="v" id="orders">—</div></div><div class="card metric"><div class="k">PAID</div><div class="v ok" id="paid">—</div></div><div class="card metric"><div class="k">PENDING</div><div class="v warn" id="pending">—</div></div><div class="card metric"><div class="k">ACTIVE LICENSE</div><div class="v ok" id="activeLicenses">—</div></div></section><section class="card"><b>Semakan Payment QR</b><p class="hint">QR manual tidak auto-aktif. Selepas transaksi disahkan, tekan <b>VERIFY QR → CREATE LICENSE</b>. Sistem akan tandakan payment paid dan terus cipta Access Code.</p></section><section class="card"><div class="tabs"><button class="btn gold" onclick="load('orders')">💳 Payment</button><button class="btn" onclick="load('licenses')">🔑 License</button></div><div id="panel" style="margin-top:14px"></div></section></main><script>const $=id=>document.getElementById(id),TOKEN_KEY='reqoo_admin_token';if(!localStorage.getItem(TOKEN_KEY))location.replace('/admin/?return='+encodeURIComponent(location.pathname));const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const pill=s=>{const x=String(s??'').toLowerCase(),c=x==='paid'||x==='active'?'paid':x.includes('pending')?'pending':'';return`<span class="pill ${c}">${esc(s||'—')}</span>`};async function api(action,extra={},method='GET'){const token=localStorage.getItem(TOKEN_KEY)||'',u=new URL('/api/sim-admin-v2',location.origin);u.searchParams.set('action',action);if(method==='GET')Object.entries(extra).forEach(([k,v])=>{if(v!==undefined&&v!=='')u.searchParams.set(k,v)});const o={method,headers:{'X-Admin-Token':token,'Content-Type':'application/json'},cache:'no-store'};if(method==='POST')o.body=JSON.stringify(extra);const r=await fetch(u,o),d=await r.json();if(r.status===401){localStorage.removeItem(TOKEN_KEY);location.replace('/admin/?return='+encodeURIComponent(location.pathname));throw Error('Admin session tidak sah')}if(!d.ok)throw Error(d.error||'Request gagal');return d}async function loadAll(){try{const d=await api('summary');for(const k of ['orders','paid','pending','activeLicenses'])$(k).textContent=d[k]??0;await load('orders')}catch(e){alert(e.message)}}async function load(kind){try{if(kind==='orders'){const d=await api('orders');$('panel').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>ORDER</th><th>PEMBELI</th><th>AMOUNT</th><th>PAYMENT</th><th>REF</th><th>LICENSE</th><th>PAID AT</th><th>ACTION</th></tr></thead><tbody>${d.orders.map(o=>`<tr><td class="mono">${esc(o.id)}</td><td>${esc(o.customer_name)}<br><span class="muted">${esc(o.phone)}</span></td><td>RM${Number(o.amount||0).toFixed(2)}</td><td>${pill(o.payment_status)}</td><td class="mono">${esc(o.payment_ref)}</td><td class="mono">${esc(o.access_code||'—')}</td><td>${esc(o.paid_at||'—')}</td><td>${o.payment_status==='pending'&&o.payment_ref?`<button class="btn gold" onclick="verifyQR('${esc(o.id)}','${esc(o.payment_ref)}')">VERIFY QR → CREATE LICENSE</button>`:o.access_code?'<span class="ok"><b>✓ ACTIVE</b></span>':'—'}</td></tr>`).join('')||'<tr><td colspan="8" class="empty">Tiada rekod.</td></tr>'}</tbody></table></div>`}else{const d=await api('licenses');$('panel').innerHTML=`<div class="tablewrap"><table class="table"><thead><tr><th>ACCESS CODE</th><th>PEMBELI</th><th>PHONE</th><th>PAYMENT</th><th>STATUS</th><th>ORDER</th><th>CREATED</th></tr></thead><tbody>${d.licenses.map(l=>`<tr><td class="mono"><b>${esc(l.access_code)}</b></td><td>${esc(l.customer_name)}</td><td>${esc(l.phone)}</td><td>${pill(l.payment_status)}</td><td>${pill(l.status)}</td><td class="mono">${esc(l.order_id)}</td><td>${esc(l.created_at)}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">Tiada license.</td></tr>'}</tbody></table></div>`}}catch(e){$('panel').innerHTML=`<div class="danger">${esc(e.message)}</div>`}}async function verifyQR(orderNo,tx){if(!confirm('Sahkan bayaran QR RM35 untuk order '+orderNo+'?\nPastikan transaksi telah diterima.'))return;try{const d=await api('verifyQR',{orderNo,transactionRef:tx,reason:'Admin sahkan bayaran QR RM35'},'POST');alert('BERJAYA\nAccess Code: '+d.accessCode);await loadAll()}catch(e){alert('GAGAL: '+e.message)}}loadAll();</script></body></html>
