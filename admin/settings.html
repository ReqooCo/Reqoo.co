<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REQOO Admin — Settings</title>
<style>body{margin:0;background:#080808;color:#f5f5f5;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:900px;margin:auto;padding:28px}.card{background:#111;border:1px solid #292929;border-radius:16px;padding:22px;margin-top:20px}h1{font-size:28px;margin:0}p{color:#888}.row{display:flex;gap:10px;align-items:end}.field{flex:1}.label{display:block;color:#888;font-size:11px;margin-bottom:7px}input{width:100%;box-sizing:border-box;background:#0b0b0b;color:#fff;border:1px solid #333;border-radius:10px;padding:12px}button{border:1px solid #6b592e;background:#d9b45e;color:#090909;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}.hint{font-size:11px;color:#666;margin-top:12px}.ok{color:#57c785}.err{color:#e46b78}@media(max-width:600px){.row{flex-direction:column;align-items:stretch}button{width:100%}}</style>
</head><body><main class="wrap"><a href="/admin/" style="color:#aaa;text-decoration:none">← Admin</a><div class="card"><h1>Admin Security</h1><p>Tetapkan token/password Admin yang akan digunakan oleh modul SIM.</p><div class="row"><div class="field"><label class="label" for="token">ADMIN TOKEN / PASSWORD</label><input id="token" type="password" autocomplete="new-password" placeholder="Masukkan token admin"></div><button onclick="save()">Simpan</button></div><div id="msg" class="hint">Token disimpan pada browser ini sahaja.</div></div></main><script>const KEY='reqoo_admin_token';const input=document.getElementById('token');const msg=document.getElementById('msg');const saved=localStorage.getItem(KEY);if(saved)input.value=saved;function save(){const v=input.value.trim();if(!v){msg.className='hint err';msg.textContent='Token tidak boleh kosong.';return}localStorage.setItem(KEY,v);msg.className='hint ok';msg.textContent='Token Admin berjaya disimpan pada browser ini.'}</script></body></html>
