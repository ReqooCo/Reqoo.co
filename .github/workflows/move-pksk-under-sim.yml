name: Move PKSK under SIM family

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  move:
    if: ${{ !contains(github.event.head_commit.message, '[move-pksk-under-sim]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move PKSK into SIM family
        shell: bash
        run: |
          set -e

          if [ ! -d pksk ]; then
            echo 'Top-level pksk folder not found. Nothing to move.'
            exit 0
          fi

          if [ -e sim/pksk ]; then
            echo 'sim/pksk already exists. Refusing to overwrite it.'
            exit 1
          fi

          mv pksk sim/pksk

          git config user.name 'reqoo-structure-bot'
          git config user.email 'reqoo-structure-bot@users.noreply.github.com'
          git add -A
          git commit -m '[move-pksk-under-sim] Move PKSK under SIM family'
          git push
