name: PKSK V45.10 Generator

on:
  workflow_dispatch:
    inputs:
      set_number:
        description: 'Nombor set PKSK (5-50)'
        required: true
        default: '5'
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/build_pksk_sets_04_50_v4510.py'
      - 'sim/pksk/PKSK_GENERATOR_RULES.md'
      - 'sim/pksk/PKSK_SET_STATE.json'
      - '.github/workflows/pksk-v4510-generator.yml'

permissions:
  contents: write

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'build(pksk): publish V45.10 production set'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate set number
        env:
          PKSK_SET: ${{ inputs.set_number || '5' }}
        run: |
          python3 - <<'PY'
          import os
          s=int(os.environ['PKSK_SET'])
          assert 5 <= s <= 50, f'Set mesti 5-50, diterima: {s}'
          print(f'Generating PKSK Set {s} dengan V45.10')
          PY

      - name: Generate from V45.10
        env:
          PKSK_SET: ${{ inputs.set_number || '5' }}
        run: python3 scripts/build_pksk_sets_04_50_v4510.py

      - name: Structural and hard QA
        env:
          PKSK_SET: ${{ inputs.set_number || '5' }}
        run: |
          python3 - <<'PY'
          import json, os
          from collections import Counter
          s=int(os.environ['PKSK_SET'])
          p=f'sim/pksk/simulator/sets/SET 01-10/data/set{s:02d}.json'
          d=json.load(open(p,encoding='utf-8'))
          q=d['questions']; w=d['writing']
          assert len(q)==100
          assert sum(x['section']=='BAHAGIAN A' for x in q)==30
          assert sum(x['section']=='BAHAGIAN B' for x in q)==70
          assert len(w)==3
          assert len({x['id'] for x in q})==100
          assert len({x['question'].strip().casefold() for x in q})==100
          assert d.get('legacy_content_used') is False
          A=[x for x in q if x['section']=='BAHAGIAN A']
          pos=Counter(x['answerIndex'] for x in A)
          assert dict(sorted(pos.items()))=={0:8,1:8,2:7,3:7}, pos
          assert sum(x.get('format')=='AGREE_DISAGREE' for x in A)>=10
          assert d['qa']['status']=='PASS'
          assert d['qa']['length_leak']=='PASS'
          print('PASS V45.10 STRUCTURE', s, dict(sorted(pos.items())))
          PY

      - name: Mathematics answer-option gate
        env:
          PKSK_SET: ${{ inputs.set_number || '5' }}
        run: |
          python3 - <<'PY'
          import json, os
          s=int(os.environ['PKSK_SET'])
          p=f'sim/pksk/simulator/sets/SET 01-10/data/set{s:02d}.json'
          d=json.load(open(p,encoding='utf-8'))
          math=[x for x in d['questions'] if x.get('category')=='Matematik']
          assert math
          for x in math:
              assert len(x['options'])==4
              assert len(set(x['options']))==4
              assert 0 <= x['answerIndex'] < 4
          print(f'Mathematics option gate PASS: {len(math)} items')
          PY

      - name: Publish verified JSON
        env:
          PKSK_SET: ${{ inputs.set_number || '5' }}
        run: |
          git config user.name ReqooCo
          git config user.email actions@github.com
          git add "sim/pksk/simulator/sets/SET 01-10/data/set${PKSK_SET}.json"
          git commit -m 'build(pksk): publish V45.10 production set' || echo 'No changes to commit'
          git push origin main
