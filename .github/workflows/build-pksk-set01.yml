name: Build PKSK Set 01
on:
  push:
    branches: [main]
    paths-ignore:
      - 'sim/pksk/simulator/sets/SET 01-10/data/set01.json'
      - 'scripts/build_pksk_set01.py'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Set 01
        run: python3 scripts/build_pksk_set01.py
      - name: Publish
        run: |
          git config user.name ReqooCo
          git config user.email actions@github.com
          git add sim/pksk/data/candidates/set01 sim/pksk/simulator/sets/SET\ 01-10/data/set01.json scripts/build_pksk_set01.py .github/workflows/build-pksk-set01.yml
          git commit -m 'build(pksk): publish Set 01 from audited candidates'
          git push origin main
