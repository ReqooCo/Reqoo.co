name: Provision REQOO Rebuild D1

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v1-foundation

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          wrangler whoami

      - name: Create or reuse isolated D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_NAME="reqoo-rebuild"
          API="https://api.cloudflare.com/client/v4"

          LIST_JSON="$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database")"
          DB_ID="$(printf '%s' "$LIST_JSON" | jq -r --arg name "$DB_NAME" '.result[] | select(.name == $name) | .uuid' | head -n 1)"

          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            echo "Creating isolated D1: $DB_NAME"
            CREATE_JSON="$(curl -fsS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" "$API/accounts/$CLOUDFLARE_ACCOUNT_ID/d1/database" --data "$(jq -nc --arg name "$DB_NAME" '{name:$name}')")"
            printf '%s' "$CREATE_JSON" | jq .
            DB_ID="$(printf '%s' "$CREATE_JSON" | jq -r '.result.uuid')"
          else
            echo "Reusing existing D1: $DB_NAME"
          fi

          test -n "$DB_ID" && [ "$DB_ID" != "null" ] || { echo "Unable to resolve D1 database id"; exit 1; }
          printf '%s\n' "name = \"reqoo-rebuild\"" "compatibility_date = \"2026-08-19\"" "" "[[d1_databases]]" "binding = \"DB\"" "database_name = \"reqoo-rebuild\"" "database_id = \"$DB_ID\"" "migrations_dir = \"migrations\"" > wrangler.toml
          cat wrangler.toml

      - name: Apply migration 0001 to remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply reqoo-rebuild --remote

      - name: Verify core schema on remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          REQUIRED_TABLES="customers products product_images product_variations product_custom_fields product_addons orders order_items payments fulfillments documents document_items payment_allocations licenses license_devices referrals referral_attributions referral_commissions activity_events error_events admin_audit_events pricing_materials pricing_machines pricing_rules pricing_calculations schema_migrations"
          SQL="SELECT name FROM sqlite_master WHERE type='table' AND name IN ($(printf "'%s'," $REQUIRED_TABLES | sed 's/,$//')) ORDER BY name;"
          wrangler d1 execute reqoo-rebuild --remote --command "$SQL" --json > /tmp/schema.json
          cat /tmp/schema.json
          EXPECTED="$(printf '%s\n' $REQUIRED_TABLES | sort)"
          ACTUAL="$(jq -r '.result[0].results[]?.name // empty' /tmp/schema.json | sort)"
          test "$ACTUAL" = "$EXPECTED" || { echo "Schema verification failed"; echo "Expected:"; printf '%s\n' "$EXPECTED"; echo "Actual:"; printf '%s\n' "$ACTUAL"; exit 1; }
          echo "REQOO CORE SCHEMA VERIFIED: all required tables exist."

      - name: Commit D1 binding configuration
        run: |
          git config user.name "REQOO Bot"
          git config user.email "actions@reqoo.co"
          git add wrangler.toml
          if git diff --cached --quiet; then
            echo "No config change."
            exit 0
          fi
          git commit -m "provision isolated rebuild D1 binding"
          git push
