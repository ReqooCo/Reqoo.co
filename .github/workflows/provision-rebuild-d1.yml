name: Provision REQOO Rebuild D1

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v1-foundation

permissions:
  contents: write

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Verify Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          wrangler whoami

      - name: Create or reuse isolated D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          DB_NAME="reqoo-rebuild"
          DB_JSON="$(wrangler d1 list --json)"
          DB_ID="$(printf '%s' "$DB_JSON" | jq -r '.[] | select(.name == "reqoo-rebuild") | (.uuid // .database_id)' | head -n 1)"
          if [ -z "$DB_ID" ] || [ "$DB_ID" = "null" ]; then
            CREATE_JSON="$(wrangler d1 create "$DB_NAME" --json)"
            DB_ID="$(printf '%s' "$CREATE_JSON" | jq -r '.database_id // .uuid // .result.uuid // .result.database_id')"
          fi
          test -n "$DB_ID" && [ "$DB_ID" != "null" ] || { echo "Unable to resolve D1 database id"; exit 1; }
          printf '%s\n' "name = \"reqoo-rebuild\"" "compatibility_date = \"2026-08-19\"" "" "[[d1_databases]]" "binding = \"DB\"" "database_name = \"reqoo-rebuild\"" "database_id = \"$DB_ID\"" "migrations_dir = \"migrations\"" > wrangler.toml
          cat wrangler.toml

      - name: Apply migration 0001 to remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: wrangler d1 migrations apply reqoo-rebuild --remote

      - name: Commit D1 binding configuration
        run: |
          git config user.name "REQOO Bot"
          git config user.email "actions@reqoo.co"
          git add wrangler.toml
          if git diff --cached --quiet; then
            echo "No config change."
            exit 0
          fi
          git commit -m "provision isolated rebuild D1 binding"
          git push
