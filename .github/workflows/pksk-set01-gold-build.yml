name: PKSK Set01 Gold Build

on:
  push:
    branches:
      - rebuild/pksk-set01-gold-v1
    paths:
      - 'sim/pksk/generator/gold/set01/**'
      - 'scripts/assemble_set01_gold.py'
      - 'scripts/test_set01_gold_scoring_contract.js'
      - 'scripts/build_set01_visual_smoke.py'
      - 'docs/SET01_GOLD_STANDARD_PLAN.md'
      - '.github/workflows/pksk-set01-gold-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/pksk-set01-gold-v1
      - name: Assemble and validate Set 01
        run: python scripts/assemble_set01_gold.py
      - name: Test visual renderer
        run: node scripts/test_pksk_visual_renderer.js
      - name: Test scoring/runtime contract
        run: node scripts/test_set01_gold_scoring_contract.js
      - name: Build visual QA page
        run: python scripts/build_set01_visual_smoke.py
      - name: Desktop and mobile visual smoke
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          PAGE="file://$PWD/.tmp/set01-visual-smoke.html"
          "$CHROME" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=1440,2200 --screenshot="$PWD/.tmp/set01-desktop.png" "$PAGE"
          "$CHROME" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=390,5200 --screenshot="$PWD/.tmp/set01-mobile.png" "$PAGE"
          "$CHROME" --headless --no-sandbox --disable-gpu --allow-file-access-from-files --window-size=390,844 --dump-dom "$PAGE" > .tmp/set01-mobile-dom.html
          grep -q 'data-ready="1"' .tmp/set01-mobile-dom.html
          grep -q 'data-overflow="0"' .tmp/set01-mobile-dom.html
          grep -q 'data-visuals="6"' .tmp/set01-mobile-dom.html
          test -s .tmp/set01-desktop.png
          test -s .tmp/set01-mobile.png
      - name: Upload visual QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: set01-visual-qa
          path: |
            .tmp/set01-desktop.png
            .tmp/set01-mobile.png
          if-no-files-found: error
          retention-days: 7
      - name: Validate JSON can be loaded by Node
        run: |
          node -e "const d=require('./sim/pksk/simulator/sets/SET 01-10/data/set01.json'); if(d.questions.length!==100||d.writing.length!==3) process.exit(1); console.log('PASS Set01',d.rebuildVersion);"
      - name: Commit generated Set 01 candidate
        shell: bash
        run: |
          if git diff --quiet -- 'sim/pksk/simulator/sets/SET 01-10/data/set01.json'; then
            echo 'Set 01 already assembled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'sim/pksk/simulator/sets/SET 01-10/data/set01.json'
          git commit -m 'Build Set 01 gold-standard candidate'
          git push origin HEAD:rebuild/pksk-set01-gold-v1
