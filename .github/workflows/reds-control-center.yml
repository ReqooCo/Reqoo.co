name: REDS Control Center
on:
  push:
    branches: [reds/draft]
    paths:
      - 'scripts/reds-control-*'
      - 'cad-source/release-policy.json'
      - '.github/workflows/reds-control-center.yml'
      - 'AGENTS.md'
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
  checks: read
  pull-requests: read
concurrency:
  group: reds-control-center
  cancel-in-progress: true
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: reds-draft
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reds/draft
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate reconciler and fail-closed behavior
        run: |
          node --check scripts/reds-control-sync.mjs
          node scripts/reds-control-sync.test.mjs
      - name: Read authoritative GitHub and Cloudflare state
        id: sync
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_AUDIT_TOKEN: ${{ secrets.CLOUDFLARE_AUDIT_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reds-control-sync.mjs reds/control/status.json
      - name: Publish evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reds-control-status
          path: reds/control/status.json
          if-no-files-found: warn
          retention-days: 14
      - name: Fail on conflict or missing evidence
        if: steps.sync.outcome != 'success'
        run: |
          echo 'REDS release not ready: conflicts or unverified sources. See reds-control-status artifact.'
          exit 1
