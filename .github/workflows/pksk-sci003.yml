name: PKSK Science Batch 003

on:
  push:
    branches:
      - staging/sci003
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate-sci003:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore validated baseline from SCI002 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit-output /tmp/sci002
          gh api repos/ReqooCo/Reqoo.co/actions/artifacts/10439933410/zip > /tmp/sci002.zip
          unzip -q /tmp/sci002.zip -d /tmp/sci002
          cp -a /tmp/sci002/. audit-output/
          test -f audit-output/b_section_strict_source_survivors.jsonl
          test -f audit-output/b_science_new_batch_001_validated.jsonl
          test -f audit-output/b_science_new_batch_002_validated.jsonl
      - name: Validate Science new batch 003
        run: python scripts/validate_pksk_b_science_new_batch.py 3
      - name: Rebuild dynamic strict B authoring plan
        run: python scripts/build_pksk_b_strict_authoring_plan_v5.py
      - name: Rebuild dynamic B progress ledger
        run: python scripts/build_pksk_b_current_progress_v5.py
      - name: Upload SCI003 validated workspace
        uses: actions/upload-artifact@v4
        with:
          name: pksk-sci003-workspace
          path: audit-output/
