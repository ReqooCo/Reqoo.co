name: Build PKSK Set 04
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_pksk_set04_v4510.py'
      - 'scripts/repair_pksk_set04_answer_positions_v4510.py'
      - 'scripts/pksk_generator_v45_10.py'
      - '.github/workflows/build-pksk-set04.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.event.head_commit.message != 'build(pksk): publish Set 04 V45.10 production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build from zero using V45.10
        run: python3 scripts/build_pksk_set04_v4510.py
      - name: Repair A answer positions only
        run: python3 scripts/repair_pksk_set04_answer_positions_v4510.py
      - name: Hard QA
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          p='sim/pksk/simulator/sets/SET 01-10/data/set04.json'
          d=json.load(open(p,encoding='utf-8'))
          q=d['questions']
          assert len(q)==100, len(q)
          assert sum(x['section']=='BAHAGIAN A' for x in q)==30
          assert sum(x['section']=='BAHAGIAN B' for x in q)==70
          assert len({x['id'] for x in q})==100
          assert len(d['writing'])==3
          assert d.get('legacy_content_used') is False
          A=[x for x in q if x['section']=='BAHAGIAN A']
          pos=Counter(x['answerIndex'] for x in A)
          assert len(pos)==4, pos
          assert max(pos.values())<=15, pos
          print('PASS V45.10:', {'A':30,'B':70,'C':3,'A_positions':dict(sorted(pos.items())),'legacy':False})
          PY
      - name: Publish
        run: |
          git config user.name ReqooCo
          git config user.email actions@github.com
          git add "sim/pksk/simulator/sets/SET 01-10/data/set04.json"
          git commit -m "build(pksk): publish Set 04 V45.10 production"
          git push origin main
