name: Shop V1 reset run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply source reset
        run: |
          if [ ! -f shop/shop-core-v12.js ]; then echo 'Shop V1 source already reset'; exit 0; fi
          python - <<'PY'
          from pathlib import Path
          root=Path('.')
          for rel in ['shop/shop-enhance.js','shop/shop-core-v7.js','.github/workflows/shop-v1-reset-run.yml','.github/workflows/shop-v1-source-reset.yml']:
              p=root/rel
              if p.exists(): p.unlink()
          p=root/'.github/workflows/deploy.yml'
          s=p.read_text()
          s=s.replace('test -f shop/shop-core-v12.js','test -f shop/shop-core-v1.js')
          p.write_text(s)
          p=root/'tools/shop-v1-reset.py'
          lines=p.read_text().splitlines()
          for i,line in enumerate(lines):
              if line.startswith('payment_re = re.compile'):
                  lines[i]=r'''payment_re = re.compile(r"try\{payment=await api\(API\+'\?action=paymentConfig.*?catch\(e\)\{.*?return\}", re.S)'''
                  break
          else:
              raise SystemExit('Reset-script regex marker not found')
          p.write_text('\n'.join(lines)+'\n')
          PY
          python tools/shop-v1-reset.py
          python - <<'PY'
          from pathlib import Path
          p=Path('shop/shop-core-v1.js')
          s=p.read_text()
          marker='</div>`modal.querySelector(\'#receiptFile\')'
          if marker not in s:
              raise SystemExit('Checkout template terminator marker not found')
          p.write_text(s.replace(marker,'</div>`;modal.querySelector(\'#receiptFile\')',1))
          PY
          node --check shop/shop-core-v1.js
          node --check _web_worker.js
          node --check api/shop-flow-v2.js
          node --check api/shop-flow-v3.js
          node --check api/shop-admin-flow-v2.js
          node --check api/shop-admin-flow-v4.js
          node --check api/shop-admin-flow-v5.js
          git diff --check
          git restore .github/workflows/shop-v1-reset-run.yml .github/workflows/shop-v1-source-reset.yml .github/workflows/deploy.yml
      - name: Commit V1 source
        run: |
          if [ ! -f shop/shop-core-v1.js ]; then exit 0; fi
          git config user.name 'reqoo-v1-bot'
          git config user.email 'reqoo-v1-bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: reset Shop to V1 source'
          git push origin HEAD:main
