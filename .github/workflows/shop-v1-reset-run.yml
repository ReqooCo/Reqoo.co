name: Shop V1 reset run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply source reset
        run: |
          if [ ! -f shop/shop-core-v12.js ]; then echo 'Shop V1 source already reset'; exit 0; fi
          python - <<'PY'
          from pathlib import Path
          p=Path('tools/shop-v1-reset.py')
          s=p.read_text()
          old='payment_re = re.compile(r"try\\{payment=await api\\(API\\+\\'\\\\?action=paymentConfig.*?catch\\(e\\)\\{.*?return\\}", re.S)'
          new='payment_re = re.compile(r"try\\{payment=await api\\(API\\+\\'\\?action=paymentConfig.*?catch\\(e\\)\\{.*?return\\}", re.S)'
          if old not in s:
              raise SystemExit('Reset-script regex marker not found')
          p.write_text(s.replace(old,new,1))
          PY
          python tools/shop-v1-reset.py
          node --check shop/shop-core-v1.js
          node --check _web_worker.js
          node --check api/shop-flow-v2.js
          node --check api/shop-flow-v3.js
          node --check api/shop-admin-flow-v2.js
          node --check api/shop-admin-flow-v4.js
          node --check api/shop-admin-flow-v5.js
          git diff --check
      - name: Commit V1 source
        run: |
          if [ ! -f shop/shop-core-v1.js ]; then exit 0; fi
          git config user.name 'reqoo-v1-bot'
          git config user.email 'reqoo-v1-bot@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'chore: reset Shop to V1 source'
          git push origin HEAD:main
