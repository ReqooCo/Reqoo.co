name: PKSK V45.10 Production 21-50

on:
  push:
    paths:
      - 'PRODUCTION_21_50.trigger'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Sets 21-50 with V45.10
        env:
          PKSK_SET_START: '21'
          PKSK_SET_END: '50'
        run: python3 scripts/build_pksk_sets_04_50_v4510.py

      - name: Publish into grouped production folders
        run: |
          set -e
          mkdir -p "sim/pksk/simulator/sets/SET 21-30/data" "sim/pksk/simulator/sets/SET 31-40/data" "sim/pksk/simulator/sets/SET 41-50/data"
          for s in $(seq 21 50); do
            src="sim/pksk/simulator/sets/SET 01-10/data/set$(printf '%02d' "$s").json"
            if [ ! -f "$src" ]; then echo "Missing generated file: $src"; exit 1; fi
            if [ "$s" -le 30 ]; then dst="sim/pksk/simulator/sets/SET 21-30/data/set$(printf '%02d' "$s").json";
            elif [ "$s" -le 40 ]; then dst="sim/pksk/simulator/sets/SET 31-40/data/set$(printf '%02d' "$s").json";
            else dst="sim/pksk/simulator/sets/SET 41-50/data/set$(printf '%02d' "$s").json"; fi
            cp "$src" "$dst"
          done

      - name: Hard QA 21-50
        run: |
          python3 - <<'PY'
          import json, pathlib
          from collections import Counter
          root=pathlib.Path('sim/pksk/simulator/sets')
          allq=[]
          for s in range(21,51):
              grp=f'SET {((s-1)//10)*10+1:02d}-{((s-1)//10+1)*10:02d}'
              p=root/grp/'data'/f'set{s:02d}.json'
              d=json.loads(p.read_text(encoding='utf-8'))
              q=d['questions']; w=d['writing']
              assert len(q)==100, (s,len(q))
              assert sum(x['section']=='BAHAGIAN A' for x in q)==30, s
              assert sum(x['section']=='BAHAGIAN B' for x in q)==70, s
              assert len(w)==3, s
              assert len({x['id'] for x in q})==100, s
              assert len({x['question'].strip().casefold() for x in q})==100, s
              assert d.get('legacy_content_used') is False, s
              A=[x for x in q if x['section']=='BAHAGIAN A']
              pos=Counter(x['answerIndex'] for x in A)
              assert dict(sorted(pos.items()))=={0:8,1:8,2:7,3:7}, (s,pos)
              assert sum(x.get('format')=='AGREE_DISAGREE' for x in A)>=10, s
              assert d['qa']['status']=='PASS', s
              assert d['qa']['length_leak']=='PASS', s
              math=[x for x in q if x.get('category')=='Matematik']
              assert math, s
              for x in math:
                  assert len(x['options'])==4 and len(set(x['options']))==4
                  assert 0 <= x['answerIndex'] < 4
              allq.extend((s,x['question'].strip().casefold()) for x in q)
          texts=[x[1] for x in allq]
          dup=[t for t,c in Counter(texts).items() if c>1]
          assert not dup, f'Exact cross-set duplicates: {len(dup)}'
          print('PASS: Sets 21-50 = 30 sets x 100 questions, all hard QA gates passed.')
          PY

      - name: Cleanup trigger and temporary workflow
        run: |
          rm -f PRODUCTION_21_50.trigger
          rm -f .github/workflows/pksk-v4510-batch-21-50.yml

      - name: Commit production
        run: |
          git config user.name ReqooCo
          git config user.email actions@github.com
          git add "sim/pksk/simulator/sets/SET 21-30/data" "sim/pksk/simulator/sets/SET 31-40/data" "sim/pksk/simulator/sets/SET 41-50/data" PRODUCTION_21_50.trigger .github/workflows/pksk-v4510-batch-21-50.yml
          git commit -m "build(pksk): production Sets 21-50 V45.10"
          git push origin main
