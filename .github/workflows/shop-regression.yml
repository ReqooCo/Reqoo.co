name: Shop regression
on:
  pull_request:
    paths:
      - '_web_worker.js'
      - 'shop/shop-core-v1.js'
      - 'shop/index.html'
      - 'shop/account.html'
      - 'shop/shop-premium.css'
      - 'shop/admin-whatsapp-docs-v1.js'
      - 'admin/shop-*.css'
      - 'api/shop-flow-v*.js'
      - 'api/shop-admin-flow-v*.js'
      - 'api/worker.js'
      - 'tests/shop-*'
      - '.github/workflows/shop-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Shop JavaScript syntax
        run: |
          node --check _web_worker.js
          node --check shop/shop-core-v1.js
          node --check shop/admin-whatsapp-docs-v1.js
          for file in api/shop-flow-v*.js api/shop-admin-flow-v*.js api/worker.js; do node --check "$file"; done
      - name: Run Shop backend and routing regressions
        run: |
          node tests/shop-routing.mjs
          node tests/shop-quantity-unit.cjs
          node tests/shop-quote.mjs
          node tests/shop-reject-stock-restore.test.mjs
          node tests/shop-status-stock-safety.mjs
          node tests/shop-customer-auth.mjs
          node tests/shop-admin-orders-ui.mjs
      - run: npm install --no-save --no-package-lock jsdom@30.0.1
      - name: Run Shop DOM regression
        run: node tests/shop-ui.cjs
