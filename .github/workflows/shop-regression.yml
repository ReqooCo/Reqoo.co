name: Shop regression
on:
  pull_request:
    paths:
      - '_web_worker.js'
      - 'functions/_middleware.js'
      - 'admin/**'
      - 'shop/**'
      - 'tumbler/**'
      - 'api/**'
      - 'migrations/**'
      - 'tests/**'
      - '.github/workflows/shop-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check Shop JavaScript syntax
        run: |
          node --check _web_worker.js
          node --check functions/_middleware.js
          node --check admin/admin-shell.js
          node --check admin/overview.js
          node --check admin/orders.js
          node --check admin/production.js
          node --check admin/products.js
          node --check admin/product-option-matrix.js
          node --check admin/documents.js
          node --check admin/documents-unified-v1.js
          node --check admin/documents-payment-v1.js
          node --check admin/documents-drawer-v1.js
          node --check admin/documents-overdue-v1.js
          node --check admin/document-public-v1.js
          node --check admin/customers.js
          node --check admin/finance.js
          node --check shop/shop-core-v1.js
          node --check shop/order-whatsapp-v1.js
          node --check shop/shop-inventory-v1.js
          node --check shop/admin-inventory-v2.js
          node --check shop/admin-fulfillment-v1.js
          node --check shop/admin-production-queue-safe-v1.js
          node --check shop/admin-order-production-v1.js
          node --check shop/account-premium-v1.js
          node --check shop/postpurchase-v1.js
          node --check tumbler/tumbler-order.js
          node --check plaque/plaque-store.js
          node --check landing-runtime.js
          for file in api/shop-flow-v*.js api/shop-admin-flow-v*.js api/worker.js; do node --check "$file"; done
      - name: Run Shop backend and routing regressions
        run: |
          node tests/shop-routing.mjs
          node tests/tumbler-order-proxy-safety.mjs
          node tests/payment-toyyibpay-flow.mjs
          node tests/shop-e2e-transaction.mjs
          node tests/shop-quantity-unit.cjs
          node tests/shop-quote.mjs
          node tests/shop-reject-stock-restore.test.mjs
          node tests/shop-status-stock-safety.mjs
          node tests/shop-fulfillment-status-route.mjs
          node tests/shop-fulfillment-persistence.mjs
          node tests/shop-customer-auth.mjs
          node tests/shop-admin-orders-ui.mjs
          node tests/shop-admin-products-ui.mjs
          node tests/shop-product-toggle-safety.mjs
          node tests/shop-variant-publish-safety.mjs
          node tests/shop-image-gallery-preserve.mjs
          node tests/shop-inventory-ux.mjs
          node tests/shop-customer-account-ux.mjs
          node tests/shop-admin-fulfillment-ux.mjs
          node tests/shop-admin-whatsapp-status.mjs
          node tests/shop-production-queue-ux.mjs
          node tests/shop-production-meta-v13.mjs
          node tests/shop-order-status-consistency.mjs
          node tests/shop-order-production-detail.mjs
          node tests/shop-size-color-ux.mjs
          node tests/storefront-sales-flow.mjs
          node tests/meta-conversion-funnel.mjs
          node tests/storefront-asset-integrity.mjs
          node tests/admin-asset-integrity.mjs
          node tests/api-version-chain.mjs
          node tests/admin-premium-shell.mjs
          node tests/admin-premium-theme-v3.mjs
          node tests/admin-overview-v2.mjs
          node tests/admin-overview-scalability.mjs
          node tests/admin-centre-reliability.mjs
          node tests/admin-payment-ledger-consistency.mjs
          node tests/admin-orders-v1.mjs
          node tests/admin-orders-documents-scalability.mjs
          node tests/admin-production-page-v1.mjs
          node tests/admin-production-scalability.mjs
          node tests/admin-products-page-v1.mjs
          node tests/admin-products-scalability.mjs
          node tests/admin-product-option-matrix.mjs
          node tests/admin-documents-pack.mjs
          node tests/admin-documents-v2.mjs
          node tests/admin-documents-performance.mjs
          node tests/admin-documents-overdue.mjs
          node tests/admin-documents-finance-scalability.mjs
          node tests/admin-customers-crm.mjs
          node tests/admin-customers-scalability.mjs
          node tests/admin-finance-dashboard.mjs
          node tests/admin-finance-scalability.mjs
      - run: npm install --no-save --no-package-lock jsdom@30.0.1
      - name: Run Documents fast-load DOM regression
        run: node tests/admin-documents-fast-load.cjs
      - name: Run Shop DOM regression
        run: node tests/shop-ui.cjs
