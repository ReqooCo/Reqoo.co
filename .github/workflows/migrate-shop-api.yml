name: Migrate SHOP API endpoint

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[shop-api-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace legacy SHOP endpoint
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shop/index.html')
          s = p.read_text(encoding='utf-8')
          old = "const ORDER_API_URL='https://script.google.com/macros/s/AKfycbyFy2y76srL3i-wIp1kesaXw5KZl6fpTTCbLJk_5lQBUwl0QKkdRsxo6ynF7XCjnKb1MA/exec';"
          new = "const ORDER_API_URL='/api/shop';"
          if old not in s:
              print('Legacy endpoint not found; nothing to change.')
          else:
              p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit migration
        shell: bash
        run: |
          if git diff --quiet -- shop/index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git config user.name 'reqoo-shop-migration[bot]'
          git config user.email 'reqoo-shop-migration[bot]@users.noreply.github.com'
          git add shop/index.html
          git commit -m "[shop-api-migrated] Use Cloudflare SHOP API"
          git push
