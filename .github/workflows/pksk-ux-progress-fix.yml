name: PKSK UX and progress fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'Apply PKSK UX and progress fixes' && github.event.head_commit.message != 'Remove one-time PKSK UX workflow'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PKSK
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1) Server: dashboard must expose activity derived from completed OVERALL progress.
          p=Path('functions/api/pksk.js')
          s=p.read_text()
          old="return {ok:true,license:{licenseCode:l.access_code,orderNo:l.order_id,name:l.customer_name,phone:l.phone,status:l.status,createdAt:l.created_at,activeAt:l.activated_at,deviceCount:devices.results.filter(x=>x.status==='active').length,maxDevices:l.max_devices,lastSeen:devices.results[0]?.last_seen||''},progress:progress.results,totalSets:TOTAL_SETS};"
          new="""const activity=progress.results.filter(x=>x.section==='OVERALL'&&x.completed).slice().sort((a,b)=>String(b.completed_at||b.updated_at||'').localeCompare(String(a.completed_at||a.updated_at||''))).slice(0,20).map(x=>({message:`Set ${String(x.set_no).padStart(2,'0')} selesai • ${Number(x.score||0)}%`,createdAt:x.completed_at||x.updated_at||''}));return {ok:true,license:{licenseCode:l.access_code,orderNo:l.order_id,name:l.customer_name,phone:l.phone,status:l.status,createdAt:l.created_at,activeAt:l.activated_at,deviceCount:devices.results.filter(x=>x.status==='active').length,maxDevices:l.max_devices,lastSeen:devices.results[0]?.last_seen||''},progress:progress.results,totalSets:TOTAL_SETS,activity};"""
          if old not in s:
              raise SystemExit('Backend dashboard return pattern not found')
          s=s.replace(old,new,1)
          p.write_text(s)

          # 2) Simulator JS: compact review cards + safe exit/cancel controls + stronger completion sync.
          a=Path('sim/pksk/simulator/js/app.js')
          s=a.read_text()
          marker='/* PKSK UX PROGRESS FIX V2 */'
          if marker not in s:
              patch=r'''\n\n/* PKSK UX PROGRESS FIX V2 */\n(function(){\n  const style=document.createElement('style');\n  style.textContent=`\n    .review-list{gap:8px!important}\n    .review-item{padding:11px 13px!important;border-radius:12px!important}\n    .review-top{gap:8px!important;align-items:flex-start!important}\n    .review-top b{font-size:12px!important;line-height:1.4!important;font-weight:650!important}\n    .review-top strong{font-size:9px!important;white-space:nowrap!important;padding-top:2px}\n    .review-answer{margin-top:6px!important;gap:3px!important;font-size:10.5px!important;line-height:1.4!important}\n    .review-explain{margin-top:7px!important;padding:8px 10px!important;border-radius:8px!important;font-size:10.5px!important;line-height:1.45!important}\n    .pksk-exitbar{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:16px}\n    .pksk-exit{border:1px solid #cfd9e5;background:#fff;color:#506078;border-radius:9px;padding:10px 15px;font-size:11px;font-weight:800;box-shadow:none}\n    .pksk-exit:hover{border-color:#9db2c8;background:#f8fafc}\n    .pksk-exit.danger{color:#9f4b4b;border-color:#dfc4c4}\n    @media(max-width:760px){\n      .review-item{padding:10px 11px!important}\n      .review-top b{font-size:11px!important}\n      .review-answer,.review-explain{font-size:10px!important}\n      .pksk-exit{width:100%;max-width:360px}\n    }`;\n  document.head.appendChild(style);\n\n  function addButton(container, id, text, cls, handler){\n    if(!container || document.getElementById(id)) return;\n    const wrap=container.querySelector('.pksk-exitbar') || (()=>{const x=document.createElement('div');x.className='pksk-exitbar';container.appendChild(x);return x})();\n    const b=document.createElement('button'); b.id=id; b.type='button'; b.className='pksk-exit '+(cls||''); b.textContent=text; b.onclick=handler; wrap.appendChild(b);\n  }\n\n  function dashboard(){ location.href='../access/'; }\n  function confirmDashboard(){\n    if(phase==='ab') persistSession();\n    if(phase==='c'){\n      localStorage.setItem(`pksk-set${String(setNo).padStart(2,'0')}-writing`,JSON.stringify({wTimer,selectedTopic,text:$("essay")?.value||''}));\n    }\n    if(phase==='ab'||phase==='c') { if(!confirm('Keluar ke dashboard? Jawapan anda akan disimpan dan boleh disambung semula.')) return; }\n    clearInterval(interval); clearInterval(winterval); dashboard();\n  }\n\n  function mountExitControls(){\n    const start=document.getElementById('start');\n    if(start){\n      const card=start.querySelector('.start-card')||start;\n      addButton(card,'pkskCancelStart','← KEMBALI KE DASHBOARD','',dashboard);\n    }\n    const briefing=document.getElementById('briefing');\n    if(briefing){\n      const inner=briefing.querySelector('.brief-inner')||briefing;\n      addButton(inner,'pkskCancelBrief','← BATAL & KEMBALI','',dashboard);\n    }\n    const exam=document.getElementById('exam');\n    if(exam){\n      const nav=document.querySelector('.exam-layout')||exam;\n      addButton(nav,'pkskExitExam','KELUAR KE DASHBOARD','danger',confirmDashboard);\n    }\n    const writing=document.getElementById('writing');\n    if(writing){\n      const layout=document.querySelector('.write-layout')||writing;\n      addButton(layout,'pkskExitWriting','KELUAR KE DASHBOARD','danger',confirmDashboard);\n    }\n  }\n\n  // DOM may be rendered before/after this patch depending on cache; observe once for safety.\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',mountExitControls,{once:true}); else mountExitControls();\n  const observer=new MutationObserver(()=>{mountExitControls();});\n  observer.observe(document.body,{childList:true,subtree:true});\n  setTimeout(()=>observer.disconnect(),15000);\n\n  // Make final progress save explicit and timestamped; existing sync function remains the source of truth.\n  const originalBuildResult=window.buildResult;\n  if(typeof originalBuildResult==='function'){\n    // no override: server sync is already called by buildResult; this patch only adds a second flush after result render.\n    setTimeout(()=>{try{flushProgressQueue();}catch(e){}},1200);\n  }\n})();\n'''
              s += patch
              a.write_text(s)

          print('PKSK patch prepared')
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add functions/api/pksk.js sim/pksk/simulator/js/app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Apply PKSK UX and progress fixes'
          git push
      - name: Remove one-time workflow
        run: |
          git rm .github/workflows/pksk-ux-progress-fix.yml
          git commit -m 'Remove one-time PKSK UX workflow'
          git push
