name: One-time Shop QR static fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: contains(github.event.head_commit.message, '[shop-qr-static-fix]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy canonical PKSK QR into Shop static assets
        run: cp sim/pksk/payment/assets/maybank-qr.jpeg shop/assets/maybank-qr.jpeg
      - name: Point Shop source at static QR
        run: python3 - <<'PY'
          from pathlib import Path
          p=Path('shop/shop-core-v1.js')
          s=p.read_text()
          old="QR='/shop/maybank-qr.jpg'"
          new="QR='/shop/assets/maybank-qr.jpeg'"
          if old not in s:
              raise SystemExit('Expected Shop QR source was not found')
          p.write_text(s.replace(old,new,1))
      - name: Remove obsolete QR worker exception
        run: python3 - <<'PY'
          from pathlib import Path
          p=Path('_web_worker.js')
          s=p.read_text()
          old="if((host==='reqoo.co'||host==='shop.reqoo.co')&&/^\\/shop\\/maybank-qr\\.jpg$/i.test(url.pathname))return env.ASSETS.fetch(assetRequest('/shop/maybank-qr.jpg',request));"
          if old not in s:
              raise SystemExit('Expected obsolete QR worker exception was not found')
          p.write_text(s.replace(old,'',1))
      - name: Commit source-level fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shop/assets/maybank-qr.jpeg shop/shop-core-v1.js _web_worker.js
          git diff --cached --quiet && exit 0
          git commit -m "fix: use PKSK static QR asset for Shop [skip ci]"
          git push
