name: Remove remaining SHOP QR image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[shop-qr-removed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove QR image
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('shop/index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<img src=\\\"assets/qr-maybank.png\\\" alt=\\\"Maybank QR\\\">', '')
          s = s.replace('<img src="assets/qr-maybank.png" alt="Maybank QR">', '')
          s = s.replace('assets/qr-maybank.png', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- shop/index.html; then
            echo 'QR already removed.'
            exit 0
          fi
          git config user.name 'reqoo-shop-qr-cleanup[bot]'
          git config user.email 'reqoo-shop-qr-cleanup[bot]@users.noreply.github.com'
          git add shop/index.html
          git commit -m '[shop-qr-removed] Remove legacy Maybank QR image'
          git push
