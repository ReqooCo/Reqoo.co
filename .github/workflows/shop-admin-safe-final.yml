name: Shop Admin Safe Final
on: [pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check _web_worker.js
      - run: node tests/shop-admin-safe-mode-smoke.mjs
      - run: node tests/shop-admin-safe-mode.mjs
      - run: node tests/admin-premium-shell.mjs
