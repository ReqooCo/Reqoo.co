name: CAD PR validation
on:
  push:
    branches: [main]
    paths: ['cad-source/**', '.github/workflows/cad-pr-validation.yml']
  pull_request:
    paths: ['cad-source/**', '.github/workflows/cad-pr-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cad-source/package-lock.json
      - name: Install dependencies
        working-directory: cad-source
        run: npm ci
      - name: Build
        working-directory: cad-source
        run: npm run build
      - name: Install Chromium
        working-directory: cad-source
        run: npx playwright install --with-deps chromium
      - name: Validate constraints
        working-directory: cad-source
        run: |
          node tests/runtime-route.mjs
          node tests/constraints.mjs
          node tests/transform-snapping.mjs
          node tests/pattern-thread.mjs
      - name: Browser integration tests
        working-directory: cad-source
        run: |
          node tests/cad.mjs
          node tests/acceptance.mjs
          node tests/product.mjs
          node tests/transform-ui.mjs
          node tests/pattern-thread-ui.mjs
          node tests/input.mjs
      - name: Upload screenshots and QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-pr-qa
          path: cad-source/test-results/
          retention-days: 7
