name: CAD PR validation
on:
  push:
    branches: [main]
    paths: ['cad-source/**', '.github/workflows/cad-pr-validation.yml']
  pull_request:
    paths: ['cad-source/**', '.github/workflows/cad-pr-validation.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cad-source/package-lock.json
      - name: Install dependencies
        working-directory: cad-source
        run: npm ci
      - name: Build
        working-directory: cad-source
        run: npm run build
      - name: Install Chromium
        working-directory: cad-source
        run: npx playwright install --with-deps chromium
      - name: Validate constraints
        working-directory: cad-source
        run: node tests/constraints.mjs
      - name: Browser integration tests
        working-directory: cad-source
        run: node tests/cad.mjs
      - name: Publish verified CAD static assets to main
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          source=Path('cad-source/dist')
          target=Path('cad')
          assert (source/'index.html').exists(), 'Missing built CAD entrypoint'
          shutil.rmtree(target,ignore_errors=True)
          shutil.copytree(source,target)
          PY
          git config user.name 'Reqoo CAD Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A cad
          if ! git diff --cached --quiet; then
            git commit -m 'Deploy verified Reqoo CAD static build [skip ci]'
            git push origin HEAD:main
          fi
      - name: Upload screenshots and QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-pr-qa
          path: cad-source/test-results/
          retention-days: 7
