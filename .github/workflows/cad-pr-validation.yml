name: CAD PR validation
on:
  push:
    branches: [main]
    paths: ['scripts/reds-release-gate.mjs', 'scripts/reds-release-gate.test.mjs', 'scripts/reds-release-test-fetch.mjs', 'AGENTS.md', 'cad-source/**', 'workers/cad-bridge.js', '_web_worker.js', 'wrangler-web.toml', 'migrations/*cad_bridge*', '.github/workflows/cad-pr-validation.yml']
  pull_request:
    paths: ['scripts/reds-release-gate.mjs', 'cad-source/**', 'workers/cad-bridge.js', '_web_worker.js', 'wrangler-web.toml', 'migrations/*cad_bridge*', '.github/workflows/cad-pr-validation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        suite: [core, modeling, product]
    steps:
      - uses: actions/checkout@v4
      - name: REDS single-draft PR entry gate
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/reds-release-gate.mjs check-pr
      - name: Verify REDS release-gate policy tests
        run: node scripts/reds-release-gate.test.mjs
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cad-source/package-lock.json
      - name: Install dependencies
        working-directory: cad-source
        run: npm ci
      - name: Build
        working-directory: cad-source
        run: npm run build
      - name: Install Chromium
        working-directory: cad-source
        run: npx playwright install --with-deps chromium
      - name: Validate constraints
        if: matrix.suite == 'core'
        working-directory: cad-source
        run: |
          node tests/display-cache.mjs
          node tests/native-cache.mjs
          node tests/project-io.mjs
          node tests/sketch-stroke.mjs
          node tests/sketch-edit-geometry.mjs
          node tests/sketch-native-parity.mjs
          node tests/parameter-geometry.mjs
          node tests/multi-profile.mjs
          node tests/visualization.mjs
          node tests/smart-dimensions.mjs
          node tests/bridge-api.mjs
          node tests/runtime-route.mjs
          node tests/constraints.mjs
          node tests/transform-snapping.mjs
          node tests/pattern-thread.mjs
          node tests/precision-modeling.mjs
          node tests/planar-regions.mjs
      - name: Browser integration tests
        working-directory: cad-source
        run: |
          failed=0
          run_test() { node "$1" || failed=1; }
          case "${{ matrix.suite }}" in
            core)
              run_test tests/display-performance-ui.mjs
              run_test tests/active-sketch-edit-ui.mjs
              run_test tests/reds-sketch-parity-ui.mjs
              run_test tests/multi-profile-ui.mjs
              run_test tests/r3ds-ux-ui.mjs
              run_test tests/visualization-ui.mjs
              run_test tests/smart-dimensions-ui.mjs
              run_test tests/bridge-ui.mjs
              run_test tests/motion-continuity-ui.mjs
              ;;
            modeling)
              run_test tests/canvas-gizmo-ui.mjs
              run_test tests/reds-focused-workspace-ui.mjs
              run_test tests/sketch-stroke-ui.mjs
              run_test tests/sketch-file-ux-ui.mjs
              run_test tests/sketch-regions-ui.mjs
              run_test tests/direct-sketch-ui.mjs
              run_test tests/rotation-ui.mjs
              run_test tests/extrude-modes-ui.mjs
              run_test tests/cad.mjs
              run_test tests/acceptance.mjs
              ;;
            product)
              run_test tests/product.mjs
              run_test tests/transform-ui.mjs
              run_test tests/pattern-thread-ui.mjs
              run_test tests/precision-ui.mjs
              run_test tests/workspace-reference-ui.mjs
              run_test tests/input.mjs
              ;;
          esac
          exit "$failed"
      - name: Upload screenshots and QA output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cad-pr-qa-${{ matrix.suite }}
          path: cad-source/test-results/
          retention-days: 7
