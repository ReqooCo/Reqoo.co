name: Shop V1 source reset

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reset:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore: reset Shop to V1') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge fixes into Shop V1 source and remove patches
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path('.')

          CORE_OLD = root / 'shop/shop-core-v12.js'
          CORE_NEW = root / 'shop/shop-core-v1.js'
          core = CORE_OLD.read_text(encoding='utf-8')

          assert "const API='/api/shop',MEDIA='/api/shop-media',CART_KEY='reqoo_shop_cart_v4';" in core, 'Shop core marker missing'
          assert "paymentConfig" in core and "maybank-qr-premium.svg" in core, 'Expected old payment block not found'

          core = core.replace(
              "const API='/api/shop',MEDIA='/api/shop-media',CART_KEY='reqoo_shop_cart_v4';",
              "const API='/api/shop',MEDIA='/api/shop-media',CART_KEY='reqoo_shop_cart_v4',QR='/shop/maybank-qr.jpg',PAYMENT_ACCOUNT='Ab Art Trading',PAYMENT_INSTRUCTIONS='Scan QR dan pastikan jumlah bayaran sama seperti jumlah order.';",
              1,
          )
          core = core.replace("let products=[],cart=[],selectedCategory='Semua',payment={};", "let products=[],cart=[],selectedCategory='Semua';", 1)

          payment_re = re.compile(r"try\{payment=await api\(API\+'\\?action=paymentConfig.*?catch\(e\)\{.*?return\}", re.S)
          replacement = (
              "const qr=QR;"
              "modal.querySelector('#paymentBox').innerHTML=`<h3>Bayaran QR</h3>"
              "<img class=\"qr\" src=\"${esc(qr)}\" alt=\"QR pembayaran\">"
              "<b>${esc(PAYMENT_ACCOUNT)}</b>"
              "<p>${esc(PAYMENT_INSTRUCTIONS)}</p>"
              "<label>BUKTI PEMBAYARAN *</label>"
              "<input id=\"receiptFile\" type=\"file\" accept=\"image/png,image/jpeg,image/webp,application/pdf\">"
              "<div id=\"receiptHint\" class=\"fileHint\">PNG / JPG / WEBP / PDF · maksimum 5MB</div>`"
          )
          core, n = payment_re.subn(replacement, core, count=1)
          assert n == 1, 'Checkout payment block was not replaced'

          stock_block = r'''\nconst stockState={product:'',variant:0};let stockBusy=false;const stockRoot=document.documentElement;\nfunction stockFor(p,index){const vars=Array.isArray(p?.variants)?p.variants:[];const v=vars[index];if(!v)return null;return v.stock==null||v.stock===''?null:Number(v.stock)}\nfunction productSoldOut(p){const vars=Array.isArray(p?.variants)?p.variants.filter(v=>v&&v.price>0):[];return vars.length>0&&vars.every(v=>v.stock!=null&&Number(v.stock)<=0)}\nfunction refreshStock(){if(stockBusy)return;stockBusy=true;stockObserver.disconnect();try{const p=products.find(x=>x.id===String(stockState.product));document.querySelectorAll('[data-product]').forEach(btn=>{const item=products.find(x=>x.id===String(btn.dataset.product));if(!item)return;const sold=productSoldOut(item);btn.disabled=sold;btn.textContent=sold?'Stok Habis':'Pilih';btn.setAttribute('aria-disabled',sold?'true':'false');btn.style.opacity=sold?'.48':'';btn.style.cursor=sold?'not-allowed':''});const modal=document.getElementById('modal');if(!modal?.classList.contains('open')||!p)return;const vars=p.variants.length?p.variants:(Number(p.basePrice||0)>0?[{name:'Standard',price:Number(p.basePrice),stock:null}]:[]);modal.querySelectorAll('[data-v]').forEach(btn=>{const i=Number(btn.dataset.v),s=stockFor({variants:vars},i),blocked=s!==null&&s<=0;btn.disabled=blocked;btn.style.opacity=blocked?'.42':'';btn.style.cursor=blocked?'not-allowed':'';const small=btn.querySelector('small');if(small&&!small.dataset.reqooOriginal)small.dataset.reqooOriginal=small.textContent;if(blocked&&small)small.textContent='Stok Habis';else if(small&&small.dataset.reqooOriginal)small.textContent=small.dataset.reqooOriginal});const q=modal.querySelector('#detailQty'),add=modal.querySelector('#addToCart'),s=stockFor({variants:vars},stockState.variant);if(q){q.min='1';if(s!==null){q.max=String(Math.max(1,s));if(Number(q.value)>s)q.value=String(Math.max(1,s));if(s<=0)q.value='1'}else q.removeAttribute('max')}if(add){const blocked=s!==null&&s<=0;add.disabled=blocked;add.style.opacity=blocked?'.48':'';add.style.cursor=blocked?'not-allowed':'';add.textContent=blocked?'Stok Habis':'Tambah ke Cart'}}finally{stockBusy=false;stockObserver.observe(stockRoot,{childList:true,subtree:true})}}\nconst stockObserver=new MutationObserver(()=>refreshStock());stockObserver.observe(document.documentElement,{childList:true,subtree:true});\ndocument.addEventListener('click',e=>{const card=e.target.closest('[data-product]');if(card&&!card.disabled){stockState.product=card.dataset.product;stockState.variant=0;setTimeout(refreshStock,0);return}const v=e.target.closest('#modal [data-v]');if(v&&!v.disabled){stockState.variant=Number(v.dataset.v);setTimeout(refreshStock,0)}},true);\ndocument.addEventListener('input',e=>{if(e.target.id!=='detailQty'||!stockState.product)return;const p=products.find(x=>x.id===String(stockState.product)),s=stockFor(p,stockState.variant);if(s!==null&&Number(e.target.value)>s)e.target.value=String(s);if(Number(e.target.value)<1)e.target.value='1'},true);\n'''
          core, n = re.subn(r"\nfunction boot\(\)\{", stock_block + "function boot(){", core, count=1)
          assert n == 1, 'Boot marker missing'

          CORE_NEW.write_text(core, encoding='utf-8')
          CORE_OLD.unlink()

          worker_path = root / '_web_worker.js'
          worker = worker_path.read_text(encoding='utf-8')
          old_scripts = '<script src="/shop/stock-ux-v1.js?v=1"></script><script src="/shop/shop-core-v12.js?v=2"></script><script src="/shop/qr-permanent-v1.js?v=2"></script>'
          new_scripts = '<script src="/shop/shop-core-v1.js?v=1"></script>'
          assert old_scripts in worker, 'Old Shop runtime injection not found'
          worker = worker.replace(old_scripts, new_scripts, 1)
          worker = re.sub(r"async function injectShopAdminRuntime\(response\)\{.*?\}\nfunction assetRequest", "function assetRequest", worker, count=1, flags=re.S)
          worker = worker.replace("return injectShopAdminRuntime(injectAdminUI(response));", "return injectAdminUI(response);", 1)
          worker = worker.replace("headers.set('x-reqoo-shop-runtime','qr-permanent-v2-stock-ux-v1');", "headers.set('x-reqoo-shop-runtime','shop-v1');", 1)
          worker_path.write_text(worker, encoding='utf-8')

          v3p = root / 'api/shop-flow-v3.js'
          v3 = v3p.read_text(encoding='utf-8')
          assert "qrUrl:await setting(env,'payment_qr_url')" in v3, 'V3 QR response marker missing'
          v3 = v3.replace("qrUrl:await setting(env,'payment_qr_url')", "qrUrl:'/shop/maybank-qr.jpg'", 1)
          v3p.write_text(v3, encoding='utf-8')

          v2p = root / 'api/shop-flow-v2.js'
          v2 = v2p.read_text(encoding='utf-8')
          assert "case'paymentConfig'" in v2 and "paymentQr(env)" in v2, 'V2 paymentConfig marker missing'
          v2 = re.sub(
              r"case'paymentConfig':return R\(\{ok:true,method:'QR',qrUrl:await paymentQr\(env\),accountName:await setting\(env,'payment_account_name'\),instructions:await setting\(env,'payment_instructions'\)\}\);",
              "case'paymentConfig':return R({ok:true,method:'QR',qrUrl:'/shop/maybank-qr.jpg',accountName:'Ab Art Trading',instructions:'Scan QR dan pastikan jumlah bayaran sama seperti jumlah order.'});",
              v2,
              count=1,
          )
          v2p.write_text(v2, encoding='utf-8')

          ap = root / 'shop/admin.html'
          admin = ap.read_text(encoding='utf-8')
          assert 'id="settings"' in admin and 'savePaymentConfig' in admin, 'Admin payment settings markers missing'
          admin, n = re.subn(r'<section[^>]*\bid="settings"[^>]*>.*?</section>', '', admin, count=1, flags=re.S)
          assert n == 1, 'Admin settings section not removed'
          admin, _ = re.subn(r'<[^>]*\bdata-tab=["\']settings["\'][^>]*>.*?</[^>]+>', '', admin, count=1, flags=re.S)
          admin = admin.replace(
              "const [p,o,q,s]=await Promise.all([api('listProducts'),api('listOrders'),api('paymentConfig'),api('getShipping')]);products=p.products||[];orders=o.orders||[];loadPayment(q);renderProducts();renderOrders();renderShipping(s.shipping||[])",
              "const [p,o,s]=await Promise.all([api('listProducts'),api('listOrders'),api('getShipping')]);products=p.products||[];orders=o.orders||[];renderProducts();renderOrders();renderShipping(s.shipping||[])",
              1,
          )
          admin, n = re.subn(r"function loadPayment\(q\).*?(?=function renderShipping)", '', admin, count=1, flags=re.S)
          assert n == 1, 'Admin payment JS block not removed'
          admin = admin.replace("$('saveQrBtn').onclick=saveQR;$('qrUrl').oninput=renderQR;", '', 1)
          ap.write_text(admin, encoding='utf-8')

          readme = root / 'shop/README.md'
          readme.write_text('''# REQOO.CO Shop\n\nCanonical customer shop: `shop.reqoo.co`\n\n## V1 flow\n\n1. Admin tambah/edit produk di `admin.reqoo.co` → **Shop**.\n2. Produk aktif terus muncul di Shop.\n3. Pelanggan pilih variasi, teks/artwork dan kuantiti.\n4. Checkout menggunakan QR tetap **Ab Art Trading**.\n5. Pelanggan upload bukti pembayaran.\n6. Order + bukti pembayaran masuk ke Admin untuk pengesahan.\n\n## Sumber canonical\n\n- Customer UI: `shop/index.html` + `shop/shop-core-v1.js`\n- Shop Admin UI: `shop/admin.html`\n- Public Shop API: `api/shop-flow-v3.js` → `api/shop-flow-v2.js`\n- Admin Shop API: `api/shop-admin-flow-v4.js` → `api/shop-admin-flow-v5.js`\n- Product media: `api/shop-media.js` + `functions/api/product-image.js`\n- Database: D1 `reqoo-rebuild`\n- Product/order artwork dan receipt: R2 `reqoo-product-media`\n\nHarga checkout sentiasa disahkan semula di server. Frontend tidak menjadi sumber harga yang dipercayai.\n\nPKSK/SIM menggunakan route dan fail berasingan dan tidak menjadi sebahagian daripada Shop flow.\n''', encoding='utf-8')

          for rel in [
              'shop/stock-ux-v1.js',
              'shop/qr-permanent-v1.js',
              'shop/qr-fallback-v1.js',
              'shop/admin-shop-clean-v1.js',
              'shop/maybank-qr-premium.svg',
          ]:
              p = root / rel
              if p.exists(): p.unlink()

          bad = []
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try: s = p.read_text(encoding='utf-8')
              except Exception: continue
              for token in ['shop-core-v12.js','stock-ux-v1.js','qr-permanent-v1.js','qr-fallback-v1.js','admin-shop-clean-v1.js','maybank-qr-premium.svg']:
                  if token in s: bad.append(f'{p}: {token}')
          assert not bad, 'Obsolete references remain: ' + '; '.join(bad)
          assert (root / 'shop/maybank-qr.jpg').exists(), 'Permanent QR asset missing'
          assert "QR='/shop/maybank-qr.jpg'" in core
          assert "qrUrl:'/shop/maybank-qr.jpg'" in v3
          assert "qrUrl:'/shop/maybank-qr.jpg'" in v2
          assert 'id="settings"' not in admin and 'savePaymentConfig' not in admin and 'paymentConfig' not in admin

      - name: Syntax and source checks
        run: |
          node --check shop/shop-core-v1.js
          node --check _web_worker.js
          node --check api/shop-flow-v2.js
          node --check api/shop-flow-v3.js
          node --check api/shop-admin-flow-v2.js
          node --check api/shop-admin-flow-v4.js
          node --check api/shop-admin-flow-v5.js
          git diff --check
          git status --short

      - name: Commit source-clean V1
        run: |
          git config user.name "reqoo-v1-bot"
          git config user.email "reqoo-v1-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "chore: reset Shop to V1 source"
          git push origin HEAD:main
