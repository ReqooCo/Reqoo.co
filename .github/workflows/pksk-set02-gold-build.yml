name: PKSK Set02 Gold Build

on:
  push:
    branches:
      - rebuild/pksk-set02-gold-v1
    paths:
      - 'scripts/build_set02_gold.py'
      - 'scripts/test_gold_set_contract.js'
      - 'sim/pksk/simulator/js/visual-renderer.js'
      - '.github/workflows/pksk-set02-gold-build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rebuild/pksk-set02-gold-v1
      - name: Build and validate Set 02
        run: python scripts/build_set02_gold.py
      - name: Validate JSON can be loaded
        run: node -e "const d=require('./sim/pksk/simulator/sets/SET 01-10/data/set02.json'); if(d.questions.length!==100||d.writing.length!==3) process.exit(1); console.log('PASS Set02',d.rebuildVersion);"
      - name: Test runtime scoring contract
        run: node scripts/test_gold_set_contract.js 02
      - name: Test structured visual renderer
        run: node scripts/test_pksk_visual_renderer.js
      - name: Commit generated Set 02 candidate
        shell: bash
        run: |
          if git diff --quiet -- 'sim/pksk/simulator/sets/SET 01-10/data/set02.json'; then
            echo 'Set 02 already assembled.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'sim/pksk/simulator/sets/SET 01-10/data/set02.json'
          git commit -m 'Build Set 02 Gold candidate'
          git push origin HEAD:rebuild/pksk-set02-gold-v1
