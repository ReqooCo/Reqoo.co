name: PKSK payment flow

on:
  pull_request:
    paths:
      - 'sim/pksk/payment-v2/index.html'
      - 'functions/api/pksk-payment-v2.js'
      - 'sim/pksk/access/**'
      - 'sim/pksk/simulator/js/app.js'
      - 'scripts/test_pksk_payment_flow.js'
      - '.github/workflows/pksk-payment-flow.yml'

permissions:
  contents: read

jobs:
  payment-flow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check
        run: |
          node --check functions/api/pksk-payment-v2.js
          node --check sim/pksk/access/app.js
          node --check sim/pksk/simulator/js/app.js
          node --check scripts/test_pksk_payment_flow.js
      - name: Payment access regression
        run: node scripts/test_pksk_payment_flow.js
