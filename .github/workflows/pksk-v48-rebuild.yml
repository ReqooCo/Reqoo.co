name: PKSK V48 Rebuild 21-50

on:
  push:
    paths:
      - 'scripts/repair_pksk_v48.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Sets 21-50
        run: python3 scripts/repair_pksk_v48.py
      - name: Hard QA
        run: |
          python3 - <<'PY'
          import json,glob,os
          files=glob.glob('sim/pksk/simulator/sets/SET 21-30/data/set*.json')+glob.glob('sim/pksk/simulator/sets/SET 31-40/data/set*.json')+glob.glob('sim/pksk/simulator/sets/SET 41-50/data/set*.json')
          assert len(files)==30
          for p in files:
            d=json.load(open(p,encoding='utf8')); q=d['questions']; A=[x for x in q if x['section']=='BAHAGIAN A']; B=[x for x in q if x['section']=='BAHAGIAN B']
            assert len(q)==100 and len(A)==30 and len(B)==70 and len(d['writing'])==3
            assert len({x['id'] for x in q})==100 and len({x['question'].casefold() for x in q})==100
            for x in q:
              assert len(x['options'])==4 and len(set(x['options']))==4 and x['options'][x['answerIndex']]
              assert x['rebuildStatus']=='V48_REBUILT_PRODUCTION'
            assert d['rebuildVersion']=='V48_REBUILT_PRODUCTION'
          print('V48 HARD QA PASS',len(files),'sets')
          PY
      - name: Publish
        run: |
          git config user.name ReqooCo
          git config user.email actions@github.com
          git add 'sim/pksk/simulator/sets/SET 21-30/data' 'sim/pksk/simulator/sets/SET 31-40/data' 'sim/pksk/simulator/sets/SET 41-50/data'
          git commit -m 'build(pksk): rebuild sets 21-50 with V48' || echo 'No changes'
          git push