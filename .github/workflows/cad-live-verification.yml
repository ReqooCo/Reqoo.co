name: REDS single Draft preview verification
on:
  push:
    branches: [reds/draft]
    paths: ['.github/workflows/provision-rebuild-d1.yml','scripts/reds-*','cad-source/**','workers/cad-bridge.js','wrangler-web.toml','_web_worker.js','scripts/reds-release-gate.mjs','scripts/reds-release-gate.test.mjs', 'scripts/reds-release-surface-audit.mjs','scripts/reds-release-test-fetch.mjs','AGENTS.md','.github/workflows/cad-pr-validation.yml','.github/workflows/cad-live-verification.yml','.github/workflows/deploy.yml']
permissions:
  contents: read
concurrency:
  group: reds-draft-preview
  cancel-in-progress: true
jobs:
  verify-live:
    runs-on: ubuntu-latest
    environment: reds-draft
    timeout-minutes: 25
    env:
      CAD_TEST_URL: https://reqoo-reds-draft.abarttrading1.workers.dev/cad/
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build expected source identity
        working-directory: cad-source
        run: |
          npm ci
          npm run build
      - name: REDS Draft-only deployment gate
        run: node scripts/reds-release-gate.mjs check-draft
      - name: Ensure there is no second Live or Draft publisher
        run: node scripts/reds-release-surface-audit.mjs
      - name: Deploy canonical REDS Draft Worker
        working-directory: cad-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e "const fs=require('fs');fs.mkdirSync('../cad-preview/cad',{recursive:true});fs.cpSync('dist','../cad-preview/cad',{recursive:true})"
          npx --yes wrangler@4.129.0 deploy --config wrangler.draft.jsonc
      - name: Install Chromium
        working-directory: cad-source
        run: npx playwright install --with-deps chromium
      - name: Verify live source identity in the browser
        working-directory: cad-source
        run: node tests/live-identity.mjs
      - name: Test the deployed CAD application
        working-directory: cad-source
        run: |
          node tests/active-sketch-edit-ui.mjs
          node tests/reds-sketch-parity-ui.mjs
          node tests/multi-profile-ui.mjs
          node tests/r3ds-ux-ui.mjs
          node tests/visualization-ui.mjs
          node tests/smart-dimensions-ui.mjs
          # Bridge UI exercises a local mocked MCP backend; the static Draft Worker has no /cad/mcp endpoint.
          # Keep this test, but force its own local server instead of the externally deployed CAD_TEST_URL.
          env -u CAD_TEST_URL node tests/bridge-ui.mjs
          node tests/motion-continuity-ui.mjs
          node tests/sketch-regions-ui.mjs
          node tests/direct-sketch-ui.mjs
          node tests/canvas-gizmo-ui.mjs
          node tests/reds-focused-workspace-ui.mjs
          node tests/sketch-stroke-ui.mjs
          node tests/sketch-file-ux-ui.mjs
          node tests/rotation-ui.mjs
          node tests/extrude-modes-ui.mjs
          node tests/cad.mjs
          node tests/acceptance.mjs
          node tests/product.mjs
          node tests/transform-ui.mjs
          node tests/pattern-thread-ui.mjs
          node tests/precision-ui.mjs
          node tests/workspace-reference-ui.mjs
          node tests/input.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-live-qa
          path: cad-source/test-results
          retention-days: 14
