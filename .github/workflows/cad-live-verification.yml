name: CAD live preview and production verification
on:
  push:
    branches: [main, ux/reds-focused-workspace-20261106, feature/cad-professional-20261103, fix/cad-continuous-drag-diameter-20261103, fix/cad-interactive-preview-ui-20261103, fix/cad-ipad-face-preview-20261104, fix/cad-ring-regions-theme-20261104, fix/cad-sketch-dimensions-view-20261104, feature/cad-viewcube-display-20261104]
    paths: ['cad-source/**','workers/cad-bridge.js','wrangler-web.toml','_web_worker.js','.github/workflows/cad-live-verification.yml','.github/workflows/deploy.yml']
permissions:
  contents: read
concurrency:
  group: cad-live-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CAD_TEST_URL: ${{ github.ref == 'refs/heads/main' && 'https://reqoo.co/cad/' || github.ref == 'refs/heads/ux/reds-focused-workspace-20261106' && 'https://reqoo-cad-preview.abarttrading1.workers.dev/cad/' || github.ref == 'refs/heads/feature/cad-viewcube-display-20261104' && 'https://reqoo-cad-preview.abarttrading1.workers.dev/cad/' || github.ref == 'refs/heads/fix/cad-sketch-dimensions-view-20261104' && 'https://reqoo-cad-preview.abarttrading1.workers.dev/cad/' || github.ref == 'refs/heads/fix/cad-ring-regions-theme-20261104' && 'https://reqoo-cad-preview.abarttrading1.workers.dev/cad/' || github.ref == 'refs/heads/fix/cad-ipad-face-preview-20261104' && 'https://reqoo-cad-preview.abarttrading1.workers.dev/cad/' || github.ref == 'refs/heads/fix/cad-interactive-preview-ui-20261103' && 'https://fix-cad-interactive-preview.reqoo-co.pages.dev/cad/' || github.ref == 'refs/heads/fix/cad-continuous-drag-diameter-20261103' && 'https://fix-cad-continuous-drag-diam.reqoo-co.pages.dev/cad/' || 'https://feature-cad-professional-202.reqoo-co.pages.dev/cad/' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Build expected source identity
        working-directory: cad-source
        run: |
          npm ci
          npm run build
      - name: Deploy isolated CAD preview using the existing Workers deployment access
        if: github.ref == 'refs/heads/ux/reds-focused-workspace-20261106' || github.ref == 'refs/heads/feature/cad-viewcube-display-20261104' || github.ref == 'refs/heads/fix/cad-ipad-face-preview-20261104' || github.ref == 'refs/heads/fix/cad-ring-regions-theme-20261104' || github.ref == 'refs/heads/fix/cad-sketch-dimensions-view-20261104'
        working-directory: cad-source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node -e "const fs=require('fs');fs.mkdirSync('../cad-preview/cad',{recursive:true});fs.cpSync('dist','../cad-preview/cad',{recursive:true})"
          npx --yes wrangler@4.129.0 deploy --config wrangler.preview.jsonc
      - name: Install Chromium
        working-directory: cad-source
        run: npx playwright install --with-deps chromium
      - name: Verify live source identity in the browser
        working-directory: cad-source
        run: node tests/live-identity.mjs
      - name: Test the deployed CAD application
        working-directory: cad-source
        run: |
          node tests/active-sketch-edit-ui.mjs
          node tests/multi-profile-ui.mjs
          node tests/r3ds-ux-ui.mjs
          node tests/visualization-ui.mjs
          node tests/smart-dimensions-ui.mjs
          node tests/bridge-ui.mjs
          node tests/motion-continuity-ui.mjs
          node tests/sketch-regions-ui.mjs
          node tests/direct-sketch-ui.mjs
          node tests/canvas-gizmo-ui.mjs
          node tests/reds-focused-workspace-ui.mjs
          node tests/sketch-stroke-ui.mjs
          node tests/sketch-file-ux-ui.mjs
          node tests/rotation-ui.mjs
          node tests/extrude-modes-ui.mjs
          node tests/cad.mjs
          node tests/acceptance.mjs
          node tests/product.mjs
          node tests/transform-ui.mjs
          node tests/pattern-thread-ui.mjs
          node tests/precision-ui.mjs
          node tests/workspace-reference-ui.mjs
          node tests/input.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-live-qa
          path: cad-source/test-results
          retention-days: 14
