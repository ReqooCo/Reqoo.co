name: Validate Reqoo

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find api foundation shared sim -type f -name '*.js' -print0 2>/dev/null)
      - name: Check required production files
        shell: bash
        run: |
          set -euo pipefail
          test -f api/public-gateway.js
          test -f api/order-create.js
          test -f api/order-public.js
          test -f api/migrations/001_production_schema.sql
          test -f api/migrations/004_checkout_idempotency.sql
          test -f api/migrations/005_core_schema_repair.sql
          test -f admin/shop/product-builder.html
          test -f checkout/index.html
          test -f order/index.html
