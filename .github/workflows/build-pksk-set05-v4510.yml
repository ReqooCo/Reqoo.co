# V45.10 Set 05 production only
name: Build PKSK Set 05 V45.10
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_pksk_sets_04_50_v4510.py'
      - '.github/workflows/build-pksk-set05-v4510.yml'
permissions:
  contents: write
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'build(pksk): publish Set 05 V45.10 production'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Set 05 from zero
        env:
          PKSK_SET_START: '5'
          PKSK_SET_END: '5'
        run: python3 scripts/build_pksk_sets_04_50_v4510.py
      - name: Hard QA
        run: |
          python3 - <<'PY'
          import json
          from collections import Counter
          p='sim/pksk/simulator/sets/SET 01-10/data/set05.json'
          d=json.load(open(p,encoding='utf-8'))
          q=d['questions']
          assert len(q)==100
          assert sum(x['section']=='BAHAGIAN A' for x in q)==30
          assert sum(x['section']=='BAHAGIAN B' for x in q)==70
          assert len(d['writing'])==3
          assert len({x['id'] for x in q})==100
          assert len({x['question'].strip().casefold() for x in q})==100
          assert d.get('legacy_content_used') is False
          A=[x for x in q if x['section']=='BAHAGIAN A']
          pos=Counter(x['answerIndex'] for x in A)
          assert len(pos)==4 and max(pos.values())<=15, pos
          assert d['qa']['status']=='PASS'
          assert d['qa']['length_leak']=='PASS'
          print('PASS V45.10 SET 05',dict(sorted(pos.items())))
          PY
      - name: Publish
        run: |
          git config user.name ReqooCo
          git config user.email actions@github.com
          git add 'sim/pksk/simulator/sets/SET 01-10/data/set05.json'
          git commit -m 'build(pksk): publish Set 05 V45.10 production'
          git push origin main
