name: REQOO Foundation Regression v3
on:
  push:
    branches: [rebuild/v1-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check API modules
        shell: bash
        run: |
          set -euo pipefail
          for f in functions/api/*-v1.js; do node --check "$f"; done
      - name: Required migrations
        shell: bash
        run: |
          set -euo pipefail
          for f in migrations/0001_reqoo_core.sql migrations/0002_access_grants.sql migrations/0003_fulfillment_compat.sql migrations/0004_shop_catalog.sql; do test -f "$f"; done
      - name: Contract scan
        shell: bash
        run: |
          set -euo pipefail
          grep -q "SUM(amount_minor)" functions/api/payment-v1.js
          grep -q "access_grants" functions/api/sim-v1.js
          grep -q "access_grants" functions/api/play-v1.js
          grep -q "product_custom_fields" functions/api/order-v1.js
          grep -q "product_addons" functions/api/order-v1.js
          grep -q "documents" functions/api/invoice-v1.js
          grep -q "documents" functions/api/quote-v1.js
          echo "FOUNDATION REGRESSION SOURCE CHECK PASSED"
