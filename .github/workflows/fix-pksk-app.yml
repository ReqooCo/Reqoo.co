name: Repair PKSK app.js
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  diagnose:
    if: github.event.head_commit.message == 'Capture PKSK JavaScript syntax diagnostic'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose JavaScript syntax
        shell: bash
        run: |
          : > pksk-nodecheck.txt
          echo '--- first 80 lines of app.js ---' >> pksk-nodecheck.txt
          nl -ba sim/pksk/simulator/js/app.js | sed -n '1,80p' >> pksk-nodecheck.txt
          echo '--- node check ---' >> pksk-nodecheck.txt
          node --check sim/pksk/simulator/js/app.js >> pksk-nodecheck.txt 2>&1 || true
      - name: Commit diagnostic
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pksk-nodecheck.txt
          git commit -m 'Record PKSK JavaScript syntax diagnostic'
          git push
