name: Repair PKSK app.js
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Fix trailing escaped newline in PKSK app.js'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove trailing escaped newline
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/pksk/simulator/js/app.js')
          s=p.read_text()
          while s.endswith('\\n'):
              s=s[:-2]
          p.write_text(s.rstrip()+'\n')
          print('Removed trailing literal escaped newline')
          PY
      - name: Verify JavaScript syntax
        shell: bash
        run: node --check sim/pksk/simulator/js/app.js
      - name: Commit repaired app.js
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sim/pksk/simulator/js/app.js
          git commit -m 'Fix PKSK simulator syntax'
          git push
