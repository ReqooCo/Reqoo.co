name: Repair PKSK app.js
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Clean escaped PKSK app tail correctly'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean escaped tail and verify syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('sim/pksk/simulator/js/app.js')
          s=p.read_text()
          marker='/* PKSK UX PROGRESS FIX V2 */'
          if marker in s:
              s=s.split(marker,1)[0]
          s=s.rstrip('\r\n')
          while s.endswith('\\n'):
              s=s[:-2].rstrip('\r\n')
          p.write_text(s+'\n')
          PY
          node --check sim/pksk/simulator/js/app.js
      - name: Commit repaired app.js
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sim/pksk/simulator/js/app.js
          git commit -m 'Repair PKSK simulator JavaScript'
          git push
