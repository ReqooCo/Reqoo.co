name: Repair PKSK app.js
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  repair:
    if: github.event.head_commit.message == 'Remove malformed PKSK patch without blocking on syntax check'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove malformed PKSK UX patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sim/pksk/simulator/js/app.js')
          s = p.read_text()
          marker = '/* PKSK UX PROGRESS FIX V2 */'
          if marker not in s:
              raise SystemExit('PKSK UX patch marker not found')
          s = s.split(marker, 1)[0].rstrip() + '\n'
          p.write_text(s)
          print('Removed malformed PKSK UX patch')
          PY
      - name: Commit cleaned app.js
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add sim/pksk/simulator/js/app.js
          git diff --cached --quiet && exit 0
          git commit -m 'Remove malformed PKSK simulator patch'
          git push
