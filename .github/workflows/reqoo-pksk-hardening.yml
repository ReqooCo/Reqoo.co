name: REQOO PKSK hardening patch
on:
  push:
    paths:
      - '.github/workflows/reqoo-pksk-hardening.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch PKSK frontend contracts
        shell: python
        run: |
          from pathlib import Path
          # Payment: only show success when R2 proof was actually stored.
          p = Path('sim/pksk/payment/index.html')
          s = p.read_text()
          old = "if(!r.ok)throw Error(r.error||'Gagal menghantar bukti.');showPending(orderNo)"
          new = "if(!r.ok)throw Error(r.error||'Gagal menghantar bukti.');if(!r.proofUploaded){throw Error(r.warning||'Bukti pembayaran belum berjaya disimpan. Sila cuba upload semula.')}showPending(orderNo)"
          if old not in s:
              raise SystemExit('payment patch target not found')
          p.write_text(s.replace(old,new,1))
          # Admin: distinguish QR proof orders from Billplz pending orders.
          p = Path('sim/pksk/admin/index.html')
          s = p.read_text()
          old = '''  const actions=x.status==="PENDING"\n   ?`<button class="primary" onclick='verifyOrder(${JSON.stringify(x.orderNo)})'>✓ SAHKAN</button><button class="danger" onclick='rejectOrder(${JSON.stringify(x.orderNo)})'>TOLAK</button>`\n   :x.accessCode?`<button class="ghost" onclick='resendAccess(${JSON.stringify(x.accessCode)})'>↗ RESEND ACCESS</button><button class="ghost" onclick='copyText(${JSON.stringify(x.accessCode)})'>📋 COPY</button>`:"";\n  const proof=x.proofUploaded||x.proofRef?`<button class="ghost proof-btn" onclick='viewProof(${JSON.stringify(x.orderNo)})'>📎 BUKTI</button>`:`<span>⚠ Tiada bukti</span>`;'''
          new = '''  const hasProof=x.proofUploaded===true||String(x.proofRef||"").trim()!=="";\n  const isOnline=x.onlinePayment===true||String(x.paymentRef||"").startsWith("billplz:");\n  const actions=x.status==="PENDING"\n   ?(hasProof\n      ?`<button class="primary" onclick='verifyOrder(${JSON.stringify(x.orderNo)})'>✓ SAHKAN</button><button class="danger" onclick='rejectOrder(${JSON.stringify(x.orderNo)})'>TOLAK</button>`\n      :isOnline\n        ?`<span class="small">💳 TUNGGU BAYARAN ONLINE</span>`\n        :`<button class="danger" onclick='rejectOrder(${JSON.stringify(x.orderNo)})'>TOLAK</button>`)\n   :x.accessCode?`<button class="ghost" onclick='resendAccess(${JSON.stringify(x.accessCode)})'>↗ RESEND ACCESS</button><button class="ghost" onclick='copyText(${JSON.stringify(x.accessCode)})'>📋 COPY</button>`:"";\n  const proof=hasProof?`<button class="ghost proof-btn" onclick='viewProof(${JSON.stringify(x.orderNo)})'>📎 BUKTI</button>`:(isOnline?`<span class="small">💳 Billplz</span>`:`<span>⚠ Tiada bukti</span>`);'''
          if old not in s:
              raise SystemExit('admin patch target not found')
          p.write_text(s.replace(old,new,1))
          # Simulator: remove duplicate helper declarations; keep first canonical definitions.
          p = Path('sim/pksk/simulator/js/app.js')
          s = p.read_text()
          old = '''function pkskLicense(){return (localStorage.getItem("reqoo_pksk_license")||"").trim().toUpperCase();}\nfunction pkskRequireAccess'''
          if old not in s:
              raise SystemExit('app license duplicate target not found')
          s = s.replace(old, 'function pkskRequireAccess', 1)
          old = '''}\nfunction pkskDeviceId(){\n  let id=localStorage.getItem("reqoo_pksk_device_id");\n  if(!id){id="DEV-"+crypto.getRandomValues(new Uint32Array(3)).join("-")+"-"+Date.now().toString(36);localStorage.setItem("reqoo_pksk_device_id",id)}\n  return id;\n}\nfunction pkskDashApi(action,data,done){pkskApi(action,data,done)}\nfunction exitToDashboard'''
          if old not in s:
              raise SystemExit('app device duplicate target not found')
          s = s.replace(old, '}\nfunction exitToDashboard', 1)
          p.write_text(s)
      - name: Validate JavaScript
        run: |
          node --check sim/pksk/simulator/js/app.js
      - name: Commit patch and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/reqoo-pksk-hardening.yml
          git add sim/pksk/payment/index.html sim/pksk/admin/index.html sim/pksk/simulator/js/app.js .github/workflows/reqoo-pksk-hardening.yml
          git commit -m 'fix: harden PKSK payment admin and simulator flow' || exit 0
          git push