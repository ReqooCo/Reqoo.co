name: Repair PKSK wording

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  repair:
    if: startsWith(github.event.issue.title, '[AUTO] Repair PKSK wording')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Repair duplicated wording
        run: |
          python - <<'PY'
          from pathlib import Path

          files = [
              Path('sim/pksk/simulator/sets/SET 11-20/data/set11.json'),
              Path('sim/pksk/simulator/sets/SET 11-20/data/set19.json'),
          ]

          for path in files:
              text = path.read_text(encoding='utf-8')
              fixed = text.replace('projek projek', 'projek')
              if fixed == text:
                  print(f'No change needed: {path}')
              else:
                  path.write_text(fixed, encoding='utf-8')
                  print(f'Repaired: {path}')
          PY

      - name: Commit repair and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/repair-pksk-wording.yml
          git add sim/pksk/simulator/sets/SET\ 11-20/data/set11.json sim/pksk/simulator/sets/SET\ 11-20/data/set19.json .github/workflows/repair-pksk-wording.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "fix(pksk): repair duplicated project wording in Sets 11 and 19"
            git push
          fi
          gh issue close "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --comment "Automated PKSK wording repair completed."
