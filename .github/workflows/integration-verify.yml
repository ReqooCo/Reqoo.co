name: Verify Final Integration

on:
  push:
    branches:
      - rebuild/reqoo-final-integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify backend and runtime files
        shell: bash
        run: |
          set -euo pipefail
          for file in api/*.js functions/api/*.js; do
            echo "CHECKING $file"
            node --check "$file" || { echo "SYNTAX_FAILED=$file"; exit 1; }
          done
          test -f api/worker.js
          test -f api/shop.js
          test -f api/pksk.js
          test -f api/hero.js
          test -f api/shop-admin.js
          test -f api/sim-admin.js
          test -f api/shop-runtime.js
          test -f api/wrangler.jsonc
          test -f wrangler-web.toml
          test -f _web_worker.js

      - name: Verify migrations and PKSK sets
        shell: bash
        run: |
          set -euo pipefail
          for f in migrations/0001_reqoo_core.sql migrations/0002_access_grants.sql migrations/0003_fulfillment_compat.sql migrations/0004_shop_catalog.sql migrations/0005_pksk_progress.sql migrations/0006_shop_operations.sql migrations/0007_shop_hero.sql; do
            test -f "$f"
          done
          count=$(find sim/pksk/simulator/sets -type f -name 'set*.json' | wc -l | tr -d ' ')
          test "$count" -eq 50
          while IFS= read -r f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
          done < <(find sim/pksk/simulator/sets -type f -name 'set*.json' | sort)

      - name: Verify deployment configs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const api = fs.readFileSync('api/wrangler.jsonc', 'utf8');
          const web = fs.readFileSync('wrangler-web.toml', 'utf8');
          if (!api.includes('reqoo-catalog-api')) throw new Error('API worker name missing');
          if (!api.includes('reqoo-rebuild')) throw new Error('D1 binding missing');
          if (!api.includes('reqoo-product-media')) throw new Error('R2 binding missing');
          for (const host of ['reqoo.co','shop.reqoo.co','sim.reqoo.co','pksk.sim.reqoo.co']) {
            if (!web.includes(host)) throw new Error(`Web route missing: ${host}`);
          }
          NODE

      - name: Verify Shop and host routing contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const worker = fs.readFileSync('api/worker.js', 'utf8');
          const shopApi = fs.readFileSync('api/shop.js', 'utf8');
          const web = fs.readFileSync('_web_worker.js', 'utf8');
          const shop = fs.readFileSync('shop/index.html', 'utf8');
          const webCfg = fs.readFileSync('wrangler-web.toml', 'utf8');
          const checks = [
            [worker, "path === '/api/shop'", 'API worker shop route'],
            [shopApi, "u.pathname==='/api/shop'", 'shop handler route'],
            [worker, "path === '/api/sim-admin'", 'API worker admin route'],
            [web, "host === 'shop.reqoo.co'", 'shop host route'],
            [web, "host === 'pksk.sim.reqoo.co'", 'PKSK host route'],
            [web, "host === 'sim.reqoo.co'", 'SIM host route'],
            [shop, 'api/shop', 'shop API client'],
            [webCfg, 'shop.reqoo.co', 'shop web route'],
            [webCfg, 'pksk.sim.reqoo.co', 'PKSK web route'],
            [webCfg, 'sim.reqoo.co', 'SIM web route']
          ];
          for (const [text, needle, label] of checks) {
            if (!text.includes(needle)) throw new Error(`${label} missing: ${needle}`);
          }
          NODE
