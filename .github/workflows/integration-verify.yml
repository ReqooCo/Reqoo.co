name: Verify Final Integration

on:
  push:
    branches: [rebuild/reqoo-final-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify backend and runtime files
        shell: bash
        run: |
          set -euo pipefail
          test -f api/worker.js
          test -f api/core-worker.js
          test -f api/core.js
          test -f api/shop.js
          test -f api/pksk.js
          test -f api/admin-compat.js
          test -f api/wrangler.jsonc
          test -f wrangler-web.toml
          test -f _web_worker.js
          node --check api/worker.js
          node --check api/core-worker.js
          node --check api/core.js
          node --check api/shop.js
          node --check api/pksk.js
          node --check api/admin-compat.js
          node --check _web_worker.js
          node --check functions/api/core.js
          node --check functions/api/product-image.js

      - name: Verify migrations and PKSK sets
        shell: bash
        run: |
          set -euo pipefail
          test -f migrations/0001_reqoo_core.sql
          test -f migrations/0002_access_grants.sql
          test -f migrations/0003_fulfillment_compat.sql
          test -f migrations/0004_shop_catalog.sql
          test -f migrations/0005_pksk_progress.sql
          count=$(find sim/pksk/simulator/sets -type f -name 'set*.json' | wc -l | tr -d ' ')
          test "$count" -eq 50
          while IFS= read -r f; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
          done < <(find sim/pksk/simulator/sets -type f -name 'set*.json' | sort)

      - name: Verify deployment configs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const api = fs.readFileSync('api/wrangler.jsonc', 'utf8');
          const deploy = fs.readFileSync('.github/workflows/deploy-final.yml', 'utf8');
          if (!api.includes('api.reqoo.co/*')) throw new Error('API route missing');
          if (!deploy.includes('wrangler-web.toml')) throw new Error('Web deploy missing');
          if (!deploy.includes('api/wrangler.jsonc')) throw new Error('API deploy missing');
          NODE

      - name: Verify Shop and host routing contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const worker = fs.readFileSync('api/worker.js', 'utf8');
          const shopApi = fs.readFileSync('api/shop.js', 'utf8');
          const web = fs.readFileSync('_web_worker.js', 'utf8');
          const shop = fs.readFileSync('shop/index.html', 'utf8');
          const webCfg = fs.readFileSync('wrangler-web.toml', 'utf8');
          const checks = [
            [worker, "url.pathname === '/api/shop'", 'API worker shop route'],
            [shopApi, "u.pathname==='/api/shop'", 'shop handler route'],
            [worker, "url.pathname === '/api/sim-admin'", 'API worker admin route'],
            [web, "host === 'shop.reqoo.co'", 'shop host route'],
            [web, "host === 'pksk.sim.reqoo.co'", 'PKSK host route'],
            [shop, 'api/shop', 'shop API client'],
            [webCfg, 'shop.reqoo.co', 'shop web route'],
            [webCfg, 'pksk.sim.reqoo.co', 'PKSK web route']
          ];
          for (const [text, needle, label] of checks) {
            if (!text.includes(needle)) throw new Error(`${label} missing: ${needle}`);
          }
          NODE
