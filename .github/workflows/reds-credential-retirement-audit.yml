name: REDS retired credential and legacy workflow audit
on:
  push:
    branches: [reds/draft]
    paths:
      - '.github/workflows/reds-credential-retirement-audit.yml'
      - 'scripts/reds-credential-retirement-audit.mjs'
      - 'scripts/reds-*'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  audit-retired-credentials:
    name: retired-credential-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No environment: the secrets context below can only resolve repository
    # and organization secrets, never the reds-live/reds-draft credentials.
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      REPO_WORKER_SECRET_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      REPO_D1_SECRET_PRESENT: ${{ secrets.CLOUDFLARE_D1_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify legacy shared deployment secrets absent and D1 workflow disabled
        run: node scripts/reds-credential-retirement-audit.mjs
