name: Fix Admin Single Login

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply single-login bridge
        shell: python
        run: |
          from pathlib import Path

          p = Path('sim/pksk/admin/index.html')
          s = p.read_text(encoding='utf-8')

          if 'REQOO_SINGLE_LOGIN_BRIDGE_V1' not in s:
              s = s.replace(
                  '<section id="login" class="card login">',
                  '<!-- REQOO_SINGLE_LOGIN_BRIDGE_V1 --><section id="login" class="card login" hidden>',
                  1
              )
              s = s.replace(
                  'const $=id=>document.getElementById(id);let TOKEN="",DATA={orders:[],licenses:[],referrals:[]};',
                  'const $=id=>document.getElementById(id);let TOKEN=localStorage.getItem("reqoo_admin_token")||"",DATA={orders:[],licenses:[],referrals:[]};',
                  1
              )
              s = s.replace(
                  'async function load(){\n setLive(false);',
                  '''function goMainAdmin(){const here=location.pathname+location.search;location.replace("/admin/?return="+encodeURIComponent(here));}
function ensureMainAdminSession(){if(!TOKEN){goMainAdmin();return false;}return true;}
async function load(){
 if(!ensureMainAdminSession())return;
 setLive(false);''',
                  1
              )
              s = s.replace(
                  '$("loginBtn").onclick=async()=>{TOKEN=$("token").value.trim();if(!TOKEN)return showLoginMsg("Token diperlukan.");$("loginBtn").disabled=true;showLoginMsg("Menyemak…");const j=await api("getPKSKAdminDashboard");$("loginBtn").disabled=false;if(!j?.ok)return showLoginMsg(j?.error||"Gagal masuk.");$("login").hidden=true;$("app").hidden=false;DATA=j;setLive(true);render();loadErrors()};',
                  '''$("loginBtn").onclick=async()=>{TOKEN=$("token").value.trim();if(!TOKEN)return showLoginMsg("Token diperlukan.");localStorage.setItem("reqoo_admin_token",TOKEN);$("loginBtn").disabled=true;showLoginMsg("Menyemak…");const j=await api("getPKSKAdminDashboard");$("loginBtn").disabled=false;if(!j?.ok){localStorage.removeItem("reqoo_admin_token");TOKEN="";return showLoginMsg(j?.error||"Gagal masuk.");}$("login").hidden=true;$("app").hidden=false;DATA=j;setLive(true);render();loadErrors()};''',
                  1
              )
              s = s.replace(
                  '$("saveSettings").onclick=async()=>{const price=Number($("price").value),commission=Number($("commission").value);const j=await api("updatePKSKSettings",{price,commission});$("settingsMsg").textContent=j?.ok?"✓ Tetapan disimpan.":(j?.error||"Gagal simpan.");if(j?.ok)await load()};',
                  '''$("saveSettings").onclick=async()=>{const price=Number($("price").value),commission=Number($("commission").value);const j=await api("updatePKSKSettings",{price,commission});$("settingsMsg").textContent=j?.ok?"✓ Tetapan disimpan.":(j?.error||"Gagal simpan.");if(j?.ok)await load()};
if(ensureMainAdminSession()){ $("login").hidden=true; $("app").hidden=false; load(); }''',
                  1
              )
              p.write_text(s, encoding='utf-8')

          p = Path('shop/admin.html')
          s = p.read_text(encoding='utf-8')
          if 'REQOO_SINGLE_LOGIN_BRIDGE_V1' not in s:
              s = s.replace(
                  '<section id="login" class="login">',
                  '<!-- REQOO_SINGLE_LOGIN_BRIDGE_V1 --><section id="login" class="login" style="display:none">',
                  1
              )
              s = s.replace(
                  "let TOKEN='',ORDERS=[];",
                  "let TOKEN=localStorage.getItem('reqoo_admin_token')||'',ORDERS=[];",
                  1
              )
              marker = "function login(){TOKEN=document.getElementById('token').value.trim();if(TOKEN){initNotifications();load()}}"
              replacement = "function login(){TOKEN=document.getElementById('token').value.trim();if(TOKEN){localStorage.setItem('reqoo_admin_token',TOKEN);initNotifications();load()}}"
              s = s.replace(marker, replacement, 1)
              boot = "if(TOKEN){document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';initNotifications();load()}else{location.replace('/admin/?return='+encodeURIComponent(location.pathname+location.search))}"
              s = s.replace(replacement, replacement + '\n' + boot, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit patched files
        run: |
          git config user.name 'REQOO Bot'
          git config user.email 'actions@reqoo.co'
          git add sim/pksk/admin/index.html shop/admin.html
          if git diff --cached --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git commit -m 'fix admin single login bridge'
          git push
