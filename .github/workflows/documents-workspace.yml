name: Documents workspace regression
on:
  pull_request:
    paths:
      - 'admin/documents*'
      - 'admin/cost-calculator*'
      - 'admin/quotation-costs.css'
      - 'migrations/0014_quotation_costs.sql'
      - 'tests/admin-quotation-costs.mjs'
      - 'admin/document-*'
      - 'admin/admin-*'
      - 'admin/sales-workspace.js'
      - 'admin/manage.html'
      - 'admin/overview.js'
      - 'admin/index.html'
      - 'admin/overview.css'
      - 'admin/finance*'
      - 'api/admin-expenses.js'
      - 'api/admin-recurring-expenses.js'
      - 'migrations/0016_recurring_expenses.sql'
      - 'tests/admin-recurring-expenses.mjs'
      - 'api/quotation-order-costs.js'
      - 'tests/admin-quotation-order-costs.mjs'
      - 'migrations/0015_operating_expenses.sql'
      - 'tests/admin-operating-expenses.mjs'
      - 'migrations/0012_order_handoffs.sql'
      - 'tests/admin-sales*'
      - 'tests/admin-language.cjs'
      - '_web_worker.js'
      - 'functions/_middleware.js'
      - 'tests/admin-theme-browser.cjs'
      - 'api/shop-admin-flow-v18.js'
      - 'api/shop-admin-flow-v17.js'
      - 'migrations/0013_quotation_revisions.sql'
      - 'tests/admin-quotation-revisions*'
      - 'tests/admin-invoice-balances.mjs'
      - 'api/admin-business.js'
      - 'api/worker.js'
      - 'migrations/0011_admin_business.sql'
      - 'tests/admin-business*'
      - 'tests/admin-finance*'
      - 'scripts/build-documents-workspace.mjs'
      - 'tests/admin-documents*'
      - '.github/workflows/documents-workspace.yml'
permissions:
  contents: read
jobs:
  documents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate workspace and in-memory D1 workflows
        run: |
          node scripts/build-documents-workspace.mjs --check
          node --check admin/documents.js
          node --check api/shop-admin-flow-v18.js
          node tests/admin-documents-pack.mjs
          node tests/admin-documents-v2.mjs
          node tests/admin-documents-performance.mjs
          node tests/admin-documents-overdue.mjs
          node tests/admin-documents-finance-scalability.mjs
          node tests/admin-invoice-balances.mjs
          node tests/admin-quotation-revisions.mjs
          node tests/admin-quotation-costs.mjs
          node tests/admin-quotation-order-costs.mjs
          node tests/admin-operating-expenses.mjs
          node tests/admin-recurring-expenses.mjs
          node tests/admin-documents-workspace.mjs
          node tests/admin-orders-documents-scalability.mjs
          node tests/admin-payment-ledger-consistency.mjs
          node tests/admin-finance-dashboard.mjs
          node tests/admin-finance-scalability.mjs
          node tests/admin-business-workflows.mjs
          node tests/admin-sales-workspace.mjs
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-package-lock playwright@1.62.1 jsdom@30.0.1
          npx playwright install --with-deps chromium
      - name: Validate browser and first paint with fixtures
        env:
          REQOO_TEST_OUTPUT: test-results/documents
        run: |
          node tests/admin-language.cjs
          node tests/admin-documents-fast-load.cjs
          node tests/admin-documents-browser.cjs
          node tests/admin-theme-browser.cjs
          node tests/admin-business-browser.cjs
          node tests/admin-sales-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: documents-fixture-previews
          path: test-results/documents
