name: Deploy Reqoo Final Stack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wrangler 4
        shell: bash
        run: npm install --no-save wrangler@4.128.0

      - name: Validate final stack
        shell: bash
        run: |
          set -euo pipefail
          node --check api/worker.js
          node --check api/core-worker.js
          node --check api/pksk.js
          node --check _web_worker.js
          node --check sim/pksk/simulator/js/app.js
          test -f migrations/0005_pksk_progress.sql
          test "$(find sim/pksk/simulator/sets -type f -name 'set*.json' | wc -l | tr -d ' ')" -eq 50
          for f in sim/pksk/simulator/sets/*/data/set*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
          done

      - name: Apply D1 migrations
        shell: bash
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          token="$RAW_CF_TOKEN"
          token="${token#Bearer }"
          token="${token#bearer }"
          export CLOUDFLARE_API_TOKEN="$token"
          npx wrangler d1 migrations apply reqoo-rebuild --remote --config api/wrangler.jsonc

      - name: Deploy API Worker
        shell: bash
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          token="$RAW_CF_TOKEN"
          token="${token#Bearer }"
          token="${token#bearer }"
          export CLOUDFLARE_API_TOKEN="$token"
          npx wrangler deploy --config api/wrangler.jsonc

      - name: Deploy Web Worker
        shell: bash
        env:
          RAW_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          token="$RAW_CF_TOKEN"
          token="${token#Bearer }"
          token="${token#bearer }"
          export CLOUDFLARE_API_TOKEN="$token"
          npx wrangler deploy --config wrangler-web.toml
