name: Publish PKSK Set 05 V45.10
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-pksk-set05.yml'
permissions:
  contents: write
jobs:
  publish:
    if: github.event.head_commit.message != 'build(pksk): publish Set 05 V45.10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Set 05
        env:
          PAYLOAD: |
            
            
            
        run: |
          python3 - <<'PY'
          import os, base64, bz2
          data = bz2.decompress(base64.b64decode(os.environ['PAYLOAD'])).decode('utf-8')
          open('sim/pksk/simulator/sets/SET 01-10/data/set05.json','w',encoding='utf-8').write(data)
          PY
      - name: Publish production data
        run: |
          git config user.name ReqooCo
          git config user.email actions@github.com
          git add 'sim/pksk/simulator/sets/SET 01-10/data/set05.json'
          git diff --cached --quiet || git commit -m 'build(pksk): publish Set 05 V45.10'
          git push origin main
