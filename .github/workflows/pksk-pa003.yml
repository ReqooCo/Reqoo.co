name: PKSK Pengetahuan Am Batch 003

on:
  push:
    branches:
      - staging/pa003
    paths:
      - 'sim/pksk/curation/B/pa_new_batch_003*.jsonl'
      - 'sim/pksk/curation/B/pa_new_batch_003_manifest.json'
      - 'scripts/validate_pksk_b_pa_new_batch.py'
      - '.github/workflows/pksk-pa003.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-pa003:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore validated PA baseline from PA002 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit-output /tmp/pa002
          gh api repos/${{ github.repository }}/actions/artifacts/10435532315/zip > /tmp/pa002.zip
          unzip -q /tmp/pa002.zip -d /tmp/pa002
          cp -a /tmp/pa002/. audit-output/
          test -f audit-output/b_section_strict_source_survivors.jsonl
          test -f audit-output/b_pa_new_batch_001_validated.jsonl
          test -f audit-output/b_pa_new_batch_002_validated.jsonl
      - name: Validate Pengetahuan Am new batch 003
        run: python scripts/validate_pksk_b_pa_new_batch.py 3
      - name: Upload PA003 QA artifact
        uses: actions/upload-artifact@v4
        with:
          name: pksk-pa003-qa
          path: |
            audit-output/b_pa_new_batch_003_qa.json
            audit-output/b_pa_new_batch_003_validated.jsonl
