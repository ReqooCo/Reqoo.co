name: Build PKSK Set 03
on: push
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Set 03
        shell: bash
        run: |
          python3 - <<'PY'
          import json,glob,os
          rows=[]
          for fn in sorted(glob.glob('tmp/pksk/s03_f*.txt')):
              with open(fn,encoding='utf-8') as f:
                  rows += [x.rstrip('\n').split('|') for x in f if x.strip()]
          assert len(rows)==100
          assert sum(r[0]=='A' for r in rows)==30
          assert sum(r[0]=='B' for r in rows)==70
          qs=[]; a_no=b_no=0
          for r in rows:
              sec,cat,q,o1,o2,o3,o4,ans,fam=r
              ans=int(ans); opts=[o1,o2,o3,o4]
              base=[3,2,1,0]; weights=[base[(j-ans)%4] for j in range(4)]
              if sec=='A':
                  a_no+=1; ident=f'PKSK-V45-S03-A{a_no:02d}'
                  weights=[1,3,0,2]
              else:
                  b_no+=1; ident=f'PKSK-V45-S03-B{b_no:02d}'
              qs.append({'section':'BAHAGIAN A' if sec=='A' else 'BAHAGIAN B','category':cat,'question':q,'options':opts,'weights':weights,'type':'graded','plannedLevel':3,'constructFamily':fam,'levelSignal':3,'contentDomain':'sahsiah_dan_situasi' if sec=='A' else cat,'setLevel':3,'rebuildStatus':'V45.9_GENERATED_FROM_ZERO','id':ident})
          writing=[
            {'id':'C01','title':'Hari tanpa plastik','prompt':'Sekolah kamu mahu mengurangkan penggunaan plastik. Cadangkan satu program yang boleh dilaksanakan oleh murid, terangkan langkah pelaksanaannya dan jelaskan kesan yang dijangka.','min_words':100,'plannedLevel':3,'constructFamily':'environmental_problem_solving','levelSignal':3,'rubric_focus':['masalah','idea','langkah','sebab','kesan','bahasa']},
            {'id':'C02','title':'Memimpin aktiviti kelas','prompt':'Kamu dilantik mengetuai satu aktiviti kelas yang melibatkan semua murid. Huraikan cara kamu membahagikan tugas, mengurus perbezaan pendapat dan memastikan aktiviti berjaya.','min_words':100,'plannedLevel':3,'constructFamily':'leadership_conflict_management','levelSignal':3,'rubric_focus':['perancangan','pembahagian tugas','penyelesaian konflik','kepimpinan','kesan','bahasa']},
            {'id':'C03','title':'Satu keputusan yang sukar','prompt':'Ceritakan satu situasi yang memerlukan kamu membuat pilihan antara dua perkara yang sama-sama penting. Terangkan faktor yang kamu pertimbangkan, keputusan kamu dan perkara yang kamu pelajari.','min_words':100,'plannedLevel':3,'constructFamily':'decision_making_reflection','levelSignal':3,'rubric_focus':['situasi','pertimbangan','keputusan','justifikasi','refleksi','bahasa']}]
          out={'set':3,'questions':qs,'writing':writing,'difficulty':3,'rebuildVersion':'V45.9_SET03_PRODUCTION','source':'generated_from_zero_v45.9','legacy_content_used':False,'structure':{'A':30,'B':70,'C':3},'qa':{'count':103,'unique_ids':len({q['id'] for q in qs})==100,'status':'BUILT_FROM_ZERO','cross_set_policy':'NEW_CONTEXTS_AND_NEW_STEMS'}}
          assert out['qa']['unique_ids'] and len(writing)==3
          path='sim/pksk/simulator/sets/SET 01-10/data/set03.json'
          os.makedirs(os.path.dirname(path),exist_ok=True)
          with open(path,'w',encoding='utf-8') as f: json.dump(out,f,ensure_ascii=False,indent=2)
          PY
      - name: Publish Set 03
        run: |
          git config user.name ReqooCo
          git config user.email actions@github.com
          git add "sim/pksk/simulator/sets/SET 01-10/data/set03.json"
          git commit -m "build(pksk): publish Set 03 production bank"
          git push origin main
