name: REDS Live credential read-only audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-live-token-isolation:
    runs-on: ubuntu-24.04
    environment: reds-live
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify effective Live Worker and D1 token isolation without deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reds-live-credential-audit.mjs
