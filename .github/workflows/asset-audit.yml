name: Asset Audit

on:
  push:
  pull_request:

jobs:
  validate-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate image binaries
        run: node scripts/validate-assets.mjs
