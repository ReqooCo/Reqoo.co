name: Build PKSK Sets 04-50 V45.10
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_pksk_sets_04_50_v4510.py'
      - '.github/workflows/build-pksk-sets-04-50.yml'
permissions:
  contents: write
jobs:
  generate:
    if: github.event.head_commit.message != 'build(pksk): publish Sets 04-50 V45.10'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate Sets 04-50
        run: python3 scripts/build_pksk_sets_04_50_v4510.py
      - name: Publish production data
        run: |
          git config user.name ReqooCo
          git config user.email actions@github.com
          git add 'sim/pksk/simulator/sets/SET 01-10/data/set0[4-9].json' 'sim/pksk/simulator/sets/SET 01-10/data/set[1-4][0-9].json' 'sim/pksk/simulator/sets/SET 01-10/data/set50.json'
          git commit -m 'build(pksk): publish Sets 04-50 V45.10'
          git push origin main
