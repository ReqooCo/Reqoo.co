name: Deploy Reqoo Final

on:
  push:
    branches: [main]
  # Deliberately no workflow_dispatch: release only after an approved main merge.

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: read

env:
  WRANGLER_VERSION: 4.129.0

concurrency:
  group: reqoo-production-release
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify release source before asking the owner to approve
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reds-release-gate.mjs check-live-source
      - name: Audit canonical deployment surfaces
        run: node scripts/reds-release-surface-audit.mjs
      - name: Summarize the release for the owner
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          echo "## REQOO Live release" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Required CAD checks and canonical Draft validation were verified. Approve reds-live to publish this release." >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    environment: reds-live
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verify Live Worker and D1 credential isolation (read-only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/reds-live-credential-audit.mjs

      - name: REDS Live single-gate verification
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/reds-release-gate.mjs check-live

      - name: Validate final runtime
        shell: bash
        run: |
          set -euo pipefail
          for f in api/*.js functions/api/*.js; do
            echo "CHECKING $f"
            node --check "$f"
          done
          node --check _web_worker.js
          node cad-source/tests/bridge-api.mjs
          node --check sim/pksk/simulator/js/app.js
          node tests/payment-toyyibpay-flow.mjs
          node tests/payment-billplz-flow.mjs
          node tests/billplz-contract.mjs
          node tests/commerce.mjs
          node tests/app-cache-isolation.mjs
          test -f api/worker.js
          test -f api/wrangler.jsonc
          test -f wrangler-web.toml
          test -f _web_worker.js
          test -f shop/index.html
          test -f shop/shop-core-v1.js
          test -f shop/maybank-qr.jpg
          test -f shop/admin.html
          test -f sim/pksk/simulator/index.html
          test "$(find sim/pksk/simulator/sets -type f -name 'set*.json' | wc -l | tr -d ' ')" -eq 50
          for f in sim/pksk/simulator/sets/*/data/set*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
          done

      - name: Build current CAD source for the Web Worker asset binding
        working-directory: cad-source
        run: |
          npm ci
          node tests/multi-profile.mjs
          node tests/visualization.mjs
          node tests/smart-dimensions.mjs
          npm run build
          node -e "const fs=require('fs');fs.rmSync('../cad',{recursive:true,force:true});fs.cpSync('dist','../cad',{recursive:true})"

      - name: Install Wrangler
        shell: bash
        run: npm install --no-save --no-package-lock "wrangler@${WRANGLER_VERSION}"

      - name: Verify existing Billplz Worker secrets (names only)
        run: node scripts/check-billplz-deployment.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Apply D1 migrations
        shell: bash
        env:
          # Separate restricted D1 credential from the Worker deployment token.
          # Configure CLOUDFLARE_D1_API_TOKEN as a reds-live environment secret.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::reds-live needs environment secret CLOUDFLARE_D1_API_TOKEN (D1 Write only)."
            exit 1
          fi
          npx --no-install wrangler d1 migrations apply reqoo-rebuild --remote --config api/wrangler.jsonc

      - name: Deploy API Worker
        shell: bash
        run: npx --no-install wrangler deploy --config api/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Web Worker
        shell: bash
        run: npx --no-install wrangler deploy --config wrangler-web.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Verify REDS Live source identity after release
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if curl --fail --silent --show-error --header 'Cache-Control: no-cache' "https://reqoo.co/cad/version.json?release=$EXPECTED_SHA" > /tmp/reds-live-version.json; then
              if node -e "const fs=require('fs');const v=JSON.parse(fs.readFileSync('/tmp/reds-live-version.json','utf8'));if(v.commit!==process.env.EXPECTED_SHA)process.exit(1);"; then
                echo "REDS Live source verified: $EXPECTED_SHA"
                exit 0
              fi
            fi
            sleep 4
          done
          echo "::error::Production CAD version did not match the released main commit."
          exit 1
