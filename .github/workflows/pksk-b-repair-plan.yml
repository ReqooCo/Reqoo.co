name: PKSK B 50-Set Repair Plan

on:
  push:
    branches:
      - repair/pksk-b-50set-v1
    paths:
      - 'scripts/audit_pksk_live_50sets_clone.py'
      - 'scripts/classify_pksk_live_50sets_clone.py'
      - 'scripts/build_pksk_b_repair_plan.py'
      - 'scripts/validate_pksk_b_repair_batch.py'
      - 'scripts/validate_apply_pksk_b_repair_batch002.py'
      - 'scripts/validate_apply_pksk_b_repair_batch003.py'
      - 'scripts/validate_pksk_b_iq_batch001.py'
      - 'scripts/audit_pksk_b_core_duplicates.py'
      - 'scripts/audit_pksk_b_core_duplicates_v2.py'
      - 'scripts/audit_pksk_b_core_duplicates_v3.py'
      - 'scripts/audit_pksk_b_core_duplicates_v4.py'
      - 'scripts/build_pksk_b_strict_authoring_plan.py'
      - '.github/workflows/pksk-b-repair-plan.yml'
      - 'sim/pksk/curation/B/**'
      - 'sim/pksk/simulator/sets/**'
  workflow_dispatch:

jobs:
  repair-plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit cloned live PKSK 50 sets
        run: python scripts/audit_pksk_live_50sets_clone.py
      - name: Classify salvage path
        run: python scripts/classify_pksk_live_50sets_clone.py
      - name: Build locked B repair plan
        run: python scripts/build_pksk_b_repair_plan.py
      - name: Validate B repair batch 001
        run: python scripts/validate_pksk_b_repair_batch.py
      - name: Audit baseline hidden duplicates after batch 001 (strict V2)
        run: python scripts/audit_pksk_b_core_duplicates_v2.py
      - name: Validate and apply B repair batch 002
        run: python scripts/validate_apply_pksk_b_repair_batch002.py
      - name: Audit hidden duplicates after batch 002 (strict V3)
        run: python scripts/audit_pksk_b_core_duplicates_v3.py
      - name: Validate and apply B repair batch 003
        run: python scripts/validate_apply_pksk_b_repair_batch003.py
      - name: Audit hidden duplicates after batch 003 (strict V4)
        run: python scripts/audit_pksk_b_core_duplicates_v4.py
      - name: Validate IQ new batch 001
        run: python scripts/validate_pksk_b_iq_batch001.py
      - name: Build current strict B authoring plan
        run: python scripts/build_pksk_b_strict_authoring_plan.py
      - name: Upload B repair workspace
        uses: actions/upload-artifact@v4
        with:
          name: pksk-b-50set-repair-workspace
          path: audit-output/
