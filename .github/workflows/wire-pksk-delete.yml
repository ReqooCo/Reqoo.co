name: Wire PKSK delete button

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message, '[auto-delete-inject]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject delete script
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('sim/pksk/admin/index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./delete-order.js?v=1"></script>'
          if tag not in s:
              s=s.replace('</body>', f'{tag}</body>')
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit injection
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sim/pksk/admin/index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '[auto-delete-inject] Wire PKSK admin delete button'
          git push
