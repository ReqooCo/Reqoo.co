name: Backend Syntax Gate

on:
  push:
    branches: [main, rebuild/reqoo-final-integration]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check backend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for file in api/*.js functions/api/*.js; do
            echo "CHECKING $file"
            node --check "$file" || { echo "SYNTAX_FAILED=$file"; exit 1; }
          done
          echo "BACKEND_SYNTAX_OK"
