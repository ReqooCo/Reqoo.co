name: REQOO Core Health Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - rebuild/v1-foundation

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Wrangler
        run: npm install --global wrangler@latest

      - name: Start local Pages runtime with remote D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          wrangler pages dev . --d1 DB=reqoo-rebuild --compatibility-date=2026-08-19 --ip=127.0.0.1 --port=8788 > /tmp/reqoo-pages.log 2>&1 &
          echo $! > /tmp/reqoo-pages.pid
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8788/api/health-v1 > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/reqoo-pages.log || true
          test -s /tmp/health.json || { echo "Health endpoint did not respond"; exit 1; }
          cat /tmp/health.json

      - name: Assert core health
        run: |
          set -euo pipefail
          jq -e '.ok == true and .status == "ok" and .db == "connected" and .schema == "ready" and (.trace_id | length > 0)' /tmp/health.json
          echo "REQOO CORE HEALTH VERIFIED: DB binding and schema are ready."

      - name: Stop local runtime
        if: always()
        run: |
          if [ -f /tmp/reqoo-pages.pid ]; then kill "$(cat /tmp/reqoo-pages.pid)" || true; fi
