name: PKSK Bahasa Melayu Batch 004

on:
  push:
    branches:
      - staging/bm004
    paths:
      - 'sim/pksk/curation/B/bm_new_batch_004*.jsonl'
      - 'sim/pksk/curation/B/bm_new_batch_004_manifest.json'
      - 'scripts/validate_pksk_b_bm_new_batch.py'
      - 'scripts/build_pksk_b_strict_authoring_plan_v5.py'
      - 'scripts/build_pksk_b_current_progress_v5.py'
      - '.github/workflows/pksk-bm004.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-bm004:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore validated baseline from BM003 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit-output /tmp/bm003
          gh api repos/ReqooCo/Reqoo.co/actions/artifacts/10437295743/zip > /tmp/bm003.zip
          unzip -q /tmp/bm003.zip -d /tmp/bm003
          cp -a /tmp/bm003/. audit-output/
          test -f audit-output/b_section_strict_source_survivors.jsonl
          test -f audit-output/b_bm_new_batch_001_validated.jsonl
          test -f audit-output/b_bm_new_batch_002_validated.jsonl
          test -f audit-output/b_bm_new_batch_003_validated.jsonl
      - name: Validate Bahasa Melayu new batch 004
        run: python scripts/validate_pksk_b_bm_new_batch.py 4
      - name: Rebuild dynamic strict B authoring plan
        run: python scripts/build_pksk_b_strict_authoring_plan_v5.py
      - name: Rebuild dynamic B progress ledger
        run: python scripts/build_pksk_b_current_progress_v5.py
      - name: Upload BM004 validated workspace
        uses: actions/upload-artifact@v4
        with:
          name: pksk-bm004-workspace
          path: audit-output/
