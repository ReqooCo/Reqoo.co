name: Fix PKSK max devices

on:
  push:
    paths:
      - '.github/workflows/fix-pksk-max-devices.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update PKSK limit
        shell: bash
        run: |
          set -euo pipefail
          file="functions/api/pksk.js"
          grep -F "const MAX_DEVICES = 2;" "$file"
          sed -i "s/const MAX_DEVICES = 2;/const MAX_DEVICES = 3;/" "$file"
          grep -F "const MAX_DEVICES = 3;" "$file"

      - name: Commit change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add functions/api/pksk.js .github/workflows/fix-pksk-max-devices.yml
          git rm .github/workflows/fix-pksk-max-devices.yml
          git commit -m "fix: allow 3 PKSK devices per license"
          git push