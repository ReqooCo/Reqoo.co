name: PKSK Science Batch 004

on:
  push:
    branches:
      - staging/sci004
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  validate-sci004:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore validated baseline from SCI003 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p audit-output /tmp/sci003
          gh api repos/ReqooCo/Reqoo.co/actions/artifacts/10440610683/zip > /tmp/sci003.zip
          unzip -q /tmp/sci003.zip -d /tmp/sci003
          cp -a /tmp/sci003/. audit-output/
          test -f audit-output/b_section_strict_source_survivors.jsonl
          test -f audit-output/b_science_new_batch_001_validated.jsonl
          test -f audit-output/b_science_new_batch_002_validated.jsonl
          test -f audit-output/b_science_new_batch_003_validated.jsonl

      - name: Validate Science new batch 004
        run: python scripts/validate_pksk_b_science_new_batch.py 4

      - name: Rebuild dynamic strict B authoring plan
        run: python scripts/build_pksk_b_strict_authoring_plan_v5.py

      - name: Rebuild dynamic B progress ledger
        run: python scripts/build_pksk_b_current_progress_v5.py

      - name: Upload SCI004 validated workspace
        uses: actions/upload-artifact@v4
        with:
          name: pksk-sci004-workspace
          path: audit-output/
