name: PKSK Live 50-Set Clone Audit

on:
  push:
    branches:
      - audit/pksk-live-50set-clone-v1
    paths:
      - 'scripts/audit_pksk_live_50sets_clone.py'
      - 'scripts/classify_pksk_live_50sets_clone.py'
      - '.github/workflows/pksk-live-50set-clone-audit.yml'
      - 'sim/pksk/simulator/sets/**'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/pksk-live-50set-clone-v1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit cloned live PKSK 50 sets
        run: python scripts/audit_pksk_live_50sets_clone.py
      - name: Classify salvage path
        run: python scripts/classify_pksk_live_50sets_clone.py
      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: pksk-live-50set-clone-audit
          path: audit-output/
