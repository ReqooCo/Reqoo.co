name: PKSK V63 Audit 01-20

on:
  push:
    paths:
      - 'scripts/audit_pksk_1_20_v63.py'
      - 'sim/pksk/simulator/sets/SET 01-10/data/**'
      - 'sim/pksk/simulator/sets/SET 11-20/data/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: V63 audit Sets 01-20
        run: python3 scripts/audit_pksk_1_20_v63.py
