<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1830"><title>PKSK Referral V2 — Reqoo</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#14243d;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}header{height:64px;background:#fff;border-bottom:1px solid #dce3ec;display:flex;align-items:center;padding:0 18px}.brand{text-decoration:none;color:#0b1830;font-weight:900}.brand b{display:inline-grid;place-items:center;width:30px;height:30px;background:#0b1830;color:#fff;border-radius:8px;margin-right:8px}main{max-width:700px;margin:auto;padding:28px 16px}.card{background:#fff;border:1px solid #dce3ec;border-radius:18px;padding:24px;box-shadow:0 15px 40px rgba(20,36,61,.06)}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:900;color:#55708f}h1{font-size:32px;line-height:1.05;margin:9px 0}p{color:#6b788b;font-size:13px;line-height:1.55}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-top:12px}.full{grid-column:1/-1}label{display:block;font-size:10px;font-weight:850;color:#6b788b;margin-bottom:6px}input{width:100%;height:45px;border:1px solid #dce3ec;border-radius:10px;padding:0 11px;font:inherit}.btn{width:100%;height:46px;margin-top:15px;border:0;border-radius:10px;background:#0b1830;color:#fff;font-weight:900}.btn:disabled{opacity:.55}.result{margin-top:15px;padding:16px;border-radius:13px;background:#edf8f1;border:1px solid #cce8d7}.error{margin-top:15px;padding:14px;border-radius:13px;background:#fff1f2;border:1px solid #fecdd3;color:#9f1239}.code{font-size:24px;font-weight:950;letter-spacing:.08em;margin:8px 0}.link{word-break:break-all;font-size:12px;background:#f7f9fc;padding:10px;border-radius:8px}.hidden{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.card{padding:18px}}</style></head><body><header><a class="brand" href="../"><b>R</b> REQOO <span>/ PKSK REFERRAL V2</span></a></header><main><section class="card"><div class="eyebrow">PKSK 50 • REFERRAL V2</div><h1>Ajak orang, dapat komisen.</h1><p>Daftar referral melalui laluan V2. Link yang dijana akan terus membawa pembeli ke <b>Payment V2</b>, termasuk referral code secara automatik.</p><div class="grid"><div class="field"><label>NAMA PENUH</label><input id="name" autocomplete="name"></div><div class="field"><label>WHATSAPP</label><input id="whatsapp" inputmode="tel" autocomplete="tel"></div><div class="field full"><label>NAMA BANK</label><input id="bank" placeholder="Maybank / CIMB / Bank Islam"></div><div class="field full"><label>NO AKAUN</label><input id="account" inputmode="numeric"></div></div><button id="submit" class="btn">DAFTAR REFERRAL V2</button><div id="msg"></div><div id="result" class="result hidden"></div></section></main><script>
const API='/api/referral',$=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function link(code){return location.origin+'/pksk/payment-v2/?ref='+encodeURIComponent(code)}
$('submit').onclick=async()=>{const name=$('name').value.trim(),whatsapp=$('whatsapp').value.trim(),bank=$('bank').value.trim(),account=$('account').value.trim();if(!name||!whatsapp||!bank||!account){$('msg').innerHTML='<div class="error">Lengkapkan semua maklumat.</div>';return}$('submit').disabled=true;$('submit').textContent='Mendaftar…';$('msg').textContent='';try{const r=await fetch(API,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'registerReferral',name,whatsapp,bank,account})}).then(x=>x.json());if(!r.ok)throw Error(r.error||'Pendaftaran gagal.');const url=link(r.referralCode);$('result').classList.remove('hidden');$('result').innerHTML='<b>✅ Referral V2 berjaya didaftarkan</b><div class="code">'+esc(r.referralCode)+'</div><p>Komisen semasa: <b>RM'+Number(r.commission||5).toFixed(2)+'</b> setiap pembelian yang layak.</p><p>Link anda:</p><div class="link">'+esc(url)+'</div><button class="btn" id="copy">SALIN LINK PAYMENT V2</button>';$('copy').onclick=()=>navigator.clipboard.writeText(url).then(()=>$('copy').textContent='✓ LINK DISALIN');$('name').value='';$('whatsapp').value='';$('bank').value='';$('account').value=''}catch(e){$('msg').innerHTML='<div class="error">'+esc(e.message||'Sambungan terganggu. Cuba lagi.')+'</div>'}finally{$('submit').disabled=false;$('submit').textContent='DAFTAR REFERRAL V2'}};
</script></body></html>
