<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO · PKSK Set Diagnostic</title><link rel="stylesheet" href="exam.css"><style>body{background:#090807;color:#eee;font-family:Inter,system-ui,sans-serif}.diag{max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #352b1c;padding-bottom:18px}.brand{font-weight:800;letter-spacing:.16em;color:#e4bd6b}.sub{color:#928a7d;font-size:13px}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}.stat{padding:20px;border:1px solid #3b301e;border-radius:18px;background:#100e0a}.stat b{display:block;font-size:32px;color:#e4bd6b;margin-top:5px}.list{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.row{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border:1px solid #30291e;border-radius:15px;background:#0e0c09}.row.ok{border-color:#4d432d}.row.fail{border-color:#673737}.left{display:flex;gap:14px;align-items:center}.badge{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#19150d;color:#e4bd6b;font-size:11px}.msg{color:#a29a8b;font-size:12px}.actions{margin-top:20px;display:flex;gap:10px}.btn{display:inline-block;padding:12px 18px;border:1px solid #564525;border-radius:12px;color:#e4bd6b;text-decoration:none;background:#151109}.run{cursor:pointer}.loading{color:#c9b487}@media(max-width:650px){.summary{grid-template-columns:repeat(2,1fr)}.list{grid-template-columns:1fr}.diag{padding:14px}}</style></head><body><main class="diag"><header class="top"><div><div class="brand">REQOO</div><div class="sub">PKSK SET DIAGNOSTIC · 01—50</div></div><button id="run" class="btn run">RUN TEST</button></header><section id="summary" class="summary"></section><section id="list" class="list"><div class="loading">Tekan RUN TEST untuk semak semua set.</div></section><div class="actions"><a class="btn" href="dashboard.html">← Dashboard</a><a class="btn" href="index.html">Simulator</a></div></main><script>const pad=n=>String(n).padStart(2,'0');const path=n=>`sets/${n<=10?'SET 01-10':n<=20?'SET 11-20':n<=30?'SET 21-30':n<=40?'SET 31-40':'SET 41-50'}/data/set${pad(n)}.json`;async function run(){const list=document.querySelector('#list'),sum=document.querySelector('#summary');list.innerHTML='';let ok=0,fail=0,total=0;for(let n=1;n<=50;n++){const row=document.createElement('div');row.className='row';try{const r=await fetch(path(n),{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();const q=Array.isArray(d.questions)?d.questions:[];if(!q.length)throw new Error('Tiada questions');ok++;total+=q.length;row.classList.add('ok');row.innerHTML=`<div class="left"><span class="badge">✓</span><div><strong>SET ${pad(n)}</strong><div class="msg">${q.length} soalan · JSON valid</div></div></div><span class="msg">READY</span>`}catch(e){fail++;row.classList.add('fail');row.innerHTML=`<div class="left"><span class="badge">!</span><div><strong>SET ${pad(n)}</strong><div class="msg">${e.message}</div></div></div><span class="msg">FAIL</span>`}list.appendChild(row)}sum.innerHTML=`<div class="stat"><span class="sub">PASS</span><b>${ok}</b></div><div class="stat"><span class="sub">FAIL</span><b>${fail}</b></div><div class="stat"><span class="sub">JUMLAH SOALAN</span><b>${total}</b></div><div class="stat"><span class="sub">STATUS</span><b>${fail?'CHECK':'READY'}</b></div>`}document.querySelector('#run').onclick=run;</script></body></html>
