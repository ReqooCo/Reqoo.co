<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — PKSK V2</title><link rel="stylesheet" href="../style.css"></head><body><header class="top"><a class="brand" href="../">REQOO <span>PKSK V2</span></a><button id="logout" class="btn ghost">Keluar</button></header><main class="hero"><div><p class="eyebrow">DASHBOARD</p><h1>Pilih <b>set</b> latihan.</h1><p class="lead">V2 menggunakan set JSON sedia ada sebagai data read-only. Simulator baharu membaca Set 01–50 mengikut kumpulan folder asal.</p><div id="sets" class="grid" style="padding:0;margin:28px 0 0;grid-template-columns:repeat(5,1fr)"></div></div><div class="card"><strong>Akses</strong><p id="status" style="color:var(--muted)"></p><input id="code" placeholder="Masukkan kod akses" style="width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:#091321;color:#fff"><button id="save" class="btn primary" style="margin-top:12px;width:100%">Simpan Akses</button><p style="color:var(--muted);font-size:13px">Kod demo tempatan untuk ujian V2: <b>V2-DEMO</b></p></div></main><script>const K='reqoo_pksk_v2_license';const $=id=>document.getElementById(id);function render(){const code=localStorage.getItem(K)||'';$('code').value=code;$('status').textContent=code?`Akses aktif: ${code}`:'Belum ada akses';const box=$('sets');box.innerHTML=Array.from({length:50},(_,i)=>{const n=i+1;return `<a class="btn ghost" style="padding:12px 5px" href="../simulator/?set=${n}">SET ${String(n).padStart(2,'0')}</a>`}).join('')} $('save').onclick=()=>{const v=$('code').value.trim().toUpperCase();if(!v)return alert('Masukkan kod akses.');localStorage.setItem(K,v);render()};$('logout').onclick=()=>{localStorage.removeItem(K);render()};render();</script></body></html>
