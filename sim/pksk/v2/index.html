<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PKSK Simulator — REQOO</title><meta name="description" content="PKSK Computer Based Test Simulator"><link rel="stylesheet" href="style.css"></head><body><header><strong>REQOO PKSK</strong><span id="timer">--:--</span></header><main><section id="start" class="card"><span class="eyebrow">PKSK SIMULATOR</span><h1>Latihan PKSK</h1><p>Simulasi ujian komputer dengan 100 soalan.</p><label>Nama calon<input id="candidate" autocomplete="name" placeholder="Nama penuh"></label><button id="startBtn">Mula Ujian</button></section><section id="exam" hidden><div class="layout"><aside class="card navigator"><b>Navigasi Soalan</b><div id="nav"></div><button id="submitBtn" class="danger">Hantar Ujian</button></aside><article class="card question"><div class="meta"><span id="section">Bahagian A</span><span id="progress">1 / 100</span></div><h2 id="qText">Soalan</h2><div id="choices"></div><div class="actions"><button id="prevBtn">← Sebelum</button><button id="flagBtn">⚑ Tandakan</button><button id="nextBtn">Seterusnya →</button></div></article></div></section><section id="result" class="card" hidden><span class="eyebrow">KEPUTUSAN</span><h1 id="score">0 / 100</h1><div id="breakdown"></div><button id="reviewBtn">Semak Jawapan</button><button id="restartBtn">Kembali</button></section><section id="review" class="card" hidden><div class="meta"><span>Semakan</span><span id="reviewProgress">1 / 100</span></div><h2 id="reviewQuestion"></h2><p id="reviewAnswer"></p><p id="reviewCorrect"></p><p id="reviewExplain"></p><div class="actions"><button id="reviewPrev">← Sebelum</button><button id="reviewNext">Seterusnya →</button></div></section></main><script src="app.js"></script></body></html>
