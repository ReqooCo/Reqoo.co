<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1830"><title>Jadi Referral PKSK — Reqoo</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#14243d;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}header{height:64px;background:#fff;border-bottom:1px solid #dce3ec;display:flex;align-items:center;padding:0 18px}.brand{text-decoration:none;color:#0b1830;font-weight:850}.brand b{display:inline-grid;place-items:center;width:30px;height:30px;background:#0b1830;color:#fff;border-radius:8px;margin-right:8px}main{max-width:700px;margin:auto;padding:28px 16px}.card{background:#fff;border:1px solid #dce3ec;border-radius:18px;padding:24px}.eyebrow{font-size:10px;letter-spacing:.14em;font-weight:900;color:#55708f}h1{font-size:32px;line-height:1.05;margin:9px 0}p{color:#6b788b;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-top:12px}.field.full{grid-column:1/-1}label{display:block;font-size:10px;font-weight:850;color:#6b788b;margin-bottom:6px}input{width:100%;height:45px;border:1px solid #dce3ec;border-radius:10px;padding:0 11px;font:inherit}.btn{width:100%;height:46px;margin-top:15px;border:0;border-radius:10px;background:#0b1830;color:#fff;font-weight:900}.result{margin-top:15px;padding:16px;border-radius:13px;background:#edf8f1;border:1px solid #cce8d7}.code{font-size:24px;font-weight:950;letter-spacing:.08em;margin:8px 0}.link{word-break:break-all;font-size:12px}.hidden{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.card{padding:18px}}
</style></head><body><header><a class="brand" href="../"><b>R</b> REQOO <span>/ PKSK REFERRAL</span></a></header><main><section class="card"><div class="eyebrow">PKSK 50 • REFERRAL</div><h1>Ajak orang, dapat komisen.</h1><p>Daftar referral untuk dapatkan link sendiri. Setiap pembelian PKSK yang disahkan melalui link anda akan dikira mengikut kadar komisen semasa.</p><div class="grid"><div class="field"><label>NAMA PENUH</label><input id="name" autocomplete="name"></div><div class="field"><label>WHATSAPP</label><input id="whatsapp" inputmode="tel" autocomplete="tel"></div><div class="field full"><label>NAMA BANK</label><input id="bank" placeholder="Maybank / CIMB / Bank Islam"></div><div class="field full"><label>NO AKAUN</label><input id="account" inputmode="numeric"></div></div><button id="submit" class="btn">DAFTAR REFERRAL</button><div id="msg"></div><div id="result" class="result hidden"></div></section></main><script>
const API_URL="/api/pksk";
const $=id=>document.getElementById(id);
function makeCode(name){const b=(name||"REF").toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,5)||"REF";return b+Math.floor(1000+Math.random()*9000)}
function jsonp(action,data){return new Promise((resolve,reject)=>{const cb="ref_"+Date.now()+"_"+Math.floor(Math.random()*99999),s=document.createElement("script");let done=false,t=setTimeout(()=>finish(null,new Error("Timeout")),11000);function finish(r,e){if(done)return;done=true;clearTimeout(t);delete window[cb];s.remove();e?reject(e):resolve(r)}window[cb]=r=>finish(r);s.onerror=()=>finish(null,new Error("Connection gagal"));s.src=API_URL+"?"+new URLSearchParams({action,callback:cb,...data});document.body.appendChild(s)})}
$("submit").onclick=async()=>{
 const name=$("name").value.trim(),whatsapp=$("whatsapp").value.trim(),bank=$("bank").value.trim(),account=$("account").value.trim();
 if(!name||!whatsapp||!bank||!account){$("msg").textContent="Lengkapkan semua maklumat.";return}
 const code=makeCode(name);$("submit").disabled=true;$("msg").textContent="Mendaftar…";
 try{
  await fetch(API_URL,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({action:"registerReferral",name,whatsapp,bank,account,referralCode:code})});
  let ok=false;
  for(let i=0;i<4&&!ok;i++){try{const r=await jsonp("validateReferral",{ref:code});ok=!!r.ok}catch(e){}if(!ok)await new Promise(r=>setTimeout(r,800))}
  if(!ok){$("submit").disabled=false;$("msg").textContent="Server belum mengesahkan pendaftaran. Jangan hantar berkali-kali; cuba semula selepas beberapa saat.";return}
  const link=location.origin+"/pksk/?ref="+encodeURIComponent(code);
  $("result").classList.remove("hidden");$("result").innerHTML="<b>✅ Referral berjaya didaftarkan</b><div class='code'>"+code+"</div><p>Link anda:</p><div class='link'>"+link+"</div><button class='btn' onclick='navigator.clipboard.writeText("+JSON.stringify(link)+").then(()=>this.textContent=\"✓ LINK DISALIN\")'>SALIN LINK</button>";
  $("msg").textContent="";
 }catch(e){$("submit").disabled=false;$("msg").textContent="Sambungan terganggu. Cuba lagi."}
}
</script></body></html>
