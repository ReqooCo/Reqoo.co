<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reqoo PKSK Simulator</title><style>body{font-family:system-ui;margin:0;background:#f6f6f6;color:#111}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:24px;margin:16px 0}a{display:inline-block;padding:12px 18px;background:#111;color:#fff;border-radius:10px;text-decoration:none;margin:6px 6px 0 0}</style></head><body><div class="wrap"><div class="card"><b>REQOO • SIM</b><h1>PKSK Simulator</h1><p>Set 01–50</p><div id="sets"></div></div></div><script>const root=document.getElementById('sets');for(let i=1;i<=50;i++){const a=document.createElement('a');a.href='sets/SET '+(i<=10?'01-10':i<=20?'11-20':i<=30?'21-30':i<=40?'31-40':'41-50')+'/SET '+String(i).padStart(2,'0')+'.json';a.textContent='Set '+String(i).padStart(2,'0');root.appendChild(a)}</script></body></html>
