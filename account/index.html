<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akaun & Order · REQOO.CO</title><link rel="stylesheet" href="../shared/reqoo.css"><style>.page{max-width:760px;margin:auto;padding:35px 0 80px}.card{border:1px solid var(--rq-line);background:var(--rq-panel);border-radius:16px;padding:22px}.form{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:18px}.form input{min-width:0;padding:13px;border:1px solid var(--rq-line);border-radius:9px;background:#09090b;color:#fff}.muted{color:var(--rq-muted);font-size:11px;line-height:1.6}.error{margin-top:12px;padding:10px;border:1px solid #6b3e3e;background:#1a1111;color:#ffb7b7;border-radius:9px;font-size:10px;display:none}@media(max-width:600px){.form{grid-template-columns:1fr}}</style></head><body><header class="rq-header"><div class="rq-shell"><div class="rq-header-main"><a class="rq-brand" href="../"><span class="rq-brand-mark">R</span><span>REQOO.CO</span></a><a class="rq-action" href="../cart/">🛒 Troli</a></div><nav class="rq-nav"><a href="../shop/">Shop</a><a href="../custom/">Custom Made</a><a class="active" href="./">Order</a></nav></div></header><main class="page"><div class="rq-eyebrow">REQOO.CO · ORDER</div><h1>Semak pesanan anda</h1><p class="muted">Masukkan Order ID daripada halaman confirmation untuk melihat status pesanan, bayaran dan invoice.</p><section class="card"><form id="form" class="form"><input id="id" required placeholder="Contoh: Order ID"><button class="rq-btn gold" type="submit">Semak Order →</button></form><div id="error" class="error"></div></section></main><script>const form=document.querySelector('#form'),input=document.querySelector('#id'),error=document.querySelector('#error');form.onsubmit=e=>{e.preventDefault();const id=input.value.trim();if(!id)return;error.style.display='none';location.href=`../order/?id=${encodeURIComponent(id)}`}</script></body></html>
