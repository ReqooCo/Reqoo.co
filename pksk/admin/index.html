<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1830"><title>PKSK Admin — Reqoo</title><link rel="stylesheet" href="./style.css"></head>
<body>
<header><a href="../" class="brand"><b>R</b> REQOO <span>/ PKSK ADMIN</span></a><button id="refresh">Muat Semula</button></header>
<main>
<section id="login" class="card login"><div class="eyebrow">PKSK ADMIN</div><h1>Semakan pembayaran</h1><p>Masukkan token admin PKSK.</p><input id="token" type="password" placeholder="Token"><button id="loginBtn">MASUK</button><div id="loginMsg"></div></section>
<section id="app" hidden>
<div class="stats"><div><span>Jumlah Order</span><b id="total">0</b></div><div><span>Menunggu</span><b id="pending">0</b></div><div><span>Disahkan</span><b id="paid">0</b></div><div><span>License Aktif</span><b id="active">0</b></div></div>
<div class="toolbar"><input id="search" placeholder="Cari order / nama / WhatsApp"><select id="filter"><option>Semua</option><option>PENDING</option><option>PAID</option><option>REJECTED</option></select></div>
<div id="rows" class="list"></div>
</section>
</main>
<div id="modal" class="modal" hidden style="display:none"><div class="modalbox"><button class="close" id="close">×</button><div id="detail"></div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwVFg5bxd2EsbLxUe2CsVHqRE-yVNraIJBSx8_pDsrGvrtTUiVdJwVdJwhJbbacxpci/exec";
const $=id=>document.getElementById(id);
const loginBox=$("login"), appBox=$("app"), tokenInput=$("token"), loginBtn=$("loginBtn"), loginMsg=$("loginMsg");
const refreshBtn=$("refresh"), searchInput=$("search"), filterSelect=$("filter"), rowsBox=$("rows"), totalBox=$("total"), pendingBox=$("pending"), paidBox=$("paid"), activeBox=$("active");
const modalBox=$("modal"), detailBox=$("detail"), closeBtn=$("close");
let TOKEN="",ORDERS=[];

const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));

function api(action,extra,done){
  const cb="pkskAdminCb_"+Date.now()+"_"+Math.random().toString(36).slice(2);
  window[cb]=function(result){
    try{delete window[cb];}catch(e){}
    script.remove();
    done(result);
  };
  const params=new URLSearchParams({action,callback:cb,token:TOKEN,...extra});
  const script=document.createElement("script");
  script.src=API_URL+"?"+params.toString();
  script.onerror=function(){
    try{delete window[cb];}catch(e){}
    script.remove();
    done({ok:false,error:"Sambungan API gagal."});
  };
  document.body.appendChild(script);
}

function render(){
 const q=searchInput.value.trim().toLowerCase(),f=filterSelect.value;
 const arr=ORDERS.filter(o=>(f==="Semua"||o.status===f)&&(!q||[o.orderNo,o.name,o.phone].join(" ").toLowerCase().includes(q)));
 totalBox.textContent=ORDERS.length;
 pendingBox.textContent=ORDERS.filter(x=>x.status==="PENDING").length;
 paidBox.textContent=ORDERS.filter(x=>x.status==="PAID").length;
 activeBox.textContent=ORDERS.filter(x=>x.licenseStatus==="ACTIVE").length;
 rowsBox.innerHTML=arr.length?arr.map(o=>`<button class="row" data-i="${ORDERS.indexOf(o)}"><b>${esc(o.orderNo)}</b><span>${esc(o.name)}</span><span>${esc(o.phone)}</span><strong>RM${Number(o.amount||29).toFixed(2)}</strong><em class="${o.status}">${esc(o.status)}</em></button>`).join(""):'<div class="empty">Tiada order.</div>';
}

function load(done){
 api("listPKSKOrders",{},function(j){
   if(!j.ok){ if(done)done(j); return; }
   ORDERS=j.orders||[];
   render();
   if(done)done(j);
 });
}

loginBtn.addEventListener("click",function(){
 TOKEN=tokenInput.value.trim();
 if(!TOKEN){loginMsg.textContent="Token diperlukan.";return;}
 loginMsg.textContent="Menyemak...";
 load(function(j){
   if(!j.ok){loginMsg.textContent=j.error||"Gagal masuk.";return;}
   loginBox.hidden=true;
   appBox.hidden=false;
   loginMsg.textContent="";
 });
});

refreshBtn.addEventListener("click",function(){load(function(j){if(!j.ok)alert(j.error||"Gagal memuatkan order.");})});
searchInput.addEventListener("input",render);
filterSelect.addEventListener("change",render);
closeBtn.addEventListener("click",function(){modalBox.hidden=true;modalBox.style.display="none";});

rowsBox.addEventListener("click",function(e){
 const button=e.target.closest(".row"); if(!button)return;
 const o=ORDERS[Number(button.dataset.i)];
 if(!o)return;
 detailBox.innerHTML=`<div class="eyebrow">ORDER PKSK</div><h2>${esc(o.orderNo)}</h2>
 <p><b>Nama:</b> ${esc(o.name)}</p>
 <p><b>WhatsApp:</b> ${esc(o.phone)}</p>
 <p><b>Jumlah:</b> RM${Number(o.amount||29).toFixed(2)}</p>
 <p><b>Rujukan:</b> ${esc(o.ref||"-")}</p>
 <p><b>Status:</b> ${esc(o.status)}</p>
 <div class="actions"><button id="verifySendBtn">✓ SAHKAN & HANTAR WHATSAPP</button><button class="reject" id="rejectBtn">TOLAK</button></div>
 <div id="license"></div>`;
 modalBox.hidden=false;modalBox.style.display="grid";
 $("verifySendBtn").addEventListener("click",function(){verifyAndWhatsApp(o);});
 $("rejectBtn").addEventListener("click",function(){rejectOrder(o.orderNo);});
});

function verifyAndWhatsApp(o){
  if(!confirm("Sahkan bayaran RM"+Number(o.amount||29).toFixed(2)+" dan buka WhatsApp untuk customer ini?")) return;

  const btn=$("verifySendBtn");
  btn.disabled=true;
  btn.textContent="MEMPROSES...";

  api("verifyPKSKOrder",{orderNo:o.orderNo},function(j){
    if(!j.ok){
      btn.disabled=false;
      btn.textContent="✓ SAHKAN & HANTAR WHATSAPP";
      alert(j.error||"Gagal sahkan bayaran.");
      return;
    }

    const code=j.accessCode;
    const accessUrl="https://reqoo.co/pksk/access/";
    const phone=String(o.phone||"").replace(/\D/g,"");
    const waPhone=phone.startsWith("0")?"60"+phone:phone;

    const text=
      "✅ Pembayaran PKSK telah disahkan.\n\n"+
      "🔐 Access Code: "+code+"\n\n"+
      "🎯 Akses simulasi:\n"+accessUrl+"\n\n"+
      "Masukkan Access Code tersebut untuk mula menggunakan simulasi PKSK.\n\n"+
      "Terima kasih kerana memilih REQOO.";

    localStorage.setItem("pksk_last_whatsapp_order",o.orderNo);

    $("license").innerHTML=
      '<div class="license"><b>ACCESS CODE</b><strong>'+esc(code)+'</strong>'+
      '<small>WhatsApp dibuka. Tekan Send untuk hantar kepada customer.</small></div>';

    btn.textContent="✓ DISAHKAN";
    btn.disabled=true;

    window.location.href="https://wa.me/"+waPhone+"?text="+encodeURIComponent(text);
  });
}

function rejectOrder(orderNo){
 if(!confirm("Tolak pembayaran ini?"))return;
 api("rejectPKSKOrder",{orderNo},function(j){
   if(!j.ok){alert(j.error||"Gagal.");return;}
   modalBox.hidden=true;
   load();
 });
}
</script></body></html>
