<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0a08"><title>REQOO · PKSK Dashboard</title><link rel="stylesheet" href="exam.css?v=dashboard-3"><link rel="stylesheet" href="dashboard.css?v=3"></head><body><main class="dashboard-shell"><header class="exam-top"><div class="brand"><span class="brand-mark">R</span><span>REQOO</span><small>PKSK DASHBOARD</small></div><a class="gold-btn" href="index.html">Simulator</a></header><section class="dash-hero"><div><div class="eyebrow">PROGRESS LATIHAN</div><h1>Jejak semua<br><em>50 set.</em></h1><p>Semua kemajuan disimpan pada peranti ini. Sambung set yang belum selesai atau ulang set yang telah selesai.</p></div><div class="dash-stats" id="stats"></div></section><section class="dash-panel"><div class="dash-heading"><div><div class="eyebrow">SET 01 — 50</div><h2>Progress Set</h2></div><button id="reset" class="outline-btn">Reset Semua</button></div><div id="sets" class="dashboard-grid"></div></section></main><script>const key='reqoo_pksk_results';const p=JSON.parse(localStorage.getItem(key)||'{}');const pad=n=>String(n).padStart(2,'0');const vals=Object.values(p);const done=vals.filter(x=>x?.status==='completed').length;const active=vals.filter(x=>x?.status==='in-progress').length;document.getElementById('stats').innerHTML=`<div><span>Selesai</span><b>${done}</b><small>/ 50 set</small></div><div><span>Sedang berjalan</span><b>${active}</b></div><div><span>Belum mula</span><b>${50-done-active}</b></div>`;const root=document.getElementById('sets');for(let i=1;i<=50;i++){const x=p[i]||{};const cls=x.status||'new';const label=cls==='completed'?'SELESAI':cls==='in-progress'?'SAMBUNG':'MULA';root.insertAdjacentHTML('beforeend',`<a class="dash-set ${cls}" href="index.html?set=${i}"><span>SET ${pad(i)}</span><strong>${label}</strong><small>${x.score!=null?'Skor '+x.score:'Belum ada percubaan'}</small><i>${cls==='completed'?'✓':cls==='in-progress'?'→':'+'}</i></a>`)}document.getElementById('reset').onclick=()=>{if(confirm('Padam semua progress?')){localStorage.removeItem(key);location.reload()}};</script></body></html>
