<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"><style>
.payment-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}.pay-card{border:1px solid var(--rq-line);border-radius:14px;padding:16px;background:var(--rq-panel);cursor:pointer;transition:.15s}.pay-card.active{border-color:#dfc46f;box-shadow:0 0 0 1px #dfc46f inset}.pay-card input{display:none}.pay-title{font-weight:800;font-size:15px}.pay-sub{color:var(--rq-muted);font-size:12px;line-height:1.5;margin-top:5px}.qr-panel{display:none;margin-top:14px;padding:16px;border:1px solid #dfc46f;border-radius:14px;background:#111115}.qr-panel.show{display:block}.qr-box{min-height:220px;border:1px dashed #555;border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:16px;color:var(--rq-muted)}.qr-box img{display:block;max-width:280px;width:100%;height:auto;border-radius:10px;background:#fff}.pay-note{margin-top:10px;font-size:12px;color:var(--rq-muted);line-height:1.55}.qr-action{margin-top:14px;width:100%;padding:13px 16px;border:0;border-radius:10px;background:#171717;color:#dfc46f;font-weight:800;cursor:pointer}.qr-action:disabled{opacity:.55;cursor:not-allowed}@media(max-width:620px){.payment-choice{grid-template-columns:1fr}}
</style></head>
<body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../shop/">Shop</a></div></nav><main><div class="rq-kicker">Order</div><section class="rq-hero"><h1>Pesanan diterima</h1><p id="intro">Memuatkan pesanan…</p></section><div id="detail" class="rq-panel"></div></main></div>
<script type="module">
const API='https://api.reqoo.co';
const id=new URLSearchParams(location.search).get('id');
const detail=document.querySelector('#detail'),intro=document.querySelector('#intro');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>`RM${(Number(v||0)/100).toFixed(2)}`;
// Admin boleh letak QR AB Art sebenar di lokasi ini. Jangan guna QR Billplz di sini.
const QR_IMAGE='../shared/qr-ab-art.png';
function paymentPanel(status,paymentMethod){
  if(status==='paid') return '<div style="margin-top:24px;padding:14px;border:1px solid #b8d8bf;border-radius:10px;background:#f1faf3"><strong>✓ Bayaran berjaya</strong><div style="margin-top:5px;color:#667">Pesanan anda sedang diproses.</div></div>';
  const billActive=paymentMethod==='billplz' || !paymentMethod;
  const qrActive=paymentMethod==='qr';
  return `<div style="margin-top:24px"><strong>Pilih kaedah pembayaran</strong><div class="payment-choice">
    <label class="pay-card ${billActive?'active':''}" data-method="billplz"><input type="radio" name="payment" value="billplz" ${billActive?'checked':''}><div class="pay-title">Billplz</div><div class="pay-sub">Bayaran automatik. Status order dikemas kini melalui callback.</div></label>
    <label class="pay-card ${qrActive?'active':''}" data-method="qr"><input type="radio" name="payment" value="qr" ${qrActive?'checked':''}><div class="pay-title">QR AB Art</div><div class="pay-sub">Bayar terus melalui DuitNow QR dan tunggu pengesahan admin.</div></label>
  </div>
  <div id="bill-section" style="display:${billActive?'block':'none'}"><button id="pay" type="button" style="margin-top:14px;width:100%;padding:14px 18px;border:0;border-radius:10px;background:#171717;color:#dfc46f;font-weight:800;font-size:14px;cursor:pointer">Bayar dengan Billplz</button><p id="paymsg" style="margin:10px 0 0;color:#777;font-size:12px">Anda akan dibawa ke halaman pembayaran Billplz.</p></div>
  <div id="qr-section" class="qr-panel ${qrActive?'show':''}"><div style="font-weight:800;margin-bottom:10px">Bayar terus ke AB Art</div><div class="qr-box"><img src="${QR_IMAGE}" alt="QR pembayaran AB Art" onerror="this.style.display='none';this.parentElement.innerHTML='<div>QR AB Art belum dimasukkan.<br><br>Admin perlu letak fail <b>shared/qr-ab-art.png</b> sebelum pilihan ini diaktifkan.</div>'"></div><div class="pay-note">Sila bayar jumlah tepat <strong>${money(currentTotal)}</strong>. Selepas pembayaran, simpan bukti transaksi. Status QR akan kekal <strong>pending verification</strong> sehingga admin mengesahkannya.</div><button id="qr-paid" class="qr-action" type="button">Saya Dah Bayar QR</button><div id="qrmsg" class="pay-note"></div></div></div>`;
}
let currentTotal=0;
async function startBill(){const button=document.querySelector('#pay'),msg=document.querySelector('#paymsg');if(!button)return;button.disabled=true;button.style.opacity='.65';button.textContent='Menyediakan pembayaran…';msg.textContent='Sila tunggu sebentar.';try{const res=await fetch(`${API}/payments/billplz/create/${encodeURIComponent(id)}`,{method:'POST'});const data=await res.json();if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);if(!data.bill_url)throw new Error('Pautan pembayaran tidak diterima.');location.href=data.bill_url}catch(e){button.disabled=false;button.style.opacity='1';button.textContent='Bayar dengan Billplz';msg.textContent='Pembayaran gagal dimulakan: '+e.message}}
function wirePayment(status){document.querySelectorAll('.pay-card').forEach(card=>card.addEventListener('click',()=>{const method=card.dataset.method;document.querySelectorAll('.pay-card').forEach(x=>x.classList.toggle('active',x===card));const bill=document.querySelector('#bill-section'),qr=document.querySelector('#qr-section');bill.style.display=method==='billplz'?'block':'none';qr.classList.toggle('show',method==='qr');if(method==='billplz')document.querySelector('#pay')?.addEventListener('click',startBill,{once:true});}));document.querySelector('#pay')?.addEventListener('click',startBill,{once:true});document.querySelector('#qr-paid')?.addEventListener('click',()=>{const m=document.querySelector('#qrmsg');m.textContent='Permintaan pengesahan direkodkan pada halaman ini. Admin akan sahkan bayaran QR sebelum order diproses.';document.querySelector('#qr-paid').disabled=true;});}
async function load(){if(!id){intro.textContent='ID pesanan tidak ditemui.';detail.innerHTML='<div class="rq-empty">Sila kembali ke Shop.</div>';return}try{const res=await fetch(`${API}/orders/${encodeURIComponent(id)}`);const data=await res.json();if(!res.ok)throw new Error(data.error||`HTTP ${res.status}`);const o=data.order,c=data.customer;currentTotal=Number(o.total_minor||0);intro.textContent=`No. pesanan: ${o.id}`;const status=String(o.payment_status||'pending');detail.innerHTML=`<div><strong>Pelanggan:</strong> ${esc(c?.name)}</div><div style="margin-top:10px"><strong>Status bayaran:</strong> ${esc(status)}</div><div style="margin-top:10px"><strong>Jumlah:</strong> ${money(o.total_minor)}</div><div style="margin-top:20px"><strong>Item</strong>${(data.items||[]).map(i=>`<div style="display:flex;justify-content:space-between;gap:16px;margin-top:8px"><span>${esc(i.product_name_snapshot)} × ${i.quantity}</span><span>${money(i.line_total_minor)}</span></div>`).join('')}</div>${paymentPanel(status,data.payment?.method||'')}`;wirePayment(status)}catch(e){intro.textContent='Pesanan tidak dapat dimuatkan.';detail.innerHTML='<div class="rq-empty">'+esc(e.message)+'</div>'}}
load();
</script></body></html>
