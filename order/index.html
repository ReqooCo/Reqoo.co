<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0d"><title>Pesanan · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"><style>:root{--gold:#d8b84c;--gold2:#f0d98a;--panel:#121216;--line:#292930;--muted:#9999a3}body{background:radial-gradient(circle at 85% 0,#242015 0,transparent 30%),#09090b}.rq-shell{max-width:1080px;padding:22px 20px 70px}.order-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;padding:38px 0 28px;border-bottom:1px solid var(--line)}.kicker{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:850;text-transform:uppercase}.order-head h1{font-size:clamp(36px,6vw,64px);line-height:.98;letter-spacing:-.045em;margin:10px 0}.order-head p{margin:0;color:var(--muted);font-size:14px}.order-ref{text-align:right}.ref-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#777781}.ref-value{font-size:13px;margin-top:5px;color:#ddd}.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}.step{border:1px solid var(--line);background:#141418;border-radius:12px;padding:12px 14px}.step span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#777781}.step strong{display:block;margin-top:4px;font-size:12px}.step.active{border-color:#6b5a29}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#151519,#101014);border-radius:18px;padding:22px}.card-title{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#8c8c95;font-weight:800;margin-bottom:16px}.customer{font-size:14px;line-height:1.7}.item{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-top:1px solid #25252b}.item:first-child{border-top:0;padding-top:0}.item-name{font-weight:750}.item-sub{font-size:11px;color:#777781;margin-top:4px;line-height:1.5}.item-price{font-weight:800;color:#ddd}.total{display:flex;justify-content:space-between;align-items:end;border-top:1px solid #303037;margin-top:10px;padding-top:16px}.total span{font-size:11px;color:#888891}.total strong{font-size:25px;color:var(--gold2)}.payment-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pay-card{border:1px solid #2b2b31;border-radius:14px;padding:16px;background:#101014;cursor:pointer}.pay-card.active{border-color:#b69735;box-shadow:0 0 0 1px #b69735 inset}.pay-card input{display:none}.pay-number{font-size:10px;color:var(--gold);font-weight:900}.pay-title{font-size:15px;font-weight:850;margin-top:5px}.pay-sub{font-size:11px;color:#888891;line-height:1.5;margin-top:6px}.pay-action{width:100%;border:0;border-radius:11px;padding:14px 16px;background:linear-gradient(135deg,#e3c45d,#c29d31);color:#111;font-weight:900;cursor:pointer;margin-top:14px}.pay-msg{font-size:11px;color:#777781;line-height:1.5;margin:9px 0}.qr-panel{display:none;margin-top:12px;padding:18px;border:1px solid #6a5825;border-radius:16px;background:#111115}.qr-panel.show{display:block}.qr-box{margin:16px auto 0;max-width:310px;padding:18px;background:#fff;border-radius:18px}.qr-box img{display:block;width:100%}.qr-caption{text-align:center;color:#333;font-size:12px;font-weight:800;margin-top:10px}.qr-note{font-size:11px;color:#92929a;line-height:1.6;margin-top:13px}.copy-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.copy-row button,.qr-action{padding:11px;border:1px solid #36363e;border-radius:10px;background:#1b1b20;color:#ddd;font-size:11px;cursor:pointer}.qr-action{width:100%;margin-top:10px;color:var(--gold2)}.notice{padding:13px 15px;border-radius:12px;background:#111116;border:1px solid var(--line);color:#9999a3;font-size:11px;margin-bottom:16px}.success{border-color:#28563e;background:#101a15;color:#9bd9b7}.error{border-color:#653131;color:#e5a5a5}@media(max-width:760px){.layout{grid-template-columns:1fr}.order-head{display:block}.order-ref{text-align:left;margin-top:18px}.payment-choice{grid-template-columns:1fr}}@media(max-width:480px){.rq-shell{padding:14px 13px 50px}.order-head h1{font-size:42px}.copy-row{grid-template-columns:1fr}}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../shop/">Shop</a></div></nav><main><div class="order-head"><div><div class="kicker">Order confirmed</div><h1>Pesanan diterima</h1><p id="intro">Memuatkan pesanan…</p></div><div class="order-ref"><div class="ref-label">Order ID</div><div id="ref" class="ref-value">—</div></div></div><div class="steps"><div class="step active"><span>01 · Order</span><strong>Pesanan direkodkan</strong></div><div class="step active"><span>02 · Payment</span><strong>Pilih cara bayaran</strong></div><div class="step"><span>03 · Verify</span><strong>Menunggu pengesahan</strong></div></div><div id="notice" class="notice">Sila pilih salah satu kaedah pembayaran di bawah.</div><div id="layout" class="layout"></div></main></div><script type="module">const API='https://api.reqoo.co',params=new URLSearchParams(location.search),id=params.get('id'),token=params.get('token')||'',layout=document.querySelector('#layout'),intro=document.querySelector('#intro'),ref=document.querySelector('#ref'),notice=document.querySelector('#notice');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>`RM${(Number(v||0)/100).toFixed(2)}`;let currentTotal=0;function selection(i){const b=[];try{const v=JSON.parse(i.variation_snapshot_json||'{}');Object.values(v).forEach(x=>x?.label&&x?.value&&b.push(`${x.label}: ${x.value}`))}catch{}try{const a=JSON.parse(i.addons_snapshot_json||'[]');(Array.isArray(a)?a:[]).forEach(x=>{const s=(x.values||[]).map(y=>y.label).filter(Boolean).join(', ');if(s)b.push(`${x.label}: ${s}`)})}catch{}try{const c=JSON.parse(i.customization_snapshot_json||'{}');Object.values(c).forEach(x=>x?.label&&x?.value&&b.push(`${x.label}: ${x.value}`))}catch{}return b.map(esc).join('<br>')}function orderCard(o,c,items){return `<div class="card"><div class="card-title">Ringkasan pesanan</div><div class="customer"><strong>${esc(c?.name)}</strong><br>${esc(c?.phone)}${c?.email?`<br>${esc(c.email)}`:''}</div><div style="height:18px"></div>${items.map(i=>`<div class="item"><div><div class="item-name">${esc(i.product_name_snapshot)} <span style="color:#777">× ${i.quantity}</span></div>${selection(i)?`<div class="item-sub">${selection(i)}</div>`:''}</div><div class="item-price">${money(i.line_total_minor)}</div></div>`).join('')}<div class="total"><span>Jumlah</span><strong>${money(o.total_minor)}</strong></div></div>`}function paymentCard(status,paymentMethod,paymentStatus){if(status==='paid')return `<div class="card"><div class="card-title">Payment</div><div class="notice success">✓ Bayaran disahkan<br><span>Pesanan anda sedang diproses.</span></div></div>`;const qrPending=paymentMethod==='qr'&&paymentStatus==='pending_verification',bill=paymentMethod==='billplz'||!paymentMethod,qr=paymentMethod==='qr';return `<div class="card"><div class="card-title">Pilih kaedah pembayaran</div><div class="payment-choice"><label class="pay-card ${bill?'active':''}" data-method="billplz"><input type="radio" ${bill?'checked':''}><div class="pay-number">01</div><div class="pay-title">Billplz</div><div class="pay-sub">Bayaran automatik & status dikemas kini selepas pembayaran.</div></label><label class="pay-card ${qr?'active':''}" data-method="qr"><input type="radio" ${qr?'checked':''}><div class="pay-number">02</div><div class="pay-title">QR AB Art</div><div class="pay-sub">Bayar terus. Admin akan verify.</div></label></div><div id="bill-section" style="display:${bill?'block':'none'}"><button id="pay" class="pay-action">Teruskan dengan Billplz</button><div id="paymsg" class="pay-msg">Anda akan dibawa ke halaman pembayaran Billplz.</div></div><div id="qr-section" class="qr-panel ${qr?'show':''}"><div><strong>AB Art Trading</strong><div style="font-size:10px;color:#999">Maybank · DuitNow QR</div></div><div class="qr-box"><img src="../shared/qr-ab-art.svg" alt="DuitNow QR AB Art Trading"><div class="qr-caption">AB ART TRADING</div></div><div class="qr-note">Bayar jumlah tepat <strong>${money(currentTotal)}</strong>. Simpan bukti transaksi. Order diproses selepas admin mengesahkan bayaran.</div><div class="copy-row"><button id="copy-amount">Salin ${money(currentTotal)}</button><button id="copy-order">Salin Order ID</button></div><button id="qr-paid" class="qr-action" ${qrPending?'disabled':''}>${qrPending?'Bayaran Ditanda ✓':'Saya Dah Bayar QR'}</button><div id="qrmsg" class="pay-msg">${qrPending?'Bayaran ditanda. Menunggu pengesahan admin.':'Belum ditanda.'}</div></div></div>`}function wire(){document.querySelectorAll('.pay-card').forEach(card=>card.onclick=()=>{const m=card.dataset.method;document.querySelectorAll('.pay-card').forEach(x=>x.classList.toggle('active',x===card));document.querySelector('#bill-section').style.display=m==='billplz'?'block':'none';document.querySelector('#qr-section').classList.toggle('show',m==='qr')});document.querySelector('#pay')?.addEventListener('click',async()=>{const b=document.querySelector('#pay'),m=document.querySelector('#paymsg');b.disabled=true;m.textContent='Menyediakan pembayaran…';try{const r=await fetch(`${API}/payments/billplz/create/${encodeURIComponent(id)}?token=${encodeURIComponent(token)}`,{method:'POST'}),d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);location.href=d.bill_url}catch(e){b.disabled=false;m.textContent=e.message}});document.querySelector('#copy-amount')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText((currentTotal/100).toFixed(2))}catch{}});document.querySelector('#copy-order')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(id)}catch{}});document.querySelector('#qr-paid')?.addEventListener('click',async()=>{const q=document.querySelector('#qr-paid'),m=document.querySelector('#qrmsg');q.disabled=true;q.textContent='Menghantar…';try{const r=await fetch(`${API}/payments/qr/mark-paid/${encodeURIComponent(id)}?token=${encodeURIComponent(token)}`,{method:'POST'}),d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);q.textContent='Bayaran Ditanda ✓';m.textContent='Bayaran ditanda. Menunggu pengesahan admin.'}catch(e){q.disabled=false;q.textContent='Saya Dah Bayar QR';m.textContent='Gagal: '+e.message}})}async function load(){if(!id||!token){notice.className='notice error';notice.textContent='Pautan pesanan tidak lengkap. Sila gunakan pautan asal selepas checkout.';return}try{const r=await fetch(`${API}/orders/${encodeURIComponent(id)}?token=${encodeURIComponent(token)}`),d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);currentTotal=Number(d.order.total_minor||0);const short=id.slice(0,8).toUpperCase();ref.textContent=short+'…';intro.textContent=`Pesanan #${short} telah berjaya direkodkan.`;layout.innerHTML=orderCard(d.order,d.customer,d.items||[])+paymentCard(String(d.order.payment_status||'pending'),d.payment?.method||'',d.payment?.status||'');wire()}catch(e){notice.className='notice error';notice.textContent=e.message;intro.textContent='Pesanan tidak dapat dimuatkan.'}}load();</script></body></html>
