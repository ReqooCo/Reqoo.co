<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0b0d"><title>Pesanan · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"><style>
:root{--gold:#d8b84c;--gold2:#f0d98a;--panel:#121216;--panel2:#17171c;--line:#292930;--muted:#9999a3;--green:#57c98a}
body{background:radial-gradient(circle at 85% 0,#242015 0,transparent 30%),#09090b}.rq-shell{max-width:1080px;padding:22px 20px 70px}.rq-nav{padding-bottom:18px}.rq-brand{font-size:15px}.rq-navlinks a{border-color:#2b2b31;background:#111116;border-radius:12px;padding:9px 14px}
.order-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-end;padding:38px 0 28px;border-bottom:1px solid var(--line)}.kicker{font-size:11px;letter-spacing:.18em;color:var(--gold);font-weight:850;text-transform:uppercase}.order-head h1{font-size:clamp(36px,6vw,64px);line-height:.98;letter-spacing:-.045em;margin:10px 0 10px}.order-head p{margin:0;color:var(--muted);font-size:14px}.order-ref{text-align:right}.ref-label{font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:#777781}.ref-value{font-size:13px;margin-top:5px;color:#ddd}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:22px 0}.step{border:1px solid var(--line);background:rgba(20,20,24,.75);border-radius:12px;padding:12px 14px}.step span{display:block;font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:#777781}.step strong{display:block;margin-top:4px;font-size:12px}.step.active{border-color:#6b5a29;box-shadow:inset 0 0 0 1px #3f351d}.layout{display:grid;grid-template-columns:1.1fr .9fr;gap:18px}.card{border:1px solid var(--line);background:linear-gradient(180deg,#151519,#101014);border-radius:18px;padding:22px;box-shadow:0 18px 50px rgba(0,0,0,.18)}.card-title{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:#8c8c95;font-weight:800;margin-bottom:16px}.customer{font-size:14px;line-height:1.7}.customer strong{color:#fff}.item{display:flex;justify-content:space-between;gap:15px;padding:14px 0;border-top:1px solid #25252b}.item:first-child{border-top:0;padding-top:0}.item-name{font-weight:750}.item-sub{font-size:11px;color:#777781;margin-top:4px}.item-price{font-weight:800;color:#ddd}.total{display:flex;justify-content:space-between;align-items:end;border-top:1px solid #303037;margin-top:10px;padding-top:16px}.total span{font-size:11px;color:#888891}.total strong{font-size:25px;color:var(--gold2)}
.payment-choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pay-card{position:relative;border:1px solid #2b2b31;border-radius:14px;padding:16px;background:#101014;cursor:pointer;transition:.18s}.pay-card:hover{transform:translateY(-1px);border-color:#4b4b54}.pay-card.active{border-color:#b69735;box-shadow:0 0 0 1px #b69735 inset,0 10px 30px rgba(0,0,0,.18)}.pay-card input{display:none}.pay-number{font-size:10px;color:var(--gold);font-weight:900}.pay-title{font-size:15px;font-weight:850;margin-top:5px}.pay-sub{font-size:11px;color:#888891;line-height:1.5;margin-top:6px}.pay-action{width:100%;border:0;border-radius:11px;padding:14px 16px;background:linear-gradient(135deg,#e3c45d,#c29d31);color:#111;font-weight:900;cursor:pointer;margin-top:14px}.pay-action:disabled{opacity:.55;cursor:not-allowed}.pay-msg{font-size:11px;color:#777781;line-height:1.5;margin:9px 0 0}
.qr-panel{display:none;margin-top:12px;padding:18px;border:1px solid #6a5825;border-radius:16px;background:linear-gradient(180deg,#17171a,#0d0d10)}.qr-panel.show{display:block}.qr-head{display:flex;justify-content:space-between;align-items:center;gap:10px}.qr-brand{font-weight:850;font-size:15px}.qr-bank{font-size:10px;color:#999}.qr-box{margin:16px auto 0;max-width:310px;padding:18px;background:#fff;border-radius:18px;box-shadow:0 16px 35px rgba(0,0,0,.35)}.qr-box img{display:block;width:100%;height:auto}.qr-caption{text-align:center;color:#333;font-size:12px;font-weight:800;margin-top:10px}.qr-note{font-size:11px;color:#92929a;line-height:1.6;margin-top:13px}.copy-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}.copy-row button{padding:10px;border:1px solid #36363e;border-radius:10px;background:#1b1b20;color:#ddd;font-size:11px;cursor:pointer}.qr-action{width:100%;margin-top:10px;padding:13px;border:1px solid #6f5b28;border-radius:10px;background:#17171c;color:var(--gold2);font-weight:850;cursor:pointer}.qr-action:disabled{opacity:.55}.qr-status{margin-top:10px;padding:11px;border-radius:10px;background:#111116;color:#888891;font-size:10px;line-height:1.5}
.notice{padding:13px 15px;border-radius:12px;background:#111116;border:1px solid var(--line);color:#9999a3;font-size:11px;margin-bottom:16px}.success{border-color:#28563e;background:#101a15;color:#9bd9b7}.error{border-color:#653131;color:#e5a5a5}
@media(max-width:760px){.layout{grid-template-columns:1fr}.order-head{display:block}.order-ref{text-align:left;margin-top:18px}.payment-choice{grid-template-columns:1fr}.steps{gap:6px}.step{padding:10px}.step strong{font-size:10px}}
@media(max-width:480px){.rq-shell{padding:14px 13px 50px}.order-head{padding-top:28px}.card{padding:17px;border-radius:15px}.copy-row{grid-template-columns:1fr}.order-head h1{font-size:42px}}
</style></head>
<body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../shop/">Shop</a></div></nav><main><div class="order-head"><div><div class="kicker">Order confirmed</div><h1>Pesanan diterima</h1><p id="intro">Memuatkan pesanan…</p></div><div class="order-ref"><div class="ref-label">Order ID</div><div id="ref" class="ref-value">—</div></div></div><div class="steps"><div class="step active"><span>01 · Order</span><strong>Pesanan direkodkan</strong></div><div class="step active"><span>02 · Payment</span><strong>Pilih cara bayaran</strong></div><div class="step"><span>03 · Verify</span><strong>Menunggu pengesahan</strong></div></div><div id="notice" class="notice">Sila pilih salah satu kaedah pembayaran di bawah.</div><div id="layout" class="layout"></div></main></div>
<script type="module">
const API='https://api.reqoo.co';const id=new URLSearchParams(location.search).get('id');const layout=document.querySelector('#layout'),intro=document.querySelector('#intro'),ref=document.querySelector('#ref'),notice=document.querySelector('#notice');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>`RM${(Number(v||0)/100).toFixed(2)}`;const QR_IMAGE='../shared/qr-ab-art.svg';let currentTotal=0;
function paymentCard(status,paymentMethod){if(status==='paid')return `<div class="card"><div class="card-title">Payment</div><div class="notice success">✓ Bayaran berjaya<br><span style="font-size:11px">Pesanan anda sedang diproses.</span></div></div>`;const bill=paymentMethod==='billplz'||!paymentMethod,qr=paymentMethod==='qr';return `<div class="card"><div class="card-title">Pilih kaedah pembayaran</div><div class="payment-choice"><label class="pay-card ${bill?'active':''}" data-method="billplz"><input type="radio" name="payment" ${bill?'checked':''}><div class="pay-number">01</div><div class="pay-title">Billplz</div><div class="pay-sub">Bayaran automatik &amp; status dikemas kini selepas pembayaran.</div></label><label class="pay-card ${qr?'active':''}" data-method="qr"><input type="radio" name="payment" ${qr?'checked':''}><div class="pay-number">02</div><div class="pay-title">QR AB Art</div><div class="pay-sub">Bayar terus ke akaun AB Art. Admin akan verify.</div></label></div><div id="bill-section" style="display:${bill?'block':'none'}"><button id="pay" class="pay-action" type="button">Teruskan dengan Billplz</button><div id="paymsg" class="pay-msg">Anda akan dibawa ke halaman pembayaran Billplz.</div></div><div id="qr-section" class="qr-panel ${qr?'show':''}"><div class="qr-head"><div><div class="qr-brand">AB Art Trading</div><div class="qr-bank">Maybank · DuitNow QR</div></div><div style="font-size:18px">↗</div></div><div class="qr-box"><img src="${QR_IMAGE}" alt="DuitNow QR AB Art Trading"><div class="qr-caption">AB ART TRADING</div></div><div class="qr-note">Bayar jumlah tepat <strong>${money(currentTotal)}</strong>. Selepas bayar, simpan bukti transaksi. Order hanya akan diproses selepas admin mengesahkan bayaran.</div><div class="copy-row"><button id="copy-amount" type="button">Salin ${money(currentTotal)}</button><button id="copy-order" type="button">Salin Order ID</button></div><button id="qr-paid" class="qr-action" type="button">Saya Dah Bayar QR</button><div id="qrmsg" class="qr-status">Belum ditanda sebagai telah dibayar.</div></div></div>`}
function orderCard(o,c,items){return `<div class="card"><div class="card-title">Ringkasan pesanan</div><div class="customer"><strong>${esc(c?.name)}</strong><br>${esc(c?.phone)}${c?.email?`<br>${esc(c.email)}`:''}</div><div style="height:18px"></div>${items.map(i=>{let sub='';try{const x=JSON.parse(i.customization_snapshot_json||'{}');sub=[x.material,x.size,x.text].filter(Boolean).map(esc).join(' · ')}catch{}return `<div class="item"><div><div class="item-name">${esc(i.product_name_snapshot)} <span style="color:#777">× ${i.quantity}</span></div>${sub?`<div class="item-sub">${sub}</div>`:''}</div><div class="item-price">${money(i.line_total_minor)}</div></div>`}).join('')}<div class="total"><span>Jumlah</span><strong>${money(o.total_minor)}</strong></div></div>`}
async function startBill(){const b=document.querySelector('#pay'),m=document.querySelector('#paymsg');b.disabled=true;b.textContent='Menyediakan pembayaran…';m.textContent='Sila tunggu sebentar.';try{const r=await fetch(`${API}/payments/billplz/create/${encodeURIComponent(id)}`,{method:'POST'}),d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);if(!d.bill_url)throw new Error('Pautan pembayaran tidak diterima.');location.href=d.bill_url}catch(e){b.disabled=false;b.textContent='Teruskan dengan Billplz';m.textContent='Pembayaran gagal: '+e.message}}
function wire(){document.querySelectorAll('.pay-card').forEach(card=>card.addEventListener('click',()=>{const method=card.dataset.method;document.querySelectorAll('.pay-card').forEach(x=>x.classList.toggle('active',x===card));document.querySelector('#bill-section').style.display=method==='billplz'?'block':'none';document.querySelector('#qr-section').classList.toggle('show',method==='qr')}));document.querySelector('#pay')?.addEventListener('click',startBill);document.querySelector('#copy-amount')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText((Number(currentTotal)/100).toFixed(2));document.querySelector('#copy-amount').textContent='Jumlah disalin ✓'}catch{}});document.querySelector('#copy-order')?.addEventListener('click',async()=>{try{await navigator.clipboard.writeText(id);document.querySelector('#copy-order').textContent='Order ID disalin ✓'}catch{}});const q=document.querySelector('#qr-paid');q?.addEventListener('click',()=>{localStorage.setItem(`reqoo-qr-paid-${id}`,new Date().toISOString());q.disabled=true;q.textContent='Bayaran Ditanda ✓';document.querySelector('#qrmsg').innerHTML='<strong>Bayaran ditanda.</strong><br>Sila simpan bukti transaksi. Status sebenar masih menunggu pengesahan admin.'});if(localStorage.getItem(`reqoo-qr-paid-${id}`)){q.disabled=true;q.textContent='Bayaran Ditanda ✓';document.querySelector('#qrmsg').innerHTML='<strong>Bayaran QR telah ditanda.</strong><br>Menunggu pengesahan admin.'}}
async function load(){if(!id){intro.textContent='ID pesanan tidak ditemui.';layout.innerHTML='<div class="card">Sila kembali ke Shop.</div>';return}try{const r=await fetch(`${API}/orders/${encodeURIComponent(id)}`),d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);const o=d.order,c=d.customer;currentTotal=Number(o.total_minor||0);const short=id.slice(0,8).toUpperCase();ref.textContent=short+'…';intro.textContent=`Pesanan #${short} telah berjaya direkodkan.`;layout.innerHTML=orderCard(o,c,d.items||[])+paymentCard(String(o.payment_status||'pending'),d.payment?.method||'');wire()}catch(e){notice.className='notice error';notice.textContent=e.message;intro.textContent='Pesanan tidak dapat dimuatkan.'}}
load();
</script></body></html>
