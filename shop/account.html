<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO.CO — Akaun</title><style>body{margin:0;background:#070808;color:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.gold{color:#d9b45e}header{border-bottom:1px solid #292929;background:#080909;padding:17px 0}.nav{display:flex;align-items:center;gap:12px}.logo{font-weight:950;letter-spacing:3px;color:#fff;text-decoration:none}.spacer{flex:1}.btn{border:1px solid #333;background:#151616;color:#fff;border-radius:10px;padding:10px 14px;font-weight:850;text-decoration:none;cursor:pointer}.goldBtn{background:linear-gradient(135deg,#d9b45e,#f0cf79);color:#080808;border:0}.hero{padding:45px 0 22px}.muted{color:#8f9192;font-size:12px;line-height:1.6}.hero h1{font-size:clamp(34px,7vw,60px);line-height:.95;margin:8px 0}.card{background:linear-gradient(180deg,#151616,#0d0e0e);border:1px solid #292a2a;border-radius:18px;padding:19px;margin:13px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{display:block;color:#aaa;font-size:10px;font-weight:850;margin:10px 0 6px}input{width:100%;padding:12px;background:#090a0a;border:1px solid #333;border-radius:10px;color:#fff;outline:none;box-sizing:border-box}.row{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.order{border:1px solid #292a2a;border-radius:14px;padding:14px;margin:10px 0}.status{display:inline-block;padding:5px 8px;border-radius:999px;background:#222;color:#e9cc7b;font-size:9px;font-weight:900}.error{color:#ff8b8b;margin-top:10px;font-size:11px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><a class="logo" href="/shop/">REQOO<span class="gold">.CO</span></a><div class="spacer"></div><a class="btn" href="/shop/">← Shop</a></div></header><main class="wrap"><section class="hero"><div class="muted">REQOO.CO ACCOUNT</div><h1>Pesanan anda.<br><span class="gold">Dalam satu tempat.</span></h1><p class="muted">Masukkan No. WhatsApp yang digunakan semasa pembelian untuk semak pesanan.</p></section><div id="auth" class="grid"><section class="card"><h2>Semak Pesanan</h2><label>NO. WHATSAPP</label><input id="loginPhone" inputmode="tel" placeholder="01xxxxxxxx"><button id="lookupBtn" class="btn goldBtn" style="margin-top:14px">Semak Pesanan</button><div id="loginErr" class="error"></div></section><section class="card"><h2>Privasi</h2><p class="muted">Gunakan nombor WhatsApp yang sama seperti ketika checkout. Tiada PIN diperlukan.</p></section></div><section id="account" style="display:none"><div class="card"><div class="row"><div><div class="muted">SELAMAT DATANG</div><h2 id="customerName"></h2><div class="muted" id="customerPhone"></div></div><button id="logoutBtn" class="btn">Log keluar</button></div></div><div class="card"><h2>Pesanan Saya</h2><div id="orders"></div></div></section></main><script>'use strict';const API='/api/shop',money=n=>'RM'+Number(n||0).toFixed(2),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const $=id=>document.getElementById(id);async function lookup(){const btn=$('lookupBtn'),msg=$('loginErr'),phone=$('loginPhone').value.trim();if(!phone){msg.textContent='Masukkan No. WhatsApp.';return}btn.disabled=true;msg.textContent='Menyemak pesanan…';try{const r=await fetch(API+'?action=customerOrders&phone='+encodeURIComponent(phone)+'&_='+Date.now(),{cache:'no-store'}),j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Pesanan tidak dijumpai');sessionStorage.setItem('REQOO_CUSTOMER',JSON.stringify(j));render(j)}catch(e){msg.textContent=e.message}finally{btn.disabled=false}}function render(j){$('auth').style.display='none';$('account').style.display='block';$('customerName').textContent=j.customer?.name||'Pelanggan';$('customerPhone').textContent=j.customer?.phone||'';const list=j.orders||[];$('orders').innerHTML=list.length?list.map(o=>`<div class="order"><div class="row"><b>${esc(o.orderNo||o.order_ref||'—')}</b><span class="status">${esc(o.payment_status||o.fulfillment_status||'pending')}</span></div><p class="muted">${esc(String(o.created_at||'').slice(0,16))}</p><div class="row"><b class="gold">${money(o.total)}</b><span class="muted">Payment: ${esc(o.payment_status||'pending')}</span></div></div>`).join(''):'<p class="muted">Belum ada pesanan.</p>'}function logout(){sessionStorage.removeItem('REQOO_CUSTOMER');location.reload()}$('lookupBtn').onclick=lookup;$('loginPhone').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});$('logoutBtn').onclick=logout;try{const x=JSON.parse(sessionStorage.getItem('REQOO_CUSTOMER')||'null');if(x?.customer)render(x)}catch{}</script></body></html>
