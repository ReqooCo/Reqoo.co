<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO.CO — Akaun</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(100% - 28px,1050px);margin:auto}.gold{color:#d9b45e}header{border-bottom:1px solid #292929;background:#080808;padding:18px 0}.nav{display:flex;align-items:center;gap:12px}.logo{font-weight:950;letter-spacing:4px;text-decoration:none;color:#fff}.spacer{flex:1}.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:900;cursor:pointer;text-decoration:none;display:inline-block;background:#222;color:#fff}.goldbtn{background:linear-gradient(135deg,#d9b45e,#f0cf79);color:#080808}.hero{padding:45px 0 25px}.hero h1{font-size:clamp(34px,7vw,62px);line-height:.95;margin:8px 0}.muted{color:#888}.card{background:linear-gradient(180deg,#151515,#0d0d0d);border:1px solid #292929;border-radius:20px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:#aaa;font-size:11px;margin:12px 0 6px}input,textarea{width:100%;padding:13px;border-radius:11px;border:1px solid #333;background:#090909;color:#fff}.order{border:1px solid #292929;border-radius:16px;padding:16px;margin:12px 0}.status{display:inline-block;padding:6px 9px;border-radius:999px;background:#222;color:#f0cf79;font-size:11px;font-weight:900}.row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.error{color:#ff8585;margin-top:10px}.success{color:#8edb9a;margin-top:10px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><div class="wrap nav"><a class="logo" href="/shop/">R <span class="gold">REQOO.CO</span></a><div class="spacer"></div><a class="btn" href="/shop/">← Shop</a></div></header><main class="wrap"><section class="hero"><div class="muted">REQOO.CO ACCOUNT</div><h1>Pesanan anda.<br><span class="gold">Dalam satu tempat.</span></h1><p class="muted">Daftar menggunakan No. WhatsApp dan PIN 6 digit untuk semak semua pesanan REQOO.CO.</p></section><div id="auth" class="grid"><section class="card"><h2>Log Masuk</h2><label>No. WhatsApp</label><input id="loginPhone" placeholder="01xxxxxxxx"><label>PIN 6 digit</label><input id="loginPin" inputmode="numeric" maxlength="6" type="password"><button class="btn goldbtn" style="margin-top:14px" onclick="login()">Masuk</button><div id="loginErr" class="error"></div></section><section class="card"><h2>Buat Akaun</h2><label>Nama</label><input id="regName" placeholder="Nama penuh"><label>No. WhatsApp</label><input id="regPhone" placeholder="01xxxxxxxx"><label>Alamat</label><textarea id="regAddress" rows="2" placeholder="Alamat penghantaran"></textarea><label>PIN 6 digit</label><input id="regPin" inputmode="numeric" maxlength="6" type="password"><button class="btn goldbtn" style="margin-top:14px" onclick="register()">Daftar Akaun</button><div id="regMsg" class="error"></div></section></div><section id="account" style="display:none"><div class="card"><div class="row"><div><div class="muted">SELAMAT DATANG</div><h2 id="customerName"></h2><div class="muted" id="customerPhone"></div></div><button class="btn" onclick="logout()">Log keluar</button></div></div><div class="card"><h2>Pesanan Saya</h2><div id="orders"></div></div></section></main><script>const API='https://script.google.com/macros/s/AKfycbyFy2y76srL3i-wIp1kesaXw5KZl6fpTTCbLJk_5lQBUwl0QKkdRsxo6ynF7XCjnKb1MA/exec';const money=n=>'RM'+Number(n||0).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function register(){const msg=document.getElementById('regMsg');msg.className='error';msg.textContent='Mendaftar...';const body={action:'customerRegister',name:regName.value,phone:regPhone.value,address:regAddress.value,pin:regPin.value};try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw Error(j.error||'Gagal daftar');msg.className='success';msg.textContent='Akaun berjaya. Sila log masuk.';loginPhone.value=regPhone.value;loginPin.value=regPin.value}catch(e){msg.textContent=e.message}}async function login(){const msg=document.getElementById('loginErr');msg.textContent='Menyemak...';try{const r=await fetch(API+'?action=customerLogin&phone='+encodeURIComponent(loginPhone.value)+'&pin='+encodeURIComponent(loginPin.value));const j=await r.json();if(!j.ok)throw Error(j.error||'Login gagal');sessionStorage.setItem('REQOO_CUSTOMER',JSON.stringify(j));render(j)}catch(e){msg.textContent=e.message}}function render(j){auth.style.display='none';account.style.display='block';customerName.textContent=j.customer.name;customerPhone.textContent=j.customer.phone;orders.innerHTML=(j.orders||[]).length?(j.orders||[]).map(o=>`<div class="order"><div class="row"><b>${esc(o.orderNo)}</b><span class="status">${esc(o.status)}</span></div><p class="muted">${esc(o.name)} · ${o.itemCount} item</p><div class="row"><b class="gold">${money(o.total)}</b><span>${esc(String(o.timestamp||'').slice(0,16))}</span></div>${o.customerReceiptUrl?`<p><a class="btn" target="_blank" href="${esc(o.customerReceiptUrl)}">🧾 Lihat Resit</a></p>`:''}</div>`).join(''):'<p class="muted">Belum ada pesanan.</p>'}function logout(){sessionStorage.removeItem('REQOO_CUSTOMER');location.reload()}try{const x=JSON.parse(sessionStorage.getItem('REQOO_CUSTOMER')||'null');if(x&&x.customer)render(x)}catch(e){}</script></body></html>
