<!doctype html>
<html lang="ms">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO — Product</title><style>body{margin:0;background:#080808;color:#f5f5f5;font:14px system-ui}.wrap{max-width:1100px;margin:auto;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:28px}.media{background:#111;border:1px solid #292929;border-radius:18px;padding:10px}.media img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px}.card{background:#111;border:1px solid #292929;border-radius:18px;padding:22px}.muted{color:#999}.price{font-size:26px;font-weight:900;margin:16px 0}.field{margin:15px 0}label{display:block;color:#bbb;margin-bottom:7px}input,textarea,select{width:100%;box-sizing:border-box;background:#080808;color:#fff;border:1px solid #333;border-radius:10px;padding:11px}button{border:0;border-radius:999px;padding:13px 20px;background:#d9b45e;color:#080808;font-weight:900;cursor:pointer}.notice{padding:12px;border:1px solid #3b3222;border-radius:10px;color:#cbb77e}.hidden{display:none}@media(max-width:750px){.grid{grid-template-columns:1fr}}</style></head>
<body><main class="wrap"><p><a href="/shop/v1/" style="color:#d9b45e">← Shop</a></p><div id="app"><div class="notice">Memuatkan produk…</div></div></main>
<script>
const API='/api/core';
const params=new URLSearchParams(location.search);const id=params.get('id')||params.get('product');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function money(n,c='MYR'){return new Intl.NumberFormat('ms-MY',{style:'currency',currency:c}).format((Number(n)||0)/100)}
function field(f){let req=f.required?'required':'';if(f.field_type==='textarea')return `<div class="field"><label>${esc(f.label)}</label><textarea name="${esc(f.field_key)}" ${req}></textarea></div>`;if(['dropdown','radio'].includes(f.field_type)){let opts=Array.isArray(f.options)?f.options:[];return `<div class="field"><label>${esc(f.label)}</label><select name="${esc(f.field_key)}" ${req}><option value="">Pilih…</option>${opts.map(o=>`<option value="${esc(o.value??o)}">${esc(o.label??o)}</option>`).join('')}</select></div>`}return `<div class="field"><label>${esc(f.label)}</label><input type="${f.field_type==='number'?'number':f.field_type==='date'?'date':f.field_type==='time'?'time':f.field_type==='color'?'color':'text'}" name="${esc(f.field_key)}" ${req}></div>`}
async function load(){if(!id){document.querySelector('#app').innerHTML='<div class="notice">Produk tidak dinyatakan.</div>';return}let r=await fetch(`${API}?resource=product&id=${encodeURIComponent(id)}`);let d=await r.json();if(!r.ok||!d.product){document.querySelector('#app').innerHTML='<div class="notice">Produk tidak dijumpai atau belum aktif.</div>';return}let p=d.product;let vars=d.variations||[];let fields=d.custom_fields||[];let adds=d.addons||[];let img=(d.images||[])[0]?.url||'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800"><rect width="100%" height="100%" fill="%23151515"/><text x="50%" y="50%" fill="%23aaa" text-anchor="middle" font-size="30">REQOO</text></svg>';
let variation=vars.length?`<div class="field"><label>Variation</label><select id="variation">${vars.map(v=>`<option value="${esc(v.id)}" data-price="${v.sale_price_minor??v.price_minor??p.sale_price_minor??p.base_price_minor}">${esc(v.name)}</option>`).join('')}</select></div>`:'';
let addons=adds.length?`<div class="field"><label>Add-ons</label>${adds.map(a=>`<label><input type="checkbox" class="addon" value="${esc(a.id)}" data-price="${a.price_adjustment_minor}" style="width:auto"> ${esc(a.name)} (+${money(a.price_adjustment_minor,p.currency)})</label>`).join('')}</div>`:'';
document.querySelector('#app').innerHTML=`<div class="grid"><section class="media"><img src="${esc(img)}" alt="${esc(p.name)}"></section><section class="card"><div class="muted">${esc(p.product_type)}</div><h1>${esc(p.name)}</h1><p class="muted">${esc(p.short_description||p.description||'')}</p><div id="price" class="price">${money(p.sale_price_minor??p.base_price_minor,p.currency)}</div><form id="form">${variation}${fields.map(field).join('')}${addons}<button type="submit">Tambah ke Cart</button></form><p id="msg" class="muted"></p></section></div>`;
let base=()=>{let v=document.querySelector('#variation');return Number(v?.selectedOptions[0]?.dataset.price??p.sale_price_minor??p.base_price_minor)};let update=()=>{let total=base();document.querySelectorAll('.addon:checked').forEach(x=>total+=Number(x.dataset.price||0));document.querySelector('#price').textContent=money(total,p.currency)};document.querySelectorAll('#variation,.addon').forEach(x=>x.addEventListener('change',update));document.querySelector('#form').addEventListener('submit',e=>{e.preventDefault();let custom={};new FormData(e.currentTarget).forEach((v,k)=>custom[k]=v);let item={product_id:p.id,variation_id:document.querySelector('#variation')?.value||null,customization:custom,addons:[...document.querySelectorAll('.addon:checked')].map(x=>x.value),unit_price_minor:base()+[...document.querySelectorAll('.addon:checked')].reduce((s,x)=>s+Number(x.dataset.price||0),0),quantity:1};localStorage.setItem('reqoo_cart',JSON.stringify([...(JSON.parse(localStorage.getItem('reqoo_cart')||'[]')),item]));document.querySelector('#msg').textContent='Produk dimasukkan ke cart.'})}
load().catch(()=>document.querySelector('#app').innerHTML='<div class="notice">Tidak dapat memuatkan produk sekarang.</div>');
</script></body></html>
