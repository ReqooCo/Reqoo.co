<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO — Checkout</title><style>body{margin:0;background:#080808;color:#f5f5f5;font:14px system-ui}.wrap{max-width:800px;margin:auto;padding:24px}.card{background:#111;border:1px solid #292929;border-radius:18px;padding:20px;margin:14px 0}label{display:block;color:#bbb;margin:14px 0 6px}input{width:100%;box-sizing:border-box;background:#080808;color:#fff;border:1px solid #333;border-radius:10px;padding:12px}button{margin-top:18px;border:0;border-radius:999px;padding:13px 20px;background:#d9b45e;color:#080808;font-weight:900;cursor:pointer}.muted{color:#999}.error{color:#ff8c8c}</style></head><body><main class="wrap"><h1>Checkout</h1><div id="app"></div></main><script>
const draft=JSON.parse(localStorage.getItem('reqoo_checkout_draft')||'null');const money=n=>new Intl.NumberFormat('ms-MY',{style:'currency',currency:'MYR'}).format((Number(n)||0)/100);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
if(!draft?.items?.length){app.innerHTML='<div class="card">Tiada item untuk checkout.</div>'}else{let total=draft.items.reduce((s,x)=>s+Number(x.unit_price_minor||0)*Number(x.quantity||1),0);app.innerHTML=`<div class="card"><b>Ringkasan</b>${draft.items.map(x=>`<p>${esc(x.product_name_snapshot||x.product_id)} × ${x.quantity||1} — ${money(x.unit_price_minor*(x.quantity||1))}</p>`).join('')}<h2>${money(total)}</h2></div><form class="card" id="form"><label>Nama</label><input name="name" required><label>Telefon</label><input name="phone" required><label>Email</label><input name="email" type="email"><button>Teruskan</button><p id="msg" class="muted"></p></form>`;form.addEventListener('submit',e=>{e.preventDefault();let f=new FormData(form);let customer={name:f.get('name'),phone:f.get('phone'),email:f.get('email')};localStorage.setItem('reqoo_order_draft',JSON.stringify({customer,items:draft.items,total_minor:total,source:'shop',created_at:new Date().toISOString()}));msg.textContent='Checkout draft disimpan. Payment API akan disambungkan selepas Order Core diuji.'})}
</script></body></html>
