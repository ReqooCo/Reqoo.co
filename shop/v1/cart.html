<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO — Cart</title><style>body{margin:0;background:#080808;color:#f5f5f5;font:14px system-ui}.wrap{max-width:900px;margin:auto;padding:24px}.card{background:#111;border:1px solid #292929;border-radius:18px;padding:20px;margin:14px 0}.row{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #292929;padding:14px 0}.muted{color:#999}.total{font-size:24px;font-weight:900}button{border:0;border-radius:999px;padding:13px 20px;background:#d9b45e;color:#080808;font-weight:900;cursor:pointer}.danger{background:#222;color:#fff}</style></head><body><main class="wrap"><h1>Cart</h1><div id="app"></div></main><script>
const cart=()=>JSON.parse(localStorage.getItem('reqoo_cart')||'[]');const save=x=>localStorage.setItem('reqoo_cart',JSON.stringify(x));const money=n=>new Intl.NumberFormat('ms-MY',{style:'currency',currency:'MYR'}).format((Number(n)||0)/100);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(){let c=cart();if(!c.length){app.innerHTML='<div class="card">Cart kosong.</div>';return}let total=c.reduce((s,x)=>s+Number(x.unit_price_minor||0)*Number(x.quantity||1),0);app.innerHTML=`<div class="card">${c.map((x,i)=>`<div class="row"><div><b>${esc(x.product_name_snapshot||x.product_id)}</b><div class="muted">Qty ${x.quantity||1}</div></div><div>${money(x.unit_price_minor*(x.quantity||1))}<br><button class="danger" onclick="removeItem(${i})">Buang</button></div></div>`).join('')}<p class="total">Jumlah: ${money(total)}</p><button onclick="checkout()">Teruskan Checkout</button></div>`}function removeItem(i){let c=cart();c.splice(i,1);save(c);render()}
function checkout(){let c=cart();localStorage.setItem('reqoo_checkout_draft',JSON.stringify({items:c,created_at:new Date().toISOString()}));location.href='/shop/v1/checkout.html'}render();
</script></body></html>
