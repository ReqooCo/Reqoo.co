<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="./">Shop</a><a href="../custom/">Custom</a></div></nav><main><div id="app" class="rq-card">Memuatkan…</div></main></div><script type="module">import{catalog}from'../shared/catalog.js';const app=document.querySelector('#app');const id=new URLSearchParams(location.search).get('id');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function run(){if(!id){app.textContent='Produk tidak ditemui.';return}try{const data=await catalog.get(id);const p=data?.product||data;if(!p||!p.id){app.textContent='Produk tidak ditemui.';return}const imgs=p.images||[];app.innerHTML=`<a href="./">← Kembali ke Shop</a><h1>${esc(p.name)}</h1>${imgs[0]?`<img src="${esc(imgs[0])}" alt="${esc(p.name)}" style="max-width:100%;width:520px;border-radius:12px">`:''}<p>${esc(p.description||'')}</p><h2>RM${Number(p.price||0).toFixed(2)}</h2><button id="add" class="rq-btn">Tambah ke cart</button>`;document.querySelector('#add').onclick=()=>{let c=JSON.parse(localStorage.getItem('reqoo_cart')||'[]');const i=c.find(x=>x.product_id===p.id);if(i)i.quantity++;else c.push({product_id:p.id,name:p.name,price:Number(p.price||0),quantity:1});localStorage.setItem('reqoo_cart',JSON.stringify(c));location.href='../cart/'};}catch(e){app.textContent='Gagal: '+e.message}}run()</script></body></html>
