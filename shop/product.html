<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Product · REQOO.CO</title><link rel="stylesheet" href="../shared/reqoo.css"><style>.wrap{max-width:1200px;margin:auto;padding:22px 0 70px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.panel{border:1px solid var(--rq-line);border-radius:16px;background:linear-gradient(180deg,#151515,#0d0d0d);padding:18px}.main{aspect-ratio:1;background:#080808;border-radius:12px;overflow:hidden;display:grid;place-items:center}.main img{width:100%;height:100%;object-fit:contain}.thumbs{display:flex;gap:7px;overflow:auto;margin-top:9px}.thumb{width:62px;height:62px;flex:0 0 62px;padding:0;border:1px solid var(--rq-line);background:#080808;border-radius:8px;overflow:hidden}.thumb.active{border-color:var(--rq-gold)}.thumb img{width:100%;height:100%;object-fit:cover}.eyebrow{font-size:9px;font-weight:900;color:var(--rq-gold-hi);letter-spacing:.16em}.info h1{font-size:32px;line-height:1.08;margin:8px 0}.desc{font-size:12px;line-height:1.7;color:#999}.meta{font-size:10px;color:#888;border-bottom:1px solid var(--rq-line);padding-bottom:13px}.price{font-size:28px;color:var(--rq-gold-hi);font-weight:950;margin:15px 0}.options{display:grid;gap:9px}.opt{border:1px solid var(--rq-line);border-radius:10px;padding:12px}.opt-title{font-size:10px;font-weight:900;margin-bottom:7px;display:flex;justify-content:space-between}.required{color:#d9a441;font-size:8px}.opt select,.opt input,.opt textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #303030;border-radius:8px;background:#090909;color:#eee}.choice{display:flex;gap:8px;padding:8px 0;border-top:1px solid #242424;font-size:10px}.qty{display:flex;align-items:center;gap:10px;margin-top:14px}.qty input{width:70px;padding:10px;background:#090909;color:#fff;border:1px solid #333;border-radius:8px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}.actions button,.actions a{min-height:44px;display:flex;align-items:center;justify-content:center;border-radius:9px;font-size:10px;font-weight:900}.add{background:var(--rq-gold-hi);border:1px solid var(--rq-gold);color:#111}.cart{background:#111;border:1px solid #333;color:#fff;text-decoration:none}.error{padding:10px;border:1px solid #703b3b;background:#251313;color:#ffb1b1;border-radius:8px;font-size:10px;margin-top:9px}@media(max-width:800px){.layout{grid-template-columns:1fr}.info h1{font-size:27px}}@media(max-width:480px){.actions{grid-template-columns:1fr}}</style></head><body><header class="rq-header"><div class="rq-shell"><div class="rq-header-main"><a class="rq-brand" href="../"><span class="rq-brand-mark">R</span><span>REQOO.CO</span></a><a class="rq-action" href="../cart/">🛒 Cart <b class="rq-badge" id="cartCount">0</b></a></div><nav class="rq-nav"><a href="../">Home</a><a class="active" href="./">Shop</a><a href="../custom/">Custom</a><a href="../quotation/">Quotation</a></nav></div></header><main class="rq-shell wrap"><a href="./" style="color:#999;font-size:10px">← Kembali</a><section class="layout" style="margin-top:12px"><div class="panel"><div id="main" class="main">Memuatkan…</div><div id="thumbs" class="thumbs"></div></div><div class="panel info" id="info">Memuatkan produk…</div></section></main></body><script type="module">import{catalog}from'../shared/catalog.js';import{cart,money}from'../shared/cart.js';const $=s=>document.querySelector(s),id=new URLSearchParams(location.search).get('id'),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let product=null,options=[];function chosenPrice(sel){let price=Number(product.price||0);for(const o of options.filter(x=>x.group==='variation')){const chosen=sel.variation[o.id],value=chosen?.value??chosen;if(!value)continue;const x=(o.values||[]).find(z=>String(z.value??z.label)===String(value));if(x)price+=Number(x.price||0)}for(const o of options.filter(x=>x.group==='addon')){const vals=sel.addons.filter(a=>String(a.option_id)===String(o.id)).flatMap(a=>a.values||[]);for(const v of vals){if(o.field_type==='select'){const x=(o.values||[]).find(z=>String(z.label)===String(v.label)||String(z.value??'')===String(v.label));price+=Number(x?.price||0)}else price+=Number(o.addonPrice||0)}}return price}function renderOption(o){const req=o.required?'<span class="required">WAJIB</span>':'';if(o.group==='custom')return `<div class="opt"><div class="opt-title"><span>${esc(o.label)}</span>${req}</div>${o.field_type==='textarea'?`<textarea data-custom="${esc(o.id)}" placeholder="${esc(o.placeholder||'')}"></textarea>`:`<input data-custom="${esc(o.id)}" type="${o.field_type==='number'?'number':'text'}" placeholder="${esc(o.placeholder||'')}">`}</div>`;if(o.group==='addon'&&o.field_type==='checkbox')return `<div class="opt"><div class="opt-title"><span>${esc(o.label)}</span>${req}</div><label class="choice"><input type="checkbox" data-addon-check="${esc(o.id)}"> ${esc(o.label)} +RM${Number(o.addonPrice||0).toFixed(2)}</label></div>`;if(o.group==='addon')return `<div class="opt"><div class="opt-title"><span>${esc(o.label)}</span>${req}</div><select data-addon-select="${esc(o.id)}"><option value="">Tiada</option>${(o.values||[]).map(v=>`<option value="${esc(v.label)}">${esc(v.label)} +RM${Number(v.price||0).toFixed(2)}</option>`).join('')}</select></div>`;return `<div class="opt"><div class="opt-title"><span>${esc(o.label)}</span>${req}</div><select data-var="${esc(o.id)}"><option value="">Pilih ${esc(o.label)}</option>${(o.values||[]).map(v=>`<option value="${esc(v.label)}">${esc(v.label)} · RM${Number(v.price||0).toFixed(2)}</option>`).join('')}</select></div>`}function collect(){const variation={},addons=[],customization={},missing=[];for(const o of options){if(o.group==='variation'){const el=$(`[data-var="${CSS.escape(o.id)}"]`),value=el?.value||'';if(o.required&&!value)missing.push(o.label);if(value)variation[o.id]={label:o.label,value}}else if(o.group==='addon'){if(o.field_type==='checkbox'){const el=$(`[data-addon-check="${CSS.escape(o.id)}"]`);if(el?.checked)addons.push({option_id:o.id,label:o.label,values:[{label:o.label}]})}else{const el=$(`[data-addon-select="${CSS.escape(o.id)}"]`);if(el?.value)addons.push({option_id:o.id,label:o.label,values:[{label:el.value}]})}}else{const el=$(`[data-custom="${CSS.escape(o.id)}"]`),value=el?.value?.trim()||'';if(o.required&&!value)missing.push(o.label);if(value)customization[o.id]={label:o.label,value}}}return{variation,addons,customization,missing}}function updatePrice(){const s=collect();$('#price').textContent=money(chosenPrice(s))}function render(){const imgs=product.images||[];$('#main').innerHTML=imgs[0]?`<img src="${esc(imgs[0])}" alt="${esc(product.name)}">`:'Tiada gambar';$('#thumbs').innerHTML=imgs.map((x,i)=>`<button class="thumb ${i===0?'active':''}" data-src="${esc(x)}" type="button"><img src="${esc(x)}" alt=""></button>`).join('');document.querySelectorAll('.thumb').forEach(b=>b.onclick=()=>{$('#main img').src=b.dataset.src;document.querySelectorAll('.thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active')});options=Array.isArray(product.options)?product.options:[];$('#info').innerHTML=`<div class="eyebrow">REQOO.CO · ${product.product_type==='custom'?'CUSTOM':'PRODUCT'}</div><h1>${esc(product.name)}</h1><p class="desc">${esc(product.description||product.short_description||'')}</p><div class="meta">${esc(product.fulfillment_type||'physical_shipping')} · ${product.published?'Available':'Unavailable'}</div><div id="price" class="price">${money(product.price)}</div>${options.length?`<div class="options">${options.map(renderOption).join('')}</div>`:''}<div class="qty"><b style="font-size:10px">Kuantiti</b><input id="qty" type="number" min="1" value="1"></div><div id="err"></div><div class="actions"><button id="add" class="add" type="button">Tambah ke Cart</button><a class="cart" href="../cart/">Lihat Cart</a></div>`;document.querySelectorAll('[data-var],[data-addon-select],[data-addon-check],[data-custom]').forEach(x=>{x.oninput=updatePrice;x.onchange=updatePrice});$('#add').onclick=()=>{const s=collect();if(s.missing.length){$('#err').innerHTML=`<div class="error">Sila lengkapkan: ${s.missing.map(esc).join(', ')}</div>`;return}const qty=Math.max(1,Math.floor(Number($('#qty').value)||1));cart.add({...product,price:chosenPrice(s),variation:s.variation,addons:s.addons,customization:s.customization},qty);location.href='../cart/'};$('#cartCount').textContent=cart.count();updatePrice()}async function run(){try{const d=await catalog.get(id);product=d?.product||d;if(!product?.id)throw Error('Produk tidak ditemui');render()}catch(e){$('#info').innerHTML=`<h1>Produk tidak dapat dimuatkan.</h1><p class="desc">${esc(e.message)}</p>`}}if(id)run();else $('#info').innerHTML='<h1>Produk tidak ditemui.</h1>';</script></html>
