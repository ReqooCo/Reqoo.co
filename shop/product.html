<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"><style>.custom-box{margin-top:20px;padding:18px;border:1px solid var(--rq-line);border-radius:14px;background:var(--rq-panel);display:grid;gap:13px}.custom-box h3{margin:0}.custom-box label{display:grid;gap:6px;font-size:12px;color:var(--rq-muted);font-weight:700}.custom-box input,.custom-box select{width:100%;box-sizing:border-box;padding:11px;border:1px solid var(--rq-line);border-radius:9px;background:#0f0f12;color:var(--rq-text);font:inherit}.custom-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:650px){.custom-grid{grid-template-columns:1fr}}.custom-note{font-size:12px;color:var(--rq-muted);line-height:1.5}.price-line{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.qty{width:90px!important}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="./">Shop</a><a href="../custom/">Custom</a><a href="../cart/">Cart</a></div></nav><main><div id="app" class="rq-card">Memuatkan…</div></main></div><script type="module">import{catalog}from'../shared/catalog.js';import{cart,money}from'../shared/cart.js';const app=document.querySelector('#app');const id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function run(){if(!id){app.textContent='Produk tidak ditemui.';return}catalog.get(id).then(data=>{const p=data?.product||data;if(!p||!p.id){app.textContent='Produk tidak ditemui.';return}const imgs=p.images||[];const isCustom=p.product_type==='custom';app.innerHTML=`<a href="./">← Kembali ke Shop</a><h1>${esc(p.name)}</h1>${imgs[0]?`<img src="${esc(imgs[0])}" alt="${esc(p.name)}" style="max-width:100%;width:520px;border-radius:12px">`:''}<p>${esc(p.description||'')}</p><div class="price-line"><h2 style="margin:0">${money(p.price)}</h2>${isCustom?'<span class="status" style="background:#3a3215;color:#f0d36a;padding:7px 10px;border-radius:999px;font-size:11px;font-weight:800">CUSTOM</span>':''}</div>${isCustom?`<section class="custom-box"><h3>Custom produk</h3><div class="custom-grid"><label>Material<select id="material"><option value="Kayu">Kayu</option><option value="Acrylic">Acrylic</option><option value="MDF">MDF</option><option value="Plywood">Plywood</option><option value="PLA">PLA</option><option value="TPU">TPU</option><option value="Aluminium">Aluminium</option></select></label><label>Ukuran<input id="size" placeholder="Contoh: 100 × 50 mm"></label></div><label>Nama / Teks custom<input id="custom-text" placeholder="Contoh: ALIFF"></label><label>Kuantiti<input id="custom-qty" class="qty" type="number" min="1" value="1"></label><div class="custom-note">Pilihan ini akan disimpan bersama item dalam cart. Untuk design kompleks atau fail rujukan, gunakan Custom Studio.</div></section>`:''}<button id="add" class="rq-btn" style="margin-top:18px">${isCustom?'Tambah custom ke cart':'Tambah ke cart'}</button>`;document.querySelector('#add').onclick=()=>{const customization=isCustom?{material:document.querySelector('#material').value,size:document.querySelector('#size').value.trim(),text:document.querySelector('#custom-text').value.trim()}:{};const qty=isCustom?Math.max(1,Number(document.querySelector('#custom-qty').value)||1):1;cart.add({...p,customization},qty);location.href='../cart/'};}).catch(e=>app.textContent='Gagal: '+e.message)}run()</script></body></html>
