<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#171717">
<title>Product · Reqoo.co</title>
<link rel="stylesheet" href="../shared/reqoo.css?v=20260820-3">
<style>
:root{--gold:#d4af37;--ink:#171717;--muted:#74746f;--line:#deded8;--panel:#fff;--soft:#f4f4f1}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:#252522;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.product-wrap{max-width:1100px;margin:auto;padding:24px 18px 60px}.back{display:inline-flex;color:#666;text-decoration:none;font-size:12px;font-weight:700;margin-bottom:15px}.product{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.95fr);box-shadow:0 12px 35px rgba(0,0,0,.05)}
.visual{background:#ecece8;min-height:540px;display:flex;align-items:center;justify-content:center;padding:30px}.visual img{width:100%;max-height:650px;object-fit:contain;border-radius:12px}.no-image{color:#aaa;font-size:13px}.info{padding:38px 36px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#a9872f;font-weight:900}.info h1{font-size:34px;line-height:1.1;letter-spacing:-.04em;margin:9px 0 10px}.description{font-size:14px;line-height:1.7;color:#6e6e69;margin:0 0 18px}.price-line{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:20px}.price{font-size:25px;color:#9a7721;font-weight:850}.badge{font-size:10px;font-weight:900;letter-spacing:.08em;padding:7px 10px;border-radius:999px;background:#f3ead0;color:#806318}.custom-box{margin-top:20px;padding:18px;border:1px solid #d9cda9;border-radius:13px;background:#faf7ed;display:grid;gap:13px}.custom-box h3{margin:0;font-size:16px}.custom-note{font-size:11px;color:#77705e;line-height:1.55}.custom-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.custom-box label{display:grid;gap:6px;font-size:11px;color:#67645c;font-weight:800}.custom-box input,.custom-box select{width:100%;padding:11px;border:1px solid #d9d6cc;border-radius:9px;background:#fff;color:#222;font:inherit}.qty{max-width:110px}.actions{display:flex;gap:8px;margin-top:18px}.btn{display:flex;align-items:center;justify-content:center;min-height:44px;border-radius:9px;text-decoration:none;font-size:12px;font-weight:850;cursor:pointer;padding:0 16px}.btn.primary{flex:1;border:1px solid #171717;background:#171717;color:#e4c86e}.btn.secondary{border:1px solid var(--line);background:#fff;color:#444}.helper{margin-top:14px;color:#888;font-size:10px;line-height:1.5}
@media(max-width:800px){.product{grid-template-columns:1fr}.visual{min-height:330px;padding:20px}.info{padding:25px 20px}.info h1{font-size:29px}}
@media(max-width:520px){.product-wrap{padding:14px 12px 40px}.custom-grid{grid-template-columns:1fr}.actions{flex-direction:column}.btn.secondary{min-height:40px}}
</style>
</head>
<body>
<div class="rq-shell">
<nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="./">Shop</a><a href="../custom/">Custom</a><a href="../cart/">Cart</a></div></nav>
<main class="product-wrap"><a class="back" href="./">← Kembali ke Shop</a><section id="app" class="product"><div class="visual"><span class="no-image">Memuatkan produk…</span></div><div class="info"></div></section></main>
</div>
<script type="module">
import{catalog}from'../shared/catalog.js?v=20260820-3';
import{cart,money}from'../shared/cart.js?v=20260820-3';
const app=document.querySelector('#app');
const id=new URLSearchParams(location.search).get('id');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(p){const custom=p.product_type==='custom';const img=(p.images||[])[0]||'';app.querySelector('.visual').innerHTML=img?`<img src="${esc(img)}" alt="${esc(p.name)}">`:'<span class="no-image">Tiada gambar produk</span>';app.querySelector('.info').innerHTML=`<div class="eyebrow">REQOO.CO · ${custom?'CUSTOM':'SHOP'}</div><h1>${esc(p.name)}</h1><p class="description">${esc(p.description||'')}</p><div class="price-line"><span class="price">${money(p.price)}</span>${custom?'<span class="badge">CUSTOM</span>':''}</div>${custom?`<section class="custom-box"><h3>Sesuaikan produk anda</h3><div class="custom-grid"><label>Material<select id="material"><option value="Kayu">Kayu</option><option value="Acrylic">Acrylic</option><option value="MDF">MDF</option><option value="Plywood">Plywood</option><option value="PLA">PLA</option><option value="TPU">TPU</option><option value="Aluminium">Aluminium</option></select></label><label>Ukuran<input id="size" placeholder="Contoh: 100 × 50 mm"></label></div><label>Nama / Teks custom<input id="custom-text" placeholder="Contoh: ALIFF"></label><label>Kuantiti<input id="custom-qty" class="qty" type="number" min="1" step="1" value="1"></label><div class="custom-note">Pilihan ini disimpan bersama item dalam cart. Jika perlukan design khas, gambar rujukan atau spesifikasi kompleks, gunakan Custom Studio.</div></section>`:''}<div class="actions"><button id="add" class="btn primary">${custom?'Tambah Custom ke Cart':'Tambah ke Cart'}</button><a class="btn secondary" href="../cart/">Lihat Cart</a></div>${custom?'<div class="helper">Harga yang dipaparkan adalah harga asas. Spesifikasi tertentu mungkin memerlukan semakan quotation.</div>':''}`;document.querySelector('#add').onclick=()=>{const customization=custom?{material:document.querySelector('#material').value,size:document.querySelector('#size').value.trim(),text:document.querySelector('#custom-text').value.trim()}:{};const qty=custom?Math.max(1,Math.floor(Number(document.querySelector('#custom-qty').value)||1)):1;cart.add({...p,customization},qty);location.href='../cart/'} }
async function run(){if(!id){app.innerHTML='<div class="info"><h1>Produk tidak ditemui.</h1><a class="btn secondary" href="./">Kembali ke Shop</a></div>';return}try{const data=await catalog.get(id);const p=data?.product||data;if(!p||!p.id)throw new Error('Produk tidak ditemui');render(p)}catch(e){app.innerHTML=`<div class="info"><h1>Produk tidak dapat dimuatkan.</h1><p class="description">${esc(e.message)}</p><a class="btn secondary" href="./">Kembali ke Shop</a></div>`}}
run();
</script>
</body></html>
