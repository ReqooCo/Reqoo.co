<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171717"><title>Product · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css?v=20260820-5"><style>
:root{--gold:#d4af37;--ink:#171717;--muted:#74746f;--line:#deded8;--soft:#f4f4f1}.product-wrap{max-width:1120px;margin:auto;padding:22px 18px 60px}.back{display:inline-flex;color:#777;text-decoration:none;font-size:11px;font-weight:800;margin-bottom:14px}.product{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1.05fr .95fr;box-shadow:0 14px 38px rgba(0,0,0,.06)}.visual{background:#ecece8;min-height:560px;display:flex;align-items:center;justify-content:center;padding:28px}.visual img{width:100%;max-height:680px;object-fit:contain;border-radius:12px}.info{padding:38px 34px}.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#a9872f;font-weight:900}.info h1{font-size:34px;line-height:1.08;letter-spacing:-.04em;margin:9px 0}.description{font-size:13px;line-height:1.7;color:#70706b;margin:0 0 18px}.price-line{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:18px}.price{font-size:25px;color:#9a7721;font-weight:900}.badge{font-size:9px;font-weight:900;letter-spacing:.08em;padding:7px 10px;border-radius:999px;background:#f3ead0;color:#806318}.option-box{margin-top:18px;display:grid;gap:14px}.option-card{padding:13px;border:1px solid #dedbd2;border-radius:12px;background:#fafaf7}.option-card label.title{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:900;color:#45443f;margin-bottom:7px}.required{color:#a43b3b;font-size:9px}.option-card select,.option-card input,.option-card textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d9d6cc;border-radius:9px;background:#fff;color:#222;font:inherit}.option-card textarea{min-height:75px;resize:vertical}.choice{display:flex;align-items:center;gap:8px;padding:9px 0;font-size:11px;color:#555;border-top:1px solid #eceae4}.choice:first-of-type{border-top:0}.choice input{width:auto}.helper{font-size:10px;color:#85827a;line-height:1.5}.qty-row{display:flex;align-items:center;gap:10px}.qty-row input{width:80px}.actions{display:flex;gap:8px;margin-top:16px}.btn{display:flex;align-items:center;justify-content:center;min-height:45px;border-radius:9px;text-decoration:none;font-size:12px;font-weight:850;cursor:pointer;padding:0 16px}.btn.primary{flex:1;border:1px solid #171717;background:#171717;color:#e4c86e}.btn.secondary{border:1px solid var(--line);background:#fff;color:#444}.error{padding:10px;border:1px solid #e3b7b7;background:#fff5f5;color:#8b3b3b;border-radius:9px;font-size:11px}.note{margin-top:13px;color:#888;font-size:10px;line-height:1.5}@media(max-width:800px){.product{grid-template-columns:1fr}.visual{min-height:330px;padding:20px}.info{padding:25px 20px}.info h1{font-size:29px}}@media(max-width:520px){.product-wrap{padding:14px 12px 40px}.actions{flex-direction:column}}
</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="./">Shop</a><a href="../custom/">Custom</a><a href="../cart/">Cart</a></div></nav><main class="product-wrap"><a class="back" href="./">← Kembali ke Shop</a><section id="app" class="product"><div class="visual"><span>Memuatkan produk…</span></div><div class="info"></div></section></main></div>
<script type="module">
import{catalog,decodeProductOptions}from'../shared/catalog.js?v=20260820-5';import{cart,money}from'../shared/cart.js?v=20260820-5';
const app=document.querySelector('#app'),id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function field(o){const req=o.required?'<span class="required">WAJIB</span>':'';const values=o.values||[];if(o.group==='custom'){if(o.field_type==='textarea')return `<div class="option-card"><label class="title">${esc(o.label)} ${req}</label><textarea data-custom="${esc(o.id)}" placeholder="${esc(o.placeholder||'')}"></textarea></div>`;return `<div class="option-card"><label class="title">${esc(o.label)} ${req}</label><input data-custom="${esc(o.id)}" type="${o.field_type==='number'?'number':'text'}" placeholder="${esc(o.placeholder||'')}"></div>`}
if(o.group==='addon'&&o.field_type==='checkbox')return `<div class="option-card"><label class="title">${esc(o.label)} ${req}</label>${values.map(v=>`<label class="choice"><input type="checkbox" data-addon="${esc(o.id)}" data-value-id="${esc(v.id)}" data-label="${esc(v.label)}">${esc(v.label)}</label>`).join('')}</div>`;
if(o.field_type==='radio')return `<div class="option-card"><label class="title">${esc(o.label)} ${req}</label>${values.map((v,i)=>`<label class="choice"><input type="radio" name="opt-${esc(o.id)}" data-variation="${esc(o.id)}" data-value-id="${esc(v.id)}" value="${esc(v.value||v.label)}" ${i===0&&!o.required?'':' '}>${esc(v.label)}</label>`).join('')}</div>`;
return `<div class="option-card"><label class="title">${esc(o.label)} ${req}</label><select data-variation="${esc(o.id)}"><option value="">Pilih ${esc(o.label)}</option>${values.map(v=>`<option value="${esc(v.value||v.label)}" data-value-id="${esc(v.id)}">${esc(v.label)}</option>`).join('')}</select></div>`}
function collect(p){const options=decodeProductOptions(p.internal_notes);const variation={};const addons=[];const customization={};let missing=[];for(const o of options){if(o.group==='variation'){let el=document.querySelector(`[data-variation="${CSS.escape(o.id)}"]`);let val='',valueId='';if(el?.tagName==='SELECT'){val=el.value;valueId=el.selectedOptions[0]?.dataset.valueId||''}else{el=document.querySelector(`input[data-variation="${CSS.escape(o.id)}"]:checked`);val=el?.value||'';valueId=el?.dataset.valueId||''}if(o.required&&!val)missing.push(o.label);if(val)variation[o.id]={label:o.label,value:val,value_id:valueId}}else if(o.group==='addon'){const els=[...document.querySelectorAll(`[data-addon="${CSS.escape(o.id)}"]:checked`)];if(o.required&&!els.length)missing.push(o.label);if(els.length)addons.push({option_id:o.id,label:o.label,values:els.map(x=>({id:x.dataset.valueId,label:x.dataset.label}))})}else{const el=document.querySelector(`[data-custom="${CSS.escape(o.id)}"]`);const val=el?.value?.trim()||'';if(o.required&&!val)missing.push(o.label);if(val)customization[o.id]={label:o.label,value:val}}return{options,variation,addons,customization,missing}}
function render(p){const custom=p.product_type==='custom',img=(p.images||[])[0]||'';app.querySelector('.visual').innerHTML=img?`<img src="${esc(img)}" alt="${esc(p.name)}">`:'<span style="color:#aaa;font-size:12px">Tiada gambar produk</span>';const options=decodeProductOptions(p.internal_notes);app.querySelector('.info').innerHTML=`<div class="eyebrow">REQOO.CO · ${custom?'CUSTOM':'SHOP'}</div><h1>${esc(p.name)}</h1><p class="description">${esc(p.description||'')}</p><div class="price-line"><span class="price">${money(p.price)}</span>${custom?'<span class="badge">CUSTOM</span>':''}</div>${options.length?`<section class="option-box">${options.map(field).join('')}<div class="helper">Pilihan custom disimpan bersama item dalam pesanan. Harga asas produk dipaparkan di atas.</div></section>`:''}<div class="qty-row" style="margin-top:16px"><label style="font-size:11px;font-weight:800">Kuantiti</label><input id="qty" type="number" min="1" step="1" value="1"></div><div id="err"></div><div class="actions"><button id="add" class="btn primary">Tambah ke Cart</button><a class="btn secondary" href="../cart/">Lihat Cart</a></div><div class="note">Jika spesifikasi memerlukan design khas, ukuran kompleks atau quotation, gunakan Custom Studio.</div>`;document.querySelector('#add').onclick=()=>{const x=collect(p);if(x.missing.length){document.querySelector('#err').innerHTML=`<div class="error">Sila lengkapkan: ${x.missing.map(esc).join(', ')}</div>`;return}const qty=Math.max(1,Math.floor(Number(document.querySelector('#qty').value)||1));cart.add({...p,variation:x.variation,addons:x.addons,customization:x.customization},qty);location.href='../cart/'} }
async function run(){if(!id){app.innerHTML='<div class="info"><h1>Produk tidak ditemui.</h1></div>';return}try{const d=await catalog.get(id),p=d?.product||d;if(!p?.id)throw new Error('Produk tidak ditemui');render(p)}catch(e){app.innerHTML=`<div class="info"><h1>Produk tidak dapat dimuatkan.</h1><p class="description">${esc(e.message)}</p></div>`}}run();
</script></body></html>
