<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050505"><title>Product · REQOO.CO</title><link rel="stylesheet" href="../shared/reqoo.css?v=20260822-core1"><style>.product-wrap{max-width:1280px;margin:auto;padding:24px 0 70px}.product-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.product-back{color:#999;font-size:11px;font-weight:800}.product-layout{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(390px,.95fr);gap:18px}.product-gallery,.product-info-panel{background:linear-gradient(180deg,#151515,#0d0d0d);border:1px solid #292929;border-radius:16px;box-shadow:0 18px 55px rgba(0,0,0,.28)}.product-gallery{padding:14px}.product-main-image{aspect-ratio:1;background:#090909;border-radius:12px;overflow:hidden;display:grid;place-items:center;border:1px solid #222}.product-main-image img{width:100%;height:100%;object-fit:contain}.product-thumbs{display:flex;gap:8px;margin-top:10px;overflow:auto}.product-thumb{width:66px;height:66px;flex:0 0 66px;border:1px solid #292929;background:#0a0a0a;border-radius:8px;overflow:hidden;padding:0}.product-thumb.active{border-color:var(--rq-gold)}.product-thumb img{width:100%;height:100%;object-fit:cover}.product-info-panel{padding:28px}.product-eyebrow{color:var(--rq-gold-hi);font-size:10px;font-weight:900;letter-spacing:.18em;text-transform:uppercase}.product-info-panel h1{font-size:32px;line-height:1.08;letter-spacing:-.035em;margin:9px 0 12px}.product-desc{color:#999;font-size:12px;line-height:1.7;margin:0 0 16px}.product-meta{display:flex;gap:12px;flex-wrap:wrap;color:#999;font-size:10px;padding-bottom:15px;border-bottom:1px solid #292929}.product-meta b{color:#ddd}.product-price-row{display:flex;align-items:end;gap:10px;margin-top:17px}.product-price{font-size:27px;color:var(--rq-gold-hi);font-weight:950}.option-box{display:grid;gap:10px;margin-top:18px}.option-card{padding:13px;border:1px solid #292929;border-radius:11px;background:#101010}.option-card label.title{display:flex;justify-content:space-between;gap:8px;font-size:11px;font-weight:900;color:#eee;margin-bottom:8px}.required{color:#dba94a;font-size:8px}.option-card select,.option-card input,.option-card textarea{width:100%;box-sizing:border-box;padding:11px;border:1px solid #303030;border-radius:8px;background:#0a0a0a;color:#eee;outline:none}.option-card textarea{min-height:75px;resize:vertical}.choice{display:flex;align-items:center;gap:8px;padding:9px 0;font-size:11px;color:#aaa;border-top:1px solid #252525}.choice:first-of-type{border-top:0}.helper,.product-note{font-size:10px;color:#777;line-height:1.5}.qty-row{display:flex;align-items:center;gap:10px;margin-top:16px}.qty-row input{width:76px;padding:10px;border:1px solid #303030;border-radius:8px;background:#0a0a0a;color:#fff}.product-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.product-actions button,.product-actions a{min-height:45px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:900}.product-add{border:1px solid var(--rq-gold);background:linear-gradient(180deg,var(--rq-gold-hi),var(--rq-gold));color:#111;cursor:pointer}.product-cart{border:1px solid #343434;background:#111;color:#eee}.product-error{margin-top:10px;padding:10px;border:1px solid #754040;background:#241414;color:#e7aaaa;border-radius:8px;font-size:10px}.product-trust{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}.product-trust div{padding:11px;border:1px solid #242424;border-radius:9px;color:#777;font-size:9px;text-align:center}.product-trust strong{display:block;color:#ddd;margin-bottom:3px}@media(max-width:850px){.product-layout{grid-template-columns:1fr}.product-info-panel{padding:22px}.product-wrap{padding:14px 0 70px}}@media(max-width:520px){.product-info-panel h1{font-size:27px}.product-actions{grid-template-columns:1fr}.product-trust{grid-template-columns:1fr 1fr}}</style></head><body><header class="rq-header"><div class="rq-shell"><div class="rq-header-main"><a class="rq-brand" href="../"><span class="rq-brand-mark">R</span><span>REQOO.CO</span></a><form class="rq-search" onsubmit="event.preventDefault();location.href='./?q='+encodeURIComponent(this.q.value)"><select><option>Semua</option></select><input name="q" placeholder="Cari produk, design atau custom…"><button>⌕</button></form><div class="rq-header-actions"><a class="rq-action" href="../cart/">🛒 <span class="label">Troli <b class="rq-badge" id="cartCount">0</b></span></a></div></div><nav class="rq-nav"><a href="../">Laman Utama</a><a href="../custom/">Custom Made</a><a class="active" href="./">Koleksi</a><a href="../calculator/">Kalkulator</a><a href="../quotation/">Quotation</a></nav></div></header><main class="rq-shell product-wrap"><div class="product-top"><a class="product-back" href="./">← Kembali ke Shop</a><span class="rq-pill">REQOO.CO · PRODUCT</span></div><section class="product-layout"><div class="product-gallery"><div class="product-main-image" id="mainImage"><span class="rq-muted">Memuatkan produk…</span></div><div id="thumbs" class="product-thumbs"></div></div><div class="product-info-panel"><div id="info"><h1>Memuatkan…</h1></div></div></section></main><nav class="rq-mobile-nav"><a href="../">⌂<span>Home</span></a><a class="active" href="./">▦<span>Shop</span></a><a href="../custom/">✦<span>Custom</span></a><a href="../cart/">🛒<span>Cart</span></a><a href="../admin/">♙<span>Admin</span></a></nav><script type="module">import{catalog,decodeProductOptions}from'../shared/catalog.js?v=20260822-core1';import{cart,money}from'../shared/cart.js?v=20260822-core1';const $=s=>document.querySelector(s),id=new URLSearchParams(location.search).get('id');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function field(o){const req=o.required?'<span class="required">WAJIB</span>':'';const values=o.values||[];if(o.group==='custom'){if(o.field_type==='textarea')return `<div class="option-card"><label class="title">${esc(o.label)} ${req}</label><textarea data-custom="${esc(o.id)}" placeholder="${esc(o.placeholder||'')}"></textarea></div>`;return `<div class="option-card"><label class="title">${esc(o.label)} ${req}</label><input data-custom="${esc(o.id)}" type="${o.field_type==='number'?'number':'text'}" placeholder="${esc(o.placeholder||'')}"></div>`}if(o.group==='addon'&&o.field_type==='checkbox')return `<div class="option-card"><label class="title">${esc(o.label)} ${req}</label>${values.map(v=>`<label class="choice"><input type="checkbox" data-addon="${esc(o.id)}" data-value-id="${esc(v.id)}" data-label="${esc(v.label)}">${esc(v.label)}</label>`).join('')}</div>`;if(o.field_type==='radio')return `<div class="option-card"><label class="title">${esc(o.label)} ${req}</label>${values.map(v=>`<label class="choice"><input type="radio" name="opt-${esc(o.id)}" data-variation="${esc(o.id)}" data-value-id="${esc(v.id)}" value="${esc(v.value||v.label)}">${esc(v.label)}</label>`).join('')}</div>`;return `<div class="option-card"><label class="title">${esc(o.label)} ${req}</label><select data-variation="${esc(o.id)}"><option value="">Pilih ${esc(o.label)}</option>${values.map(v=>`<option value="${esc(v.value||v.label)}" data-value-id="${esc(v.id)}">${esc(v.label)}</option>`).join('')}</select></div>`}function collect(p){const options=decodeProductOptions(p.internal_notes),variation={},addons=[],customization={},missing=[];for(const o of options){if(o.group==='variation'){let el=document.querySelector(`[data-variation="${CSS.escape(o.id)}"]`),val='',valueId='';if(el?.tagName==='SELECT'){val=el.value;valueId=el.selectedOptions[0]?.dataset.valueId||''}else{el=document.querySelector(`input[data-variation="${CSS.escape(o.id)}"]:checked`);val=el?.value||'';valueId=el?.dataset?.valueId||''}if(o.required&&!val)missing.push(o.label);if(val)variation[o.id]={label:o.label,value:val,value_id:valueId}}else if(o.group==='addon'){const els=[...document.querySelectorAll(`[data-addon="${CSS.escape(o.id)}"]:checked`)];if(o.required&&!els.length)missing.push(o.label);if(els.length)addons.push({option_id:o.id,label:o.label,values:els.map(x=>({id:x.dataset.valueId,label:x.dataset.label}))})}else{const el=document.querySelector(`[data-custom="${CSS.escape(o.id)}"]`),val=el?.value?.trim()||'';if(o.required&&!val)missing.push(o.label);if(val)customization[o.id]={label:o.label,value:val}}return{variation,addons,customization,missing}}function render(p){const imgs=Array.isArray(p.images)?p.images.filter(Boolean):[],main=$('#mainImage'),thumbs=$('#thumbs');main.innerHTML=imgs[0]?`<img id="mainImg" src="${esc(imgs[0])}" alt="${esc(p.name)}">`:'<span class="rq-muted">Tiada gambar produk</span>';thumbs.innerHTML=imgs.map((x,i)=>`<button class="product-thumb ${i===0?'active':''}" data-src="${esc(x)}"><img src="${esc(x)}" alt=""></button>`).join('');thumbs.querySelectorAll('.product-thumb').forEach(b=>b.onclick=()=>{const image=main.querySelector('img');if(image)image.src=b.dataset.src;thumbs.querySelectorAll('.product-thumb').forEach(x=>x.classList.remove('active'));b.classList.add('active')});const options=decodeProductOptions(p.internal_notes),custom=p.product_type==='custom',price=Number(p.price||0);$('#info').innerHTML=`<div class="product-eyebrow">${custom?'CUSTOM PRODUCT':'SHOP PRODUCT'}</div><h1>${esc(p.name)}</h1><p class="product-desc">${esc(p.description||'')}</p><div class="product-meta"><span>Status: <b>${p.published?'Available':'Unavailable'}</b></span><span>Type: <b>${custom?'Custom':'Ready Made'}</b></span></div><div class="product-price-row">${price>0?`<span class="product-price">${money(price)}</span>`:'<span class="product-note">Harga dikira melalui quotation.</span>'}</div>${options.length?`<section class="option-box">${options.map(field).join('')}<div class="helper">Pilihan custom akan disimpan bersama item dalam cart dan order.</div></section>`:''}<div class="qty-row"><label style="font-size:11px;font-weight:900">Kuantiti</label><input id="qty" type="number" min="1" value="1"></div><div id="err"></div><div class="product-actions"><button id="add" class="product-add">${custom?'Tambah Custom ke Cart':'Tambah ke Cart'}</button><a class="product-cart" href="../cart/">Lihat Cart</a></div><div class="product-trust"><div><strong>✦ Premium</strong>Hasil kemas</div><div><strong>⌁ Custom</strong>Ikut keperluan</div><div><strong>✓ Tersimpan</strong>Spesifikasi order</div></div>`;$('#add').onclick=()=>{const x=collect(p);if(x.missing.length){$('#err').innerHTML=`<div class="product-error">Sila lengkapkan: ${x.missing.map(esc).join(', ')}</div>`;return}const qty=Math.max(1,Math.floor(Number($('#qty').value)||1));cart.add({...p,variation:x.variation,addons:x.addons,customization:x.customization},qty);location.href='../cart/'};try{$('#cartCount').textContent=cart.count()}catch{}}async function run(){if(!id){$('#info').innerHTML='<h1>Produk tidak ditemui.</h1>';return}try{const d=await catalog.get(id),p=d?.product||d;if(!p?.id)throw new Error('Produk tidak ditemui');render(p)}catch(e){$('#info').innerHTML=`<h1>Produk tidak dapat dimuatkan.</h1><p class="product-desc">${esc(e.message)}</p>`}}run()</script></body></html>
