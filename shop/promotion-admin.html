<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO.CO — Promotion Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:auto}.nav{height:70px;display:flex;align-items:center;gap:12px}.logo{font-weight:950;letter-spacing:4px}.gold{color:#2563eb}.spacer{flex:1}.btn{border:1px solid #dbe3ee;background:#fff;color:#172033;border-radius:10px;padding:10px 13px;font-weight:900;cursor:pointer;text-decoration:none}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 4px 18px rgba(15,23,42,.045)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field label{display:block;font-size:10px;color:#64748b;margin:8px 0 5px}.field input,.field select{width:100%;padding:11px;border:1px solid #d7e0eb;border-radius:10px}.promo{display:grid;grid-template-columns:1fr 1fr 120px 120px 90px;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid #edf1f5}.promo:last-child{border:0}.muted{color:#64748b;font-size:12px}.badge{padding:5px 8px;border-radius:99px;background:#dcfce7;color:#15803d;font-size:9px;font-weight:900}@media(max-width:800px){.promo{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:520px){.promo{grid-template-columns:1fr}}</style></head><body><main class="wrap"><nav class="nav"><div class="logo">REQOO<span class="gold">.CO</span> PROMOTION</div><div class="spacer"></div><a class="btn" href="/shop/admin.html">← Shop Admin</a></nav><section class="card"><h1>Promotion Manager</h1><p class="muted">Data promosi disimpan terus dalam Cloudflare D1. Tiada Google Scripts.</p><div class="grid"><div class="field"><label>Admin Token</label><input id="token" type="password" autocomplete="current-password"></div><div class="field"><label>Product ID</label><input id="productId"></div><div class="field"><label>Variant</label><input id="variant" placeholder="Contoh: 30cm"></div><div class="field"><label>Tajuk</label><input id="title"></div><div class="field"><label>Kod / Slug</label><input id="slug"></div><div class="field"><label>Harga Asal</label><input id="original" type="number" step="0.01"></div><div class="field"><label>Harga Promo</label><input id="promoPrice" type="number" step="0.01"></div><div class="field"><label>Mula</label><input id="start" type="datetime-local"></div><div class="field"><label>Tamat</label><input id="end" type="datetime-local"></div></div><button class="btn primary" onclick="save()">Simpan Promosi</button><span id="msg" class="muted"></span></section><section class="card"><div style="display:flex;justify-content:space-between;align-items:center"><h2>Promosi</h2><button class="btn" onclick="load()">↻ Refresh</button></div><div id="list" class="muted">Memuatkan…</div></section></main><script>const API='/api/shop-admin';const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=n=>'RM'+Number(n||0).toFixed(2);function h(){return {'Content-Type':'application/json','X-Admin-Token':$('token').value.trim()}}async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:h(),body:JSON.stringify({action,...data})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'API error');return j}async function load(){try{const j=await api('listPromotions');list.innerHTML=(j.promotions||[]).map(p=>`<div class="promo"><div><b>${esc(p.title||p.code)}</b><div class="muted">${esc(p.slug||'')}</div></div><div>${money(p.promoPrice)} <span class="muted">asal ${money(p.originalPrice)}</span></div><div><span class="badge">${p.active?'ACTIVE':'OFF'}</span></div><div>${esc(p.start||'')}<br>${esc(p.end||'')}</div><button class="btn" onclick="del('${esc(p.id)}')">Off</button></div>`).join('')||'<p class="muted">Tiada promosi.</p>'}catch(e){list.innerHTML='<p style="color:#dc2626">'+esc(e.message)+'</p>'}}async function save(){msg.textContent='Menyimpan…';try{await api('savePromotion',{title:$('title').value,slug:$('slug').value,productId:$('productId').value,variant:$('variant').value,originalPrice:Number($('original').value||0),promoPrice:Number($('promoPrice').value||0),start:$('start').value||null,end:$('end').value||null});msg.textContent=' ✓ Disimpan';load()}catch(e){msg.textContent=' '+e.message}}async function del(id){if(!confirm('Matikan promosi ini?'))return;try{await api('deletePromotion',{id});load()}catch(e){alert(e.message)}}</script></body></html>
