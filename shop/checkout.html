<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO SHOP — Checkout</title><style>:root{--bg:#070707;--p:#111;--gold:#d9b45e;--line:#292929;--muted:#999}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 30px));margin:auto}.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.logo{font-weight:950;letter-spacing:3px}.logo span{color:var(--gold)}a{color:#bbb;text-decoration:none;font-size:12px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin:35px 0}.card{background:linear-gradient(180deg,#131313,#0e0e0e);border:1px solid var(--line);border-radius:18px;padding:22px}.eyebrow{color:var(--gold);font-size:10px;font-weight:800;letter-spacing:2px}.item{display:flex;justify-content:space-between;gap:15px;padding:15px 0;border-bottom:1px solid #242424}.name{font-weight:800}.meta{color:#888;font-size:11px;margin-top:5px}.total{display:flex;justify-content:space-between;font-size:20px;font-weight:900;margin-top:22px}.field{margin:13px 0}.field label{display:block;color:#999;font-size:11px;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #333;background:#090909;color:#fff;border-radius:10px;outline:none}.btn{width:100%;padding:15px;border:0;border-radius:11px;background:var(--gold);color:#080808;font-weight:950;cursor:pointer;margin-top:10px}.empty{text-align:center;color:#777;padding:40px 10px}.msg{font-size:12px;color:#aaa;margin-top:12px;line-height:1.5}@media(max-width:700px){.grid{grid-template-columns:1fr;margin-top:20px}}
</style></head><body><div class="wrap"><nav class="nav"><div class="logo">REQOO<span>.SHOP</span></div><a href="/shop/">← Continue shopping</a></nav><div class="grid"><section class="card"><div class="eyebrow">YOUR ORDER</div><div id="items"></div><div class="total"><span>Total</span><span id="total">RM 0.00</span></div></section><section class="card"><div class="eyebrow">CHECKOUT</div><div class="field"><label>Nama</label><input id="name" autocomplete="name"></div><div class="field"><label>No. WhatsApp</label><input id="phone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Referral code (jika ada)</label><input id="ref" autocapitalize="characters"></div><button class="btn" id="pay">Continue to payment</button><div class="msg" id="msg"></div></section></div></div><script src="/shop/cart.js"></script><script>
const $=id=>document.getElementById(id),cart=REQOO_CART.get();
function render(){if(!cart.length){$('items').innerHTML='<div class="empty">Cart kosong.<br><br><a href="/shop/">Pilih produk dahulu →</a></div>';$('pay').disabled=true;return} $('items').innerHTML=cart.map(x=>`<div class="item"><div><div class="name">${esc(x.name||'Product')}</div><div class="meta">${Number(x.qty||1)} × ${REQOO_CART.money(x.unitPrice)}</div></div><strong>${REQOO_CART.money(Number(x.unitPrice)*Number(x.qty||1))}</strong></div>`).join('');$('total').textContent=REQOO_CART.money(REQOO_CART.total())}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('pay').onclick=async()=>{if(!cart.length)return;const name=$('name').value.trim(),phone=$('phone').value.trim();if(!name||!phone){$('msg').textContent='Sila lengkapkan nama dan WhatsApp.';return}$('pay').disabled=true;$('pay').textContent='Creating order…';try{const r=await fetch('/api/shop',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({action:'createOrder',productType:'SHOP',customerName:name,phone,email:$('email').value.trim(),amount:REQOO_CART.total(),referralCode:$('ref').value.trim(),items:cart})}).then(x=>x.json());if(!r.ok)throw Error(r.error||'Order gagal');$('msg').innerHTML=`Order <strong>${esc(r.orderRef)}</strong> telah dicipta. Payment gateway akan disambungkan selepas credential Billplz production dimasukkan.`;localStorage.setItem('reqoo_last_order',r.orderRef)}catch(e){$('msg').textContent=e.message;$('pay').disabled=false;$('pay').textContent='Continue to payment'}};render();
</script></body></html>
