<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO SHOP — Checkout</title><style>:root{--bg:#070707;--p:#111;--gold:#d9b45e;--line:#292929;--muted:#999;--green:#35c98b;--red:#ff7777}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#d9b45e14,transparent 30%),var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 30px));margin:auto}.nav{height:70px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.logo{font-weight:950;letter-spacing:3px}.logo span{color:var(--gold)}a{color:#bbb;text-decoration:none;font-size:12px}.grid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin:35px 0}.card{background:linear-gradient(180deg,#131313,#0e0e0e);border:1px solid var(--line);border-radius:18px;padding:22px}.item{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:12px;padding:15px 0;border-bottom:1px solid #242424}.thumb{width:52px;height:52px;border-radius:9px;object-fit:cover;background:#181818}.name{font-weight:800}.meta{color:#888;font-size:11px;margin-top:5px}.qty{display:flex;align-items:center;gap:7px;margin-top:8px}.qty button{width:25px;height:25px;border:1px solid #444;background:#171717;color:#fff;border-radius:6px;cursor:pointer}.qty span{min-width:18px;text-align:center;font-size:12px}.summary{margin-top:20px}.row{display:flex;justify-content:space-between;padding:6px 0;color:#aaa;font-size:13px}.discount{color:var(--green)}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:900;margin-top:12px;padding-top:14px;border-top:1px solid #333}.promo{display:flex;gap:8px;margin:18px 0}.promo input{flex:1;padding:12px;border:1px solid #333;background:#090909;color:#fff;border-radius:9px;text-transform:uppercase}.promo button{padding:12px 14px;border:1px solid #5b4b2b;background:#17130b;color:#f3dfac;border-radius:9px;font-weight:900;cursor:pointer}.promo-msg{font-size:11px;min-height:16px;margin-top:-10px;margin-bottom:10px;color:#999}.promo-msg.ok{color:var(--green)}.promo-msg.bad{color:var(--red)}.field{margin:13px 0}.field label{display:block;color:#999;font-size:11px;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #333;background:#090909;color:#fff;border-radius:10px;outline:none}.btn{width:100%;padding:15px;border:0;border-radius:11px;background:var(--gold);color:#080808;font-weight:950;cursor:pointer;margin-top:10px}.wa-btn{width:100%;padding:13px;border:1px solid #315c42;border-radius:11px;background:#12351f;color:#d9ffe5;font-weight:900;cursor:pointer;margin-top:10px}.empty{text-align:center;color:#777;padding:40px 10px}.msg{font-size:12px;color:#aaa;margin-top:12px;line-height:1.5}.wa-note{font-size:11px;color:#888;margin-top:7px;line-height:1.4}@media(max-width:700px){.grid{grid-template-columns:1fr;margin-top:20px}}</style></head><body><div class="wrap"><nav class="nav"><div class="logo">REQOO<span>.SHOP</span></div><a href="/shop/">← Continue shopping</a></nav><div class="grid"><section class="card"><div class="eyebrow">YOUR ORDER</div><div id="items"></div><div class="promo"><input id="promo" placeholder="PROMO CODE" autocomplete="off"><button id="apply">APPLY</button></div><div class="promo-msg" id="promoMsg"></div><div class="summary"><div class="row"><span>Subtotal</span><strong id="subtotal">RM 0.00</strong></div><div class="row discount" id="discountRow" style="display:none"><span id="discountLabel">Discount</span><strong id="discount">- RM 0.00</strong></div><div class="total"><span>Total</span><span id="total">RM 0.00</span></div></div></section><section class="card"><div class="eyebrow">CHECKOUT</div><div class="field"><label>Nama</label><input id="name" autocomplete="name"></div><div class="field"><label>No. WhatsApp</label><input id="phone" inputmode="tel" autocomplete="tel"></div><div class="field"><label>Email</label><input id="email" type="email" autocomplete="email"></div><div class="field"><label>Referral code (jika ada)</label><input id="ref" autocapitalize="characters"></div><button class="btn" id="pay">CONTINUE TO PAYMENT</button><div class="msg" id="msg"></div><div id="waBox" style="display:none"><button class="wa-btn" id="wa">💬 Hantar Ringkasan Order ke WhatsApp</button><div class="wa-note">WhatsApp akan dibuka dengan mesej siap.</div></div></section></div></div><script src="/shop/cart.js"></script><script src="/shop/catalog.js"></script><script>const $=id=>document.getElementById(id);const WA_BUSINESS='60103982803';let lastWhatsAppText='';function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function promoResult(){return findPromotion(REQOO_CART.promo(),REQOO_CART.subtotal())}function render(){const cart=REQOO_CART.get();if(!cart.length){$('items').innerHTML='<div class="empty">Cart kosong.<br><br><a href="/shop/">Pilih produk dahulu →</a></div>';$('pay').disabled=true;return}$('pay').disabled=false;$('items').innerHTML=cart.map(x=>`<div class="item"><img class="thumb" src="${esc(x.image||'/shop/product-1.jpg')}" alt=""><div><div class="name">${esc(x.name||'Product')}</div><div class="meta">${REQOO_CART.money(x.unitPrice)} / unit</div><div class="qty"><button onclick="qty('${esc(x.sku||x.id||x.name)}',${Number(x.qty||1)-1})">−</button><span>${Number(x.qty||1)}</span><button onclick="qty('${esc(x.sku||x.id||x.name)}',${Number(x.qty||1)+1})">+</button></div></div><strong>${REQOO_CART.money(Number(x.unitPrice)*Number(x.qty||1))}</strong></div>`).join('');const sub=REQOO_CART.subtotal(),p=promoResult();$('subtotal').textContent=REQOO_CART.money(sub);if(p.ok){$('discountRow').style.display='flex';$('discountLabel').textContent=`${p.label} (${p.code})`;$('discount').textContent='- '+REQOO_CART.money(p.discount);$('total').textContent=REQOO_CART.money(sub-p.discount);$('promoMsg').textContent='Promo berjaya digunakan ✓';$('promoMsg').className='promo-msg ok'}else{$('discountRow').style.display='none';$('total').textContent=REQOO_CART.money(sub);$('promoMsg').textContent=REQOO_CART.promo()?(p.message||'Promo code tidak sah.') :'';$('promoMsg').className='promo-msg bad'}$('promo').value=REQOO_CART.promo()}function qty(key,n){REQOO_CART.setQty(key,n);render()}$('apply').onclick=()=>{REQOO_CART.setPromo($('promo').value.trim().toUpperCase());render()};$('pay').onclick=async()=>{const cart=REQOO_CART.get();if(!cart.length)return;msg.textContent='Menyediakan order…';pay.disabled=true;try{const p=promoResult();const body={action:'createOrder',productType:'SHOP',customerName:$('name').value.trim(),phone:$('phone').value.trim(),email:$('email').value.trim(),promotionCode:p.ok?p.code:'',referralCode:$('ref').value.trim(),shipping:0,items:cart.map(x=>({productId:x.productId||x.id,variant:x.variant||x.variantName||x.size,qty:Number(x.qty||1)}))};const r=await fetch('/api/shop',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!j.ok)throw Error(j.error||'Order gagal');if(j.payment?.billUrl){location.href=j.payment.billUrl;return}msg.textContent=j.payment?.provider==='MAYBANK_QR'?'Order diterima. Bayaran QR menunggu semakan Admin.':'Order diterima.';waBox.style.display='block';lastWhatsAppText=`REQOO ORDER ${j.orderRef}\nNama: ${body.customerName}\nTotal: RM${Number(j.amount||0).toFixed(2)}`;REQOO_CART.clear()}catch(e){msg.textContent=e.message;pay.disabled=false}};$('wa').onclick=()=>{location.href='https://wa.me/'+WA_BUSINESS+'?text='+encodeURIComponent(lastWhatsAppText)};render();</script></body></html>
