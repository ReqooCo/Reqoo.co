<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO.CO — Shop Hero Settings</title><style>*{box-sizing:border-box}body{margin:0;background:#080808;color:#f5f5f5;font:15px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;padding:24px}.box{max-width:760px;margin:auto;background:#121212;border:1px solid #333;border-radius:20px;padding:24px;box-shadow:0 20px 70px #0008}h1{margin:0 0 8px}p{color:#999;line-height:1.5}.hint{font-size:13px;color:#888}label{display:block;margin:16px 0 7px;color:#bbb;font-size:13px}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #444;background:#090909;color:#fff}button{margin-top:12px;background:#d9b45e;color:#111;font-weight:800;cursor:pointer}.secondary{background:#1b1b1b;color:#eee}.preview{margin-top:18px;border:1px solid #333;border-radius:14px;overflow:hidden;background:#090909}.preview img{width:100%;height:360px;object-fit:cover;display:block}.msg{margin-top:14px;min-height:20px}.ok{color:#9ad69a}.err{color:#ff8d8d}</style></head><body><main class="box"><h1>Shop Hero Settings</h1><p>Tukar gambar Hero Shop secara global. Perubahan disimpan dalam D1 dan akan digunakan oleh semua pelawat — bukan localStorage peranti.</p><label>Token Admin</label><input id="token" type="password" autocomplete="current-password" placeholder="Password / token Admin"><label>Upload gambar Hero</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><label>Atau masukkan URL gambar</label><input id="url" placeholder="https://.../gambar.jpg atau /shop/assets/..."><div class="preview"><img id="preview" alt="Hero preview"></div><button id="save">Simpan Hero Global</button><button id="reset" class="secondary" type="button">Reset ke default</button><div id="msg" class="msg hint"></div></main><script>(()=>{const $=id=>document.getElementById(id),DEFAULT='/shop/assets/plaque-signature.jpg';let selected='';function token(){return $('token').value.trim()||localStorage.getItem('reqoo_admin_token')||''}function show(text,ok=false){$('msg').textContent=text;$('msg').className='msg '+(ok?'ok':'err')}async function load(){try{const r=await fetch('/api/shop-hero?_='+Date.now(),{cache:'no-store'}),j=await r.json();selected=String(j?.url||DEFAULT);$('preview').src=selected;$('url').value=selected}catch{selected=DEFAULT;$('preview').src=DEFAULT}}$('file').onchange=()=>{const f=$('file').files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{$('preview').src=String(r.result);selected='';show('Gambar dipilih. Tekan Simpan Hero Global.',true)};r.readAsDataURL(f)};$('url').oninput=()=>{selected=$('url').value.trim();if(selected)$('preview').src=selected};$('save').onclick=async()=>{const t=token(),f=$('file').files?.[0];if(!t)return show('Masukkan token Admin dahulu.');$('save').disabled=true;show('Menyimpan…',true);try{if(f){const form=new FormData();form.append('file',f);form.append('productId','__SHOP_HERO__');const up=await fetch('/api/product-image',{method:'POST',headers:{'X-Reqoo-Admin-Token':t},body:form});const uj=await up.json();if(!up.ok||!uj.ok)throw Error(uj.error||'Upload gagal');selected=String(uj.url||'')}if(!selected)throw Error('Pilih gambar atau masukkan URL dahulu.');const r=await fetch('/api/shop-hero',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':t},body:JSON.stringify({url:selected})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Simpan gagal');$('url').value=j.url;$('preview').src=j.url;$('file').value='';try{localStorage.setItem('reqoo_admin_token',t)}catch{}show('✓ Hero global berjaya disimpan.',true)}catch(e){show(e.message||'Simpan gagal')}finally{$('save').disabled=false}};$('reset').onclick=async()=>{const t=token();if(!t)return show('Masukkan token Admin dahulu.');try{const r=await fetch('/api/shop-hero',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':t},body:JSON.stringify({url:DEFAULT})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'Reset gagal');selected=DEFAULT;$('url').value=DEFAULT;$('preview').src=DEFAULT;show('✓ Hero kembali ke default.',true)}catch(e){show(e.message||'Reset gagal')}};load()})();</script></body></html>
