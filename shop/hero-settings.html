<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reqoo Shop — Hero Settings</title><style>body{margin:0;background:#0b0b0b;color:#f5f5f5;font:15px system-ui;padding:24px}.box{max-width:720px;margin:auto;background:#151515;border:1px solid #333;border-radius:20px;padding:24px}h1{margin-top:0}label{display:block;margin:16px 0 8px;color:#bbb}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #444;background:#090909;color:#fff}button{margin-top:14px;background:#d9b45e;color:#111;font-weight:800;cursor:pointer}.preview{margin-top:18px;border:1px solid #333;border-radius:14px;overflow:hidden;background:#090909}.preview img{width:100%;height:320px;object-fit:cover;display:block}.hint{color:#888;font-size:13px;line-height:1.5}.row{display:flex;gap:10px}.row>*{flex:1}</style></head><body><main class="box"><h1>Shop Hero Settings</h1><p class="hint">Tukar gambar Hero tanpa ubah code. Untuk versi frontend ini, pilihan disimpan pada browser peranti. Penyimpanan global ke server akan dibuat dalam backend Shop V2.</p><label>Pilih gambar</label><input id="file" type="file" accept="image/*"><label>Atau masukkan URL gambar</label><input id="url" placeholder="https://.../gambar.jpg"><div class="preview"><img id="preview" src="/assets/reqoo-hero-products.webp" alt="Hero preview"></div><button id="save">Simpan Hero</button><button id="reset" type="button">Reset ke default</button><p id="msg" class="hint"></p></main><script>(()=>{const KEY='reqoo_shop_hero_v2',file=document.querySelector('#file'),url=document.querySelector('#url'),preview=document.querySelector('#preview'),msg=document.querySelector('#msg');let selected='';try{selected=localStorage.getItem(KEY)||''}catch{}if(selected)preview.src=selected;file.onchange=()=>{const f=file.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{selected=String(r.result);preview.src=selected};r.readAsDataURL(f)};url.oninput=()=>{if(url.value.trim()){selected=url.value.trim();preview.src=selected}};document.querySelector('#save').onclick=()=>{if(!selected)return msg.textContent='Pilih gambar atau masukkan URL dahulu.';try{localStorage.setItem(KEY,selected);msg.textContent='Hero disimpan pada peranti ini. Buka Shop untuk semak.'}catch{msg.textContent='Gambar terlalu besar untuk simpan dalam browser. Guna URL gambar.'}};document.querySelector('#reset').onclick=()=>{try{localStorage.removeItem(KEY)}catch{}selected='';preview.src='/assets/reqoo-hero-products.webp';msg.textContent='Hero kembali ke default.'}})();</script></body></html>
