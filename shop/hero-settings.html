<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO Shop — Hero Settings</title><style>body{margin:0;background:#0b0b0b;color:#f5f5f5;font:15px system-ui;padding:24px}.box{max-width:720px;margin:auto;background:#151515;border:1px solid #333;border-radius:20px;padding:24px}h1{margin-top:0}label{display:block;margin:16px 0 8px;color:#bbb}input,button{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #444;background:#090909;color:#fff}button{margin-top:14px;background:#d9b45e;color:#111;font-weight:800;cursor:pointer}.preview{margin-top:18px;border:1px solid #333;border-radius:14px;overflow:hidden;background:#090909}.preview img{width:100%;height:320px;object-fit:cover;display:block}.hint{color:#888;font-size:13px;line-height:1.5}.ok{color:#8fd18f}.err{color:#ef8585}</style></head><body><main class="box"><h1>Shop Hero Settings</h1><p class="hint">Hero ini disimpan secara global di D1. Gambar boleh dimuat naik ke R2 melalui sesi Admin yang sama; selepas disimpan, semua pelanggan akan nampak Hero baharu.</p><label>Pilih gambar Hero</label><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><label>Atau masukkan URL gambar</label><input id="url" placeholder="https://.../gambar.jpg"><div class="preview"><img id="preview" src="/shop/assets/plaque-signature.jpg" alt="Hero preview"></div><button id="save">Simpan Hero</button><button id="reset" type="button">Reset ke default</button><p id="msg" class="hint"></p></main><script>(()=>{const API='/api/shop-hero',UPLOAD='/api/product-image',TOKEN_KEY='reqoo_admin_token',file=document.querySelector('#file'),url=document.querySelector('#url'),preview=document.querySelector('#preview'),msg=document.querySelector('#msg');let selected='';const token=()=>localStorage.getItem(TOKEN_KEY)||'';const say=(t,ok=false)=>{msg.textContent=t;msg.className='hint '+(ok?'ok':'err')};async function load(){try{const r=await fetch(API+'?t='+Date.now(),{cache:'no-store'});const d=await r.json();if(d.ok){selected=d.url||'';preview.src=selected||d.defaultUrl;url.value=/^https:\/\//i.test(selected)?selected:''}}catch{say('Tidak dapat membaca Hero semasa.')}}file.onchange=async()=>{const f=file.files?.[0];if(!f)return;if(!token())return say('Sesi Admin tiada. Buka Main Admin dan login dahulu.');say('Upload gambar…');try{const fd=new FormData();fd.append('file',f);fd.append('productId','__SHOP_HERO__');const r=await fetch(UPLOAD,{method:'POST',headers:{'X-Reqoo-Admin-Token':token()},body:fd});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Upload gagal');selected='https://api.reqoo.co'+d.url;preview.src=selected;url.value=selected;say('Gambar dimuat naik. Tekan Simpan Hero.',true)}catch(e){say(e.message||'Upload gagal')}}url.oninput=()=>{if(url.value.trim()){selected=url.value.trim();preview.src=selected}};document.querySelector('#save').onclick=async()=>{if(!selected)return say('Pilih gambar atau masukkan URL dahulu.');if(!token())return say('Sesi Admin tiada. Login dahulu di Main Admin.');say('Menyimpan…');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':token()},body:JSON.stringify({url:selected})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Simpan gagal');selected=d.url;preview.src=selected+'?v='+Date.now();say('Hero berjaya disimpan untuk semua pelanggan.',true)}catch(e){say(e.message||'Simpan gagal')}};document.querySelector('#reset').onclick=async()=>{if(!token())return say('Sesi Admin tiada. Login dahulu di Main Admin.');try{const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Token':token()},body:JSON.stringify({url:'/shop/assets/plaque-signature.jpg'})});const d=await r.json();if(!r.ok||!d.ok)throw Error(d.error||'Reset gagal');selected=d.url;preview.src=selected+'?v='+Date.now();url.value='';say('Hero kembali ke default.',true)}catch(e){say(e.message||'Reset gagal')}};load()})();</script></body></html>
