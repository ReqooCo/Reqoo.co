<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO.CO — Special Offers</title><style>
*{box-sizing:border-box}:root{--bg:#070707;--panel:#111;--gold:#d9b45e;--gold2:#f3d98f;--line:#292929;--muted:#999}body{margin:0;background:var(--bg);color:#f6f6f6;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.12;background-image:linear-gradient(#d9b45e10 1px,transparent 1px),linear-gradient(90deg,#d9b45e10 1px,transparent 1px);background-size:42px 42px}.wrap{width:min(1120px,calc(100% - 30px));margin:auto}header{border-bottom:1px solid #222;background:#080808eF;backdrop-filter:blur(18px)}nav{height:70px;display:flex;align-items:center;justify-content:space-between}.logo{text-decoration:none;font-weight:950;letter-spacing:4px}.mark{display:inline-grid;place-items:center;width:32px;height:32px;border:1px solid var(--gold);border-radius:9px;color:var(--gold);margin-right:7px}.gold{color:var(--gold)}.links{display:flex;gap:10px}.links a{padding:10px 14px;border:1px solid #333;border-radius:999px;text-decoration:none;font-size:12px;font-weight:900}.hero{text-align:center;padding:72px 0 42px}.eyebrow{letter-spacing:5px;font-size:10px;color:var(--gold);font-weight:900}.hero h1{font-size:clamp(48px,8vw,88px);line-height:.9;letter-spacing:-6px;margin:18px 0}.hero h1 span{background:linear-gradient(90deg,var(--gold),var(--gold2));-webkit-background-clip:text;background-clip:text;color:transparent}.hero p{max-width:680px;margin:auto;color:#999;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:22px 0 80px}.card{background:linear-gradient(180deg,#151515,#0c0c0c);border:1px solid #292929;border-radius:22px;overflow:hidden;box-shadow:0 12px 30px #0005}.pic{aspect-ratio:1.1;background:#111;padding:8px}.pic img{width:100%;height:100%;object-fit:cover;border-radius:14px}.body{padding:20px}.tag{font-size:9px;letter-spacing:3px;color:var(--gold);font-weight:900}.body h2{margin:8px 0}.sub,.desc{color:#999;font-size:13px;line-height:1.6}.price{font-size:25px;font-weight:950;color:var(--gold2);margin:14px 0}.old{text-decoration:line-through;color:#666;font-size:13px;margin-left:8px}.variant{display:inline-block;background:#1b1b1b;border:1px solid #333;border-radius:999px;padding:6px 9px;color:#bbb;font-size:10px;margin:3px 0 12px}.btn{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,var(--gold),#efcd77);color:#080808;padding:13px;border-radius:999px;font-weight:950}.empty,.loading{text-align:center;color:#888;padding:70px 0;grid-column:1/-1}footer{border-top:1px solid #222;padding:30px 0 45px;color:#777;font-size:12px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{letter-spacing:-3px}.links a:first-child{display:none}}
</style></head><body><header><div class="wrap"><nav><a class="logo" href="/"><span class="mark">R</span>REQOO<span class="gold">.CO</span></a><div class="links"><a href="/shop/">Shop</a><a href="/">Home</a></div></nav></div></header><main class="wrap"><section class="hero"><div class="eyebrow">REQOO.CO SPECIAL</div><h1>Special <span>offers.</span></h1><p>Harga promo terpilih untuk masa yang ditetapkan. Tekan <b>Beli Sekarang</b> dan promo akan dibawa masuk ke catalogue secara automatik.</p></section><section id="promoGrid" class="grid"><div class="loading">Memuatkan promosi...</div></section></main><footer><div class="wrap">© REQOO.CO — Custom made. Just for you.</div></footer><script>
const API='https://script.google.com/macros/s/AKfycbyFy2y76srL3i-wIp1kesaXw5KZl6fpTTCbLJk_5lQBUwl0QKkdRsxo6ynF7XCjnKb1MA/exec';const grid=document.getElementById('promoGrid');const money=n=>'RM'+Number(n||0).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function active(p){if(!p)return false;const a=p.active===true||String(p.active).toLowerCase()==='true'||String(p.active)==='1';if(!a)return false;const now=new Date();if(p.start&&now<new Date(p.start+'T00:00:00'))return false;if(p.end&&now>new Date(p.end+'T23:59:59'))return false;return true}async function load(){try{const r=await fetch(API+'?action=listPromotions');const j=await r.json();const a=(j.promotions||[]).filter(active);if(!a.length){grid.innerHTML='<div class="empty">Tiada promosi aktif sekarang.</div>';return}grid.innerHTML=a.map(p=>`<article class="card"><div class="pic"><img src="${esc(p.image||'assets/plaque-basic.jpg')}" onerror="this.src='assets/plaque-basic.jpg'" alt="${esc(p.title)}"></div><div class="body"><div class="tag">SPECIAL OFFER</div><h2>${esc(p.title)}</h2><div class="sub">${esc(p.subtitle||'Harga istimewa')}</div><div class="variant">${esc(p.productName||'Product')} • ${esc(p.variant||'')}</div><div class="price">${money(p.promoPrice)} <span class="old">${money(p.originalPrice)}</span></div><div class="desc">${esc(p.description||'')}</div><br><a class="btn" href="/shop/?promo=${encodeURIComponent(p.slug)}">Beli Sekarang →</a></div></article>`).join('')}catch(e){console.error(e);grid.innerHTML='<div class="empty">Tak dapat memuatkan promosi. Cuba refresh.</div>'}}load();
</script></body></html>
