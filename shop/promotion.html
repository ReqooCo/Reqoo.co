<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO.CO — Special Price</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.12;background-image:linear-gradient(#d9b45e22 1px,transparent 1px),linear-gradient(90deg,#d9b45e22 1px,transparent 1px);background-size:42px 42px}.wrap{width:min(1120px,92%);margin:auto}.hero{text-align:center;padding:72px 0 42px}.eyebrow{letter-spacing:5px;font-size:10px;color:#d9b45e;font-weight:900}.hero h1{font-size:clamp(48px,8vw,90px);line-height:.9;letter-spacing:-5px;margin:18px 0}.gold{color:#d9b45e}.hero p{max-width:680px;margin:auto;color:#999;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;padding:20px 0 80px}.card{background:linear-gradient(180deg,#151515,#0c0c0c);border:1px solid #292929;border-radius:22px;overflow:hidden}.pic{aspect-ratio:1.15;background:#111}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:20px}.tag{font-size:9px;letter-spacing:3px;color:#d9b45e;font-weight:900}.body h2{margin:8px 0}.sub,.desc{color:#999;font-size:13px;line-height:1.6}.price{font-size:25px;font-weight:900;color:#f2d68d;margin:14px 0}.old{text-decoration:line-through;color:#666;font-size:13px;margin-left:8px}.btn{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,#d9b45e,#f0cf79);color:#080808;padding:13px;border-radius:999px;font-weight:900}.empty{text-align:center;color:#888;padding:70px 0}.loading{text-align:center;color:#777;padding:50px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{letter-spacing:-3px}}
</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">REQOO.CO SPECIAL</div><h1>Custom made.<br><span class="gold">Special price.</span></h1><p>Pilih promosi yang sedang berjalan. Tekan <b>Beli Sekarang</b> dan harga promo akan dibawa terus ke shop dan checkout.</p></section><section id="promoGrid" class="grid"><div class="loading">Memuatkan promosi...</div></section></main><script>
const API='https://script.google.com/macros/s/AKfycbyFy2y76srL3i-wIp1kesaXw5KZl6fpTTCbLJk_5lQBUwl0QKkdRsxo6ynF7XCjnKb1MA/exec';
const grid=document.getElementById('promoGrid');
const money=n=>'RM'+Number(n||0).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function load(){try{const r=await fetch(API+'?action=listPromotions');const j=await r.json();const a=(j.promotions||[]).filter(p=>p.active);if(!a.length){grid.innerHTML='<div class="empty">Tiada promosi aktif sekarang.</div>';return}grid.innerHTML=a.map(p=>`<article class="card"><div class="pic"><img src="${esc(p.image||'assets/product-1.jpg')}" onerror="this.src='assets/product-1.jpg'"></div><div class="body"><div class="tag">SPECIAL OFFER</div><h2>${esc(p.title)}</h2><div class="sub">${esc(p.subtitle)}</div><div class="price">${money(p.promoPrice)} <span class="old">${money(p.originalPrice)}</span></div><div class="desc">${esc(p.description)}</div><br><a class="btn" href="index.html?promo=${encodeURIComponent(p.slug)}" onclick="sessionStorage.setItem('REQOO_PROMO',JSON.stringify({promotion:${JSON.stringify(p)},savedAt:Date.now()}))">Beli Sekarang</a></div></article>`).join('')}catch(e){console.error(e);grid.innerHTML='<div class="empty">Tak dapat memuatkan promosi. Cuba refresh.</div>'}}
load();
</script></body></html>
