<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO.CO — Special Price</title><style>
*{box-sizing:border-box}body{margin:0;background:#070707;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body:before{content:"";position:fixed;inset:0;z-index:-1;opacity:.12;background-image:linear-gradient(#d9b45e22 1px,transparent 1px),linear-gradient(90deg,#d9b45e22 1px,transparent 1px);background-size:42px 42px}.wrap{width:min(1120px,92%);margin:auto}.hero{text-align:center;padding:72px 0 42px}.eyebrow{letter-spacing:5px;font-size:10px;color:#d9b45e;font-weight:900}.hero h1{font-size:clamp(48px,8vw,90px);line-height:.9;letter-spacing:-5px;margin:18px 0}.gold{color:#d9b45e}.hero p{max-width:680px;margin:auto;color:#999;line-height:1.7}.grid{display:grid;grid-template-columns:1fr;gap:24px;padding:20px 0 80px}.campaign{background:linear-gradient(180deg,#151515,#0c0c0c);border:1px solid #292929;border-radius:24px;padding:20px}.campaignHead{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;border-bottom:1px solid #292929;padding-bottom:18px}.campaignHead h2{font-size:30px;margin:8px 0}.dates{color:#777;font-size:12px}.items{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding-top:18px}.item{background:#0a0a0a;border:1px solid #252525;border-radius:16px;overflow:hidden}.item .pic{aspect-ratio:1.15}.item .body{padding:14px}.item h3{margin:5px 0}.muted{color:#999;font-size:12px}.btn{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,#d9b45e,#f0cf79);color:#080808;padding:11px;border-radius:999px;font-weight:900}.empty{text-align:center;color:#888;padding:70px 0}.loading{text-align:center;color:#777;padding:50px}@media(max-width:900px){.items{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.items{grid-template-columns:1fr}.campaignHead{display:block}.hero h1{letter-spacing:-3px}}.card{background:linear-gradient(180deg,#151515,#0c0c0c);border:1px solid #292929;border-radius:22px;overflow:hidden}.pic{aspect-ratio:1.15;background:#111}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:20px}.tag{font-size:9px;letter-spacing:3px;color:#d9b45e;font-weight:900}.body h2{margin:8px 0}.sub,.desc{color:#999;font-size:13px;line-height:1.6}.price{font-size:25px;font-weight:900;color:#f2d68d;margin:14px 0}.old{text-decoration:line-through;color:#666;font-size:13px;margin-left:8px}.btn{display:block;text-align:center;text-decoration:none;background:linear-gradient(135deg,#d9b45e,#f0cf79);color:#080808;padding:13px;border-radius:999px;font-weight:900}.empty{text-align:center;color:#888;padding:70px 0}.loading{text-align:center;color:#777;padding:50px}@media(max-width:800px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.hero h1{letter-spacing:-3px}}
</style></head><body><main class="wrap"><section class="hero"><div class="eyebrow">REQOO.CO SPECIAL</div><h1>Custom made.<br><span class="gold">Special price.</span></h1><p>Semua promosi aktif dipaparkan di sini. Tekan <b>Beli Sekarang</b> untuk masuk ke shop dengan harga promo yang betul.</p></section><section id="promoGrid" class="grid"><div class="loading">Memuatkan promosi...</div></section></main><script>
const API='https://script.google.com/macros/s/AKfycbyFy2y76srL3i-wIp1kesaXw5KZl6fpTTCbLJk_5lQBUwl0QKkdRsxo6ynF7XCjnKb1MA/exec';
const grid=document.getElementById('promoGrid');
const money=n=>'RM'+Number(n||0).toFixed(2);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function groupCampaigns(rows){
  const map=new Map();
  rows.forEach(p=>{
    const key=String(p.slug||'').trim().toLowerCase();
    if(!key)return;
    if(!map.has(key))map.set(key,{slug:key,title:p.title,subtitle:p.subtitle,start:p.start,end:p.end,description:p.description,items:[]});
    const c=map.get(key);
    c.items.push(p);
    if(!c.title)c.title=p.title;
    if(!c.subtitle)c.subtitle=p.subtitle;
    if(!c.description)c.description=p.description;
  });
  return [...map.values()];
}
function campaignCard(c){
  const items=c.items;
  const first=items[0]||{};
  return `<article class="campaign"><div class="campaignHead"><div><div class="tag">SPECIAL CAMPAIGN</div><h2>${esc(c.title||c.slug)}</h2><div class="sub">${esc(c.subtitle||'')}</div><div class="desc">${esc(c.description||'')}</div></div><div class="dates">${esc(c.start||'')} ${c.end?'→ '+esc(c.end):''}</div></div><div class="items">${items.map(p=>`<div class="item"><div class="pic"><img src="${esc(p.image||'assets/product-1.jpg')}" onerror="this.src='assets/product-1.jpg'"></div><div class="body"><div class="muted">${esc(p.productName||'')}</div><h3>${esc(p.variant||'')}</h3><div class="price">${money(p.promoPrice)} <span class="old">${money(p.originalPrice)}</span></div><a class="btn" href="index.html?promo=${encodeURIComponent(c.slug)}&product=${encodeURIComponent(p.productId)}&variant=${encodeURIComponent(p.variant)}">Beli Sekarang</a></div></div>`).join('')}</div></article>`;
}
async function load(){
  try{
    const r=await fetch(API+'?action=listPromotions',{cache:'no-store'});
    const j=await r.json();
    const a=(j.promotions||[]).filter(p=>p.active);
    if(!a.length){grid.innerHTML='<div class="empty">Tiada promosi aktif sekarang.</div>';return;}
    const campaigns=groupCampaigns(a);
    try{sessionStorage.setItem('REQOO_PROMOS',JSON.stringify({promotions:a,savedAt:Date.now()}));}catch(e){}
    grid.innerHTML=campaigns.map(c=>campaignCard(c)).join('');
  }catch(e){
    console.error(e);
    grid.innerHTML='<div class="empty">Tak dapat memuatkan promosi. Cuba refresh.</div>';
  }
}
load();
</script></body></html>
