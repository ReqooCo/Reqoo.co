<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO.CO — Special Price</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(1050px,calc(100% - 28px));margin:auto}.gold{color:#d9b45e}.nav{height:70px;display:flex;align-items:center;border-bottom:1px solid #292929}.logo{font-weight:950;letter-spacing:4px}.spacer{margin-left:auto}.btn{display:inline-block;padding:10px 13px;border-radius:10px;background:#222;color:#fff;text-decoration:none;font-weight:900}.hero{padding:42px 0 20px}.muted{color:#888}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:linear-gradient(180deg,#151515,#0d0d0d);border:1px solid #292929;border-radius:18px;padding:15px}.card img{width:100%;aspect-ratio:1.5/1;object-fit:cover;border-radius:12px;background:#181818}.tag{display:inline-block;margin-top:12px;padding:5px 8px;border-radius:99px;background:#2a2111;color:#f0cf79;font-size:9px;font-weight:900}.price{margin-top:10px;font-size:22px;font-weight:950}.old{text-decoration:line-through;color:#777;font-size:12px;margin-left:6px}.card h2{font-size:16px}.card p{font-size:11px;color:#999;line-height:1.5}@media(max-width:760px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><nav class="nav"><div class="logo">REQOO<span class="gold">.CO</span></div><div class="spacer"></div><a class="btn" href="/shop/">← Shop</a></nav><section class="hero"><div class="muted">REQOO.CO SPECIAL PRICE</div><h1>Promosi & harga istimewa.</h1><p class="muted">Semua promosi aktif datang terus daripada SHOP database.</p></section><section id="grid" class="grid"><div class="muted">Memuatkan promosi…</div></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=n=>'RM'+Number(n||0).toFixed(2);async function load(){try{const r=await fetch('/api/shop?action=listPromotions',{cache:'no-store'}),j=await r.json();if(!j.ok)throw Error(j.error||'Gagal memuatkan');grid.innerHTML=(j.promotions||[]).length?j.promotions.map(p=>`<article class="card"><img src="${esc(p.image||'/shop/product-1.jpg')}" alt=""><span class="tag">PROMO</span><h2>${esc(p.title)}</h2><p>${esc(p.description||p.subtitle||'')}</p><div class="price">${money(p.promoPrice)} <span class="old">${money(p.originalPrice)}</span></div><p><a class="btn" href="/shop/?promo=${encodeURIComponent(p.slug)}">Guna promosi →</a></p></article>`).join(''):'<div class="muted">Tiada promosi aktif.</div>'}catch(e){grid.innerHTML='<div class="muted">'+esc(e.message)+'</div>'}}load();</script></body></html>
