<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO.CO — Shop Admin</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(1250px,calc(100% - 28px));margin:auto}header{background:#fff;border-bottom:1px solid #e2e8f0}.nav{min-height:68px;display:flex;align-items:center;gap:12px}.brand{font-weight:950;letter-spacing:4px}.gold{color:#2563eb}.spacer{margin-left:auto}.btn{border:1px solid #dbe3ee;border-radius:10px;padding:10px 14px;font-weight:900;cursor:pointer;background:#fff;color:#172033}.primary{background:#2563eb;color:#fff;border-color:#2563eb}.login,.panel,.kpi{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 4px 18px rgba(15,23,42,.05)}.login{max-width:420px;margin:70px auto;padding:24px}.login h2{margin-top:0}input,select{width:100%;padding:11px;background:#fff;color:#172033;border:1px solid #d7e0eb;border-radius:10px;margin:8px 0 12px}.err{color:#dc2626;font-size:12px}.app{padding:22px 0 50px}.toolbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}.toolbar h1{margin:0;font-size:28px}.sub{color:#64748b;font-size:12px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.kpi{padding:16px}.label{font-size:11px;color:#64748b}.num{font-size:25px;font-weight:950;margin-top:6px}.panel{padding:17px;margin-top:14px}.panel h2{font-size:16px;margin:0 0 14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input{max-width:280px;margin:0}.filters select{width:auto;min-width:150px;margin:0}.table{overflow:auto;border:1px solid #e2e8f0;border-radius:14px}.row{display:grid;grid-template-columns:120px minmax(180px,1fr) 100px 100px 150px 90px;min-width:740px;border-bottom:1px solid #edf1f5;align-items:center}.row:last-child{border:0}.row>div{padding:11px 10px;font-size:11px}.head{background:#f8fafc;color:#64748b;font-weight:900;font-size:9px!important;letter-spacing:1px}.order{font-weight:900;color:#1d4ed8}.amount{font-weight:900}.badge{display:inline-block;padding:5px 8px;border-radius:999px;background:#fef3c7;color:#b45309;font-size:9px;font-weight:900}.badge.green{background:#dcfce7;color:#15803d}.empty{padding:35px;text-align:center;color:#777}.detail{background:#f8fafc;border:1px solid #e2e8f0;border-radius:12px;padding:12px;margin-top:10px}.detail small{color:#64748b;display:block}.detail b{display:block;margin-top:5px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}@media(max-width:700px){.kpis{grid-template-columns:1fr 1fr}.toolbar{align-items:flex-start}.toolbar h1{font-size:23px}}</style></head><body><header><div class="wrap nav"><div class="brand">REQOO<span class="gold">.CO</span> <span style="font-size:10px;color:#777;letter-spacing:2px">SHOP ADMIN</span></div><div class="spacer"></div><a class="btn" href="https://admin.reqoo.co">← MAIN ADMIN</a><button class="btn" id="refreshBtn">↻ Refresh</button></div></header><main class="wrap"><section id="loginBox" class="login"><h2>REQOO.CO Shop Admin</h2><div class="sub">Admin token disahkan oleh Cloudflare API.</div><input id="tokenInput" type="password" placeholder="Admin token"><button class="btn primary" style="width:100%" id="loginBtn">Masuk</button><div id="loginErr" class="err"></div></section><section id="app" class="app" style="display:none"><div class="toolbar"><div><h1>Shop Dashboard</h1><div class="sub">Cloudflare D1 / SHOP API</div></div></div><div class="kpis"><div class="kpi"><div class="label">ORDERS</div><div class="num" id="kOrders">—</div></div><div class="kpi"><div class="label">PAID</div><div class="num" id="kPaid">—</div></div><div class="kpi"><div class="label">REVENUE</div><div class="num" id="kRevenue">—</div></div><div class="kpi"><div class="label">CUSTOMERS</div><div class="num" id="kCustomers">—</div></div></div><section class="panel"><h2>Latest Orders</h2><div class="filters"><input id="searchInput" placeholder="Search order / customer"><select id="statusFilter"><option value="">All status</option><option>PAID</option><option>PENDING</option><option>PROCESSING</option><option>COMPLETED</option><option>CANCELLED</option></select></div><div id="ordersTable" class="table" style="margin-top:12px"></div></section><section class="panel"><h2>Products</h2><div id="products" class="sub">Loading…</div></section></section></main><script>const API='/api/shop-admin',TOKEN_KEY='REQOO_SHOP_ADMIN_TOKEN';const $=id=>document.getElementById(id);const money=n=>'RM'+Number(n||0).toFixed(2);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function headers(){return {'Content-Type':'application/json','X-Admin-Token':localStorage.getItem(TOKEN_KEY)||''}}async function api(action,data={}){const r=await fetch(API,{method:'POST',headers:headers(),body:JSON.stringify({action,...data})});let j={};try{j=await r.json()}catch(e){}if(!r.ok||!j.ok)throw Error(j.error||'API error');return j}async function checkToken(){const t=localStorage.getItem(TOKEN_KEY)||'';if(!t){showLogin();return false}try{await api('listOrders',{limit:1});showApp();return true}catch(e){localStorage.removeItem(TOKEN_KEY);showLogin();return false}}function showLogin(){$('loginBox').style.display='block';$('app').style.display='none'}function showApp(){$('loginBox').style.display='none';$('app').style.display='block'}async function doLogin(){const t=$('tokenInput').value.trim();if(!t)return;$('loginErr').textContent='Semak token…';localStorage.setItem(TOKEN_KEY,t);if(await checkToken()){load()}else $('loginErr').textContent='Token tidak sah.'}async function load(){if(!(await checkToken()))return;try{const[o,p,c]=await Promise.all([api('listOrders',{limit:100}),api('listProducts'),api('listCustomers')]);const orders=o.orders||[],products=p.products||[],customers=c.customers||[];const paid=orders.filter(x=>String(x.payment_status||x.payment).toUpperCase()==='PAID');$('kOrders').textContent=orders.length;$('kPaid').textContent=paid.length;$('kRevenue').textContent=money(paid.reduce((a,x)=>a+Number(x.total||0),0));$('kCustomers').textContent=customers.length;renderOrders(orders);$('products').textContent=products.length+' product(s) dalam D1.'}catch(e){$('ordersTable').innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}function renderOrders(orders){const q=$('searchInput').value.trim().toLowerCase(),sf=$('statusFilter').value.toUpperCase();const a=orders.filter(x=>(!q||`${x.orderNo||x.order_ref||''} ${x.name||x.customer_name||''} ${x.phone||''}`.toLowerCase().includes(q))&&(!sf||String(x.status||x.payment_status||'').toUpperCase()===sf));$('ordersTable').innerHTML='<div class="row head"><div>ORDER</div><div>CUSTOMER</div><div>TOTAL</div><div>PAYMENT</div><div>DATE</div><div>ACTION</div></div>'+(a.length?a.map(x=>{const ref=x.orderNo||x.order_ref||'';const pay=String(x.payment_status||x.payment||x.status||'');return `<div class="row"><div class="order">${esc(ref)}</div><div><b>${esc(x.name||x.customer_name||'—')}</b><br><small>${esc(x.phone||'')}</small></div><div class="amount">${money(x.total)}</div><div><span class="badge ${pay.toUpperCase()==='PAID'?'green':''}">${esc(pay)}</span></div><div>${esc(String(x.timestamp||'').slice(0,16))}</div><div><button class="btn" onclick="viewOrder('${esc(ref)}')">View</button></div></div>`}).join(''):'<div class="empty">Tiada order.</div>')}async function viewOrder(ref){try{const r=await api('getOrder',{orderRef:ref}),o=r.order||{},items=r.items||[];const html=`<div class="detail"><small>Customer</small><b>${esc(o.customer_name||o.name)}</b></div><div class="detail"><small>Phone</small><b>${esc(o.phone)}</b></div><div class="detail"><small>Payment</small><b>${esc(o.payment_status||o.status)}</b></div><div class="detail"><small>Total</small><b>${money(o.total)}</b></div><div class="detail"><small>Items</small>${items.map(x=>`<div style="margin-top:8px">${esc(x.product_name)} · ${esc(x.variant_name)} × ${x.qty} — ${money(x.line_total)}</div>`).join('')}</div><div class="actions"><button class="btn primary" onclick="setStatus('${esc(ref)}','PROCESSING')">Processing</button><button class="btn" onclick="setStatus('${esc(ref)}','COMPLETED')">Completed</button><button class="btn" onclick="closeDetail()">Tutup</button></div>`;let d=document.createElement('div');d.id='detailOverlay';d.style='position:fixed;inset:0;background:#0006;display:flex;align-items:center;justify-content:center;padding:15px;z-index:99';d.innerHTML=`<div style="background:#fff;border-radius:18px;padding:20px;width:min(650px,100%);max-height:90vh;overflow:auto"><h2 style="margin-top:0">${esc(ref)}</h2>${html}</div>`;document.body.appendChild(d)}catch(e){alert(e.message)}}function closeDetail(){document.getElementById('detailOverlay')?.remove()}async function setStatus(ref,status){try{await api('status',{orderRef:ref,status});closeDetail();load()}catch(e){alert(e.message)}}$('loginBtn').onclick=doLogin;$('refreshBtn').onclick=load;$('searchInput').oninput=()=>load();$('statusFilter').onchange=()=>load();checkToken().then(ok=>{if(ok)load()});</script></body></html>
