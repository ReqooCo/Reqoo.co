<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO.CO — Admin Pro</title><style>
*{box-sizing:border-box}:root{--bg:#070707;--panel:#111;--line:#292929;--gold:#d9b45e;--muted:#929292}body{margin:0;background:var(--bg);color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1250px;margin:auto;padding:20px}header{position:sticky;top:0;z-index:5;background:#080808ee;border-bottom:1px solid #292929;padding:16px 20px}.brand{font-weight:950;letter-spacing:4px}.gold{color:var(--gold)}.login,.card{background:#101010;border:1px solid #292929;border-radius:18px;padding:20px}.login{max-width:430px;margin:70px auto}input,select{width:100%;padding:12px;border:1px solid #333;background:#171717;color:#fff;border-radius:10px;margin:8px 0 14px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.goldbtn{background:linear-gradient(135deg,var(--gold),#ebcc7b);color:#111}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select,.toolbar input{width:auto;margin:0}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:18px 0}.stat{background:#111;border:1px solid #292929;border-radius:14px;padding:16px}.stat small{color:#888}.stat b{display:block;font-size:25px;margin-top:7px;color:#eee}.dash{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;margin-bottom:14px}.chart{height:260px;display:flex;align-items:end;gap:10px;padding:15px;border-top:1px solid #222}.bar{flex:1;min-width:12px;background:linear-gradient(180deg,var(--gold),#6b5527);border-radius:8px 8px 0 0;position:relative}.bar span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:9px;color:#bbb;white-space:nowrap}.bar em{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:9px;color:#777;font-style:normal;margin-top:6px}.donut{display:flex;flex-direction:column;gap:9px;padding-top:10px}.legend{display:flex;justify-content:space-between;border-bottom:1px solid #222;padding:9px 0}.table{overflow:auto;background:#111;border:1px solid #292929;border-radius:16px}.row{display:grid;grid-template-columns:150px 155px 1fr 100px 150px 120px;gap:10px;padding:13px;border-bottom:1px solid #222;min-width:900px}.head{font-weight:800;color:var(--gold)}.muted{color:#999}.link{color:var(--gold)}.receipt{max-width:90px;max-height:70px;object-fit:contain;border-radius:8px}.pill{padding:5px 8px;border-radius:999px;background:#292929;font-size:12px}.detail{position:fixed;inset:0;background:#000d;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.detail.open{display:flex}.detailbox{max-width:850px;width:100%;max-height:90vh;overflow:auto;background:#101010;border:1px solid #333;border-radius:20px;padding:24px}.close{float:right;background:#222;color:#fff;border-radius:50%;width:34px;height:34px}.invoice{background:#fff;color:#111;border-radius:12px;padding:30px;max-width:760px}.invoice h1{color:#b68a25}.invoice table{width:100%;border-collapse:collapse}.invoice td{padding:9px;border-bottom:1px solid #ddd}.btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}@media(max-width:900px){.stats{grid-template-columns:repeat(2,1fr)}.dash{grid-template-columns:1fr}}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.toolbar input,.toolbar select{width:100%}}
</style></head><body><header><div class="brand">REQOO<span class="gold">.CO</span> — ADMIN PRO</div></header><main class="wrap"><section id="login" class="login"><h2>Order Dashboard</h2><p class="muted">Masukkan Admin Token yang sama seperti dalam Google Apps Script.</p><input id="token" type="password" placeholder="Admin token"><button class="goldbtn" onclick="login()">Masuk</button><p id="err" style="color:#f66"></p></section><section id="app" style="display:none"><div class="toolbar"><h1 style="margin-right:auto">Dashboard</h1><input id="search" placeholder="Cari order / nama / WhatsApp" oninput="render()"><select id="statusFilter" onchange="render()"><option value="ALL">Semua status</option><option>Paid - Pending Verify</option><option>Confirmed</option><option>Processing</option><option>Completed</option><option>Cancelled</option></select><button class="goldbtn" onclick="load()">Refresh</button></div><div class="stats"><div class="stat"><small>Jumlah Order</small><b id="sOrders">0</b></div><div class="stat"><small>Jualan</small><b id="sSales">RM0</b></div><div class="stat"><small>Kos</small><b id="sCost">RM0</b></div><div class="stat"><small>Untung</small><b id="sProfit">RM0</b></div><div class="stat"><small>Paid Pending</small><b id="sPending">0</b></div></div><div class="dash"><div class="card"><h3>Jualan 6 bulan terakhir</h3><div class="chart" id="chart"></div></div><div class="card"><h3>Order mengikut kategori</h3><div class="donut" id="categoryChart"></div></div></div><div class="table"><div class="row head"><div>Tarikh</div><div>No. Order</div><div>Pelanggan</div><div>Total</div><div>Status</div><div>Resit</div></div><div id="rows"></div></div></section></main>
<div class="detail" id="detail"><div class="detailbox"><button class="close" onclick="closeDetail()">×</button><h2>Order Detail</h2><div id="detailContent"></div></div></div>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbyFy2y76srL3i-wIp1kesaXw5KZl6fpTTCbLJk_5lQBUwl0QKkdRsxo6ynF7XCjnKb1MA/exec';let TOKEN='',ORDERS=[];
function money(n){return 'RM'+Number(n||0).toFixed(2)}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function login(){TOKEN=document.getElementById('token').value.trim();if(TOKEN)load()}async function load(){try{const r=await fetch(API_URL+'?action=list&token='+encodeURIComponent(TOKEN));const j=await r.json();if(!j.ok)throw Error(j.error||'Token salah');ORDERS=j.orders||[];document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';render()}catch(e){document.getElementById('err').textContent=e.message}}
function filtered(){const f=document.getElementById('statusFilter').value,q=document.getElementById('search').value.toLowerCase();return ORDERS.filter(x=>(f==='ALL'||x.status===f)&&(!q||[x.orderNo,x.name,x.phone,x.address].join(' ').toLowerCase().includes(q)))}
function render(){const a=filtered();const sales=a.reduce((s,x)=>s+Number(x.total||0),0),cost=a.reduce((s,x)=>s+Number(x.cost||0),0),profit=a.reduce((s,x)=>s+Number(x.profit||0),0);document.getElementById('sOrders').textContent=a.length;document.getElementById('sSales').textContent=money(sales);document.getElementById('sCost').textContent=money(cost);document.getElementById('sProfit').textContent=money(profit);document.getElementById('sPending').textContent=a.filter(x=>x.status==='Paid - Pending Verify').length;drawChart(a);drawCategories(a);document.getElementById('rows').innerHTML=a.map(x=>`<div class="row"><div>${new Date(x.timestamp).toLocaleString('ms-MY')}</div><div><b>${esc(x.orderNo)}</b></div><div><b>${esc(x.name)}</b><br><span class="muted">${esc(x.phone)}</span></div><div><b>${money(x.total)}</b><br><span class="muted">Untung ${money(x.profit)}</span></div><div><select onchange="setStatus('${esc(x.orderNo)}',this.value)">${['Paid - Pending Verify','Confirmed','Processing','Completed','Cancelled'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div><div>${x.receiptUrl?`<a class="link" href="${x.receiptUrl}" target="_blank">Buka resit</a>`:'-'}</div></div>`).join('')||'<div style="padding:25px;color:#888">Tiada order.</div>'}
function drawChart(a){const months=[];const now=new Date();for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({key:d.getFullYear()+'-'+d.getMonth(),label:d.toLocaleString('ms-MY',{month:'short'})})}const vals=months.map(m=>a.filter(x=>{const d=new Date(x.timestamp);return d.getFullYear()+'-'+d.getMonth()===m.key}).reduce((s,x)=>s+Number(x.total||0),0));const max=Math.max(...vals,1);document.getElementById('chart').innerHTML=vals.map((v,i)=>`<div class="bar" style="height:${Math.max(4,v/max*190)}px"><span>${money(v)}</span><em>${months[i].label}</em></div>`).join('')}
function drawCategories(a){const m={};a.forEach(x=>{let items=[];try{items=JSON.parse(x.items||'[]')}catch(e){}items.forEach(it=>m[it.category]=(m[it.category]||0)+Number(it.qty||1))});const arr=Object.entries(m).sort((a,b)=>b[1]-a[1]);document.getElementById('categoryChart').innerHTML=arr.length?arr.map(([k,v])=>`<div class="legend"><span>${esc(k)}</span><b>${v} unit</b></div>`).join(''):'<span class="muted">Belum ada data kategori.</span>'}
async function setStatus(no,status){const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'status',token:TOKEN,orderNo:no,status})});const j=await r.json();if(!j.ok)alert(j.error||'Gagal');else{const x=ORDERS.find(o=>o.orderNo===no);if(x)x.status=status;render()}}
function closeDetail(){document.getElementById('detail').classList.remove('open')}
function openDetail(no){const x=ORDERS.find(o=>o.orderNo===no);if(!x)return;let items=[];try{items=JSON.parse(x.items||'[]')}catch(e){}document.getElementById('detailContent').innerHTML=`<div class="invoice"><h1>REQOO.CO</h1><h2>Order ${esc(x.orderNo)}</h2><p><b>Pelanggan:</b> ${esc(x.name)}<br><b>WhatsApp:</b> ${esc(x.phone)}<br><b>Alamat:</b> ${esc(x.address)}</p><table>${items.map(it=>`<tr><td>${esc(it.name)}<br><small>${esc(it.variant||'')} ${it.customText?'• '+esc(it.customText):''}</small></td><td>${it.qty} × ${money(it.unitPrice)}</td><td>${it.unitPrice?money(it.qty*it.unitPrice):'Quotation'}</td></tr>`).join('')}<tr><td colspan="2"><b>Jumlah</b></td><td><b>${money(x.total)}</b></td></tr><tr><td colspan="2">Status</td><td>${esc(x.status)}</td></tr></table><p>Terima kasih kerana memilih REQOO.CO.</p></div><div class="btnrow"><button class="goldbtn" onclick="printInvoice('${esc(x.orderNo)}')">Print / PDF</button>${x.receiptUrl?`<a class="goldbtn" style="padding:11px 15px;border-radius:10px;text-decoration:none;color:#111" href="${x.receiptUrl}" target="_blank">Buka Bukti Bayaran</a>`:''}</div>`;document.getElementById('detail').classList.add('open')}
function printInvoice(no){const x=ORDERS.find(o=>o.orderNo===no);let items=[];try{items=JSON.parse(x.items||'[]')}catch(e){}const w=window.open('','_blank');w.document.write(`<html><head><title>${esc(x.orderNo)}</title><style>body{font-family:Arial;padding:35px;max-width:760px;margin:auto;color:#111}h1{color:#b68a25;letter-spacing:3px}table{width:100%;border-collapse:collapse;margin-top:20px}td{padding:10px;border-bottom:1px solid #ddd}small{color:#666}</style></head><body><h1>REQOO.CO</h1><p>CUSTOM MADE. JUST FOR YOU.</p><h2>Invoice / Receipt ${esc(x.orderNo)}</h2><p><b>${esc(x.name)}</b><br>${esc(x.phone)}<br>${esc(x.address)}</p><table>${items.map(it=>`<tr><td>${esc(it.name)}<br><small>${esc(it.variant||'')}</small></td><td>${it.qty}</td><td>${it.unitPrice?money(it.qty*it.unitPrice):'Quotation'}</td></tr>`).join('')}<tr><td colspan="2"><b>TOTAL</b></td><td><b>${money(x.total)}</b></td></tr></table><p>Payment: ${esc(x.payment)}<br>Status: ${esc(x.status)}</p><p style="margin-top:60px">Terima kasih kerana memilih REQOO.CO.</p><script>window.print()<\/script></body></html>`);w.document.close()}
// Make rows clickable without changing the compact table layout.
document.addEventListener('click',e=>{const row=e.target.closest('.row:not(.head)');if(row&&e.target.tagName!=='SELECT'&&!e.target.closest('a')){const b=row.querySelector('b');if(b)openDetail(b.textContent)}});
</script></body></html>
