<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO.CO Admin</title><style>
*{box-sizing:border-box}body{margin:0;background:#0a0a0a;color:#fff;font-family:Arial,sans-serif}header{padding:18px 24px;border-bottom:1px solid #222;position:sticky;top:0;background:#0a0a0a;z-index:5}.brand{font-weight:900;letter-spacing:3px}.gold{color:#e0b84f}.wrap{max-width:1200px;margin:auto;padding:22px}.login,.card{background:#111;border:1px solid #292929;border-radius:16px;padding:20px}.login{max-width:420px;margin:60px auto}input,select{width:100%;padding:12px;border:1px solid #333;background:#171717;color:#fff;border-radius:10px;margin:8px 0 14px}button{border:0;border-radius:10px;padding:11px 15px;font-weight:800;cursor:pointer}.goldbtn{background:#e2b84f;color:#111}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.stat{background:#111;border:1px solid #292929;border-radius:14px;padding:16px}.stat small{color:#888}.stat b{display:block;font-size:25px;margin-top:7px}.table{overflow:auto;background:#111;border:1px solid #292929;border-radius:16px}.row{display:grid;grid-template-columns:150px 130px 1fr 100px 110px 150px;gap:10px;padding:13px;border-bottom:1px solid #222;min-width:800px}.head{font-weight:800;color:#e2b84f}.muted{color:#999}.pill{padding:5px 8px;border-radius:999px;background:#292929;font-size:12px}.link{color:#e2b84f}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select{width:auto;margin:0}.receipt{max-width:90px;max-height:70px;object-fit:contain;border-radius:8px}.print{background:#222;color:#fff;margin-top:8px}
@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.wrap{padding:12px}}
</style></head><body><header><div class="brand">REQOO<span class="gold">.CO</span> — ADMIN</div></header><main class="wrap"><section id="login" class="login"><h2>Order Dashboard</h2><p class="muted">Masukkan Admin Token.</p><input id="token" type="password" placeholder="Admin token"><button class="goldbtn" onclick="login()">Masuk</button><p id="err" style="color:#f66"></p></section><section id="app" style="display:none"><div class="toolbar"><h1 style="margin-right:auto">Order History</h1><select id="statusFilter" onchange="render()"><option value="ALL">Semua status</option><option>Paid - Pending Verify</option><option>Confirmed</option><option>Processing</option><option>Completed</option><option>Cancelled</option></select><button class="goldbtn" onclick="load()">Refresh</button></div><div class="stats"><div class="stat"><small>Jumlah Order</small><b id="sOrders">0</b></div><div class="stat"><small>Jualan</small><b id="sSales">RM0</b></div><div class="stat"><small>Kos</small><b id="sCost">RM0</b></div><div class="stat"><small>Anggaran Untung</small><b id="sProfit">RM0</b></div></div><div class="table"><div class="row head"><div>Tarikh</div><div>No. Order</div><div>Pelanggan</div><div>Total</div><div>Status</div><div>Resit</div></div><div id="rows"></div></div></section></main><script>
let TOKEN='',ORDERS=[];const API_URL='https://script.google.com/macros/s/AKfycbyFy2y76srL3i-wIp1kesaXw5KZl6fpTTCbLJk_5lQBUwl0QKkdRsxo6ynF7XCjnKb1MA/exec';
function login(){TOKEN=document.getElementById('token').value.trim();if(!TOKEN)return;load()}
async function load(){if(!TOKEN||API_URL.startsWith('PASTE_')){document.getElementById('err').textContent='Masukkan API URL dalam admin.html dahulu.';return}try{let r=await fetch(API_URL+'?action=list&token='+encodeURIComponent(TOKEN));let j=await r.json();if(!j.ok)throw Error(j.error||'Token salah');ORDERS=j.orders||[];document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';render()}catch(e){document.getElementById('err').textContent=e.message}}
function money(n){return 'RM'+Number(n||0).toFixed(2)}
function render(){let f=document.getElementById('statusFilter').value,a=ORDERS.filter(x=>f==='ALL'||x.status===f);document.getElementById('rows').innerHTML=a.map(x=>`<div class="row"><div>${new Date(x.timestamp).toLocaleString('ms-MY')}</div><div><b>${x.orderNo}</b></div><div><b>${esc(x.name)}</b><br><span class="muted">${esc(x.phone)}<br>${esc(x.address)}</span><br><button class="print" onclick='printOrder(${JSON.stringify(x)})'>Resit / Detail</button></div><div><b>${money(x.total)}</b><br><span class="muted">Untung ${money(x.profit)}</span></div><div><select onchange="setStatus('${x.orderNo}',this.value)">${['Paid - Pending Verify','Confirmed','Processing','Completed','Cancelled'].map(s=>`<option ${s===x.status?'selected':''}>${s}</option>`).join('')}</select></div><div>${x.receiptUrl?`<a class="link" href="${x.receiptUrl}" target="_blank">Buka resit</a>`:'-'}</div></div>`).join('');let sales=a.reduce((s,x)=>s+Number(x.total||0),0),cost=a.reduce((s,x)=>s+Number(x.cost||0),0),profit=a.reduce((s,x)=>s+Number(x.profit||0),0);document.getElementById('sOrders').textContent=a.length;document.getElementById('sSales').textContent=money(sales);document.getElementById('sCost').textContent=money(cost);document.getElementById('sProfit').textContent=money(profit)}
async function setStatus(no,status){let r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action:'status',token:TOKEN,orderNo:no,status})});let j=await r.json();if(!j.ok)alert(j.error||'Gagal');else{let x=ORDERS.find(o=>o.orderNo===no);if(x)x.status=status;render()}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function printOrder(x){let w=window.open('','_blank');w.document.write(`<html><head><title>${x.orderNo}</title><style>body{font-family:Arial;padding:30px;max-width:700px;margin:auto}h1{color:#b88a20}table{width:100%;border-collapse:collapse}td{padding:8px;border-bottom:1px solid #ddd}</style></head><body><h1>REQOO.CO</h1><h2>Order ${x.orderNo}</h2><p><b>Pelanggan:</b> ${esc(x.name)}<br><b>WhatsApp:</b> ${esc(x.phone)}<br><b>Alamat:</b> ${esc(x.address)}</p><table><tr><td>Jumlah item</td><td>${x.itemCount}</td></tr><tr><td>Jumlah</td><td>RM${Number(x.total).toFixed(2)}</td></tr><tr><td>Status</td><td>${esc(x.status)}</td></tr></table><p>Terima kasih kerana memilih REQOO.CO.</p><script>window.print()<\/script></body></html>`);w.document.close()}
</script></body></html>
