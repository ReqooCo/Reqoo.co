<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REQOO.CO Shop</title><style>body{margin:0;background:#080808;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(1180px,calc(100% - 30px));margin:auto;padding:28px 0}.head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;padding-bottom:18px}.brand{font-weight:950;letter-spacing:3px}.brand span{color:#d9b45e}.sub{color:#888;font-size:11px;margin-top:5px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:24px}.card{background:#111;border:1px solid #292929;border-radius:16px;overflow:hidden}.pic{aspect-ratio:1;background:#171717}.pic img{width:100%;height:100%;object-fit:cover}.body{padding:14px}.tag{color:#d9b45e;font-size:8px;font-weight:900;letter-spacing:2px}.body h2{font-size:16px;margin:8px 0}.desc{color:#999;font-size:11px;line-height:1.5;min-height:32px}.price{font-weight:900;margin:12px 0}.btn{width:100%;padding:11px;border:0;border-radius:999px;background:#d9b45e;color:#080808;font-weight:900}.empty,.error{margin-top:30px;padding:25px;border:1px dashed #444;border-radius:16px;color:#999;text-align:center}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.grid{grid-template-columns:1fr}}</style></head><body><main class="wrap"><header class="head"><div><div class="brand">REQOO<span>.CO</span></div><div class="sub">CUSTOM MADE · JUST FOR YOU</div></div><div id="count">0 products</div></header><div id="state" class="empty">Memuatkan produk…</div><section id="grid" class="grid" style="display:none"></section></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=n=>'RM'+(Number(n||0)/100).toFixed(2);async function load(){const state=document.getElementById('state'),grid=document.getElementById('grid');try{const r=await fetch('/api/core?action=listProducts&status=active',{cache:'no-store'});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.error||'API error');const products=Array.isArray(d.products)?d.products:[];document.getElementById('count').textContent=products.length+' product'+(products.length===1?'':'s');if(!products.length){state.textContent='Belum ada produk. Admin akan tambah produk dari Control Centre.';return}state.style.display='none';grid.style.display='grid';grid.innerHTML=products.map(p=>{const img=esc(p.cover_image||p.image_url||'');return `<article class="card"><div class="pic">${img?`<img src="${img}" alt="${esc(p.name)}">`:''}</div><div class="body"><div class="tag">${esc(p.category||p.product_type||'CUSTOM')}</div><h2>${esc(p.name)}</h2><div class="desc">${esc(p.short_description||p.description||'Custom product by Reqoo.')}</div><div class="price">${money(p.sale_price_minor??p.base_price_minor)}</div><button class="btn" onclick="location.href='/shop/product.html?id=${encodeURIComponent(p.id)}'">LIHAT PRODUK</button></div></article>`}).join('')}catch(e){state.className='error';state.textContent='Shop belum dapat memuatkan katalog. '+e.message}}load();</script></body></html>
