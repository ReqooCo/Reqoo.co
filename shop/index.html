<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Reqoo.co — Shop produk custom dan pilihan Reqoo.">
<title>Shop · Reqoo.co</title>
<link rel="stylesheet" href="../shared/reqoo.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap');
:root{--g:#c9a45b;--g2:#a98643;--bg:#e9e9e7;--panel:#f7f7f5;--white:#fff;--ink:#202020;--muted:#6f6f6b;--line:#d8d8d4;--dark:#171717;--dark2:#252525}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}.shop-hero h1,.shop-section-title,.shop-brand{font-family:'Manrope','Inter',sans-serif}
.shop-shell{max-width:1280px;margin:auto;padding:0 18px 44px}.shop-top{background:var(--dark);color:#cfcfcb;margin:0 -18px;padding:9px 18px}.shop-top-inner{max-width:1280px;margin:auto;display:flex;justify-content:space-between;font-size:12px}.shop-top a{color:#d8c18c;text-decoration:none}
.shop-mainnav{position:sticky;top:0;z-index:20;background:rgba(247,247,245,.97);backdrop-filter:blur(8px);margin:0 -18px;padding:12px 18px;border-bottom:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.06)}.shop-mainnav-inner{max-width:1280px;margin:auto;display:flex;align-items:center;gap:18px}.shop-brand{font-weight:800;letter-spacing:.04em;font-size:21px;color:var(--dark);text-decoration:none;white-space:nowrap}.shop-search{flex:1;display:flex;max-width:720px;height:44px;border:1px solid #b9b9b4;border-radius:6px;overflow:hidden;background:#fff}.shop-search:focus-within{border-color:var(--g);box-shadow:0 0 0 2px rgba(201,164,91,.14)}.shop-search input{border:0;outline:0;padding:0 14px;flex:1;font:500 14px 'Inter',sans-serif;background:#fff;color:var(--ink)}.shop-search button{width:58px;border:0;border-left:1px solid var(--line);background:var(--dark);color:#e3c47d;font-size:18px;cursor:pointer}.shop-nav-actions{margin-left:auto}.shop-cart{position:relative;text-decoration:none;color:var(--ink);font-size:21px;padding:7px}.cart-badge{position:absolute;right:-3px;top:-2px;background:var(--g);color:#171717;border-radius:20px;min-width:18px;height:18px;line-height:18px;text-align:center;font-size:11px;font-weight:800}
.shop-hero{margin-top:18px;background:linear-gradient(115deg,var(--dark),var(--dark2));border:1px solid #333;border-radius:10px;min-height:205px;padding:34px 38px;color:#f4f4f1;display:flex;align-items:center;justify-content:space-between;overflow:hidden;box-shadow:0 5px 18px rgba(0,0,0,.08)}.shop-hero-copy{max-width:680px}.shop-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.18em;color:#d8bd7c;font-weight:700;margin-bottom:8px}.shop-hero h1{font-size:34px;line-height:1.15;margin:0 0 10px;letter-spacing:-.035em}.shop-hero p{margin:0;color:#c9c9c5;line-height:1.65;max-width:600px;font-size:14px}.shop-hero-badge{font-size:70px;font-weight:900;color:var(--g);opacity:.12}
.shop-tools{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 12px;flex-wrap:wrap}.shop-section-title{font-size:19px;font-weight:800;letter-spacing:-.02em}.shop-result{font-size:12px;color:var(--muted);margin-top:3px}.shop-sort{display:flex;gap:7px;align-items:center}.shop-sort button{font:500 13px 'Inter',sans-serif;border:1px solid var(--line);background:var(--panel);color:#4b4b48;padding:9px 13px;border-radius:5px;cursor:pointer}.shop-sort button:hover,.shop-sort button.active{color:#6f5521;border-color:var(--g);background:#f3ead6}.shop-notice{margin:0 0 14px;padding:11px 14px;background:var(--panel);border:1px solid var(--line);font-size:12px;color:var(--muted);border-radius:5px}
.shop-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.product-card{background:var(--panel);border:1px solid var(--line);overflow:hidden;transition:.16s ease;min-width:0;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.035)}.product-card:hover{border-color:#bda66e;box-shadow:0 5px 16px rgba(0,0,0,.09);transform:translateY(-1px)}.product-image{display:block;position:relative;background:#dededb;aspect-ratio:1/1;overflow:hidden}.product-image img{width:100%;height:100%;object-fit:cover;display:block}.product-placeholder{height:100%;display:grid;place-items:center;color:#858580;font-size:12px}.sale-tag{position:absolute;left:0;top:0;background:#eee1c3;color:#76591e;font-size:10px;font-weight:800;padding:4px 7px}.product-body{padding:10px 10px 12px}.product-name{font-size:13px;line-height:1.4;margin:0;height:38px;overflow:hidden;font-weight:600;letter-spacing:-.01em}.product-name a{color:#292927;text-decoration:none}.product-desc{font-size:12px;color:#777773;height:30px;overflow:hidden;margin:5px 0;line-height:1.4}.product-price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;margin-top:6px}.price{font-size:18px;color:#8a6928;font-weight:800;letter-spacing:-.02em}.old-price{font-size:11px;color:#999;text-decoration:line-through}.product-actions{display:flex;gap:6px;margin-top:9px}.add,.buy{font-family:'Inter',sans-serif;font-weight:600}.add{flex:1;border:1px solid var(--g2);background:#f4ead5;color:#705521;padding:8px 5px;cursor:pointer;font-size:12px;border-radius:4px}.buy{flex:1;border:0;background:var(--dark);color:#e0c27d;padding:8px 5px;cursor:pointer;font-size:12px;border-radius:4px}.add:hover{background:#e9d9b8}.buy:hover{background:#303030}.shop-empty{grid-column:1/-1;background:var(--panel);padding:60px 20px;text-align:center;color:#777;border:1px solid var(--line);border-radius:6px}
@media(max-width:1050px){.shop-grid{grid-template-columns:repeat(4,minmax(0,1fr))}.shop-hero-badge{display:none}}@media(max-width:760px){.shop-shell{padding:0 10px 30px}.shop-top{margin:0 -10px;padding:8px 10px}.shop-mainnav{margin:0 -10px;padding:10px}.shop-mainnav-inner{gap:10px;flex-wrap:wrap}.shop-brand{font-size:19px}.shop-search{order:3;flex-basis:100%;max-width:none}.shop-nav-actions{margin-left:0}.shop-hero{margin-top:12px;padding:24px 20px;min-height:170px}.shop-hero h1{font-size:27px}.shop-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.product-body{padding:8px}.product-name{font-size:13px}.price{font-size:16px}.product-desc{display:none}.product-actions{margin-top:7px}.shop-sort{width:100%;overflow:auto}.shop-sort button{white-space:nowrap}.shop-top-inner span:first-child{display:none}}
</style>
</head>
<body>
<div class="shop-top"><div class="shop-top-inner"><span>Reqoo.co Marketplace</span><span><a href="../quotation/">Quotation</a> · <a href="../admin/">Admin</a></span></div></div>
<div class="shop-mainnav"><div class="shop-mainnav-inner"><a class="shop-brand" href="../">REQOO.CO</a><form class="shop-search" id="searchForm"><input id="search" type="search" placeholder="Cari produk, hadiah, custom..." autocomplete="off"><button type="submit" aria-label="Cari">⌕</button></form><div class="shop-nav-actions"><a class="shop-cart" href="../cart/" aria-label="Cart">🛒<span id="cartCount" class="cart-badge">0</span></a></div></div></div>
<main class="shop-shell"><section class="shop-hero"><div class="shop-hero-copy"><div class="shop-kicker">Reqoo.co Shop</div><h1>Temui produk yang sesuai untuk anda</h1><p>Produk yang dipaparkan di sini datang terus daripada katalog yang diterbitkan oleh Admin. Cari, pilih dan masukkan ke cart dengan mudah.</p></div><div class="shop-hero-badge">R</div></section><div class="shop-tools"><div><div class="shop-section-title">Produk Pilihan</div><div id="result" class="shop-result">Memuatkan katalog...</div></div><div class="shop-sort"><button data-sort="latest" class="active">Terbaru</button><button data-sort="price-low">Harga Rendah</button><button data-sort="price-high">Harga Tinggi</button></div></div><div id="notice" class="shop-notice">Memuatkan katalog…</div><div id="products" class="shop-grid"></div></main>
<script type="module">
import { catalog } from '../shared/catalog.js';import { cart, money } from '../shared/cart.js';
const notice=document.querySelector('#notice'),list=document.querySelector('#products'),count=document.querySelector('#cartCount'),search=document.querySelector('#search'),result=document.querySelector('#result');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let products=[];let sort='latest';let query='';function refreshCount(){count.textContent=cart.count()}function price(p){return Number(p.price??0)}function filtered(){let out=products.filter(p=>{const q=query.trim().toLowerCase();return !q||`${p.name||''} ${p.description||''} ${p.short_description||''}`.toLowerCase().includes(q)});if(sort==='price-low')out.sort((a,b)=>price(a)-price(b));if(sort==='price-high')out.sort((a,b)=>price(b)-price(a));return out}function render(){const visible=filtered();result.textContent=`${visible.length} produk${query?` untuk “${query}”`:''}`;if(!visible.length){list.innerHTML='<div class="shop-empty">Tiada produk ditemui.</div>';return}list.innerHTML=visible.map(p=>{const img=(p.images||[])[0]||'';const base=Number(p.base_price_minor||0)/100;const current=price(p);const sale=base>current&&current>0;return `<article class="product-card"><a class="product-image" href="./product.html?id=${encodeURIComponent(p.id)}">${img?`<img src="${esc(img)}" alt="${esc(p.name)}" loading="lazy">`:'<div class="product-placeholder">Tiada gambar</div>'}${sale?'<span class="sale-tag">SALE</span>':''}</a><div class="product-body"><h2 class="product-name"><a href="./product.html?id=${encodeURIComponent(p.id)}">${esc(p.name)}</a></h2><p class="product-desc">${esc(p.short_description||p.description||'')}</p><div class="product-price"><span class="price">${money(current)}</span>${sale?`<span class="old-price">${money(base)}</span>`:''}</div><div class="product-actions"><button class="add" data-id="${esc(p.id)}">＋ Cart</button><button class="buy" data-buy="${esc(p.id)}">Beli</button></div></div></article>`}).join('');list.querySelectorAll('.add').forEach(btn=>btn.onclick=()=>{const p=products.find(x=>String(x.id)===btn.dataset.id);if(!p)return;cart.add(p);refreshCount();btn.textContent='✓ Ditambah';setTimeout(()=>btn.textContent='＋ Cart',1000)});list.querySelectorAll('.buy').forEach(btn=>btn.onclick=()=>{const p=products.find(x=>String(x.id)===btn.dataset.buy);if(!p)return;cart.add(p);location.href='../cart/'})}async function load(){try{const data=await catalog.list(true);products=Array.isArray(data)?data:(data.products||[]);notice.textContent=products.length?`${products.length} produk diterbitkan.`:'Katalog kosong — Admin belum menerbitkan produk.';render()}catch(e){notice.textContent='Catalog API belum tersedia: '+e.message;result.textContent='Gagal memuat katalog';list.innerHTML='<div class="shop-empty">Shop menunggu Catalog API. Tiada produk demo/fake dipaparkan.</div>'}}document.querySelector('#searchForm').addEventListener('submit',e=>{e.preventDefault();query=search.value;render()});search.addEventListener('input',()=>{query=search.value;render()});document.querySelectorAll('[data-sort]').forEach(btn=>btn.addEventListener('click',()=>{sort=btn.dataset.sort;document.querySelectorAll('[data-sort]').forEach(x=>x.classList.remove('active'));btn.classList.add('active');render()}));refreshCount();load();
</script></body></html>
