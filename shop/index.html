<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"><style>.shop-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.product-card{overflow:hidden;border:1px solid var(--rq-line);background:var(--rq-panel);border-radius:16px}.product-card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#0b0b0d}.product-body{padding:16px}.product-body h2{margin:0 0 7px}.product-body p{color:var(--rq-muted);line-height:1.5}.price{font-weight:800;font-size:18px;color:var(--rq-accent)}.notice{margin:0 0 18px;padding:12px 14px;border-radius:10px;background:#17171c;color:var(--rq-muted);border:1px solid var(--rq-line)}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../calculator/">Calculator</a><a href="../quotation/">Quotation</a><a href="../cart/">Cart <span id="cartCount">0</span></a><a href="../admin/">Admin</a></div></nav><main><div class="rq-kicker">Customer</div><section class="rq-hero"><h1>Shop</h1><p>Produk yang dipaparkan di sini datang daripada katalog yang diterbitkan oleh Admin.</p></section><div id="notice" class="notice">Memuatkan katalog…</div><div id="products" class="shop-grid"></div></main></div><script type="module">
import { catalog } from '../shared/catalog.js';
import { cart, money } from '../shared/cart.js';
const notice=document.querySelector('#notice'), list=document.querySelector('#products'), count=document.querySelector('#cartCount');
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function refreshCount(){count.textContent=cart.count()}
async function load(){try{let data=await catalog.list(true);const products=Array.isArray(data)?data:(data.products||[]);if(!products.length){list.innerHTML='<div class="rq-empty">Belum ada produk diterbitkan.</div>';notice.textContent='Katalog kosong.';return}list.innerHTML=products.map(p=>{const img=(p.images||[])[0]||'';return `<article class="product-card">${img?`<a href="./product.html?id=${encodeURIComponent(p.id)}"><img src="${esc(img)}" alt="${esc(p.name)}"></a>`:'<div style="aspect-ratio:1/1"></div>'}<div class="product-body"><h2><a href="./product.html?id=${encodeURIComponent(p.id)}">${esc(p.name)}</a></h2><p>${esc(p.description||'')}</p><div class="price">${money(p.price)}</div><button class="add" data-id="${esc(p.id)}">Tambah ke Cart</button></div></article>`}).join('');notice.textContent=`${products.length} produk diterbitkan.`; list.querySelectorAll('.add').forEach(btn=>btn.onclick=()=>{const p=products.find(x=>String(x.id)===btn.dataset.id);cart.add(p);refreshCount();btn.textContent='Ditambah ✓';setTimeout(()=>btn.textContent='Tambah ke Cart',1200)});}catch(e){notice.textContent='Catalog API belum tersedia: '+e.message;list.innerHTML='<div class="rq-empty">Shop menunggu Catalog API. Tiada produk demo/fake dipaparkan.</div>'}}refreshCount();load();
</script></body></html>
