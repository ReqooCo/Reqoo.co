<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../custom/">Custom</a><a href="../quotation/">Quotation</a><a href="../">Home</a></div></nav><main><div class="rq-kicker">REQOO.CO · SHOP</div><section class="rq-hero"><h1>Produk pilihan Reqoo</h1><p>Produk siap beli dan tempahan custom. Produk yang belum diterbitkan tidak dipaparkan.</p></section><div id="status" class="rq-notice">Memuatkan produk…</div><section id="products" class="rq-grid"></section></main></div><script type="module">import{catalog}from'../shared/catalog.js';const $=s=>document.querySelector(s),status=$('#status'),products=$('#products');function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}async function load(){try{const data=await catalog.list(true);const items=Array.isArray(data)?data:(data.products||[]);if(!items.length){status.textContent='Belum ada produk diterbitkan.';products.innerHTML='';return}status.textContent=`${items.length} produk`;products.innerHTML=items.map(p=>{const img=(p.images||[])[0]||'';return `<a class="rq-card" href="product.html?id=${encodeURIComponent(p.id)}">${img?`<img src="${esc(img)}" alt="${esc(p.name)}" style="width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px">`:''}<h2>${esc(p.name)}</h2><p>${esc(p.description||'')}</p><strong>RM${Number(p.price||0).toFixed(2)}</strong></a>`}).join('')}catch(e){status.textContent='Gagal memuat produk: '+e.message}}load()</script></body></html>
