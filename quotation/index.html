<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotation · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"><style>.quote{max-width:820px;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.brandbig{font-size:28px;font-weight:850;letter-spacing:.05em}.gold{color:var(--rq-accent)}.meta{text-align:right;color:var(--rq-muted);font-size:13px;line-height:1.7}.table{margin-top:28px;border:1px solid var(--rq-line);border-radius:12px;overflow:hidden}.tr{display:grid;grid-template-columns:1fr 90px 130px 130px;gap:10px;padding:13px 15px;border-bottom:1px solid var(--rq-line);font-size:13px}.tr:last-child{border:0}.th{color:var(--rq-muted);font-size:11px;font-weight:800}.right{text-align:right}.summary{margin:18px 0 0 auto;max-width:330px}.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rq-line);font-size:13px}.grand{font-size:22px;font-weight:850}.note{margin-top:24px;padding:14px;border:1px solid var(--rq-line);border-radius:10px;color:var(--rq-muted);white-space:pre-wrap;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.status{margin-top:14px;padding:12px;border:1px solid var(--rq-line);border-radius:10px}.ok{color:#91e6a7}.bad{color:#ff8b8b}@media print{body{background:white;color:#111}.rq-nav,.actions{display:none}.rq-shell{max-width:900px}.rq-card{border:0;background:white}.table{border-color:#ccc}.tr{border-color:#ddd}.note{border-color:#ccc}}@media(max-width:650px){.head{flex-direction:column}.meta{text-align:left}.tr{grid-template-columns:1fr 55px 90px 95px;font-size:11px;padding:10px 8px}}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../shop/">Shop</a><a href="../admin/">Admin</a></div></nav><main class="quote"><section class="rq-card"><div class="head"><div><div class="brandbig">REQOO<span class="gold">.CO</span></div><div class="muted">Custom Manufacturing & Creative Works</div></div><div class="meta"><b>QUOTATION</b><br><span id="ref">Draft</span><br><span id="date"></span></div></div><hr style="border:0;border-top:1px solid var(--rq-line);margin:22px 0"><div><div class="th">CUSTOMER</div><div id="customer" style="font-size:17px;font-weight:750;margin-top:4px">Customer</div><div id="contact" class="muted"></div></div><div class="table"><div class="tr th"><div>ITEM</div><div class="right">QTY</div><div class="right">UNIT</div><div class="right">TOTAL</div></div><div id="items"></div></div><div class="summary"><div class="sum"><span>Subtotal</span><b id="subtotal">RM0.00</b></div><div class="sum"><span>Diskaun</span><b id="discount">RM0.00</b></div><div class="sum grand"><span>Total</span><b class="gold" id="total">RM0.00</b></div></div><div class="note" id="notes">Quotation ini adalah draft.</div><div class="status" id="status"></div><div class="actions"><button class="rq-btn" onclick="window.print()">Print / Save PDF</button><button class="rq-btn secondary" id="copy">Copy Link</button><button class="rq-btn" id="accept" style="display:none">Terima Quotation</button><button class="rq-btn secondary" id="back">Kembali</button></div></section></main></div><script>const API='https://api.reqoo.co',$=s=>document.querySelector(s),p=new URLSearchParams(location.search),money=n=>'RM'+(Number(n||0)/100).toFixed(2),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(q){$('#ref').textContent=q.reference||'Quotation';$('#date').textContent=new Date(q.created_at||Date.now()).toLocaleDateString('ms-MY');$('#customer').textContent=q.customer_name||'Customer';$('#contact').textContent=[q.customer_phone,q.customer_email].filter(Boolean).join(' · ');$('#items').innerHTML=(q.items||[]).map(x=>`<div class="tr"><div><b>${esc(x.description)}</b><br><span class="muted">${esc([x.material,x.size].filter(Boolean).join(' · '))}</span></div><div class="right">${esc(x.quantity)}</div><div class="right">${money(x.unit_price_minor)}</div><div class="right">${money(x.line_total_minor)}</div></div>`).join('');$('#subtotal').textContent=money(q.subtotal_minor);$('#discount').textContent=money(q.discount_minor);$('#total').textContent=money(q.total_minor);$('#notes').textContent=q.notes||'Harga ini disediakan berdasarkan spesifikasi yang diberikan. Sebarang perubahan spesifikasi boleh menyebabkan harga berubah. Tempoh siap tertakluk kepada kapasiti produksi dan pengesahan design.';$('#status').innerHTML=`Status: <b>${esc(q.status)}</b>`;$('#status').className='status '+(['accepted','converted'].includes(q.status)?'ok':['rejected','expired'].includes(q.status)?'bad':'');if(token&&!['accepted','converted','rejected','expired'].includes(q.status))$('#accept').style.display='inline-block'}const token=p.get('token');async function load(){if(token){const r=await fetch(API+'/quotations/shared?token='+encodeURIComponent(token));const q=await r.json();if(!r.ok)throw Error(q.error||'Quotation tidak dijumpai');render(q);return}if(!location.search){location.replace('../custom/');return}const qty=Math.max(1,Number(p.get('qty')||1)),price=Math.round(Number(p.get('price')||0)*100),subtotal=Math.round(Number(p.get('subtotal')||Number(p.get('price')||0)*qty)*100),discPct=Math.min(100,Math.max(0,Number(p.get('discount')||0)));render({reference:p.get('reference')||'Quotation Draft',customer_name:p.get('customer')||'Customer',created_at:new Date().toISOString(),status:'draft',subtotal_minor:subtotal,discount_minor:Math.round(subtotal*discPct/100),total_minor:Math.round(subtotal*(1-discPct/100)),items:[{description:p.get('item')||'Custom Product',material:p.get('material'),size:p.get('size'),quantity:qty,unit_price_minor:price,line_total_minor:price*qty}],notes:p.get('notes')})}$('#accept').onclick=async()=>{if(!token)return;$('#accept').disabled=true;try{const r=await fetch(API+'/quotations/shared/accept',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})}),d=await r.json();if(!r.ok)throw Error(d.error||'Gagal menerima quotation');render(d.quotation);$('#accept').textContent='Quotation diterima ✓'}catch(e){alert(e.message)}finally{$('#accept').disabled=false}};$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText(location.href);$('#copy').textContent='Link disalin ✓'}catch{$('#copy').textContent='Salin URL dari address bar'}};$('#back').onclick=()=>history.back();load().catch(e=>{$('#status').textContent=e.message;$('#status').className='status bad'});</script></body></html>
