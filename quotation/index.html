<!doctype html><html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quotation · Reqoo.co</title><link rel="stylesheet" href="../shared/reqoo.css"><style>.quote{max-width:820px;margin:auto}.head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.brandbig{font-size:28px;font-weight:850;letter-spacing:.05em}.gold{color:var(--rq-accent)}.meta{text-align:right;color:var(--rq-muted);font-size:13px;line-height:1.7}.table{margin-top:28px;border:1px solid var(--rq-line);border-radius:12px;overflow:hidden}.tr{display:grid;grid-template-columns:1fr 90px 130px 130px;gap:10px;padding:13px 15px;border-bottom:1px solid var(--rq-line);font-size:13px}.tr:last-child{border:0}.th{color:var(--rq-muted);font-size:11px;font-weight:800}.right{text-align:right}.summary{margin:18px 0 0 auto;max-width:330px}.sum{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rq-line);font-size:13px}.grand{font-size:22px;font-weight:850}.note{margin-top:24px;padding:14px;border:1px solid var(--rq-line);border-radius:10px;color:var(--rq-muted);white-space:pre-wrap;line-height:1.6}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}@media print{body{background:white;color:#111}.rq-nav,.actions{display:none}.rq-shell{max-width:900px}.rq-card{border:0;background:white}.table{border-color:#ccc}.tr{border-color:#ddd}.note{border-color:#ccc}}@media(max-width:650px){.head{flex-direction:column}.meta{text-align:left}.tr{grid-template-columns:1fr 55px 90px 95px;font-size:11px;padding:10px 8px}}</style></head><body><div class="rq-shell"><nav class="rq-nav"><a class="rq-brand" href="../">REQOO.CO</a><div class="rq-navlinks"><a href="../shop/">Shop</a><a href="../calculator/">Calculator</a><a href="../admin/">Admin</a></div></nav><main class="quote"><section class="rq-card"><div class="head"><div><div class="brandbig">REQOO<span class="gold">.CO</span></div><div class="muted">Custom Manufacturing & Creative Works</div></div><div class="meta"><b>QUOTATION</b><br><span id="ref">Draft</span><br><span id="date"></span></div></div><hr style="border:0;border-top:1px solid var(--rq-line);margin:22px 0"><div><div class="th">CUSTOMER</div><div id="customer" style="font-size:17px;font-weight:750;margin-top:4px">Customer</div></div><div class="table"><div class="tr th"><div>ITEM</div><div class="right">QTY</div><div class="right">UNIT</div><div class="right">TOTAL</div></div><div class="tr"><div><b id="item">Custom Product</b><br><span id="detail" class="muted"></span></div><div class="right" id="qty">1</div><div class="right" id="unit">RM0.00</div><div class="right" id="line">RM0.00</div></div></div><div class="summary"><div class="sum"><span>Subtotal</span><b id="subtotal">RM0.00</b></div><div class="sum"><span>Diskaun</span><b id="discount">RM0.00</b></div><div class="sum grand"><span>Total</span><b class="gold" id="total">RM0.00</b></div></div><div class="note" id="notes">Quotation ini adalah draft.</div><div class="actions"><button class="rq-btn" onclick="window.print()">Print / Save PDF</button><button class="rq-btn secondary" id="copy">Copy Link</button><button class="rq-btn secondary" id="back">Kembali Calculator</button></div></section></main></div><script>const p=new URLSearchParams(location.search),$=s=>document.querySelector(s),money=n=>'RM'+Number(n||0).toFixed(2),today=new Date().toLocaleDateString('ms-MY');const qty=Math.max(1,Number(p.get('qty')||1)),price=Number(p.get('price')||0),subtotal=Number(p.get('subtotal')||price*qty),discPct=Math.min(100,Math.max(0,Number(p.get('discount')||0))),discount=subtotal*discPct/100,total=Number((subtotal-discount).toFixed(2));$('#customer').textContent=p.get('customer')||'Customer';$('#ref').textContent=p.get('reference')||'Quotation Draft';$('#date').textContent=today;$('#item').textContent=p.get('item')||'Custom Product';$('#detail').textContent=[p.get('material'),p.get('size')].filter(Boolean).join(' ·
