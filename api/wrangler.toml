name = "reqoo-catalog-api"
main = "public-gateway.js"
compatibility_date = "2026-08-19"

[[d1_databases]]
binding = "DB"
database_name = "reqoo-rebuild"
database_id = "15123ddd-d63a-4033-912c-51c1f05c11c5"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "reqoo-media"

[secrets]
# Fail deployment instead of allowing the production Worker to run without admin authentication.
required = ["ADMIN_KEY"]

[vars]
# ADMIN_KEY is intentionally NOT stored here. It must remain a Cloudflare Worker Secret.
